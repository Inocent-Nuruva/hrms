vatars** (or search \"Default Avatars\").\n2. Select **Add avatar** to open **Add default avatar**.\n3. Enter **Avatar name**, choose **Gender category** (**Male**, **Female** or **Neutral**), **Display order** and **Status** (**Active**/**Inactive**).\n4. Click **Choose image** (PNG, JPG, JPEG or SVG, up to 5 MB) and click **Create**.\n5. To change one, click edit (**Edit default avatar**); to remove it, delete and confirm **Delete avatar?**. You can also set one as the default.\n\n**Important notes:** HEIC/HEIF images (iPhone photos) are not supported; convert to PNG or JPG.\n\n### Feature: 5.10 Delete a company\n\n1. Sign in to the platform with `companies:read` and `companies:delete`. Open **Companies** and find the organisation in **Tenant companies**.\n2. Select **Delete company** on its row. Check the name in the confirmation.\n3. Select **Cancel** to return to the list, or **Delete company** to confirm. The company disappears from the list and from its members' company choices. Its current sessions end and pending employee invitations are cancelled.\n\nHRMS retains employee, payroll and audit history, including a record of the deletion. The original slug stays reserved. Deletion is final in the application. Use **Suspend** when you expect to restore access later. People who belong to another active company keep their access there.\n\n![Delete company confirmation showing the company name and the records retained](../images/company-deletion-confirmation.png)\n\n## 6. Important fields and options\n| Field | Meaning | Rules |\n|---|---|---|\n| Company name | Display name of the company | Required |\n| Company slug | Short unique identifier | Optional; generated if empty; must be unique |\n| Company timezone | Timezone for date boundaries | IANA name, e.g. `Africa/Dar_es_Salaam` |\n| Enable roles | Company can view/manage roles | Platform administrators keep Access Governance regardless |\n| Enable permissions | Company can view the permission catalogue | Can stay off while roles are on |\n| Admin phone | First administrator's phone | +255 or +256 number |\n| Temporary admin password | First password | Min. 8 characters; must be changed at first sign-in |\n| Status | Active or suspended | Suspended companies cannot be entered |\n\n## 7. Daily usage procedures\n- Platform: review **Tenant companies** for new or suspended companies; enter a company to support it.\n- Company administrator: review **Current Company Users** when staff join or leave; keep the bank directory up to date.\n\n## 8. Approval workflows\nThere are no approvals in this module. Changes apply immediately.\n\n## 9. Links to other modules\n- [Roles, permissions and users](02-roles-permissions-users.md) – roles given to members.\n- [Email, SMS and notifications](03-email-sms-notifications.md) – company SMTP and SMS.\n- Branches, Departments, Positions – next setup steps.\n- Payroll – uses the bank directory.\n- Employees – employee invitations create user accounts and company membership.\n\n## 10. Common errors and troubleshooting\n| Problem | Cause | Solution |\n|---|---|---|\n| **Companies** not in sidebar | No `companies:read`; company users see company details through other pages | Platform permission needed |\n| **Company slug already exists** | Slug used by another company | Choose another slug or leave empty |\n| **Company timezone must be a valid IANA timezone identifier.** | Wrong format | Use e.g. `Africa/Dar_es_Salaam`, `Africa/Kampala` |\n| **Administrator phone number must be a valid Tanzanian (+255) or Ugandan (+256) number** | Wrong phone | Enter with country code |\n| **Activate the company before entering it** | Company suspended | Click **Activate** first |\n| **Cannot remove the last active user from the company** | Would leave company without users | Add another user first |\n| Roles/permissions pages missing in a company | **Enable roles**/**Enable permissions** off | Platform admin edits the company |\n\n## 11. Best practices\n- Set the correct timezone at creation; wrong timezones shift attendance and leave dates.\n- Use a real, monitored email for the first administrator and ask them to turn on 2FA.\n- Prefer roles over direct permissions; they are easier to review.\n- Use **Suspend** for a temporary closure. Use **Delete company** when access should end permanently.\n\n## 12. Setup checklist\n- [ ] Company created with correct name and timezone\n- [ ] First administrator signed in and changed the temporary password\n- [ ] **Enable roles** / **Enable permissions** decided\n- [ ] Administrator has 2FA turned on\n- [ ] Bank directory filled\n- [ ] Default avatars added (optional)\n\n## 13. Quick reference\n\n| Task | Controls in order |\n|---|---|\n| Save a company edit | **Edit company** → **Save** |\n| Rename a directory bank | **Edit** → **Bank name** → **Save changes** |\n| Remove a directory bank | **Delete** → **Delete bank** |\n| Remove a company | **Delete company** → review the company name → **Delete company** |\n| Select the male avatar category | **Add avatar** → **Gender category** → **Male** |\n"},{"path":"part-3-modules/02-roles-permissions-users.md","title":"02. Roles, Permissions and User Accounts","md":"# 02. Roles, Permissions and User Accounts\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Access administration](#13-access-administration)\n\n## 1. Overview and purpose\nThis module controls **who can sign in** and **what they can do**.\n- **Roles** – bundles of permissions given to people.\n- **Permissions** – the catalogue of single actions.\n- **User accounts** – logins, their roles, and sign-in security (2FA).\n- **Linking accounts to employees** – connecting a login to an employee record.\n- **Identity sync** – keeping name, email and phone the same on the user account and the employee record.\n\nWhere to find it:\n- Platform administrators: **Access Governance → Roles** and **Access Governance → Permissions**.\n- Company users: **Access Control → Roles** and **Access Control → Permissions**.\n- Company administrators with `users:read` can open the account list under **Access Control → Users**.\n\nRead [Roles and permissions overview](../part-1-getting-started/03-roles-and-permissions-overview.md) first for the concepts.\n\n## 2. Prerequisites and dependencies\n- The company exists ([Companies](01-companies.md)).\n- For a company to see these pages, the platform administrator must tick **Enable roles** (and optionally **Enable permissions**) on the company.\n- Employees must exist before you can link user accounts to them (Employees chapter).\n\n## 3. Who can use it (roles and permissions)\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View roles | `roles:read` | Company Admin, IT Administrator, Auditor, platform roles |\n| Create a role | `roles:create` | Company Admin, Platform Administrator |\n| Edit a role / change its permissions | `roles:update`, `roles:assign-permission`, `roles:revoke-permission` | Company Admin |\n| Delete a role | `roles:delete` | Company Admin |\n| View the permission catalogue | `permissions:read` | Company Admin, platform roles |\n| Create, edit or delete permissions | `permissions:create`, `permissions:update`, `permissions:delete` (platform users only) | Platform Super Admin |\n| View user accounts | `users:read`, `company_users:read` | Company Admin, IT Administrator |\n| Create / edit user accounts | `users:create`, `users:update` | Company Admin, IT Administrator |\n| Give or remove a role from a user | `users:assign-role`, `users:revoke-role`, `company_users:update` | Company Admin |\n| Require, enable or disable a user's 2FA | `users:manage-2fa`, `users:enable-2fa`, `users:disable-2fa` | IT Administrator, Company Admin |\n| View identity change audit | `identity_audit:read` | Company Admin, HR Manager, Auditor |\n| Roll back an identity change | `identity_audit:rollback` | Company Admin |\n| View security events | `security_events:read` | IT Administrator, Platform Support |\n\n## 4. Initial setup and configuration\n| # | Step | Mandatory? | Scope | One-time or changeable |\n|---|---|---|---|---|\n| 1 | Review the default roles that came with the company | Mandatory | Company | Changeable |\n| 2 | Create custom roles for job-specific access | Optional | Company | Changeable |\n| 3 | Make sure each role has the right **data scope** permission | Mandatory | Company | Changeable |\n| 4 | Assign roles to administrators, HR, finance and managers | Mandatory | Employee / user | Changeable |\n| 5 | Require 2FA for administrator accounts | Recommended | User | Changeable |\n| 6 | Check that every employee who must sign in has a linked user account | Mandatory | Employee | Changeable |\n\n## 5. Features – step by step\n\n### Feature: View roles\n**Purpose:** See which roles exist and what they include.\n**Steps:**\n1. Go to **Access Control → Roles** (company) or **Access Governance → Roles** (platform).\n2. Search the list. Each role shows whether it is **System** or **Custom**.\n3. Click a role. The panel shows the role details, **Assigned people** (*\"People who currently have this role.\"*) and the included **Permissions**.\n\n> 📷 Screenshot: Roles list and role detail panel with Assigned people and Permissions\n\n### Feature: Create a role\n**Purpose:** Build a role for a job in your organisation.\n**Steps:**\n1. On the Roles page click **Create role**.\n2. Optionally click one of the **Suggested roles** to start from a template.\n3. Enter a **Display name**, for example **HR Coordinator**. The **Key** fills automatically with `hr_coordinator`. Suggested roles start with an editable custom name and key. System role keys are reserved.\n4. Optionally add a **Description**.\n5. Under **Permissions**, use **Search permissions…** and tick each permission the role needs. Selected permissions are shown first; use **Enabled only** to see only ticked ones.\n6. Click **Create role**.\n\n**Expected result:** The role appears in the list as **Custom**.\n**Important notes:** **Role name is required.** appears if the display name is empty. Remember to include one data scope permission (see [overview](../part-1-getting-started/03-roles-and-permissions-overview.md#35-data-scope-whose-records-you-can-see)).\n\n### Feature: Change a role's permissions\n**Steps:**\n1. Open the custom role.\n2. Tick or untick permissions.\n3. Click **Save permissions**.\n\n**Expected result:** **Role permissions updated.** The next protected request uses the updated grants. Refresh an open page to reload its menus.\n\n### Feature: Assign a role to a person (from the role)\n**Steps:**\n1. Open the role.\n2. In **Assigned people**, use **Search and assign someone to this role.** and pick the user.\n3. To remove someone, use the remove action on their row.\n\n**Expected result:** **Role assigned to user.**\n**Important notes:** The person must be an active member of the company (**User is not an active member of this company**). You can also assign roles from **Companies → Current Company Users → Manage member access** (see [Companies](01-companies.md)).\n\n### Feature: Delete a role\nOpen the custom role, review its assigned users and confirm **Delete**.\n\n### Feature: View permissions and direct grants\n**Steps:**\n1. Go to **Access Control → Permissions** (or **Access Governance → Permissions**).\n2. Filter by **Module** or search.\n3. Click a permission to see **People with this permission assigned directly** and assign it to a user (**Select a user to assign this permission.**).\n\n**Important notes:** Direct grants bypass roles; review them regularly.\n\n### Feature: Create a permission (platform only)\n1. On **Access Governance → Permissions**, click **Create permission**.\n2. Enter **Display name** and **Name (key)** (e.g. `employees:read`), and optionally **Description**.\n3. Click **Create permission**.\n\n**Important notes:** New permissions do nothing unless the application checks that key. Normally you never need to create permissions.\n\n### Feature: Manage user accounts and 2FA\n**Purpose:** See user accounts and control their two-factor authentication.\n**Steps:**\n1. Open **Access Control → Users**.\n2. Search by **name, email, phone, user number**.\n3. In the **2FA** column, **On** or **Off** shows enrollment. **Required** means the account has to use two-factor authentication.\n4. Open the row’s action menu for the operations your permissions allow.\n   - **Require 2FA** – the user must set up 2FA at next sign-in and is blocked until they do.\n   - **Make 2FA optional** – removes the requirement; their existing setup stays.\n   - **Disable 2FA** – turns off 2FA and its recovery codes (use when a user lost their phone). Enter a reason, e.g. *\"User lost authenticator device\"*.\n   - **Assign Roles**, **Assign avatar**.\n\n### Feature: How employees get user accounts\nUser accounts for staff are normally created by HR through the employee invitation:\n1. HR uses **Invite employee** (Employees module), choosing **Send email invitation** or **Send email & SMS invitation**.\n2. The employee opens the link and completes registration ([Sign in guide](../part-1-getting-started/02-login-and-navigation.md#23-first-login-invitations-and-temporary-passwords)).\n3. The new user account is linked to the employee and gets the **Employee** role.\n\n### Feature: Unlink or remove a linked account\n**Purpose:** Detach a login from an employee record (for example if the wrong account was linked).\n**Steps:**\n1. Open the employee profile, section showing the linked user account.\n2. Click **Unlink user account from employee** – *\"The login will be detached from this employee. The user account will remain available as a separate company account.\"*\n3. Or click **Delete linked account access** – the login is detached **and** its company access is deactivated. The employee profile and history remain.\n\n### Feature: Identity sync and the identity change audit\n**Purpose:** First name, last name, email and phone are kept identical on the user account and the linked employee record.\n- When anyone changes these fields (on the user account, on the employee profile, or by approving a profile change request), both records update together.\n- A change to a user account updates all employee records linked to it, also in other companies.\n- Every change is recorded.\n\n**To review changes:**\n1. Go to **Insights → Identity change audit** (search \"identity\").\n2. Filter by **From date**, **To date**, field (**All fields**), source (**All sources**: **Employee edit**, **User edit**) or **Search name or value**.\n3. The table shows **Date & time**, **Employee / user**, **Field**, **Previous value**, **New value**, **Changed by**, **Source**.\n\n**To roll back a change:**\n1. Click **Roll back** on the row, optionally enter **Reason (optional)**, and confirm **Roll back this change?**.\n\n**Important notes:**\n- Only the latest change for a person can be rolled back.\n- It is refused if the values were changed again afterwards, or if it was already rolled back (**This change has already been rolled back**).\n- Roll back only from the company where the change was made.\n- The rollback itself is recorded as a new audit entry.\n\n## 6. Important fields and options\n| Field | Meaning |\n|---|---|\n| Display name | Name people see, e.g. \"HR Officer\" |\n| Key / Name (key) | Internal unique code, e.g. `hr_officer` or `leave_requests:approve` |\n| Description | What the role/permission is for |\n| Module | Group the permission belongs to |\n| System / Custom | Default role vs role you created |\n| Direct permission | Permission given to one user without a role |\n| Require 2FA | Forces the user to use two-factor sign-in |\n\n## 7. Daily usage procedures\n- New manager or HR staff: assign the matching role.\n- Staff leaving: their access ends through offboarding; check they no longer appear in **Assigned people** of admin roles.\n- Lost phone: **Disable 2FA** for the user, then ask them to set it up again.\n\n## 8. Approval workflows\nRole and permission changes take effect immediately; there is no approval. Identity changes made through a self-service profile change request follow the profile approval workflow (Employees chapter) before being synced.\n\n## 9. Links to other modules\n- [Companies](01-companies.md) – membership, **Manage member access**.\n- Employees – invitations, linked accounts, profile change approvals.\n- [Email, SMS and notifications](03-email-sms-notifications.md) – invitations and 2FA alerts need email/SMS.\n- Every other module – their pages appear only with the permissions set here.\n\n## 10. Common errors and troubleshooting\n| Problem | Cause | Solution |\n|---|---|---|\n| Roles/Permissions page missing | No `roles:read` / `permissions:read`, or company module disabled | Grant permission or ask platform admin to enable it |\n| **Only platform-scoped users can create permissions** | Company user tried to create a permission | Use existing permissions; ask platform admin |\n| **User is not an active member of this company** | Person not added to company | Add via Companies or invitation first |\n| User still sees old menus | Access not refreshed | Refresh page or sign out/in |\n| User sees only personal pages although given HR role | Role has only `data_scope:self` | Add a wider data scope |\n| Rollback refused | Values changed since, not the latest change, or wrong company | Make a manual correction instead |\n\n## 11. Best practices\n- Use the suggested roles as a starting point when creating a custom role.\n- Give each person the fewest permissions they need.\n- Avoid direct permissions; use roles.\n- Require 2FA for administrators, HR, payroll and IT users.\n- Review **Assigned people** of powerful roles (Company Admin, HR Manager, Finance) every quarter.\n\n## 12. Setup checklist\n- [ ] Default roles reviewed\n- [ ] Custom roles created where needed, each with a data scope\n- [ ] Administrators, HR, finance and managers assigned roles\n- [ ] 2FA required for privileged users\n- [ ] Every employee who signs in has a linked user account\n- [ ] Identity audit checked after bulk changes\n\n## 13. Access administration\n\nOpen **Access Control → Users** with `users:read`. The bookmarked address is `/dashboard/users`.\n\n![Access Control account list with an example user](../images/access-control-users.png)\n\nSystem roles have a read-only grants list. The API enforces this for role edits, deletion and individual permission changes. Create a custom role to change a set of grants. Review its selected permissions and confirm the change.\n\nThe appendix lists each of the four platform roles and twelve company roles by module. To see the grants currently assigned at your installation, open the role. [Default role grants](../part-6-appendices/08-default-role-grants.md)\n"},{"path":"part-3-modules/03-email-sms-notifications.md","title":"03. Email (SMTP), SMS and Notifications","md":"# 03. Email (SMTP), SMS and Notifications\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Verified delivery and editing behavior](#13-verified-delivery-and-editing-behavior)\n\n## 1. Overview and purpose\nHRMS informs people through four channels:\n| Channel | Example |\n|---|---|\n| **In-app** | The bell in the header and **Current notifications** |\n| **Email** | Invitations, password resets, approvals, scheduled reports |\n| **SMS** | Leave approved, payslip ready, password reset |\n| **Push** | Browser notifications (if the user allows them) |\n\nThe **Notifications** menu has three pages:\n- **Current notifications** – inbox, delivery history, channel switches, templates, rules and mail logs.\n- **Mail / SMTP configuration** – the company's outgoing email server.\n- **SMS configuration** – turning SMS on/off, SMS message registry and logs.\n\n## 2. Prerequisites and dependencies\n- The company exists ([Companies](01-companies.md)).\n- **Email:** you need SMTP details from your email provider or IT (host, port, username, password, sender address). If the company has no SMTP, the system uses a system-wide email server set by the installer, if one exists.\n- A platform administrator configures the SMS provider account and sender short code under **Platform SMS → Global → SMS gateway**. The installation administrator registers approved provider endpoints and supplies the field-encryption key for storing a new password.\n- Users must have correct email addresses and phone numbers (with country code, e.g. +255712345678).\n\n## 3. Who can use it (roles and permissions)\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| Open SMTP settings / add, edit SMTP | `scheduled_reports:manage_smtp` | Company Admin, IT Administrator |\n| Send SMTP test | `scheduled_reports:test_smtp` | Company Admin, IT Administrator |\n| View SMS settings and registry | `sms:settings-read` | Company Admin, platform admins |\n| Turn SMS on/off, edit registry items | `sms:settings-update` | Company Admin, platform admins |\n| View SMS logs | `sms:logs-read` | Company Admin, IT Administrator |\n| Retry a failed SMS | `sms:logs-retry` | Company Admin |\n| Send a test SMS | `sms:test` | Company Admin |\n| Platform SMS tab | `companies:read` plus SMS permissions | Platform administrators |\n| See and manage notifications page | `notifications:read`, `notifications:update`, `notifications:create` | Everyone with notification access |\n| Archive notifications | `notifications:delete` | |\n| View/update channel settings | `notifications:settings-read`, `notifications:settings-update` | Company Admin |\n| View / retry mail logs | `notifications:mail-logs-read`, `notifications:mail-logs-retry` | Company Admin, IT Administrator |\n| View delivery history | `notifications:delivery-logs-read` | Company Admin |\n| Send test notifications | `notifications:send`, `notifications:test` | Company Admin |\n| Manage your own preferences | `notification_preferences:manage-own` | All users |\n\n## 4. Initial setup and configuration\n| # | Step | Mandatory? | Scope | One-time or changeable |\n|---|---|---|---|---|\n| 1 | Add the company SMTP configuration and mark it **Default** (5.1) | Mandatory for email invitations | Company | Changeable |\n| 2 | Send an SMTP test (5.2) | Mandatory | Company | Repeat after changes |\n| 3 | Review **Channel Settings** (in-app, email, SMS, push) (5.6) | Recommended | Company | Changeable |\n| 4 | Turn **Company SMS** on and send a test SMS (5.3) | Optional | Company | Changeable |\n| 5 | Enable/disable individual SMS messages in the **SMS registry** (5.4) | Optional | Company | Changeable |\n| 6 | Review notification **Templates** and **Rules** (5.6) | Optional | Company | Changeable |\n| 7 | Each user sets personal **Notification Preferences** | Optional | Employee | Changeable |\n\n## 5. Features – step by step\n\n### Feature: 5.1 Add an SMTP configuration\n**Purpose:** Send emails from your own company address.\n**Before you start:** Get SMTP details from your email provider.\n**Steps:**\n1. Go to **Notifications → Mail / SMTP configuration**. The page is titled **SMTP Settings** (*\"Manage the company SMTP used by employee invitations and scheduled reports.\"*).\n2. Click **Add SMTP**.\n3. Fill in **Name**, **Host**, **Port** (default 587), **Security** (**NONE**, **STARTTLS**, **SSL_TLS**, **AUTO**), **Username**, **Password**, **Sender name**, **Sender email**, optional **Reply-to email**, **Connection timeout (ms)** (default 10000).\n4. Set **Status** to **Active** and **Default configuration** to **Default**.\n5. Optionally use **Draft SMTP test** with a **Test recipient email** before saving.\n6. Save (**Create**).\n\n**Expected result:** The configuration appears in **SMTP configurations**.\n**Important notes:**\n- **Name, host, and sender email are required before a draft SMTP test.**\n- When editing, leave **Password (leave blank to keep)** empty to keep the old password.\n- Common settings: port 587 with STARTTLS, or port 465 with SSL_TLS.\n\n> 📷 Screenshot: SMTP Settings – Add SMTP form with Draft SMTP test\n\n### Feature: 5.2 Test an SMTP configuration\n1. On the configuration row, click **Test SMTP** / **Send test**.\n2. Enter a recipient and send.\n\n**Expected result:** **SMTP test sent.** Check the inbox (and spam). If **SMTP test failed.**, check host, port, security and password.\n\n### Feature: 5.3 Turn company SMS on or off and send a test\n**Steps:**\n1. Go to **Notifications → SMS configuration** (SMS overview, **Company SMS**).\n2. The tiles show **Company SMS** (**On**/**Off**), **Recent logs** and **Failed**.\n3. Check **Company SMS settings** for the platform and company switch states. **Enable** or **Disable** changes this company’s switch. Both switches must be on for a company SMS to reach the provider.\n4. To test, click **Send test**, enter a country code, 9-digit phone number and message, then **Send test SMS**.\n\n**Important notes:** **Enter a country code, 9-digit phone number, and message.** appears if a field is missing.\n\n### Feature: 5.4 SMS registry (which events send SMS)\n**Steps:**\n1. Open the **SMS registry** tab. Columns: **Code**, **Name**, **Module**, **Status** (**ENABLED**/**DISABLED**).\n2. Click a row to open **Update registry item** – *\"Send a test message or update this registry item.\"*\n3. Switch **Enabled** on or off, check the **Template** text, and save.\n\nSMS events available include: password reset requested, two-factor enabled/disabled, leave submitted / approval required / approved / rejected, offboarding approval required / reminder / asset overdue / settlement overdue, payslip ready, staff finance application and repayment events, onboarding started, and missed-punch alerts. Some are off by default.\n\n### Feature: 5.5 SMS logs and retry\n1. Open **SMS logs**. Filter by status (**Pending**, **Sent**, **Failed**).\n2. Columns: **Recipient**, **Code**, **Status**, **Error**.\n3. For a failed message click retry. **Retry queued.** confirms.\n\n### Feature: 5.6 Notifications page (company)\nGo to **Notifications → Current notifications** (*\"Review inbox events, delivery outcomes, company channel switches, and outbound mail activity.\"*). Tabs:\n\n| Tab | Use |\n|---|---|\n| **Inbox** | Your notifications. Filter by status, category, priority. **Mark all inbox notifications as read**. |\n| **Deliveries** | Delivery history per channel with **Delivery status**. |\n| **Channel Settings** | Switch each channel (in-app, email, SMS, push) on or off for the company: **Enable channel** / **Disable channel**. |\n| **Templates** | Choose **View → Edit template**, change the title or message text, then choose **Save template**. The detail view also offers **Activate template** or **Deactivate template**. |\n| **Rules** | Choose **View → Edit rule**, change reminder times, escalation, repeat interval, priority or delivery channels, then choose **Save rule**. **Enable rule** and **Disable rule** change its status. |\n| **Mail Logs** | Every email sent, with status. Failed or skipped emails can be retried (**Mail log retry queued.**). |\n| **Channel Registry** | List of notification types and their channels. **Enable item** / **Disable item**. |\n\nThere is also **Send a test notification to your current company user** to check that in-app delivery works.\n\n### Feature: 5.7 Platform notification tabs (platform administrators)\nPlatform administrators see **Platform Settings**, **Platform Registry** and **Platform Mail Logs** (*\"Configure platform channel registry, delivery settings, and outbound mail logs.\"*), and **Platform SMS** (**Global setting**, registry and logs; *\"Turns platform SMS on or off.\"*).\n\n### Feature: 5.8 Personal notification preferences\nEach user opens **Settings → Notifications** and switches channels on or off per event (see [Sign in and navigation](../part-1-getting-started/02-login-and-navigation.md#210-settings-page)). An administrator's company-wide switch overrides personal choices.\n\n### Configure the SMS gateway\n\n1. Open **Platform SMS → Global** using a platform administrator account with SMS settings access.\n2. Under **SMS gateway**, select the **Provider endpoint** and enter the **Provider account**, **Sender short code** and provider **Channel**, if required.\n3. Enter the **Gateway password** when changing the account or endpoint. Leave it blank to keep the password for the same account. The screen shows whether a password is configured.\n4. Select **Enable gateway** when ready and choose **Save gateway**. A working installation configuration continues to apply until an administrator saves platform settings.\n5. For an authorized delivery test, use **Send test** in the intended company. The platform and company switches both apply. A disabled switch records **Skipped** with the reason. Retrying uses the original company’s current policy.\n\n### Check email routing\n\n**SMTP Settings**, **Channel Settings** and **Mail Logs** show **Email routing**. Platform administrators can also see it in **Platform Mail Logs**. With the override off, delivery uses the intended recipients. With the override on, every outgoing email uses the configured test recipients, including SMTP tests. The screen shows their count. An invalid override or an empty test **To** list blocks sending. The installation administrator maintains the test recipient list.\n\n## 6. Important fields and options\n| Field | Meaning |\n|---|---|\n| Security (SMTP) | Encryption: NONE, STARTTLS, SSL_TLS or AUTO |\n| Default configuration | The SMTP used for invitations and reports |\n| Status (SMTP) | Active / Inactive |\n| Company SMS | Master switch for SMS in this company |\n| Registry item Enabled | Whether one SMS event is sent |\n| Channel | IN_APP, EMAIL, SMS, PUSH |\n| Priority | e.g. Medium, Urgent |\n| Mail log status | e.g. PENDING, DELIVERED, FAILED, SKIPPED |\n\n## 7. Daily usage procedures\n- Check **Mail Logs** and **SMS logs** for **FAILED** items weekly and retry.\n- If users report missing invitations, look up their email in **Mail Logs**.\n- Read your inbox via the bell; mark items read.\n\n## 8. Approval workflows\nNone. Rules only control reminders and escalations for approvals defined in other modules.\n\n```mermaid\nflowchart LR\n  E[Event e.g. leave approved] --> R{Rule and registry enabled?}\n  R -- no --> X[Not sent]\n  R -- yes --> C{Company channel on? User preference on?}\n  C -- in-app --> I[Bell / Inbox]\n  C -- email --> M[Company SMTP or system SMTP] --> ML[Mail Logs]\n  C -- SMS --> S[SMS gateway] --> SL[SMS logs]\n  C -- push --> P[Browser push]\n```\n\n## 9. Links to other modules\n- Employees – invitations use SMTP (and SMS).\n- Sign-in – password reset and 2FA messages.\n- Leave, Attendance, Onboarding, Offboarding, Payroll, Finance – send notifications.\n- Reports & Analytics → Scheduled Reporting – uses the same SMTP configurations.\n\n## 10. Common errors and troubleshooting\n| Problem | Cause | Solution |\n|---|---|---|\n| **SMTP test failed.** | Wrong host/port/security/password, or provider blocks login | Check details; try 587+STARTTLS or 465+SSL_TLS; ask IT for an app password |\n| Invitations not received | No default SMTP, email in spam, wrong address | Set a **Default** SMTP; check **Mail Logs**; check spam |\n| SMS never sent | Platform or company SMS is off, the event is disabled, or the gateway is unavailable | Check the two switches, event settings and SMS logs. A platform administrator can review the gateway configuration. |\n| SMS **FAILED** with gateway error | Wrong number or gateway rejection | Fix phone number (country code); retry |\n| **Platform SMS controls need companies:read.** | Missing platform permission | Platform admin only |\n| Users get no emails although SMTP works | Email channel disabled or user preference off | Check **Channel Settings** and user preferences |\n\n## 11. Best practices\n- Use a dedicated sender address such as hr@yourcompany.\n- Test SMTP after every password change at your email provider.\n- Enable only the SMS events people need, to control cost.\n- Keep phone numbers in international format.\n\n## 12. Setup checklist\n- [ ] SMTP configuration added, Active and Default\n- [ ] SMTP test received\n- [ ] Channel Settings reviewed\n- [ ] Company SMS enabled and test SMS received (if used)\n- [ ] SMS registry items reviewed\n- [ ] Mail Logs and SMS logs checked after first invitations\n\n## 13. Verified delivery and editing behavior\n\n| Platform SMS | Company SMS | Company delivery |\n|---|---|---|\n| Off | Off | Skipped |\n| Off | On | Skipped |\n| On | Off | Skipped |\n| On | On | Eligible for delivery through the enabled gateway |\n\nProvider configuration, event settings and a valid recipient still apply. Account-level security notices without a company use the platform switch. Company administrators can change their own SMS and event settings. Editing a shared notification template or rule saves a company-specific copy. Users with read-only access can inspect the record.\n\n"},{"path":"part-3-modules/04-organization-structure.md","title":"04. Organization Structure","md":"# 04. Organization Structure\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Manager routing, numbering and staffing](#13-manager-routing-numbering-and-staffing)\n\n## 1. Overview and purpose\n\nThe organization structure describes how your company is laid out. Every employee record points to it. It has these building blocks:\n\n| Building block | Menu | What it is |\n|---|---|---|\n| Branch | **Branches** | A physical location or office (for example, Dar es Salaam head office). |\n| Department | **Departments** | A team or unit. It can belong to one branch, or be company-wide. It can sit under a parent department. |\n| Position | **Positions** | A job (for example, Accountant). It is linked to a branch and to one or more departments. It can report to another position. |\n| Cost center | **Structure → Cost centers** | A code that shows where money is spent. It can be linked to a branch or department. |\n| Pay grade | **Structure → Grades** | A pay and seniority band (for example, G4). |\n| Employee numbering | **Structure → Numbering** | The format of employee numbers (prefix, number of digits, next number). |\n\n**Reporting lines**\n\n- Set **Department manager** on a department to name the employee who reviews requests for that department.\n- Set **Reports To** on an employee to name their individual line manager. **Employees → My team** uses this assignment.\n- If **Reports To** is empty, a reporting-manager step looks at the employee’s **Reports To Position**. It uses one eligible holder of the parent position, preferring the same department, then the same branch, then the company. A tie at the closest level leaves that step unassigned and the workflow follows its existing escalation. See [Self-service and approvals](17-self-service-and-approvals.md).\n\n## 2. Prerequisites and dependencies\n\n- A **company** must exist and you must be working in it (menu **Companies**).\n- Countries and cities are picked from lists when you create a branch.\n- Roles must give you the permissions in section 3 (see the Roles and permissions chapter).\n\nCorrect creation order (each step depends on the one before):\n\n```mermaid\nflowchart LR\n  A[Company] --> B[Branches]\n  B --> C[Departments\u003cbr/>parent first, then child]\n  C --> D[Positions\u003cbr/>link to branch + departments]\n  A --> E[Grades]\n  B --> F[Cost centers]\n  C --> F\n  A --> G[Employee numbering]\n  D --> H[Employees]\n  E --> H\n  F --> H\n  G --> H\n```\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View branches | branches:read | HR admin, HR manager |\n| Add / edit / delete branches | branches:create, branches:update, branches:delete | HR admin |\n| Give users access to a branch | branches:manage-access | HR admin / system admin |\n| View departments | departments:read | HR admin, HR manager |\n| Add / edit / delete departments | departments:create, departments:update, departments:delete | HR admin |\n| Give users access to a department | departments:manage-access | HR admin / system admin |\n| Assign positions to a department | positions:assign-department | HR admin |\n| View positions | positions:read | HR admin, HR manager |\n| Add / edit / delete positions | positions:create, positions:update, positions:delete | HR admin |\n| Cost centers | cost_centers:read, cost_centers:create, cost_centers:update, cost_centers:delete | HR admin, Finance |\n| Pay grades | employee_grades:read, employee_grades:create, employee_grades:update, employee_grades:delete | HR admin |\n| Employee numbering | employee_numbering:read, employee_numbering:update | HR admin |\n| Change an employee's position assignments | employees:update | HR admin |\n\nThe **Structure** menu appears if you hold any cost center, grade or numbering permission.\n\n## 4. Initial setup and configuration\n\n| # | Step | Mandatory? | Scope | Changeable later? |\n|---|---|---|---|---|\n| 1 | Create branches | Mandatory | Company | Yes |\n| 2 | Create departments (parents before children) | Mandatory | Branch or company-wide | Yes |\n| 3 | Create positions and link them to departments | Mandatory | Branch + department | Yes |\n| 4 | Set **Reports To Position** / **Manager Position** on positions | Optional (recommended) | Position | Yes |\n| 5 | Create pay grades | Optional | Company | Yes |\n| 6 | Create cost centers | Optional | Company, branch or department | Yes |\n| 7 | Set employee numbering | **Mandatory before the first employee** | Company | Yes, but the next number can never go down |\n| 8 | Grant users branch / department access | Optional | User | Yes |\n\n## 5. Features – step by step\n\n### Feature: Add a branch\n**Purpose:** Record an office or location.\n**Before you start:** You need **branches:create**.\n**Steps:**\n1. Open **Branches**.\n2. Click **Add branch**.\n3. Enter **Name** (required), **Code**, choose **Country**, then **City** (pick the country first), and **Address**.\n4. Set **Status** (active or inactive).\n5. Save.\n**Expected result:** The branch appears in the list.\n**Important notes:** Codes must be unique. If you enter a code already used you see \"Code \"…\" already exists. Please use a different code.\"\n\n> 📷 Screenshot: Branches – Add branch dialog\n\n### Feature: Edit or delete a branch\n**Steps:**\n1. In **Branches**, use **Search branch** or the status filter to find it.\n2. Click **Edit branch** to change it, or **Delete branch** and then **Confirm Delete**.\n**Important notes:** Set a branch to inactive instead of deleting it if it has history.\n\n### Feature: Branch access (who may work with a branch)\n**Purpose:** Limit which user accounts can see and manage data of a branch.\n**Steps:**\n1. In **Branches**, click **Access** on the branch row.\n2. In **Branch access**, search and select users (placeholder \"Search and select user (e.g. Emmanuel)\").\n3. Grant access. To remove it, click **Revoke branch access**.\n**Important notes:** Needs **branches:manage-access**. If no valid user is selected you see \"Please choose at least one valid user before granting branch access.\"\n\n### Feature: Add a department\n**Purpose:** Record a team or unit.\n**Before you start:** Create the branch first. Create a parent department before its sub-departments.\n**Steps:**\n1. Open **Departments**.\n2. Click **Add department**.\n3. Enter **Name** (required), **Code**, **Description**.\n4. Choose **Branch**, or leave it empty for a company-wide department.\n5. Choose **Parent Department**, or \"No parent\".\n6. Use **Find a department manager** to search by name or employee number. Select the employee in **Department manager**. To clear an existing assignment, select **No manager assigned**.\n7. Optionally tick positions to attach to this department (or **Select all available positions**).\n8. Set **Status** and select **Save**. **Edit department** uses the same manager field. The **Department manager** column shows the saved name.\n**Expected result:** Departments are listed in groups by branch. Departments with no branch are grouped under \"Company-wide departments\".\n**Important notes:**\n- The manager picker shows eligible active employees within your authorized company and employee scope. The selected employee needs an active company membership and sign-in account. Existing review permissions still apply.\n- A department cannot be its own parent.\n- Inactive positions cannot be attached.\n- You cannot remove a position from a department while employees use that department + position combination.\n\n### Feature: Delete a department\n**Steps:** Click **Delete department** → **Confirm Delete**.\n**Important notes:** Deletion is blocked if employees have this as their main department, or if it has child departments. Move them first.\n\n### Feature: Department access\nSame as branch access: click **Access** on the row, then use **Department access** / **Revoke department access**. Needs **departments:manage-access**.\n\n### Feature: Add a position\n**Purpose:** Define a job and where it sits.\n**Before you start:** The branch and its departments must exist.\n**Steps:**\n1. Open **Positions**.\n2. Click **Add position**.\n3. Enter **Name** (required), **Code**, **Description**.\n4. Choose **Branch**. The department list then shows only departments of that branch.\n5. Tick one or more departments (or **Select all available departments**).\n6. Optionally choose **Reports To Position**, tick **Manager Position**, and set **Level**.\n7. Set **Department staffing limit** (how many people can hold this position in each department).\n8. Tick **Active** and save.\n**Expected result:** The position appears with columns Code, Name, Departments, Lvl, Mgr, Dept. staffing limit, Act.\n**Important notes:**\n- \"Select a branch before assigning this position to departments.\"\n- If you see \"No departments are associated with this branch\", check the branch on the department.\n- A position cannot report to itself.\n\n### Configure staffing checks\n\n1. Open **Positions** and find **Department staffing policy**. A user with **positions:update** and company-wide data access can change the policy.\n2. Set the position’s **Department staffing limit**. The system measures each department separately. Employees who are onboarding, active or suspended occupy seats.\n3. Turn on **Enforce staffing limits across hiring and transfers** to reserve seats for pending, unexpired invitations and block assignments that exceed the limit. This covers invitations, direct hires, imports, transfers and reactivations. Accepting an invitation uses its reserved seat. If two people try to take the last seat, only one can take it.\n4. With the switch off, invitations can continue after a capacity warning. Direct hires and position changes still check occupied seats. Current assignments stay in place when you switch the policy on.\n\n### Feature: Delete a position\n**Steps:** Click **Delete position** → **Confirm Delete**.\n**Important notes:** Blocked while employees hold the position, or while it is still linked to departments. Untick the departments first.\n\n### Feature: Pay grades\n**Purpose:** Group people by pay and seniority.\n**Steps:**\n1. Open **Structure → Grades** (page title **Pay grades**).\n2. Click **Add a grade**.\n3. Enter **Short code** (for example G4, max 50 characters) and **Grade name** (max 120).\n4. Optionally set **Rank** (\"Lower numbers are usually more junior.\") and **Notes**.\n5. Choose whether to assign it to people: \"Yes, assign this to people\" or \"No, keep it on file only\".\n6. Save.\n**Important notes:** Codes must be unique. A grade used by employees cannot be deleted.\n\n### Feature: Cost centers\n**Steps:**\n1. Open **Structure → Cost centers**.\n2. Click **Add cost center**.\n3. Enter **Short code** and **Cost center name**.\n4. Optionally choose **Branch (optional)** and **Department (optional)**. The department must belong to the chosen branch.\n5. Add **Notes (optional)** and save.\n**Important notes:** A cost center used by employees cannot be deleted.\n\n### Feature: Employee numbering\n**Purpose:** Control the format of new employee numbers.\n**Steps:**\n1. Open **Structure → Numbering** (page title **Employee numbering**).\n2. Set **Prefix** (blank, or 2–20 capital letters/digits, for example EMP).\n3. Set **Digits** (padding, 3–12).\n4. Set **Next** (the next number to assign, whole number above 0).\n5. Read **Next employee number**. The prefix and slash appear to the left of one tile per digit. The preview updates as you type. Select **Save numbering** to apply changes.\n\nWith prefix `HR`, four digits and next number `7`, the preview and issued number are `HR/0007`. A blank prefix gives `0007`. A number longer than the selected width is shown in full, for example `HR/10001`.\n\n![Employee numbering preview with HR followed by a slash and four digit tiles showing 0007](../images/employee-number-preview.png)\n\n**Important notes:** You cannot lower **Next** below the current value. Until numbering is set, creating employees fails with \"Configure the employee number format before creating employees\".\n\n### Feature: Employee position assignments (primary, acting, temporary, secondary)\n**Purpose:** Record which position(s) an employee holds over time.\n**Steps:** Open the employee profile → **Positions** tab → **Add Position Assignment**. Choose position, **Assignment Type** (Primary, Acting, Temporary, Secondary), **Start Date**, optional end date and status (Active, Inactive, Completed). See [05. Employees](05-employees.md).\n**Important notes:** End date cannot be before start date.\n\n## 6. Important fields and options\n\n| Screen | Field | Meaning |\n|---|---|---|\n| Branch | Name | Required. |\n| Branch | Code | Optional, unique. |\n| Department | Branch | Empty = company-wide. |\n| Department | Parent Department | Builds the department tree. |\n| Department | Department manager | Employee assigned to review department requests. |\n| Position | Reports To Position | Parent position used for a reporting-manager step when the employee has no individual line manager. |\n| Position | Manager Position | Marks the position as a managerial job. |\n| Position | Level | Seniority number. |\n| Position | Department staffing limit | Seats available for this position in each department. |\n| Grade | Rank | Seniority order, lower = more junior. |\n| Numbering | Prefix / Digits / Next | Format and next number. |\n\n## 7. Daily usage procedures\n- Add a new position when a new job is approved, then link it to the departments where it is used.\n- When a team is reorganized, update the department parent and move employees using movements (see Employee movements chapter) before deleting old departments.\n- Review inactive branches, departments and positions monthly.\n\n## 8. Approval workflows\nStructure records are saved immediately; there is no approval step. Changes to an employee's structure (transfer, promotion, manager change) go through employee movements or the **Update Profile** panel (see [05. Employees](05-employees.md)).\n\n## 9. Links to other modules\n- [05. Employees](05-employees.md) – every employee needs a branch, department and position.\n- [17. Self-service and approvals](17-self-service-and-approvals.md) – profile changes and attendance corrections can be reviewed by the department manager or the eligible reporting manager with review permission.\n- Payroll, Attendance and Leave use branch, department, grade and cost center for policies and reports.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Code … already exists\" | Code is already used. | Use a different code. |\n| \"Cannot delete this department because N employee(s) are currently assigned to it\" | Employees still in the department. | Move the employees first. |\n| \"Cannot delete this department while it has child departments…\" | Sub-departments exist. | Reassign or remove the children. |\n| \"Cannot delete this position while it is still assigned to one or more departments…\" | Position still linked. | Edit the position and untick the departments. |\n| \"Cannot remove this position from … because N employee(s) are assigned to it there…\" | Employees hold that position in that department. | Reassign the employees first. |\n| \"No departments are associated with this branch…\" | Departments have no or a different branch. | Fix the branch on the department. |\n| \"The grade/cost center is assigned to employees and cannot be deleted\" | In use. | Mark it inactive instead. |\n| \"Configure the employee number format before creating employees\" | Numbering not set. | Set **Structure → Numbering**. |\n| The position is full in this department | Its occupied and reserved seats reach the applicable limit. | Check employee assignments and pending invitations in that department, select a position with room or have an authorized administrator review the limit. |\n| \"next_number cannot be reduced below N\" | Tried to lower the next number. | Use a value equal to or above N. |\n| \"You do not have permission to …\" | Missing permission. | Ask an administrator to update your role. |\n\n## 11. Best practices\n- Agree on short codes before you start (branch, department, position, grade, cost center).\n- Build the structure top-down: branches → parent departments → child departments → positions.\n- Prefer **inactive** over delete for anything that has been used.\n- Set the employee numbering once, before the first employee, and avoid changing the prefix later.\n\n## 12. Setup checklist\n- [ ] Company exists and you are working in it\n- [ ] All branches created\n- [ ] Parent and child departments created\n- [ ] Positions created, linked to branch and departments\n- [ ] Reports To Position / Manager Position set\n- [ ] Pay grades created (if used)\n- [ ] Cost centers created (if used)\n- [ ] Employee numbering saved\n- [ ] Branch / department access granted to the right users\n\n## 13. Manager routing, numbering and staffing\n\n| Task | Where to check |\n|---|---|\n| Set or remove a department manager | **Departments → Edit department → Department manager → Save** |\n| Find the reviewer of an employee request | Check the workflow, department manager, employee’s **Reports To** and then the eligible holder of **Reports To Position**. A configured leave workflow retains its own approval steps. The fallback leave manager step tries the department manager first. |\n| Confirm the next employee number | **Structure → Numbering → Next employee number** displays the prefix, separator and full padded sequence. |\n| See whether an invitation reserves a seat | **Positions → Department staffing policy**. With enforcement on, pending unexpired invitations reserve seats. Cancelling or expiry makes those seats available again. |\n"},{"path":"part-3-modules/05-employees.md","title":"05. Employees","md":"# 05. Employees\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThe **Employees** menu holds the employee directory and everything HR does with employee records: adding people, inviting them to register themselves, importing them from Excel, viewing their profile, changing their status, and reviewing changes employees ask for.\n\nPages under **Employees**:\n\n| Group | Page | What it does |\n|---|---|---|\n| Employee management | **All Employees** | Search, filter and open employee records. |\n| Employee management | **Inactive Employees** | Former employees and retained records. |\n| Employee management | **Profile Updates** | Approve employee profile updates (manager → HR). See [17](17-self-service-and-approvals.md). |\n| Employee management | **Profile Changes** | Review employee change requests sent from **Employees → My employee workspace**. |\n| Employee management | **Offboarding** | Exit processes (see Offboarding chapter). |\n| Joining & onboarding | **Invite** | Invite a new hire to fill in their own details. |\n| Joining & onboarding | **Registration** | Register one employee, or **Bulk import** from Excel. |\n| Joining & onboarding | **Onboarding**, **Contracts**, **Salary approvals**, **Recruitment** | Covered in their own chapters. |\n\nEach employee has a profile page reached by clicking the employee in the list.\n\n## 2. Prerequisites and dependencies\nSet these up first (see [04. Organization structure](04-organization-structure.md)):\n1. Branches, departments and positions (an employee needs all three).\n2. **Structure → Numbering** – mandatory; without it no employee can be created.\n3. Optional: grades, cost centers.\n4. Optional: onboarding workflows (to start onboarding when registering or inviting).\n5. Optional: shifts/timetables and attendance devices (Registration can assign them).\n6. For invitations: the system must be able to send email (and SMS, if used).\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See the employee directory and profiles | any of employees:read, employees:create, employees:update, employees:delete | HR admin, HR manager |\n| Register an employee / bulk import | employees:create (or company user creation permissions) | HR admin |\n| Invite an employee | employees:create | HR admin |\n| Edit employee details, positions, departments | employees:update | HR admin |\n| Change employment status | employees:change-status | HR manager |\n| Set exit statuses directly (bypassing offboarding) | employees:force-exit-status | Senior HR / system admin |\n| Approve profile updates | self_service_requests:manager_review (manager stage), self_service_requests:final_approve (HR stage), self_service_requests:approve | Department manager, HR |\n| Review profile change requests | profile_change_request:view_all, profile_change_request:review, profile_change_request:approve, profile_change_request:reject, profile_change_request:request_correction | HR |\n| Start onboarding during registration | onboarding_requests:create | HR admin |\n\n## 4. Initial setup and configuration\n1. **Mandatory** – Set employee numbering (company, one-time, changeable).\n2. **Mandatory** – Have branches, departments and positions ready.\n3. **Optional** – Create onboarding workflows so new employees start onboarding automatically.\n4. **Optional** – Prepare the Excel template if you will import many employees (download it from **Registration → Bulk import**).\n\n## 5. Features – step by step\n\n### Feature: Find and open an employee\n**Purpose:** Look up any employee record.\n**Steps:**\n1. Open **Employees → All Employees**.\n2. Type in **Search employees** (placeholder \"Name, employee number…\").\n3. Use **Employment status** filter (All, Active, Onboarding, Suspended, Inactive).\n4. Click the employee to open the profile.\n**Expected result:** The employee profile opens. A warning \"Incomplete profile details.\" may show if key items are missing.\n\n> 📷 Screenshot: All Employees – search box and status filter\n\n### Feature: Register an employee (manual)\n**Purpose:** Create one employee record.\n**Before you start:** Numbering, branch, department, position ready.\n**Steps:**\n1. Open **Employees → Registration**. Keep the manual tab (not **Bulk import**).\n2. Work through the steps: **Details**, **Contacts**, **Addresses**, **Relatives**, **IDs**, **Bank**, **Academic**, **Professional**, **Experience**.\n3. On **Details** fill **First Name**, **Last Name** (required), **Middle Name**, **Preferred Name**, **Gender**, **Date of Birth**, **Marital Status**, **Nationality**, **Email**, **Phone Number**.\n4. Choose **Branch**, then **Department** (required), then **Position**. Lists fill only after the item above is chosen.\n5. Choose **Reports To** (the line manager, optional), **Employment Type** (Permanent, Contract, Probation, Temporary, Part Time, Intern, Consultant), **Hire Date**, **Probation End Date**.\n6. **Employee Number (Optional)** – \"Leave blank to auto-assign the next unused number.\"\n7. Add at least one contact (\"At least one contact is required before saving employee.\").\n8. Optional: onboarding (**Onboarding workflow**, **Start onboarding automatically**), **Company roles**, **Branch access**, attendance assignment (shift/timetable) and **Device and access control setup**.\n9. Click **Save Employee**.\n**Expected result:** \"Employee saved successfully.\" or \"Employee created and onboarding started.\"\n**Important notes:**\n- The form remembers unfinished work: \"You have an unfinished employee registration.\" – **Continue where you left off?**\n- Leave **Start onboarding automatically** off unless the workflow already has approvers on every step; otherwise onboarding stays a draft.\n- Phone numbers are entered without the country code (max 9 digits) after choosing **Phone Country**.\n\n### Feature: Invite an employee to self-register\n**Purpose:** Let the new hire fill in their own details and create their user account.\n**Steps:**\n1. Open **Employees → Invite** (title **Invite employee**).\n2. **Personal details**: **First name**, **Last name**, **Gender**, **Work email**, **Phone number** (with country code, e.g. +255712345678).\n3. **Work assignment**: **Branch**, **Department**, **Position**, **Reports to** (optional).\n4. **Employment & onboarding**: **Employment type**, **Hire date**, **Onboarding workflow**.\n5. Click **Send email invitation** (or **Send email & SMS invitation**).\n**Expected result:** The new hire receives a link. On the registration page (\"Complete your registration\") they enter their details; when done they see \"Your employee account is ready.\" and can log in.\n**Important notes:**\n- **Positions → Department staffing policy** controls whether an invitation can continue after a capacity warning. When enforcement is on, an unexpired invitation reserves one department seat and accepting it uses that reservation.\n- Invitations expire (default 72 hours). Statuses: pending, accepted, expired, cancelled.\n- Pending invitations can be resent from **Employees → Onboarding**.\n- \"This invitation has expired\" / \"This invitation is no longer available\" – send a new invitation.\n\n### Feature: Bulk import employees from Excel\n**Steps:**\n1. Open **Employees → Registration → Bulk import**.\n2. Download the template and fill it in. Only .xlsx files are accepted.\n3. **Choose the Excel workbook**.\n4. **Set import behavior**: **Add new only**, **Update existing only**, or **Add & update**. Turn **Skip bad rows** on to import only valid rows.\n5. Click **Check file**. Review the preview (\"Every row is ready to import.\" or \"Some rows need attention\").\n6. Optionally tick **Run in background** for large files.\n7. Click **Confirm & import**.\n**Expected result:** \"Import finished.\" Download the Excel row report for row-level errors. Earlier runs are under **Past imports**.\n\n### Feature: Employee profile tabs\nThe profile has buttons **Update Profile** and **Update Status**, a **Find Another Employee** search, and these tabs:\n\n| Tab | Contents |\n|---|---|\n| Contacts | Phone/email contacts |\n| Documents | Uploaded documents |\n| Letters | Generated letters; **Generate and save**, **Preview**, **Download PDF** |\n| Contracts | Employment contracts |\n| Addresses, Relatives, IDs, Banks | Personal records |\n| Depts | Department assignments (**Add Department Assignment**) |\n| Positions | Position assignments (**Add Position Assignment**, type Primary/Acting/Temporary/Secondary) |\n| Movements | Transfers, promotions, manager changes (**Add Employee Movement**) |\n| History | **Status History** – employment status changes |\n| Academic, Professional, Experience | Qualifications and work history |\n| User | The linked user account |\n\n### Feature: Update Profile (identity and placement)\n**Steps:**\n1. On the profile click **Update Profile**.\n2. Change account details (first name, last name, email, username, optional new password – at least 6 characters).\n3. Change **Branch**, **Department**, **Position**, **Manager**, **Grade**, **Cost Center** as needed, with an effective date and optional reason.\n4. Save.\n**Important notes:** The employee's name, email and phone are kept in sync with the user account. Placement changes are recorded in history.\n\n### Feature: Change employment status\n**Purpose:** Activate, suspend, deactivate or exit an employee.\n**Steps:**\n1. On the profile click **Update Status**.\n2. Choose the new **Employment Status** and **Effective Date**.\n3. Complete the requirements shown for that status, for example:\n   - **Suspension**: suspension reason (Disciplinary, Pending investigation, Administrative, Other), period, pay status (Paid, Partial, Unpaid).\n   - **Exit** (resignation, termination, retirement, end of contract): **Exit reason**, **Exit date**, **Last working day**, **Rehire eligibility**, **Offboarding checklist** (\"Tick items already done. The rest become tasks in the Offboarding tab.\").\n   - **Activation** from onboarding: work schedule, leave and attendance policy.\n4. Review (\"Review the changes before saving\") and confirm.\n**Expected result:** The status changes; it appears in the **History** tab. \"Everything is saved together. If any part fails, nothing is saved.\"\n**Allowed changes:**\n\n| From | Can move to |\n|---|---|\n| Onboarding | Active, Inactive |\n| Active | Suspended, Inactive, Resigned, Terminated, Retired, Deceased, Exited |\n| Suspended | Active, Inactive, Terminated, Exited |\n| Inactive | Active, Terminated, Exited |\n| Resigned / Terminated / Retired | Exited |\n| Deceased / Exited | (none) |\n\n### Feature: Reset password, 2FA, archive\nFrom **All Employees** row actions (needs the right permission): **Reset Password** (temporary password; the employee must change it at login), **Enable 2FA / Disable 2FA**, **Remove / disable access** (archive), **Delete permanently**. Bulk **Archive employees** is available for selected rows.\n\n### Feature: Review profile change requests (HR)\n**Steps:**\n1. Open **Employees → Profile Changes**.\n2. Open a request; compare **Current** and **Requested**.\n3. Choose **Approve request**, **Decline request** (reason required), or **Return for correction** (instructions required).\n**Expected result:** Approved changes are applied to the employee record. **Request history** shows the audit trail.\n\n### Feature: Identity audit (brief)\n**Insights → Identity audit** lists changes that kept user accounts and employee records (name, email, phone) in sync. Use it to check who changed identity details.\n\n## 6. Important fields and options\n\n| Field | Meaning |\n|---|---|\n| Employee number | Auto-assigned from numbering unless overridden. |\n| Reports To | The assigned line manager used for team views and manager approvals. A reporting-manager step can also resolve an eligible holder of the parent position when this is blank. |\n| Employment Type | Permanent, Contract, Probation, Temporary, Part Time, Intern, Consultant. |\n| Employment status | Onboarding, Active, Suspended, Inactive, Resigned, Terminated, Retired, Deceased, Exited. |\n| Assignment Type | Primary, Acting, Temporary, Secondary. |\n\n## 7. Daily usage procedures\n- New hire: **Invite** (preferred) or **Registration** → follow **Onboarding** → activate with **Update Status**.\n- Check **Profile Updates** and **Profile Changes** daily for pending items.\n- Use **Inactive Employees** to look up former staff.\n\n## 8. Approval workflows\nProfile change requests (from **Employees → My employee workspace → Update details**):\n\n```mermaid\nflowchart LR\n  D[Draft] --> P[Pending review]\n  P --> U[Under review]\n  U --> A[Approved - applied]\n  U --> R[Rejected]\n  U --> C[Correction required]\n  C --> P\n  P --> X[Cancelled by employee]\n```\n\nProfile updates (from **Employees → My employee workspace → Profile**) use the two-stage manager → HR flow described in [17](17-self-service-and-approvals.md).\n\n## 9. Links to other modules\n- [04. Organization structure](04-organization-structure.md)\n- [17. Self-service and approvals](17-self-service-and-approvals.md)\n- Onboarding, Offboarding, Contracts, Movements, Attendance, Leave and Payroll chapters.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Configure the employee number format before creating employees\" | Numbering not set. | Set **Structure → Numbering**. |\n| \"No positions for this department\" | No position linked. | Link a position to the department in **Positions**. |\n| \"Select a branch first\" | Lists depend on the branch. | Choose branch, then department, then position. |\n| \"At least one contact is required before saving employee.\" | No contact. | Add a contact on **Contacts**. |\n| \"Employee saved, but onboarding could not be started…\" | Workflow lacks approvers. | Fix the workflow, start onboarding from **Onboarding**. |\n| \"Employee status cannot change from X to Y\" | Change not allowed. | See the allowed-changes table. |\n| \"Exit-related employee statuses must be completed through the offboarding workflow\" | No force permission. | Use offboarding, or ask a user with **employees:force-exit-status**. |\n| \"This invitation has expired\" | Link older than allowed time. | Send a new invitation. |\n| \"Only .xlsx employee import files are supported.\" | Wrong file type. | Save as .xlsx. |\n| \"This employee does not have a linked user account.\" | No login. | Invite or create a user account. |\n\n## 11. Best practices\n- Prefer invitations so employees enter and confirm their own personal data.\n- Keep **Reports To** current for individual reporting lines and **Employees → My team**. See [Organization structure](04-organization-structure.md) for the position fallback and department review assignments.\n- Run **Check file** and fix all errors before importing.\n- Use **Update Status** rather than editing data by hand.\n\n## 12. Setup checklist\n- [ ] Numbering set\n- [ ] Structure (branches, departments, positions) ready\n- [ ] Onboarding workflow(s) ready\n- [ ] Email/SMS sending tested with one invitation\n- [ ] Line managers set on all employees\n- [ ] HR reviewers have profile approval permissions\n\n## 13. Not verified / limitations\n- Exact row-action menu labels in **All Employees** may differ slightly (label not verified).\n- Invitation expiry is configurable by the system administrator; 72 hours is the default.\n- Identity audit screen was not examined in detail.\n- Documents tab upload steps were not verified.\n"},{"path":"part-3-modules/06-recruitment-and-onboarding.md","title":"06. Recruitment and Onboarding","md":"# 06. Recruitment and Onboarding\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThis module covers the path from \"we need to hire someone\" to \"the new employee is active in the system\".\n\n- **Recruitment** (menu **Employees → Recruitment**) tracks hiring requests, their approval (manager → HR → Finance), the job posting, applicants, interviews, verification checks, the offer, and the offer acceptance. An accepted candidate is turned into an employee invitation.\n- **Onboarding** (menu **Employees → Onboarding**) runs a checklist (workflow) for each new employee: tasks, documents, approvals and sign-offs. When every requirement is met, HR **activates** the employee. Only then does the employee's status become **Active**.\n- **Employees → My employee workspace → Onboarding** (menu **Employees → Onboarding** in the employee's own area) is where the new employee sees their joining checklist, uploads documents, reviews their contract and acknowledges onboarding.\n\nThe Recruitment page has five tabs: **Pipeline**, **Invite**, **Registration**, **Contracts** and **Letters**. Invite and Registration are the same screens used to add employees directly (see the Employees module). Contracts is the contract list (see [07. Employment Contracts](07-employment-contracts.md)).\n\n> 📷 Screenshot: Employees → Recruitment – the five tabs, Pipeline selected\n\n## 2. Prerequisites and dependencies\n\n| Needed first | Why | Where |\n|---|---|---|\n| Branches, departments and positions | A hiring request is raised for a position. Converting a candidate fails if the position has no branch or department (\"Position assignment is incomplete\"). Position headcount limits vacancies. | Organisation setup |\n| Employees for managers | Each request names a hiring manager. | Employees |\n| At least one onboarding workflow | Needed to convert a candidate and to start onboarding. | **Employees → Onboarding → Workflows** |\n| Payroll profile, statutory numbers, bank account, salary | Activation checks these. | Payroll module |\n| Contract templates and signatories | A signed employment contract is required for activation. | [07. Employment Contracts](07-employment-contracts.md) |\n| Roles, shifts/timetables, leave policies, devices | Chosen during activation (\"provisioning\"). | Roles, Attendance, Leave, Devices modules |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| Open Recruitment page, manage candidates, offers, convert | `employees:create` (or role HR Manager / HR Officer / Company Admin) | HR |\n| Raise a hiring request | HR access above, or be the hiring manager of the request (label not verified on how a manager reaches the page) | Manager, HR |\n| Manager approval of a hiring request | Must be the assigned manager | Manager |\n| HR approval of a hiring request | HR access; must be a different person from the requester | HR manager |\n| Finance approval of a request / approve offer | `payroll:config`; must be independent of earlier approvers | Finance |\n| Interview scoring | Must be on the interview panel | Panel member |\n| View onboarding | `onboarding_requests:read` or `onboarding_workflows:read` | HR |\n| Create / edit onboarding requests | `onboarding_requests:create`, `onboarding_requests:update` | HR |\n| Approve / reject onboarding approvals | `onboarding_requests:approve` | HR manager, approvers |\n| Activate (finalize) employee | `onboarding_requests:complete` | HR manager / HR admin |\n| Cancel onboarding | `onboarding_requests:cancel` | HR |\n| Manage workflows | `onboarding_workflows:create/read/update/delete` | HR admin |\n| Tasks | `onboarding_tasks:create/read/update` | HR, task owners |\n| Documents | `onboarding_documents:create/read/update/delete`, `onboarding_documents:verify` | HR |\n| My onboarding (own checklist) | No special permission; any employee with an onboarding request | Employee |\n\n## 4. Initial setup and configuration\n\n1. **Mandatory – Organisation structure** (company, one-time but changeable): branches, departments, positions with headcount. Each position used for hiring needs a branch and department.\n2. **Mandatory – Onboarding workflow** (company; changeable): **Employees → Onboarding → Workflows → Create Workflow**. Add steps; mark one workflow as **Default workflow**. See [Feature: Create an onboarding workflow](#feature-create-an-onboarding-workflow).\n3. **Mandatory – Contract templates and company signatory** (company): see [07. Employment Contracts](07-employment-contracts.md).\n4. **Mandatory – Payroll prerequisites** (company): pension and health schemes, so employees can be enrolled.\n5. **Optional – Roles, shifts/timetables, leave policies, attendance devices**: used in the activation (provisioning) step.\n6. **Optional – Acknowledgement document**: an approved document the employee acknowledges in **Employees → My employee workspace → Onboarding**. If none is configured, the employee sees \"The acknowledgement version is not configured. Contact HR.\"\n\n## 5. Features – step by step\n\n### Feature: Raise a hiring (recruitment) request\n**Purpose:** Ask for approval to fill a position.\n**Before you start:** The position exists, with free headcount.\n**Steps:**\n1. Go to **Employees → Recruitment** (tab **Pipeline**).\n2. Open the new-request dialog (button label not verified). The dialog title is **New recruitment request**.\n3. Fill **Position**, **Manager**, **Vacancies**, **Monthly budget (TZS)**, **Job title**, **Posting closes** and **Job description**.\n4. Save.\n**Expected result:** The request appears under **Requests** with status Pending manager.\n**Important notes:** Vacancies cannot exceed the position's headcount (\"Vacancies exceed position headcount\"). Budget must be positive.\n\n### Feature: Approve, post and close a request\n**Purpose:** Move the request through approvals and open the posting.\n**Steps:**\n1. Select the request. Click **Approve** (or **Reject**).\n2. Approval order: hiring manager → HR → Finance. Each must be a different person.\n3. When **Approved**, click **Post** to open the posting.\n4. Click **Close** when hiring is finished.\n**Expected result:** Status moves Pending manager → Pending HR → Pending finance → Approved → Posted → Closed.\n\n### Feature: Record applicants, shortlist, interview and check\n**Steps:**\n1. With a posted request selected, add an applicant (dialog **New applicant**): name, email, phone (a valid Tanzanian number is required), **Gender**. Upload a **CV**.\n2. Click **Shortlist** or **Reject**.\n3. Click **Interview** → **Schedule interview**: **Scheduled at**, **Location**, **Panel** (users).\n4. Panel members click **Score** → **Panel score**: **Score / 100** and **Comments**.\n5. Click **Check** → **Verification check**: **Check** (Reference, Certificate, NIDA), **Result** (Pass/Fail), **Evidence note**.\n**Expected result:** Candidate status: Applied → Shortlisted (or Rejected).\n**Important notes:** The same person cannot apply twice to one posting. A posting that is closed or past its closing date does not accept applicants.\n\n### Feature: Make an offer\n**Steps:**\n1. Click **Offer** → **Draft offer**: **Monthly salary (TZS)** and **Start date**.\n2. Generate the offer letter (**Letter**).\n3. A Finance user clicks **Approve offer**.\n4. Click **Send offer**. The candidate receives a link to an **Employment offer** page showing the salary, start date and **Respond by** date, where they accept.\n**Expected result:** Candidate status: Offer draft → Offer approved → Offer accepted.\n**Important notes:** The salary cannot exceed the approved budget. An interview score sheet is required before the offer. The offer approver must be independent.\n\n### Feature: Convert a hired candidate (create invitation)\n**Purpose:** Turn the accepted candidate into an employee invitation linked to onboarding.\n**Steps:**\n1. On the accepted candidate, click **Create invitation**.\n2. Choose the **Onboarding workflow**. Confirm.\n**Expected result:** An invitation is sent by email and SMS. The candidate status becomes Invited. The employee is created in the position's branch and department, reporting to the hiring manager, with the offer start date as hire date.\n**Important notes:** Fails if headcount is full or the position lacks a branch/department.\n\n### Feature: Create an onboarding workflow\n**Steps:**\n1. **Employees → Onboarding → Workflows → Create Workflow**.\n2. Enter **Workflow name**, **Description**, **Status** and **Default workflow**.\n3. Click **Add Workflow Step**. Choose **Step type** (Task, Sign Off, Document, Acknowledgement, System action), title, **Due days**, whether it is **Required** or **Optional**, and **Assign step to** (**Person or department**, **Role** or **Position**).\n4. Optionally add checklist items (**Add Checklist Item**).\n5. Click **Save Workflow**.\n**Expected result:** The workflow can be chosen for new onboarding requests. Use **Clone workflow** to copy one.\n**Important notes:** A workflow with no steps cannot be used (\"Configured workflow has no steps\"). If no one can be assigned a step, you see \"Workflow has no eligible assignees\".\n\n### Feature: Start an onboarding request\n**Steps:**\n1. **Employees → Onboarding → Requests → Create Request
