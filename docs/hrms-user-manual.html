 criterion. Choose a **Recommendation**: Confirm, Extend, Do not confirm, Terminate, or Further review.\n4. Enter **Comments** (required).\n5. If recommending extension, enter **Extension days**.\n6. Click **Save**.\n\n**Expected result:** The case moves to **HR review pending**.\n**Important notes:** A \"Confirm\" recommendation is blocked if the score is below the policy's minimum score: \"Confirmation cannot be recommended because the score X is below the required score Y.\"\n\n![Manager review with a criterion rating and the Further review recommendation](../images/probation-review.png)\n\n### Feature: HR decision (confirm, extend, not confirm, terminate)\n**Purpose:** Record the final outcome.\n**Before you start:** You need `probation_reviews:hr-decision`; the case must be in **HR review pending** and the manager review completed. You cannot decide your own case.\n**Steps:**\n1. Open the case and click **HR decision**.\n2. Choose a **Decision**: Confirmed, Extended, Not confirmed, or Termination recommended.\n3. Enter **Comments** (required).\n4. For **Confirmed**, optionally enter the **Confirmation date** (default today).\n5. For **Extended**, enter **Extension days**.\n6. Click **Save**.\n\n**Expected result:**\n- **Confirmed** – the employee record is marked confirmed with the confirmation date; the employee gets an \"Employment confirmed\" notification; a confirmation letter is generated automatically.\n- **Extended** – a new review period starts the day after the old due date; the extension count increases.\n- **Not confirmed / Termination recommended** – the case closes and the employee's confirmation status is updated.\n\n**Important notes:**\n- Default limits: at most 2 extensions, at most 180 days per extension, at most 365 days total probation.\n- \"Confirmation date cannot be before the hire date.\"\n- **Termination recommended does not end employment.** HR must run the exit/status change process separately.\n\n### Feature: Generate a letter\n**Purpose:** Produce a confirmation, extension or non-confirmation letter.\n**Steps:**\n1. Open a decided case and click **Generate letter**.\n\n**Expected result:** \"Letter generated.\" The letter type follows the case outcome.\n**Important notes:** If automatic confirmation letter generation failed, use this button to regenerate.\n\n### Feature: Delete a case\n**Steps:** Open the case, click **Delete case** and confirm. Message: \"Case deleted.\"\n\n## 6. Important fields and options\n\n| Field | Meaning |\n|---|---|\n| Probation days | Length of probation from the start date |\n| Minimum score | Lowest score that allows a \"Confirm\" recommendation (default 60) |\n| Effective from | Date from which the policy can be chosen |\n| Criteria weight | Share of each criterion in the score; must total 100 |\n| Extensions | Number of times probation was extended |\n| Decision | Final HR outcome (Pending until decided) |\n\n| Case status | Meaning |\n|---|---|\n| Objectives pending | Waiting for objectives to be added |\n| Active | Probation running |\n| Self-assessment pending | Due date reached; waiting for the employee |\n| Manager review pending | Waiting for the manager |\n| HR review pending | Waiting for HR decision |\n| Extended | Probation extended; a new period is running |\n| Confirmed / Not confirmed / Termination recommended | Final outcomes |\n| Cancelled | Case closed without a decision |\n\n## 7. Daily usage procedures\n\n- **HR:** check **Overview** for \"Due this week\"; open **Cases**, filter by status (\"All statuses\" list) and act on **HR review pending** cases.\n- **Managers:** check **My team** for cases waiting for **Manager review**.\n- **Employees:** open **Probation → My probation** when notified that review is due.\n- **Automatic:** every day at 7 AM the system sends reminders before the due date (30, 14, 7, 3 and 1 days by default) and moves cases whose due date has passed to the next review stage.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart TD\n  A[Case created - auto or manual] --> B{Objectives required?}\n  B -- yes --> C[Objectives pending] --> D[Active]\n  B -- no --> D\n  D -->|Due date reached| E{Self-assessment required?}\n  E -- yes --> F[Self-assessment pending] -->|Employee submits| G\n  E -- no --> G{Manager review required?}\n  G -- yes --> H[Manager review pending] -->|Manager recommends| I\n  G -- no --> I[HR review pending]\n  I -->|Confirmed| J[Confirmed + letter]\n  I -->|Extended| K[Extended - new period] -->|Due date reached| E\n  I -->|Not confirmed| L[Not confirmed]\n  I -->|Termination recommended| M[Termination recommended - run exit separately]\n```\n\n## 9. Links to other modules\n\n- **Onboarding** – activation creates the probation case automatically.\n- **Employees** – confirmation status and date are written to the employee record.\n- **Movements** (see [14-movements-and-promotion.md](14-movements-and-promotion.md)) – a reporting manager change re-evaluates the probation reviewer.\n- **Employee status / Exit** – needed to actually end employment after \"Termination recommended\".\n- **Notifications** – reminders and \"Employment confirmed\".\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Employee already has an open probation case\" | One open case per employee | Open and continue the existing case |\n| \"Probation criterion weights must total 100\" | Weights don't add up | Adjust weights |\n| \"Self-assessment can only be submitted when the probation review is due.\" | Due date not reached | Wait until the due date |\n| \"You are not the assigned probation reviewer.\" | Another manager is assigned | Ask HR to check the reporting manager |\n| \"Manager rating for criterion X is required.\" | Policy has criteria but no rating was sent | Fill every criterion shown in the current review cycle and save again |\n| \"Confirmation cannot be recommended because the score…\" | Score below minimum | Recommend Extend or another outcome |\n| \"Maximum probation extensions reached: 2.\" | Extension limit | Choose another decision |\n| \"Total probation period cannot exceed 365 days.\" | Too long | Shorten extension |\n| \"Probation case cannot be edited after the manager review has been submitted.\" | Locked | Proceed with HR decision |\n| Probation menu missing | No probation permission | Ask admin for a probation permission |\n\n## 11. Best practices\n\n- Create a default policy before onboarding employees.\n- Keep criteria few and clear; make weights total 100.\n- Check reporting managers before due dates arrive.\n- After \"Termination recommended\", start the exit process promptly.\n\n## 12. Setup checklist\n\n- [ ] At least one active probation policy with criteria totalling 100\n- [ ] One default policy\n- [ ] Reporting managers set on employees\n- [ ] HR given policy, case, decision and letter permissions\n- [ ] Managers given manager-review and team-read permissions\n- [ ] Employees have user accounts linked to their employee records\n\n## 13. Policy defaults and review outcomes\n\nNew policies show the installation defaults. The standard configuration uses a 180-day initial period, two extensions, a 90-day default extension, a 180-day maximum extension and a 365-day total limit. Standard reminders run 30, 14, 7, 3 and 1 days before the due date. The policy form displays the installation’s current values. An authorized HR administrator can change the policy-specific values. The installation administrator manages reminder days and the total-day limit in server configuration.\n\nThe assigned manager scores each criterion recorded for the current cycle. Choosing **Further review** sends the scores and comments to HR and leaves the final decision open.\n"},{"path":"part-3-modules/14-movements-and-promotion.md","title":"14. Movements and Promotion","md":"# 14. Movements and Promotion\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nA **movement** is an approved change to an employee's assignment: a transfer, promotion, demotion, position change, reporting manager change, grade change, cost center change, employment type change or salary revision. Each movement has a number, an effective date, a reason and a list of changes (old value → new value).\n\nA movement goes through approval and is then **applied**. Applying it updates the employee record on the effective date. A salary change creates a new pay record that payroll uses from the effective date. After applying, the system runs follow-on **operations** (attendance, branch access, leave policy, probation reviewer).\n\nMenus:\n- **Movements → Movement operations → Overview / Cases / Operations** (HR).\n- **Employees → My team → Movements** (managers).\n- **Movements → My movements → Overview** and **Promotion** (employees, page \"Promotions & movements\").\n\n> 📷 Screenshot: Movements → Overview – the \"Movement cycle\" summary\n\n## 2. Prerequisites and dependencies\n\n| What must exist | Why |\n|---|---|\n| Active employees | Only active employees can have a movement |\n| Branches, departments, positions, grades, cost centers | Target values for the change |\n| Position headcount (optional) | A full position blocks the move |\n| Salary structures (for salary revisions with component overrides) | See the Payroll module |\n| Approvers with the right permissions | Movements need approval before applying |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See Movements section | `employee_movements:read` (or `employee_movements:create`, `employee_movements:update`, `employee_movements:approve`, `manage_employee_movements`) | HR |\n| Create / edit draft (**New movement**, **Edit**) | `employee_movements:create` | HR |\n| Submit for approval | `employee_movements:submit` | HR |\n| Cancel / delete | `employee_movements:cancel` | HR |\n| Approve, reject, return (**Decide**) | `employee_movements:approve` | HR manager, manager |\n| Finance approval step (salary changes) | `employee_movements:finance-approve` | Finance |\n| Management approval step (promotions, if enabled) | `employee_movements:management-approve` | Management |\n| Apply | `employee_movements:apply` | HR |\n| Generate letter | `employee_movements:generate-letter` | HR |\n| Retry failed operations (**Operations** tab) | `employee_movements:retry` | HR / admin |\n| Team movements | Manager team access | Line manager |\n| See own movements and acknowledge | None (signed-in employee) | Employee |\n\n`manage_employee_movements` grants all screen actions.\n\n## 4. Initial setup and configuration\n\n1. **Set up organization data** (branches, departments, positions, grades, cost centers) – *Mandatory*. Company scope.\n2. **Set position headcount** where needed – *Optional*.\n3. **Give approval permissions** – *Mandatory*: primary approver (`employee_movements:approve`); Finance (`employee_movements:finance-approve`) if you do salary revisions.\n4. **Separate maker and checker** – *Mandatory practice*: the person who creates a movement cannot approve it.\n\nThere is no other configuration screen. Backdating limits are system settings (see section 13).\n\n## 5. Features – step by step\n\n### Feature: Create a movement\n**Purpose:** Record a proposed transfer, promotion or other change.\n**Before you start:** `employee_movements:create`.\n**Steps:**\n1. Go to **Movements → Cases**.\n2. Click **New movement**.\n3. Select the **Employee**.\n4. Choose the **Type** (for example Department transfer, Promotion, Salary revision, or Composite for several changes).\n5. Enter a **Title**, **Reason** and **Effective date**.\n6. Fill the fields shown for that type: **New branch**, **New department**, **New position**, **New grade**, **New cost center**, **New manager**, **New employment type**, or for salary: **Base salary**, **Currency** and **Salary structure** (leave blank to keep the current structure).\n7. Click **Save**.\n\n**Expected result:** \"Saved.\" The movement is listed as **Draft**.\n**Important notes:**\n- A promotion or demotion needs a new position or grade.\n- The position must belong to the new department/branch and have free headcount.\n- An employee cannot report to themselves, and the change must not create a reporting loop.\n- Only one open movement per employee per effective date.\n- \"This movement would not change any field from the employee current values.\" – nothing changed.\n\n### Feature: Submit for approval\n**Steps:** In **Cases**, click **Submit** on a Draft or Returned movement.\n**Expected result:** Status becomes **Pending approval**. The system works out the approval steps: Primary always; Finance if salary changes; Management for promotions if enabled.\n\n### Feature: Decide (approve, reject, return)\n**Purpose:** Approve or stop the movement.\n**Before you start:** You did not create the movement and it is not your own movement.\n**Steps:**\n1. In **Cases** (or **Employees → My team → Movements**), click **Decide**.\n2. Choose **Approve**, **Reject** or **Return**.\n3. Enter **Comments** (required for Reject and Return).\n4. Click **Save**.\n\n**Expected result:**\n- Approve – moves to the next step; after the last step the movement becomes **Approved** (effective date today or past) or **Scheduled** (future date). The employee is notified.\n- Reject – **Rejected** (final).\n- Return – **Returned for correction**; HR edits and resubmits.\n\n### Feature: Apply a movement\n**Purpose:** Write the changes to the employee record.\n**Steps:**\n1. In **Cases**, click **Apply** on an **Approved** movement.\n\n**Expected result:** Status becomes **Applied**. The employee's branch, department, position, grade, cost center, manager or employment type change from the effective date. For salary changes, a new active pay record replaces the old one from the effective date.\n**Important notes:**\n- **Scheduled** movements are applied automatically every day at 6 AM once the effective date arrives.\n- If the employee's data changed after submission, you see \"Employee data changed after this movement was submitted.\" Create a new movement.\n- \"Movement effective date has not been reached yet.\" – wait or let the scheduler apply it.\n\n### Feature: Retry follow-on operations\n**Purpose:** Re-run background steps that failed after applying.\n**Steps:**\n1. Go to **Movements → Operations**.\n2. Find a row with status **Failed** and read **Last error**.\n3. Click **Retry**.\n\n**Expected result:** \"Retry queued.\" Only failed operations can be retried.\nOperation types: recalculate attendance assignment, update branch access, re-evaluate leave policy, re-evaluate probation reviewer.\n\n### Feature: Generate a movement letter\n**Steps:** Click **Generate letter** on an Approved, Scheduled or Applied movement. Message: \"Letter generated.\" Letter types: transfer, promotion, demotion, position change, salary revision, generic.\n\n### Feature: Cancel or delete\n**Steps:** Use **Cancel** (open movements) or **Delete** (drafts). Applied, rejected or cancelled movements cannot be cancelled.\n\n### Feature: Employee – view and acknowledge movements\n**Steps:**\n1. Open **Promotion** (page \"Promotions & movements\") or **Movements → My movements**.\n2. Review the list (**Applied**, **Need acknowledgement** / \"Awaiting you\").\n3. If shown, click **Acknowledge**.\n\n**Expected result:** \"Movement acknowledged. HR can now see you have reviewed it.\"\n**Important notes:** Salary details are hidden from the employee view. Only applied movements that require acknowledgement can be acknowledged.\n\n> 📷 Screenshot: Promotion page – \"Awaiting you\" tile and the Acknowledge button\n\n## 6. Important fields and options\n\n| Movement type | Required new value |\n|---|---|\n| Department transfer | New department |\n| Branch transfer | New branch |\n| Position change | New position |\n| Promotion / Demotion | New position or new grade |\n| Reporting manager change | New manager |\n| Grade change | New grade |\n| Cost center change | New cost center |\n| Employment type change | New employment type |\n| Salary revision | Base salary and currency |\n| Composite | At least one change |\n\n| Status | Meaning |\n|---|---|\n| Draft | Being prepared |\n| Pending approval | Waiting for approvers |\n| Returned for correction | Sent back to HR |\n| Approved | Ready to apply |\n| Scheduled | Approved, auto-applies on effective date |\n| Applied | Employee record updated |\n| Rejected / Cancelled | Closed |\n\n## 7. Daily usage procedures\n\n- HR: check **Cases** for \"Awaiting decision\" and Approved items to apply; check **Operations** for failures.\n- Approvers: open **Decide** on pending items.\n- Employees: check **Promotion** for items awaiting acknowledgement.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart TD\n  A[Draft] -->|Submit| B[Pending approval]\n  B -->|Return| R[Returned for correction] -->|Edit + Submit| B\n  B -->|Reject| X[Rejected]\n  B -->|Approve: Primary -> Finance if salary -> Management if enabled| C{Effective date}\n  C -->|today or past| D[Approved] -->|Apply| E[Applied]\n  C -->|future| S[Scheduled] -->|6 AM on effective date| E\n  E --> O[Follow-on operations]\n  E --> N[Employee may acknowledge]\n```\n\n## 9. Links to other modules\n\n- **Employees** – applied changes update the employee record.\n- **Payroll** – salary revisions create a new pay record from the effective date.\n- **Attendance** – attendance assignment recalculated.\n- **Leave** – leave policy re-evaluated.\n- **Probation** ([13-probation.md](13-probation.md)) – probation reviewer updated on manager change.\n- **Contracts** – after a promotion, transfer or salary change, the system suggests a contract amendment to HR (nothing changes automatically).\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"The movement creator cannot approve the same movement.\" | Maker-checker rule | Another approver must decide |\n| \"You do not have the required permission (…) to approve this step\" | Finance/Management step | Ask a Finance/Management approver |\n| \"The proposed position has reached its configured headcount\" | Position full | Increase headcount or choose another position |\n| \"Only active employees can have an organizational movement.\" | Employee not active | Activate employee first |\n| \"Backdated employee movements are disabled.\" | Past effective date | Use today or a future date |\n| \"Movement cannot be backdated by more than 30 days.\" | Default limit | Use a closer date |\n| \"Employee data changed after this movement was submitted.\" | Record changed meanwhile | Cancel and create a new movement |\n| \"Only failed operations can be retried.\" | Operation not failed | No action needed |\n\n## 11. Best practices\n\n- Use future effective dates and let the scheduler apply them.\n- Use **Composite** for a promotion that also changes salary, so one approval covers all.\n- Check the **Operations** tab after applying.\n\n## 12. Setup checklist\n\n- [ ] Organization structure complete\n- [ ] Position headcounts reviewed\n- [ ] HR has create/submit/apply/cancel/letter permissions\n- [ ] Approvers have approve permission (and Finance has finance-approve)\n- [ ] Someone has retry permission\n\n## 13. Not verified / limitations\n\n> **Limitation:** Employee acknowledgement is only possible when a movement is flagged as requiring it. No screen or form field to set this flag was found, so by default movements do not ask for acknowledgement.\n\n> **Limitation:** Management approval for promotions and backdating rules are system settings (no screen).\n\n- Salary revisions mark the new pay record \"pending payroll integration\"; how payroll consumes it is described in the Payroll module, not verified here.\n- Applied movements were not found to write entries to the employee \"Status History\" panel.\n- The exact team scope for **Employees → My team → Movements** was not verified.\n"},{"path":"part-3-modules/15-kpi-and-performance.md","title":"15. KPI and Performance","md":"# 15. KPI and Performance\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThe KPI and Performance module lets you:\n\n1. Define measurable **KPIs** (Key Performance Indicators) in a **KPI Library**.\n2. Assign KPIs with a **target** to employees, departments, branches or manager groups for a **reporting period**.\n3. Let employees record **activities** and submit their **achievement** (actual result).\n4. Let managers **review** and approve achievements.\n5. Combine approved results in a **scorecard**, optionally with a weighted score from a **scoring policy**.\n6. Run formal **performance reviews** (evaluations) in **review periods**, with self-assessment, manager review, HR review, finalization and employee acknowledgement.\n7. See **Analytics** and download **Reports** (Excel/PDF).\n\nSidebar: **KPI & Performance → My KPI & Performance** (everyone) and **KPI Management** (HR/managers). KPI Management tabs:\n\n| Group | Tabs |\n|---|---|\n| Set up | **KPI Library**, **Reporting Periods**, **Templates** |\n| Assign & review | **Assignments**, **Scorecards**, **Achievement Reviews** |\n| Evaluate | **Performance Reviews**, **Review Periods**, **Review Criteria** |\n| Insights | **Analytics**, **Reports** |\n| Settings | **Scoring Policies**, **Scorecard Templates** |\n\nPersonal tabs: **My Performance**, **My KPIs**, **My Scorecards**, **My Reviews**, **My KPI Report**.\n\n> 📷 Screenshot: My Performance – \"Your KPI journey\" and \"YOUR NEXT STEP\"\n\n## 2. Prerequisites and dependencies\n\n| What must exist | Why |\n|---|---|\n| Active company, employees, departments, branches | Assignment subjects and report filters |\n| Reporting managers | Default reviewers |\n| User accounts with roles (see section 3) | KPI access is mostly role-based |\n| KPI feature switched on | If off, screens show \"… disabled in this environment.\" |\n| Notification channels (optional) | \"KPI assigned to you\" alerts |\n\n## 3. Who can use it (roles and permissions)\n\nKPI access is decided mainly by **role**: Company Admin, HR Manager, Department Manager, Branch Manager, Management, Employee. Some actions also accept permissions.\n\n| Task | Role(s) | Permission alternative |\n|---|---|---|\n| Create reporting periods, set time zone | Company Admin, HR Manager | — |\n| Create/publish KPI definitions | Admin, HR, Dept/Branch Manager | `kpi_definitions:create` |\n| View KPI library and periods | + Management | `kpi_assignments:read` or `kpi_definitions:create` |\n| Archive KPI; KPI templates | Admin, HR | — |\n| Assign KPI | Admin, HR, Dept/Branch Manager | `kpi_assignments:create` + a data scope (`data_scope:company`, `:department`, `:branch` or `:team`) |\n| Edit assignment / revise target | same | `kpi_assignments:update` / `kpi_targets:revise` + data scope |\n| Record activities, submit achievement | Employee (assigned person only) | — |\n| Review/approve achievements | Admin, HR, Dept/Branch Manager (within scope) | — |\n| Create/publish scorecards | Admin, HR, Dept/Branch Manager | — |\n| Scoring policies, scorecard templates | Admin, HR | — |\n| Review templates and periods, enrol, HR review, finalize, amend, cancel | Admin, HR | — |\n| Manager assessment in performance review | Admin, HR, Dept/Branch Manager (assigned manager) | — |\n| Self-assessment, acknowledge | Employee | — |\n| Analytics | Management roles and Employee (own data); comparisons: Admin, HR, Management; team: managers | — |\n| Reports | HR: all types; managers: Individual/Department/Branch; Management: Executive summary; Employee: My KPI report | — |\n\nEmployee search in the assignment form also needs `employees:read` (and `departments:read` / `branches:read` for those subjects).\n\n## 4. Initial setup and configuration\n\nDo these in order:\n\n1. **Reporting period** – *Mandatory*. **Reporting Periods → Create period**. Company scope. HR/Admin only. One per frequency and date range.\n2. **KPI definition** – *Mandatory*. **KPI Library → Create KPI**, then **Save & Publish**. Only published KPIs can be assigned. Changes later create a new version.\n3. **KPI templates** – *Optional*. Reusable KPI settings (**Templates → Create KPI template**, **Use template**).\n4. **Assignment with target** – *Mandatory*. **Assignments → Assign a KPI**. Depends on 1 and 2; the KPI frequency must match the period.\n5. **Scoring policy** – *Optional; mandatory for weighted scorecards*. **Scoring Policies → New policy → Publish**.\n6. **Scorecard templates** – *Optional*.\n7. **Scorecard** – *Mandatory for performance reviews*. Personal scorecard for the employee and period, published.\n8. **Review criteria (appraisal template)** – *Mandatory for performance reviews*. **Review Criteria → Create template draft → Publish**.\n9. **Review period (evaluation cycle)** – *Mandatory for performance reviews*. Depends on a reporting period and a published template.\n10. **Enrol employees** in the open review period – depends on 7 and 9.\n\n## 5. Features – step by step\n\n### Feature: Create a reporting period\n**Purpose:** Set the date range in which KPI results are recorded.\n**Before you start:** Company Admin or HR Manager with company scope.\n**Steps:**\n1. **KPI Management → Reporting Periods → Create period**.\n2. Enter **Period name**, **Frequency** (Monthly, Quarterly, Semiannual, Annual), **Start date**, **End date**, **Time zone** (for example Africa/Dar_es_Salaam).\n3. Continue, review and click **Create period**, then **Return to list**.\n\n**Expected result:** The period appears in the list. An older period showing \"Not configured\" can be fixed with **Configure** (time zone).\n**Important notes:** Employees may get a \"period available\" notice. This does **not** mean a KPI is assigned.\n\n### Feature: Create and publish a KPI\n**Steps:**\n1. **KPI Library → Create KPI** (guided form).\n2. Describe it: **KPI name**, **KPI code** (unique; letters, digits, underscores), **Category**, **Strategic objective or purpose**, **Description**.\n3. Choose a measurement rule: **Measurement type** (Percentage, Number or count, Monetary value, Time or duration, Yes or no, Milestone, Qualitative), **Performance direction** (Higher is better, Lower is better, Exact target, Acceptable range), **Measurement unit** (or **Currency code** / **Duration unit**).\n4. Plan: **Reporting frequency** and optional **Period for the next assignment**.\n5. **Review your KPI**, then click **Save & Publish** (or **Save Draft** and publish later with **Publish**).\n\n**Expected result:** The KPI is **Published** in the library. Click a row (**View details**) to see versions and history.\n**Important notes:** Duplicate codes are rejected. **Archive** removes a KPI from use (Admin/HR).\n\n### Feature: Assign a KPI\n**Steps:**\n1. **Assignments → Assign a KPI**.\n2. Choose **Subject type**: Employee, Department, Branch or Manager reporting group.\n3. Search and **select** the **Authorized subject** (typing without selecting does not work).\n4. Optionally pick **Responsible manager (optional)**.\n5. Choose the **Published KPI** and **Reporting period**, enter the **Target**.\n6. Review and click **Create assignment**.\n\n**Expected result:** An active assignment appears; the employee receives \"KPI assigned to you\".\n**Important notes:** Same KPI for the same subject in an overlapping active period is rejected. \"No matching period exists. Create a reporting period first.\"\n\n### Feature: Revise a target\n**Steps:** **Assignments → Actions → Revise target** (or **Revise a target**). Enter **New target** and **Reason for target change**; **Save**.\n**Expected result:** Current target changes; the old one stays in **Target revision history**. Inactive assignments cannot be revised.\n\n### Feature: Employee – record activities and submit achievement\n**Steps:**\n1. **My KPIs** → open the KPI → **Add Activity**.\n2. Enter **Activity date** (inside the period), **Activity title**, **Work performed**, **Measurable result**, **Comments**, optional **Evidence attachment** (up to 10 MB). Save.\n3. Repeat for other activities.\n4. Click **Submit achievement**, enter the **Final result** and **Supporting comments**, review and submit (or **Save for later**).\n\n**Expected result:** Status \"Waiting for manager review\"; editing is locked.\n**Important notes:** Activity results are **not** added up automatically – enter the final actual yourself. A target must exist first.\n\n> 📷 Screenshot: My KPIs → KPI detail – Activity records and Submit achievement\n\n### Feature: Manager – review an achievement\n**Steps:**\n1. **Achievement Reviews**; filter by **Employee**, **Department**, **Branch**, **Period** and **Show submissions** (Awaiting review, Submitted, In review, Returned, Rejected, Approved).\n2. Open the submission; check target, actual, activities and evidence.\n3. Click **Start review**, enter comments, then **Approve**, **Return for correction** or **Reject**.\n\n**Expected result:** Approved results become usable in scorecards. Returned items go back to the employee (\"Review your manager's feedback\"), who can start a correction.\n\n### Feature: Scoring policy\n**Steps:** **Scoring Policies → New policy**. Set **Identifier**, **Name**, **Method** (Weighted or Strategic status only), **Minimum score**, **Maximum score**, **Rating bands** (**Add band**), **Missing data** rule (Block scoring, Exclude optional only, Explicitly redistribute weights), **Exact-target tolerance**, **Display decimal places**, **Evaluation score cap**, optional **Qualitative rubric**. Click **Publish**. Later changes: **Create revision**.\n\n### Feature: Create a scorecard\n**Steps:**\n1. **Scorecards → New scorecard** (or **Scorecard Templates → Use template → Create draft from template**).\n2. Enter **Scorecard identifier**, **Scorecard name**, **Description**, **Scorecard for** (Employee etc.), subject, **Reporting period**, **Responsible manager**.\n3. **Scorecard mode**: *Strategic status only* (no weights; weight 0) or *Weighted evaluation* (choose a published **Scoring policy**; weights must total 100%).\n4. **Add KPI** – choose active assignments (1–100) for that subject and period.\n5. Save the draft, open **View details**, publish the configuration.\n\n**Expected result:** The scorecard shows approved actuals and, for weighted mode, a weighted score. **Clone into a new draft** copies it.\n\n### Feature: Review criteria (appraisal template)\n**Steps:** **Review Criteria → Create template draft**: Identifier, Name, Frequency, **Scale (value:label per line)** (2–10 points), **Competencies (one per line)** (max 50), section weights totalling 100%, **Require HR review**. Click **Publish**. Use **New version from form** to change it.\n\n### Feature: Review period (evaluation cycle)\n**Steps:**\n1. **Review Periods → Set up a review period / Create cycle**: name, reporting period, published template, start/end, **Employee deadline**, **Manager deadline**, **HR review deadline**, **Acknowledgement deadline** (in order, within the reporting period).\n2. Optional: **Draft cycle deadline policy** – **Soft: record late actions** or **Hard: enforce approved cutoff** with a **Reason**; **Save deadline policy**.\n3. **Open cycle** → **Start cycle** → **Review stage** → **Close**.\n4. **Assign an employee**: choose the **Open cycle**, **Employee**, **Current manager**, **Published personal scorecard**, click **Assign evaluation**.\n\n**Important notes:** Participants are enrolled after the cycle is opened. A cycle cannot close with unfinished evaluations.\n\n### Feature: Performance review (evaluation)\n**Steps:**\n1. **Employee** – **My Reviews** → open → fill **Employee self-assessment** → **Save draft** → **Submit to manager**.\n2. **Manager** – **Performance Reviews** → open → **Manager assessment** → **Save manager draft** → **Submit manager review** (or **Return self-assessment**).\n3. **HR** – **Record HR review** (if required) → **Approve evaluation** (or **Return to manager**) → **Finalize**.\n4. **Employee** – **Acknowledge receipt** or **Record disagreement**.\n\nOther HR actions: **Open amendment**, **Cancel evaluation**, **Reassign reviewer**, **Reassign HR reviewer**, **Grant exception** (deadline). **Guided review** and **Manual mode** switch the layout.\n**Important notes:** Finalizing needs an approved, complete KPI scorecard. Nobody can review, finalize, amend or cancel their own evaluation.\n\n### Feature: Analytics and Reports\n- **Analytics**: filter by period, cycle, department, branch, employee, manager, category; tiles such as Assigned KPIs, Approved actuals, Awaiting review, Missing submissions, Pending HR reviews, Scorecard coverage.\n- **Reports**: choose **Report type** (HR evaluation, Individual, Department, Branch, Executive summary; employees get **My KPI report**), filters, **Export format** and **Download Excel** / **Download PDF**.\n\n## 6. Important fields and options\n\n| Status | Achievement meaning |\n|---|---|\n| Draft | Employee still editing |\n| Submitted | Waiting for manager |\n| In review | Manager started review |\n| Returned | Sent back for correction |\n| Rejected | Not accepted |\n| Approved | Usable in scorecards |\n\n| Evaluation status | Meaning |\n|---|---|\n| Self draft / Self submitted / Self returned | Employee stage |\n| Manager draft / Manager submitted | Manager stage |\n| HR reviewed / Approved | HR stage |\n| Finalized | Locked; employee acknowledges |\n| Cancelled | Stopped |\n\n| Cycle status | Draft → Open → In progress → Review → Closed |\n|---|---|\n\n## 7. Daily usage procedures\n\n- Employees: record activities during the period; submit before the period ends.\n- Managers: clear **Achievement Reviews** \"Awaiting review\".\n- HR: watch **Analytics** for missing submissions and overdue evaluation steps.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart TD\n  P[Reporting period] --> D[KPI published] --> A[Assignment + target]\n  A --> E[Employee activities + submit] --> R{Manager review}\n  R -->|Return| E\n  R -->|Reject| X[Rejected]\n  R -->|Approve| S[Scorecard published]\n  S --> C[Review period open + employee enrolled]\n  C --> SA[Self-assessment] --> M[Manager review]\n  M -->|Return| SA\n  M --> H{HR review required?}\n  H -->|yes| HR[HR reviewed] --> AP[Approved]\n  H -->|no| AP\n  AP --> F[Finalized] --> K[Employee acknowledges or disputes]\n```\n\n## 9. Links to other modules\n\n- **Employees / Organization** – subjects, managers, scope.\n- **Notifications** – assignment, period and review alerts.\n- **Probation** ([13-probation.md](13-probation.md)) and **Movements** ([14-movements-and-promotion.md](14-movements-and-promotion.md)) are separate; KPI results are not passed to them automatically.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| KPI menu missing | Wrong role or KPI switched off | Assign a KPI role; check feature switch |\n| \"KPI role and active company are required\" | No KPI role/permission | Add role or permission |\n| Cannot find employee in assignment | Outside your scope or not selected | Select from results; ask HR about scope |\n| Duplicate KPI code | Codes unique per company | Use a new code |\n| Assignment rejected | Overlapping active period | Use another period |\n| Cannot submit achievement | No target configured | Manager sets target |\n| \"Strategic scorecards cannot have weights\" | Weights in strategic mode | Set weights to 0 |\n| \"Published scoring policy version required\" | Weighted without policy | Publish a policy |\n| \"Matching published personal scorecard required\" | No scorecard for enrolment | Publish scorecard for same period |\n| \"Approved, complete KPI scorecard required before finalization\" | Achievements not approved | Approve all required KPIs |\n| \"Cycle has unfinished evaluations\" | Close blocked | Finalize or cancel all |\n| \"Select an active, separate company HR reviewer\" | No eligible HR reviewer | Choose an HR reviewer |\n| Add Activity error \"relation … does not exist\" | Database update missing | Ask system administrator |\n\n## 11. Best practices\n\n- Create periods well before they start.\n- Keep KPI codes stable; revise rather than recreate.\n- Always give a clear reason for target changes.\n- Publish scorecards before opening the review period.\n\n## 12. Setup checklist\n\n- [ ] KPI feature enabled\n- [ ] Roles assigned (HR, managers, employees, management)\n- [ ] Reporting periods created with time zone\n- [ ] KPIs published\n- [ ] Assignments with targets created\n- [ ] Scoring policy published (if weighted)\n- [ ] Personal scorecards published\n- [ ] Review criteria template published\n- [ ] Review period created, opened and employees enrolled\n\n## 13. Not verified / limitations\n\n> **Limitation:** Most KPI access is by role name, not by ticking permissions. A custom role only gets KPI access through the few permissions listed in section 3.\n\n> **Limitation:** Reporting periods can only be created by Company Admin or HR Manager roles, even if a custom role has KPI permissions.\n\n- Exact field labels of the review-period creation form and scoring-policy publish confirmation were not fully verified.\n- Evidence rules per KPI version exist (Admin/HR) but no screen was confirmed.\n- **Remind HR?** on My Performance sends a reminder to HR; recipient rules not verified.\n"},{"path":"part-3-modules/16-field-operations.md","title":"16. Field Operations","md":"# 16. Field Operations\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nField Operations records the work your staff do away from the office: visits to customers, prospects, brokers and other parties. With it:\n\n- Employees **plan** visits and send the plan to their manager for review.\n- Employees **check in** at the customer (the system records their GPS location) and **check out** with notes and an outcome.\n- Employees record **opportunities** (possible sales), **expenses**, **evidence** and **follow-ups** for each visit.\n- Managers and HR **review** visits and plans, see a **map** of visits, and compare **planned vs actual** work.\n- Before anyone can use location features, they must **acknowledge the company location privacy notice**.\n\nThe module appears in the sidebar as **Field**. It has two groups:\n\n| Group | Tabs | Who sees it |\n|---|---|---|\n| **Field → My field work** | **My visits**, **Plans**, **Follow-ups** | Employees with a linked employee profile |\n| **Field management** | **Overview**, **Visits**, **Map**, **Parties**, **Setup** | Managers, HR and field administrators with field permissions |\n\nThe location privacy notice is on its own page: **Privacy and attendance → Location privacy notice** (address `/dashboard/me/location-privacy`) (menu path not verified).\n\n## 2. Prerequisites and dependencies\n\n| Must exist first | Why | See |\n|---|---|---|\n| Employee record linked to the user account | **Field → My field work** shows \"Field work uses your employee profile…\" until the profile is complete. | [Employees](./) |\n| Line manager on the employee record | Plans and visits are routed to the employee's manager for review. | Employees |\n| Active **location privacy notice** (if your company requires one) | Check-in is blocked until the employee acknowledges it. | Section 5, \"Location privacy notice\" |\n| Field parties (customers, prospects…) | Visits are attached to a party. | Section 5, \"Field parties\" |\n| Browser or phone location permission | Check-in reads the device GPS. | [Mobile, desktop and offline](../part-1-getting-started/04-mobile-desktop-and-offline.md) |\n| Approved business trip (optional) | If a visit date falls inside an approved business trip, the visit is linked to that trip automatically. | Attendance – Business trips |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See own visits, plans, follow-ups | `field_visits:self-service-read` | Employee (field staff) |\n| Create plans/unplanned visits, check in/out, add opportunity/expense/evidence, manage follow-ups | `field_visits:self-service-update` | Employee (field staff) |\n| See team visits, plans, overview, planned vs actual, exceptions | `field_visits:manager-read` | Line manager, sales manager |\n| Review (approve/return/reject) visits and plans; update opportunity stage and actual value | `field_visits:manager-review` | Line manager |\n| See the visit map and location access logs | `field_locations:read` | Manager, HR |\n| Export visit locations (HR map) | `field_locations:export` | HR |\n| See all field visits company-wide | `field_visits:hr-read` | HR |\n| Manage field parties and the commercial policy | `field_visits:config` | HR / field administrator |\n| Manage activity categories and activity policies | `work_activities:config` | HR |\n| Publish location privacy notices and view acknowledgements | `location_privacy:manage` | HR / Data protection officer |\n| Acknowledge the notice | none (any signed-in employee) | Everyone |\n\n> **Limitation:** The sidebar decides whether to show **Field management** using a set of permission names (for example `field:read`, `field_visits:read`, `field_parties:read`). These are matched to the permissions above through built-in aliases. If a user has a permission but does not see the menu, check the role in **Roles**.\n\n## 4. Initial setup and configuration\n\n1. **Publish the location privacy notice** – Mandatory if you use check-in. Scope: company. Changeable (each publish creates a new version; employees must acknowledge the new version). See Section 5.\n2. **Create field parties** – Mandatory in practice. Scope: company. Changeable. **Field → Parties → New party**.\n3. **Set the commercial policy** – Optional. Scope: company. Changeable, with an effective date. **Field → Setup → Commercial policy**.\n4. **Create activity categories and activity policies** – Optional. Scope: company. Changeable. **Field → Setup → Categories / Policies → New**.\n5. **Grant permissions** – Mandatory. Give field staff the self-service permissions, managers the manager permissions, HR the config permissions (Section 3).\n6. **Ask employees to allow location** in their browser or phone – Mandatory for check-in. Scope: device.\n\n> **Note:** Server settings (not on screen) control GPS rules: GPS required (default yes), maximum GPS accuracy (default 100 metres), and how old an offline visit event may be (default 3 days). Ask your system administrator if you need them changed.\n\n## 5. Features – step by step\n\n### Feature: Location privacy notice (acknowledge)\n**Purpose:** Tell employees how their location is used and record that they have read it.\n**Before you start:** HR must have published a notice.\n**Steps:**\n1. Open the **Location privacy notice** page.\n2. Read the notice. It shows the version number.\n3. Click **Acknowledge notice**.\n**Expected result:** The message \"Acknowledgement recorded for this notice version.\" appears and the page shows \"You have acknowledged this version.\"\n**Important notes:** The page explains that location is captured only for attendance and field visit events. If no notice exists you see \"There is no active company location notice.\" Without acknowledgement, check-in fails with: \"Review and acknowledge your company location privacy notice before using location-enabled attendance or field visits.\"\n\n> 📷 Screenshot: Location privacy notice – the notice text and the **Acknowledge notice** button\n\n### Feature: Publish a location privacy notice (HR)\n**Purpose:** Create or update the company notice.\n**Before you start:** You need `location_privacy:manage`. For a live system you need an approval reference (for example a policy or legal approval number).\n**Steps:**\n1. Open the **Location privacy notice** page. Scroll to **HR notice management**.\n2. In **Approval mode**, choose **Company approved** (use **UAT demo approval** only on a test system).\n3. Enter the **Approval reference**.\n4. Enter the **Notice title** (up to 160 characters) and **Notice text** (at least 30 characters).\n5. Click **Publish new version**.\n**Expected result:** \"Company-approved notice published.\" The previous version becomes superseded and every employee must acknowledge the new version.\n**Important notes:** Under **Published versions and acknowledgements**, click **View acknowledgements** to see who has acknowledged each version. Demo approval is refused on any system that is not an isolated test system.\n\n### Feature: Plan a visit\n**Purpose:** Plan upcoming site visits and send the plan for review.\n**Before you start:** The party should exist.\n**Steps:**\n1. Go to **Field → Plans**.\n2. Click **New plan**.\n3. Choose the **Type**, **Party**, **Visit date** and **Purpose**.\n4. Click **Save**. The plan is saved as **Draft**.\n5. In the plan list, click **Submit**.\n**Expected result:** \"Plan submitted.\" The status changes to **Submitted** and the manager can review it.\n**Important notes:** \"Visit date and purpose are required.\" A plan can only be edited while still in draft or returned; otherwise \"This visit plan can no longer be edited.\"\n\n### Feature: Record an unplanned visit\n**Purpose:** Record a visit that was not planned in advance.\n**Steps:**\n1. Go to **Field → My visits** and click **Unplanned visit**.\n2. Enter the **Visit date**, **Purpose** and **Why unplanned**.\n3. Click **Save**.\n**Expected result:** The visit appears in **My visits**.\n**Important notes:** \"Date, purpose, and reason are required.\" Your company may switch off unplanned visits in its policy.\n\n### Feature: Check in at the customer\n**Purpose:** Prove you arrived at the visit location.\n**Before you start:** You have acknowledged the location privacy notice; your browser/phone allows location; the visit status is **Planned**.\n**Steps:**\n1. Go to **Field → My visits**.\n2. On the visit row, click **Check in**.\n3. Allow the location request if asked.\n**Expected result:** \"Checked in.\" The status changes to **Checked in**.\n**Important notes:** \"Location is not available in this browser.\" or \"Could not read your location.\" means the device did not give a GPS position. If the GPS accuracy is worse than the limit (default 100 m) the check-in is refused: \"GPS accuracy must be within 100 meters.\"\n\n> 📷 Screenshot: Field → My visits – the **Check in** button on a visit row\n\n### Feature: Check out and record the outcome\n**Steps:**\n1. On the checked-in visit, click **Check out**.\n2. Enter **Discussion notes** and **Outcome**. Tick **Create a follow-up from this visit** if needed and enter the **Follow-up due date**.\n3. Click **Save**.\n**Expected result:** The visit is completed and goes to manager review.\n**Important notes:** \"Notes and outcome are required.\" Check-out is refused if you never checked in (\"The visit has not been checked in.\").\n\n### Feature: Record an opportunity, expense or evidence\n**Purpose:** Add business detail to a visit.\n**Steps:**\n1. On the visit row click **Opportunity**, **Expense** or **Evidence**.\n2. Opportunity: enter **Title**, **Opportunity type**, **Potential sales value**, **Sales currency**, optional **Premium value (if applicable)**, **Premium currency**, **Expected close**.\n3. Expense: choose **Type** (for example Transport), enter **Amount** and **Description**.\n4. Evidence: choose **Type** (Photo, Document, Receipt, Meeting note, Other) and enter the **Document id**.\n5. Click **Save**.\n**Expected result:** \"Saved.\" Opportunities show in the **Opportunities** column.\n**Important notes:** The **Opportunity** button is hidden if the commercial policy does not allow employees to record values. Evidence links to a document already uploaded; the screen asks for its **Document id** (label not verified for how to find it).\n\n### Feature: Follow-ups\n**Purpose:** Track actions due after visits.\n**Steps:**\n1. Go to **Field → Follow-ups** and click **New follow-up**.\n2. Choose the **Linked visit**, **Due date** and type the **Action**.\n3. Click **Save**.\n4. When done, click **Complete**, enter a **Completion note**, and save. Use **Edit** or **Cancel** while it is still open.\n**Expected result:** Status changes from **Open** to **Completed** (or **Cancelled**).\n**Important notes:** Only open follow-ups can be edited or cancelled.\n\n### Feature: Field management overview (managers)\n**Purpose:** See open visits, exceptions and party coverage.\n**Steps:** Go to **Field → Overview**. Tiles show **Open visits**, **Checked in**, **Exceptions**, **Pending review**, and **Visit mix**.\n\n### Feature: Review visits and plans (managers)\n**Steps:**\n1. Go to **Field → Visits**.\n2. On a row, click **Review**.\n3. Choose a **Decision**: **Approve**, **Return** or **Reject**, and type **Comments**.\n4. Optionally tick **Validate all opportunities on this visit**.\n5. Click **Save**.\n**Expected result:** \"Saved.\" The visit status changes to Reviewed, Returned or Rejected.\n**Important notes:** \"Decision and comments are required.\" You can only review visits of employees you manage (\"You are not allowed to review this visit.\"). The **Visits** page also shows **Commercial values by currency** and a **Planned vs actual** table.\n\n### Feature: Update opportunity stage / actual value (managers)\n**Steps:** In **Field → Visits**, under the opportunity click **Update stage / actual value**, choose the **Opportunity stage**, enter **Realized sales value**, and a **Reason for change (audit)**. Click **Save**.\n**Important notes:** \"Opportunity and reason are required.\"\n\n### Feature: Visit map\n**Steps:** Go to **Field → Map**. Visits with GPS points in the current window are shown. If none: \"No mapped visits in the current window.\"\n**Important notes:** Opening the map is logged (access logs are under **Setup → Logs**).\n\n### Feature: Field parties\n**Steps:**\n1. Go to **Field → Parties** and click **New party**.\n2. Enter **Name**, **Type**, **Contact**, **Phone** (and address/location if shown).\n3. Click **Save**.\n**Important notes:** \"Name and party type are required.\" Click **Edit** to change a party.\n\n### Feature: Field setup\n**Steps:** Go to **Field → Setup** and choose **Categories**, **Policies** or **Logs**. Click **New** to add an activity category (needs **Code** and **Name**) or an activity policy (needs **Effective from**). Click **Commercial policy** to set **Default currency**, **Supported currencies (comma separated)**, **Effective from** and **Allow employees to record opportunity forecasts**.\n\n## 6. Important fields and options\n\n| Field | Meaning |\n|---|---|\n| Visit type | Customer visit, Prospect visit, Broker visit, Intermediary visit, Renewal follow-up, Collection follow-up, Claim inspection, Risk inspection, Recovery visit, Branch visit, Regulatory visit, Special assignment, Other |\n| Party type | Customer, Prospect, Broker, Intermediary, Agent, Vendor, Regulator, Partner, Internal branch, Other |\n| Opportunity type | Lead, Quotation, New business, Renewal, Collection, Cross sell, Dormant account revival, Other |\n| Opportunity stage | Identified, Follow up, Quotation issued, Won, Lost, Deferred, Cancelled |\n| Expense type | Includes Transport (other values not listed on screen – not verified) |\n| Currency | Default TZS unless the commercial policy says otherwise |\n\n| Status list | Values |\n|---|---|\n| Plan | Draft, Submitted, Approved, Returned, Rejected, In progress, Completed, Cancelled, Locked |\n| Visit | Planned, Checked in, Completed, Missed, Deferred, Cancelled, Manager review pending, Reviewed, Returned, Rejected |\n| Follow-up | Open, Completed, Overdue, Cancelled |\n| Expense | Draft, Submitted, Manager approved, Finance approved, Rejected, Pending reimbursement integration, Reimbursed, Cancelled |\n\n## 7. Daily usage procedures\n\n**Field employee:** open **My visits** → **Check in** on arrival → **Check out** with notes → add opportunity/expense/evidence → create follow-ups → plan the next days under **Plans** and **Submit**.\n\n**Manager:** open **Overview** → review **Pending review** items in **Visits** → check **Map** and **Planned vs actual** → update opportunity stages when deals close.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  A[Plan: Draft] -->|Submit| B[Submitted]\n  B -->|Approve| C[Approved]\n  B -->|Return| D[Returned] -->|Edit & Submit| B\n  B -->|Reject| E[Rejected]\n  F[Visit: Planned] -->|Check in| G[Checked in]\n  G -->|Check out| H[Manager review pending]\n  H -->|Approve| I[Reviewed]\n  H -->|Return| J[Returned]\n  H -->|Reject| K[Rejected]\n```\n\n## 9. Links to other modules\n- **Attendance** – the same location privacy acknowledgement applies to mobile clock-in; approved business trips link to visits.\n- **Reports & Analytics** – **Field visit map** report and field reports (see [20](./20-reports-insights-and-monitoring.md)).\n- **Insights → Sales field** – sales and field overview dashboards.\n- **Mobile app** – check-in/out with offline queue (see [Part 1, ch. 4](../part-1-getting-started/04-mobile-desktop-and-offline.md)).\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Review and acknowledge your company location privacy notice…\" | Notice not acknowledged | Open the Location privacy notice page and click **Acknowledge notice**. |\n| \"Could not read your location.\" | Location blocked in browser/phone | Allow location for the site/app and retry. |\n| \"GPS accuracy must be within 100 meters.\" | Weak GPS signal | Move outdoors or wait for a better fix. |\n| \"The visit is not available for check-in.\" | Visit is not in Planned status | Check the visit status; create an unplanned visit if needed. |\n| \"Field visits are currently disabled.\" | Company policy disables visits | Ask HR to check activity policy. |\n| \"This visit plan cannot be submitted.\" | Plan not in draft/returned | Only draft or returned plans can be submitted. |\n| \"Offline visit events cannot be older than 3 days.\" | Phone synced too late | Sync the mobile app within 3 days. |\n| Field page shows profile message | No complete employee profile | Complete the required profile details. |\n\n## 11. Best practices\n- Publish the privacy notice before rollout and ask staff to acknowledge it on day one.\n- Keep the party list clean; avoid duplicates.\n- Check in only when physically at the location.\n- Managers should review visits weekly so returned items are corrected quickly.\n\n## 12. Setup checklist\n- [ ] Location privacy notice published (Company approved, with reference)\n- [ ] Field parties created\n- [ ] Commercial policy set (currencies)\n- [ ] Activity categories/policies created (if used)\n- [ ] Roles given field permissions\n- [ ] Employees linked to profiles and managers\n- [ ] Employees acknowledged the notice and allowed location\n\n## 13. Not verified / limitations\n- The **Sync** button on the web **My visits** page only queues an empty sync request; real offline sync is done by the mobile app.\n- Selfie and device-binding policy options exist in the backend; no web screen to capture a selfie was found.\n- Expense reimbursement to payroll/finance shows a \"Pending reimbursement integration\" status; full reimbursement flow not verified.\n- Location data retention purges are server jobs (minimum 30 days, approval-controlled); no user screen.\n- The exact sidebar path to the Location privacy notice page was not verified.\n"},{"path":"part-3-modules/17-self-service-and-approvals.md","title":"17. Self-service and Approvals","md":"# 17. Self-service and Approvals\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\nSelf-service lets every employee see and update their own information, send requests, and track them. Managers see their team and act on requests. HR gives final approval.\n\n| Area | Menu / page | Who |\n|---|---|---|\n| Profile | **Employees → My employee workspace → Profile** | Every employee |\n| My organization | **Employees → Organization** | Every employee |\n| My Requests | **History**, **Documents**, **Update details**, **Resignation** | Every employee |\n| To do | **To do → Employee Requests / Correction Requests / Profile Update Approvals** | Anyone with items waiting |\n| My Team | **Team overview**, **Team members**, **Team attendance**, **Team actions**, **Activity summary** | Managers |\n\n## 2. Prerequisites and dependencies\n- The employee must have a user account linked to their employee record (see [05. Employees](05-employees.md)).\n- For profile changes and attendance corrections, an authorized department manager or reporting manager can review the request. If the employee has no **Reports To**, the system tries an eligible holder of the parent position. If there is no reviewer, these requests go to HR.\n- HR reviewers need approval permissions (section 3).\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| Profile, Organization, My Requests | none (every logged-in employee) | Employee |\n| My Team pages | manager_self_service:read, manager_team:read, team_attendance:read (or similar manager/team read permissions) | Department manager |\n| Approve profile updates – manager stage | self_service_requests:manager_review | Department manager |\n| Approve profile updates – final HR stage | self_service_requests:final_approve | HR manager |\n| Approve self-service requests (general) | self_service_requests:approve | HR |\n| Review profile change requests | profile_change_request:view_all, .review, .approve, .reject, .request_correction | HR |\n\n## 4. Initial setup and configuration\n1. **Mandatory** – Link every employee to a user account (invite or create).\n2. Review **Department manager** in **Departments** and **Reports To** on each employee. **Reports To** also determines direct team membership.\n3. **Mandatory** – Give HR reviewers **self_service_requests:final_approve** and managers **self_service_requests:manager_review** in Roles.\n4. **Optional** – Give managers the team permissions so **Employees → My team** appears.\n\n## 5. Features – step by step\n\n### Feature: Profile (your own details)\n**Purpose:** See your own record and ask for updates.\n**Steps:**\n1. Open **Employees → Profile**.\n2. Use the tabs **Summary**, **Assignments** (departments, positions, schedule), **Personal**, **Records**, **Update Requests**.\n3. To change personal or contact details or your photo, open **Update Requests** and choose **Personal Details**, **Contact Details** or **Profile Picture**.\n4. Fill in the new values and submit.\n**Expected result:** The request goes to your manager, then HR. Track it under **Update Requests** (\"Your requests\").\n**Important notes:** You can cancel while it is pending, or fix and resubmit if it is returned.\n\n### Feature: My organization\nOpen **Employees → Organization** (\"My Organization Details\" – \"Your workplace, role, and reporting line\"). It is **Read only**. Ask HR if something is wrong.\n\n### Feature: Ask HR to update my details (My Requests)\n**Steps:**\n1. Open **Update details** (\"Ask HR to update your details\").\n2. Choose **What to change** (Name or personal details, Phone or email, Emergency contact, National ID / passport, Profile photo, Something else).\n3. \"Fill in only the fields that should change.\" Add **Why (optional)**.\n4. Send.\n**Expected result:** \"Sent to HR for review.\" HR handles it in **Employees → Profile Changes**.\n\n### Feature: My documents\n1. Open **Documents** (\"My documents\").\n2. Click **Upload a document**, enter **Title**, **Type**, choose **File**, optional **Expires (optional)** and **Notes (optional)**.\n3. Upload. Result: \"Document uploaded.\"\n\n### Feature: Request history\nOpen **History** (\"Request history\") to see \"Leave, documents, profile updates, and other requests you have sent.\"\n\n### Feature: Resignation\n1. Open **Resignation** → **Submit your resignation**.\n2. Enter **Last working day**, optional **Notice date (optional)**, and **Reason**.\n3. Send. Result: \"Resignation sent to HR.\"\n**Important notes:** \"Employment continues until HR finalizes offboarding.\" Track progress under **Offboarding checklist progress**.\n\n### Feature: To do (action inbox)\n**Purpose:** One list of everything waiting for you.\n**Steps:**\n1. Click **To do → Employee Requests** (\"Your to-do list\" – \"Approvals, tasks, and follow-ups that need your attention.\").\n2. Open an item and complete it.\n**Important notes:** Item types include approvals, tasks, clearances, documents, reminders and exceptions. Statuses: Open, In progress, Completed, Cancelled, Expired. \"Nothing is waiting on you right now.\" means the list is empty.\n\n### Feature: Approve profile updates (manager and HR)\n**Steps:**\n1. Open **To do → Profile Update Approvals** (page **Profile updates**).\n2. Filter by status or dates; search \"Search name, request, status…\".\n3. Open a request and compare the current and requested values (including photos).\n4. Choose **Approve**, reject (reason required), or return to the employee (note required).\n**Expected result:**\n- Manager approval: \"Profile update approved and forwarded to HR for final approval.\"\n- HR **Final approve**: \"Profile update approved and applied to the employee record.\"\n\n### Feature: My Team (managers)\nOpen **Team overview**, **Team members**, **Team attendance**, **Team actions**, **Activity summary** (**Manager workspace**). You see team size, present today, open actions, missing days and exceptions for the employees who report to you or are in a department you manage.\n\n## 6. Important fields and options\n\n| Status (profile updates) | Meaning |\n|---|---|\n| Draft | Not yet sent. |\n| Pending manager approval | Waiting for the line or department manager. |\n| Pending HR approval | Waiting for HR final approval. |\n| Returned for correction | Employee must fix and resubmit. |\n| Approved / Rejected / Cancelled | Final. |\n\n## 7. Daily usage procedures\n- Employees: check **To do** and **History**.\n- Managers: check **To do** and **Team actions** every morning.\n- HR: clear **Profile Update Approvals** and **Profile Changes** daily.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  E[Employee submits] --> M{Has a manager?}\n  M -- yes --> PM[Pending manager approval]\n  M -- no --> PH[Pending HR approval]\n  PM -- manager approves --> PH\n  PM -- reject --> R[Rejected]\n  PM -- return --> RC[Returned for correction]\n  PH -- HR final approve --> A[Approved and applied]\n  PH -- reject --> R\n  PH -- return --> RC\n  RC -- employee resubmits --> PM\n```\n\n- Manager review can be performed by the manager of the primary department or the employee’s reporting manager. An explicit **Reports To** takes precedence over **Reports To Position** for the reporting-manager assignment. An employee cannot approve their own request.\n- HR may give final approval even while the request still waits for the manager.\n- The same two-stage flow is used for attendance correction requests.\n\n## 9. Links to other modules\n- [05. Employees](05-employees.md) – Profile Changes review, Reports To.\n- [04. Organization structure](04-organization-structure.md)\n- Leave, Attendance, Offboarding chapters.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| My Team menu missing | No manager permissions. | Ask admin to add team permissions to your role. |\n| Request went straight to HR | No eligible department or reporting manager. | Review **Department manager**, **Reports To** and the holders of the reporting position. |\n| \"This request is not awaiting your decision.\" | Already decided or not at your stage. | Refresh the list. |\n| \"Add a rejection reason before declining this request.\" | Reason missing. | Enter a reason. |\n| \"Fill in at least one new value.\" | Empty update. | Enter at least one change. |\n| \"Last working day and a short reason are required.\" | Resignation incomplete. | Fill both fields. |\n| Manager does not see a team member | Employee's Reports To is someone else. | HR corrects Reports To. |\n\n## 11. Best practices\n- Keep **Reports To** current after every transfer.\n- Give clear correction notes when returning requests.\n- Employees should upload ID and certificates early under **Documents**.\n\n## 12. Setup checklist\n- [ ] All employees have user accounts\n- [ ] Department managers, reporting positions and individual **Reports To** assignments reviewed\n- [ ] Managers have manager review and team permissions\n- [ ] HR has final approve permission\n- [ ] Test one profile update end to end\n\n## 13. Not verified / limitations\n> **Limitation:** **My insights** (dashboard/me/insights) has no page of its own; it redirects to the main dashboard.\n\n> **Limitation:** Manager recommendations (promotion, transfer, disciplinary proposals sent by managers to HR) exist in the system but have no screen; they cannot be used from the web app yet.\n\n- The exact labels of the reject/return buttons on **Profile updates** were not confirmed (label not verified).\n- The menu location of **To do** may vary by role; sub-items shown depend on permissions.\n"},{"path":"part-3-modules/18-offboarding.md","title":"18. Offboarding","md":"# 18. Offboarding\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nOffboarding manages an employee's exit: resignation or other exit reason, approvals, tasks, clearances, asset return, final settlement, access removal and exit letters.\n\n- HR uses **Employees → Offboarding** with sections **Offboarding Requests**, exit workflows, **My Offboarding Tasks**, **My Offboarding Approvals** and **My Offboarding Clearances**.\n- Employees resign from **Employees → My employee workspace → Resignation** (**Send a resignation**) and follow progress in **Employees → My employee workspace → Offboarding** (**Your exit checklist**).\n\n> 📷 Screenshot: Employees → Offboarding – Offboarding Requests list\n\n## 2. Prerequisites and dependencies\n\n- An exit workflow (**New exit workflow**) with steps.\n- Notice policies (optional) to calculate notice periods.\n- Leave policies with encashment settings, for the leave settlement.\n- Employee compensation and payroll profile currency (needed for leave encashment amounts).\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View offboarding | `offboarding_requests:read`, `offboarding_workflows:read` | HR |\n| Create / submit / edit requests | `offboarding_requests:create`, `:submit`, `:update` | HR |\n| Cancel | `offboarding_requests:cancel` | HR manager |\n| Complete (schedule access termination) | `offboarding_requests:complete` | HR manager |\n| Finalize exit | `offboarding_requests:finalize` | HR manager / admin |\n| Workflows | `offboarding_workflows:create/read/update/delete` | HR admin |\n| Tasks | `offboarding_tasks:create/read/complete/reject` | HR, task owners |\n| Clearances | `offboarding_clearances:create/read/complete` | Department heads, Finance, IT |\n| Documents | `offboarding_documents:create/read/update/delete` | HR |\n| Exit letters | `offboarding_letters:read` | HR |\n| Access termination status / retry / emergency | `offboarding_access:read`, `offboarding_access:retry`, `offboarding_access:emergency-terminate` | HR admin / IT |\n| Resign and view own exit | No special permission | Employee |\n\n## 4. Initial setup and configuration\n\n1. **Mandatory – Exit workflow** (company): **Employees → Offboarding** → workflows → **New exit workflow**. Name, description (**What this exit path covers**), status **Active**/**Inactive**, default **Yes/No**. Click **Add workflow step**: type (HR, IT, Finance, Manager, Other), action (**Verify**, **Approve**, **Recommend**, **Complete**), **Assign step to** (**Person**, **Role**, **Position**), **Required** or **Optional**.\n2. **Optional – Notice policies** (company): notice periods used when **Apply notice policy** is chosen.\n3. **Mandatory for settlement – Leave encashment settings** in leave policies (rate divisor). See Leave module.\n\n## 5. Features – step by step\n\n### Feature: Employee resigns\n**Steps:**\n1. **Employees → My employee workspace → Resignation** → **Send a resignation**.\n2. Enter **Last working day** and **Reason** (both required).\n3. Submit.\n**Expected result:** \"Resignation sent to HR.\" A resignation offboarding request is created and submitted. Progress shows under **Resignation process** and in **Employees → My employee workspace → Offboarding**.\n\n### Feature: HR creates an offboarding request\n**Steps:**\n1. **Offboarding Requests** → new request.\n2. **Select employee**, exit type (Resignation, Termination, Retirement, Contract end, Absconded, Deceased, Layoff, Other), **Reason for leaving**, **Notice date**, last working date.\n3. Choose **Apply notice policy** or **Waive notice period**.\n4. Choose **Save draft** or **Submit now**.\n**Expected result:** Submitted requests go to approvers (Pending manager / Waiting approval) then In progress.\n\n### Feature: Tasks, clearances, assets, settlement\n**Steps:**\n1. Open the request. Complete tasks (or reassign, reopen, reject).\n2. Clearances: each owner marks **Cleared** or **Not cleared** (types: laptop, ID card, email, system access, vehicle, documents, finance, other).\n3. Assets: record each item (laptop, ID card, SIM card, keys, vehicle, access card, phone, other) with **Serial / tag**; mark Returned, Missing or Waived.\n4. Settlement items: final salary, leave encashment, loan recovery, salary advance recovery, gratuity, severance, tax clearance, other. Mark each Completed, Waived or Blocked.\n5. Optional: exit interview and IT actions (email disable, SSO/VPN revoke, HRMS lock, device recovery, badge, payroll stop).\n\n### Feature: Complete and finalize\n**Steps:**\n1. When tasks and approvals are done, click complete. The system calculates the **leave encashment** for unused paid leave and schedules access termination (at last working day, immediately, or manually).\n2. Access removal runs: ends company membership, sessions, branch/department access, positions, reporting line, device users, attendance assignments, cancels future leave, generates relieving and service letters.\n3. When the status is Ready for finalization, click finalize.\n**Expected result:** The request becomes Completed. The employee status changes: Resignation → Resigned, Termination → Terminated, Retirement → Retired, Deceased → Deceased, others → Inactive. Signed contracts are ended on the last working day.\n**Important notes:** Finalize is blocked until every settlement item and asset is resolved.\n\n## 6. Important fields and options\n\n| Request status | Meaning |\n|---|---|\n| Draft | Not submitted |\n| Pending manager / Waiting approval | Awaiting approvers |\n| In progress / Approved | Work underway |\n| Ready for termination | Ready to schedule access removal |\n| Termination scheduled | Access removal waiting for date |\n| Terminating access | Removal running |\n| Access termination failed | Retry needed |\n| Ready for finalization | Can be finalized |\n| Completed / Rejected / Cancelled | Closed |\n\n## 7. Daily usage procedures\n\n- Owners check **My Offboarding Tasks**, **My Offboarding Approvals**, **My Offboarding Clearances**.\n- Employees check **Employees → My employee workspace → Offboarding** for tasks and clearances waiting on them.\n- HR watches requests in Access termination failed and uses retry.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  R[Resignation / HR request] --> A[Approvals] --> P[Tasks, clearances, assets, settlement]\n  P --> C[Complete: leave settlement + schedule access removal]\n  C --> T[Access termination] -->|failed| X[Retry]\n  T --> F[Ready for finalization] --> Z[Finalize: employee status changed, contract ended]\n```\n\n## 9. Links to other modules\n\n- Leave: leave encashment calculated as a settlement item; future leave cancelled.\n- Payroll / Finance: final salary, loan and advance recovery items; payroll stop action.\n- [07. Employment Contracts](07-employment-contracts.md): contracts ended.\n- Attendance / Devices: assignments closed, device users removed.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Last working day and a short reason are required.\" | Missing fields | Fill both |\n| \"Access termination must complete before offboarding finalization\" | Access removal not done | Wait or retry |\n| \"All settlement items must be resolved before finalization\" | Open settlement items | Complete or waive |\n| \"All asset-return items must be resolved before finalization\" | Assets pending/missing | Mark returned or waived |\n| \"Cannot settle …: configure its leave encashment rate divisor first.\" | Policy incomplete | Set divisor in leave policy |\n| \"Cannot settle …: no applicable leave policy is assigned.\" | No policy | Assign leave policy |\n| \"…compensation and payroll profile currencies differ\" | Currency mismatch | Align currencies |\n\n## 11. Best practices\n\n- Record assets at the start of the exit.\n- Use emergency termination only for urgent security cases.\n- Agree final settlement with Finance before finalizing.\n\n## 12. Setup checklist\n\n- [ ] Exit workflow with steps, set as default\n- [ ] Notice policies\n- [ ] Leave encashment divisors set\n- [ ] Clearance owners have clearance permissions\n- [ ] HR has `offboarding_requests:finalize`\n\n## 13. Not verified / limitations\n\n- Exact button labels for complete, finalize and new request were not verified.\n- How settlement amounts flow into a payroll run was not verified; items may need manual entry in Payroll.\n- Exit letter download screen not verified.\n"},{"path":"part-3-modules/19-forms-and-feedback.md","title":"19. Forms and Feedback","md":"# 19. Forms and Feedback\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\n**Forms & Feedback** lets HR send surveys, polls and data-collection forms (\"campaigns\") to employees, on a one-time or repeating schedule, and see the results. Answers can be **identified** (HR sees who answered) or **anonymous** (HR sees only totals, and only when there are enough answers to protect privacy).\n\nSidebar: **Forms & Feedback**. The page has two areas:\n- **My forms** – every employee: forms waiting for you (**To complete**) and those you have **Submitted**.\n- **Manage forms** – HR with the manage permission: **Campaigns**, **Responses** and **Summary**.\n\n## 2. Prerequisites and dependencies\n\n| Must exist first | Why |\n|---|---|\n| Employees with active user accounts linked to employee records | Only active employees can receive and answer forms (\"An active employee account is required\"). |\n| Branches and departments | Needed if you target **Selected branc
