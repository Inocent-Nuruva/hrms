hes** or **Selected departments**. See Company Structure. |\n| Notifications | Employees get an in-app notification when a form opens and reminders if set. See Notifications. |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| Answer forms sent to you | none (signed-in active employee in the audience) | Every employee |\n| Create, schedule, pause, close forms; view results and satisfaction metrics | `forms_feedback:manage` (\"Manage forms and feedback\") | HR |\n\n## 4. Initial setup and configuration\n\n1. **Give HR the permission** `forms_feedback:manage` – Mandatory. Scope: company role.\n2. **Confirm branches/departments** are correct if you plan targeted campaigns – Optional.\n3. No other configuration is needed. Each campaign has its own settings.\n\n## 5. Features – step by step\n\n### Feature: Create a campaign\n**Purpose:** Build a form and send it to employees.\n**Before you start:** You need `forms_feedback:manage`.\n**Steps:**\n1. Open **Forms & Feedback** and go to **Manage forms**.\n2. Click **Create form**. The **Create campaign** wizard opens with four steps.\n3. **Details & audience** – enter **Title** and **Description**, choose **Form type** (**Survey**, **Poll**, **Data collection**), **Category**, **Response identity** (**Identified** or **Anonymous**) and **Audience** (**All active employees**, **Selected branches**, **Selected departments**). If you choose selected branches/departments, pick them in **Select audience**. Tick **Include rating answers in employee satisfaction metrics** if this is a satisfaction survey.\n4. Click **Continue**.\n5. **Questions** – choose suggested questions or click **Add question**. For each question set **Question**, **Answer type**, **Required**, and, for choice questions, **Options — one per line**. Use **Move question up/down** or **Remove question**.\n6. Click **Continue**.\n7. **Schedule** – choose **Repeat** (**Once**, **Weekly**, **Monthly**), **Start date**, **End date (optional)**, **Opening time**, **Timezone**, **Days open**, **Remind every N days (optional)**, **Maximum rounds (optional)**. For monthly: **Day of month** and **Use last day in shorter months**.\n8. Click **Continue**.\n9. **Review & send** – check the preview, then click **Send / schedule campaign**. Or click **Save draft** at any step.\n**Expected result:** \"Form saved. Scheduled forms open automatically at the selected time.\"\n**Important notes:**\n- If today's opening time has already passed on the first opening, the form opens on the next schedule check (within about a minute).\n- The response identity is **Locked when published**.\n- A satisfaction form must have at least one required rating question.\n\n> 📷 Screenshot: Create campaign wizard – the four step names and the **Send / schedule campaign** button\n\n### Feature: Answer a form (employee)\n**Steps:**\n1. Open **Forms & Feedback → My forms**. Forms waiting are under **To complete**.\n2. Open the form and answer the questions. Use **Previous** / **Next** to move between pages (if shown).\n3. Tick **I have reviewed my answers and understand the response identity setting.**\n4. Click **Submit response**.\n**Expected result:** \"Thank you. Your response has been submitted.\"\n**Important notes:** You can submit only once per round (\"Your response has already been submitted\"). Ratings are 1 to 5. Short text up to 500 characters, long text up to 5,000.\n\n### Feature: Pause, resume or close a campaign\n**Steps:**\n1. In **Manage forms → Campaigns**, find the campaign.\n2. Click **Pause** to stop it opening new rounds; click **Send** on a paused or draft form to schedule it again.\n3. Click **Close form** and confirm in **Close form?** to end it permanently.\n**Important notes:** Only draft or paused forms can be scheduled. Use **Edit** to change a draft or paused campaign (\"Edit campaign schedule\").\n\n### Feature: View results\n**Steps:**\n1. In **Manage forms**, open **Responses** or **Summary** for a campaign.\n2. Choose a round. Use **Back to rounds** to return.\n**Expected result:** Identified forms show **Employee**, **Employee no.** and each **Submission**. Anonymous forms show totals only.\n**Important notes:** Anonymous results are shown only after the round closes **and** there are at least five responses (\"HR can view anonymous answers after closing, with at least five responses.\"). Otherwise you see \"Results are not available\".\n\n## 6. Important fields and options\n\n| Field | Options / meaning |\n|---|---|\n| Form type | Survey, Poll, Data collection |\n| Response identity | Identified, Anonymous |\n| Audience | All active employees, Selected branches, Selected departments |\n| Answer type | Short text, Long text, Single choice, Multiple choice, Yes/No, Rating (1–5), Number, Date (on-screen labels not verified) |\n| Repeat | Once, Weekly, Monthly |\n| Days open | How many days each round stays open |\n| Remind every N days | Re-notify employees who have not answered |\n| Maximum rounds | Stop after this many rounds (\"Occurrence limit reached\") |\n\nCampaign statuses: **Draft**, **Scheduled**, **Paused**, **Closed**.\n\n## 7. Daily usage procedures\n- **Employees:** check **My forms → To complete** when notified.\n- **HR:** monitor **Campaigns** and **Summary**; close campaigns that are no longer needed.\n\n## 8. Approval workflows\nNo approval step. Lifecycle:\n\n```mermaid\nflowchart LR\n  A[Draft] -->|Send / schedule| B[Scheduled]\n  B -->|Pause| C[Paused] -->|Send| B\n  B -->|Each opening| R[Round open → employees answer → round closes]\n  B -->|Close form| D[Closed]\n  C -->|Close form| D\n```\n\n## 9. Links to other modules\n- **Notifications** – opening and reminder notifications (no answer data is included).\n- **Company Structure** – branches and departments for audience targeting.\n- **Insights** – satisfaction metrics from forms flagged for satisfaction (display location not verified).\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Enter a campaign title before continuing.\" | Title empty | Enter a title. |\n| \"Select at least one audience before continuing.\" | Branch/department list empty | Pick at least one. |\n| \"Add at least one question before continuing.\" | No questions | Add a question. |\n| \"Choice questions need at least two distinct options\" | Fewer than 2 options | Add more options. |\n| \"Satisfaction forms require at least one required rating question\" | Satisfaction ticked without a required rating | Add a required rating question or untick. |\n| \"End date must follow start date\" | Dates reversed | Fix dates. |\n| \"You are not in this form audience\" | Employee not targeted | Change audience. |\n| \"This form is not open\" | Round closed or not yet open | Wait for next round. |\n| \"Results are not available\" | Anonymous form with fewer than 5 responses or not closed | Wait until closed with 5+ responses. |\n\n## 11. Best practices\n- Use **Anonymous** for culture and satisfaction surveys; use **Identified** for data collection.\n- Keep surveys short; mark only essential questions **Required**.\n- Set reminders for important campaigns.\n\n## 12. Setup checklist\n- [ ] HR role has `forms_feedback:manage`\n- [ ] Branches/departments verified (if targeting)\n- [ ] First campaign tested with a small audience\n\n## 13. Not verified / limitations\n- On-screen labels for answer types and categories were not individually verified.\n- Where the satisfaction metrics appear outside this page was not verified.\n- Form scheduling runs every minute on the server; delays may occur if the server job is stopped.\n"},{"path":"part-3-modules/20-reports-insights-and-monitoring.md","title":"20. Reports, Insights and Monitoring","md":"# 20. Reports, Insights and Monitoring\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThis chapter covers the places where you look at data rather than enter it:\n\n| Sidebar item | Tabs | What it does |\n|---|---|---|\n| **Reports & Analytics** | **Reports & Analytics**, **Scheduled Reporting** | Run reports on screen, export to Excel/CSV/PDF, build and save custom reports, and email reports automatically on a schedule. |\n| **Insights** | **HR**, **Management**, **Manager**, **Sales field**, **Ready?**, **Identity audit** | Dashboards for a date range; launch readiness and system health; audit of name/email/phone changes. |\n| Help chat | (floating button on the home dashboard) | Ask where to find things; **Escalate to IT support** by email. |\n\nKPI dashboards are described in the KPI chapter; this chapter only links to them.\n\n## 2. Prerequisites and dependencies\n\n| Must exist first | Why |\n|---|---|\n| Data in source modules (employees, attendance, leave, payroll, loans, field visits) | Reports read from those modules. |\n| Departments | Department-scoped saved reports and dashboards. |\n| A tested **SMTP configuration** | Scheduled reports cannot be emailed without one. See also **Notifications → Mail / SMTP configuration**. |\n| Employees with user accounts | Recipients of type employee/user/role. |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| Open Reports & Analytics, run/preview reports | `analytics:reports` (also accepted for the menu: `reports:read`, `attendance_reports:read`, `leave_reports:read`, `field_reports:read`, `payroll_reports:read`, `loan_reports:read`, etc.) | HR, Finance |\n| Export reports | `analytics:exports` / `reports:export` | HR, Finance |\n| Statutory reports, reconciliation | `analytics:statutory-reports`, `analytics:reconciliation` | Finance |\n| View scheduled report definitions, templates, schedules | `scheduled_reports:read` | HR / Report admin |\n| Create / edit / delete templates and schedules | `scheduled_reports:create`, `:update`, `:delete` | Report admin |\n| Run now, retry executions | `scheduled_reports:run` | Report admin |\n| View execution history | `scheduled_reports:view_history` | Report admin |\n| Download generated files | `scheduled_reports:download` | Report admin |\n| Manage / test SMTP | `scheduled_reports:manage_smtp`, `scheduled_reports:test_smtp` | IT / Report admin |\n| Insights – HR dashboard | `dashboard:hr` (menu also accepts `dashboards:read`, `hr_dashboards:read`, `view_hr_dashboard`) | HR |\n| Insights – Management | `dashboard:management` | Executives |\n| Insights – Manager | `dashboard:manager` | Line managers |\n| Insights – Sales field | `analytics:dashboards-sales-field` (menu: `sales_field:read`, `analytics:read`) | Sales managers |\n| Insights – Ready? | `hrms_launch_readiness:read` (menu: `launch_readiness:read`, `security_events:read`) | HR admin, IT |\n| Insights – Identity audit (view / roll back) | `identity_audit:read` / `identity_audit:rollback` | HR admin |\n| Help chat and escalate | none (any signed-in user) | Everyone |\n\n## 4. Initial setup and configuration\n\n1. **Grant report permissions** – Mandatory. Scope: company role.\n2. **Add an SMTP configuration** – Mandatory for scheduled email. **Reports & Analytics → Scheduled Reporting → SMTP → Add SMTP**. Scope: company. Changeable.\n3. **Test the SMTP configuration** and mark one as **Default configuration** – Mandatory. Scheduled sending is refused until an active, tested default exists.\n4. **Review starter templates** – Optional. The system provisions default attendance and workforce report packs for each company. Check them under **Templates**.\n5. **Create schedules** – Optional. One per template you want sent automatically.\n6. **Grant Insights permissions** to HR, managers and executives – Mandatory for dashboards.\n\n## 5. Features – step by step\n\n### Feature: Reports & Analytics summary and catalog\n**Purpose:** Quick company numbers and a list of available reports.\n**Steps:** Open **Reports & Analytics**. The top shows **Total employees**, **New employees**, **Attendance days**, **Leave days**, **Locked payroll runs**, **Gross pay**, **Net pay**, **Employer cost**. Below, click a category button to see its reports with an implementation status.\n**Important notes:** If some sources could not load you see \"Some report sources are unavailable\" with a **Retry** button. This usually means a missing permission.\n\n### Feature: Run and export an operational report\n**Purpose:** Run ready-made HR, leave, payroll, loan, document and field visit reports.\n**Steps:**\n1. In **Operational report runner**, choose **Report**.\n2. Choose **Export format**: **Excel (.xlsx)**, **CSV (.csv)** or **PDF (.pdf)**.\n3. Set **From**, the end date and optional **Status**.\n4. Click **Run report** to see results on screen, or **Export XLSX/CSV/PDF** to download.\n**Expected result:** A table (and a **Map view** for the field visit map report) or a downloaded file.\n**Important notes:** \"Choose an operational report first.\" Sensitive data is checked against your permissions and company.\n\n> 📷 Screenshot: Reports & Analytics – Operational report runner with **Run report** and **Export** buttons\n\n### Feature: Custom report builder and saved reports\n**Steps:**\n1. In **Custom report builder**, choose **Data source**, **Group by columns**, **Measures**, **From**/to dates and **Export format**.\n2. Click **Preview** or **Export**.\n3. To keep it, enter a **Report name**, choose **Visibility** (**Private**, **Department**, **Shared**, **Admin only**), and for Department choose **Department scope**. Click **Save report**.\n4. Saved reports appear under **Saved reports**; click one to preview it, or delete it with the bin icon.\n**Important notes:** \"Choose a data source, at least one group by column, and at least one measure.\"\n\n### Feature: Set up SMTP for scheduled reports\n**Steps:**\n1. Go to **Reports & Analytics → Scheduled Reporting → SMTP**.\n2. Click **Add SMTP**. Enter **Name**, **Host**, **Port**, **Security**, **Username**, password, **Sender email**, **Sender name**, **Reply-to email**, **Connection timeout (ms)**, **Max retries**. Tick **Default configuration** and **Active**.\n3. Save, then click **Test SMTP**, enter a **Test recipient email**, and send.\n**Expected result:** \"SMTP test sent.\" and an email arrives.\n\n### Feature: Create a report template\n**Steps:**\n1. **Scheduled Reporting → Templates → Create**.\n2. Enter **Name \\***, choose **Report definition \\***, **Output format** (PDF, XLSX, CSV), **Date range strategy**, **Email subject**, **Email body**, **Filename pattern** (for example `attendance-{{date}}.pdf`), **Attach report**, and optional **SMTP configuration (optional)**.\n3. Add **Recipients**: choose **Recipient type** (email, user, employee, role, department, department manager, dynamic group) and **Channel** (To/CC/BCC), then the address or ID.\n4. Save. Use **Run template now** to test.\n**Expected result:** \"Template run started. Check the execution history for progress.\"\n\n### Feature: Schedule a report\n**Steps:**\n1. **Scheduled Reporting → Schedules → Create**.\n2. Choose **Template \\***, **Schedule type** (Daily, Weekly, Monthly, Quarterly, Annual, One time, Manual), **Execution time** (for example 08:00), **Timezone**, **Start date**, **End date**, **Weekdays (comma-separated)** for weekly, **Day of month** for monthly/quarterly/annual, and **Misfire handling** (**Skip**, **Run immediately**, **Defer to next window**).\n3. Tick **Active** and save.\n**Expected result:** \"Created successfully.\" The server checks schedules every minute.\n\n### Feature: Execution history, retry and download\n**Steps:** Open **Executions**. Filter by template, schedule, status, source or email delivery. Use **Retry** for failed runs (\"Execution retry queued.\") and **Download** for the generated file (\"Report download started.\").\n\n### Feature: Insights dashboards\n**Steps:**\n1. Open **Insights** and choose **HR**, **Management**, **Manager** or **Sales field**.\n2. Pick **Start date** and **End date**. Optionally use **Find employee** to filter by one employee (search respects your access scope).\n**Expected result:** Tiles and charts such as **Headcount by department**, **Headcount by branch**, **Approved leave by month and type**, **Attendance**, **Approvals**, **Work activities**, **Department manpower**; the HR tab also shows document compliance. **Manager** shows \"Team attendance, approvals, and work requiring your attention.\" **Sales field** shows the \"Sales and field overview\".\n\n### Feature: Ready? (launch readiness and system health)\n**Purpose:** \"Check system health, create starter clock-in rules, and review blocked actions.\"\n**Steps:**\n1. Open **Insights → Ready?** (\"Are we ready?\").\n2. Check tiles such as **System**, **Online**, **Records**, **Ready to use** and **Issues to fix**.\n3. Under **Set up clock-in**, see \"Who can clock in, and what they still need.\" Click **Create clock-in rules** to create a starter set, and **Preview a work schedule** for an employee.\n4. **Access was blocked** lists \"Times someone tried to open a page they do not have permission to use.\"\n**Important notes:** \"Creating rules here only builds a starter set. Refine devices, maps, and shifts later under Attendance.\" The server health check covers the database, cache (Redis) and disk.\n\n### Feature: Identity audit\n**Steps:** Open **Insights → Identity audit** (\"Identity change audit\"). Filter by **From date**, **To date**, field and source, or **Search name or value**. Each row shows **Date & time**, **Employee / user**, **Field**, **Previous value**, **New value**, **Source**, **Changed by**. Export with the export button (label not verified). With rollback permission, click **Roll back**, enter **Reason (optional)** and confirm in **Roll back this change?**.\n\n### Feature: Help chat and IT escalation\n**Steps:** On the home dashboard click the floating help button (\"Open help chat\"). Ask a question such as \"Where do I request leave?\". If the answer does not help, click **Escalate to IT support**.\n**Important notes:** The chat says \"This part is under development.\" Escalation sends an email to IT support, limited to 8 escalations per minute.\n\n## 6. Important fields and options\n\n| Option | Values |\n|---|---|\n| Export format | Excel (.xlsx), CSV (.csv), PDF (.pdf) |\n| Saved report visibility | Private, Department, Shared, Admin only |\n| Date range strategy | Current/previous day, week, month, quarter, year (more values may exist) |\n| SMTP security | None, STARTTLS, SSL/TLS, Auto |\n| Execution status | Pending, Queued, Generating, Generated, Sending, Sent, Partially sent, Failed, Cancelled, Skipped |\n| Execution source | Scheduler, Manual, API, Retry, System |\n\nBuilt-in scheduled report definitions include **Attendance Summary**, **Employee Directory**, **Morning Attendance Report**, **End of Day Attendance Report** and operational analytics reports.\n\n## 7. Daily usage procedures\n- **HR / Finance:** run operational reports and export for month-end.\n- **Report admin:** check **Executions** each morning for failed runs; retry.\n- **Managers:** open **Insights → Manager** for team status.\n- **Admin:** check **Ready?** during rollout for issues to fix and blocked access.\n\n## 8. Approval workflows\nThere are no approvals. Scheduled report execution flow:\n\n```mermaid\nflowchart LR\n  S[Schedule due / Run now] --> Q[Queued] --> G[Generating] --> D[Generated]\n  D -->|Email| E[Sending] --> T[Sent]\n  E --> P[Partially sent]\n  G --> F[Failed] -->|Retry| Q\n```\n\n## 9. Links to other modules\n- **Notifications → Mail / SMTP configuration** – mail settings.\n- **Attendance** – clock-in rules created from **Ready?**.\n- **Field Operations** ([16](./16-field-operations.md)) – field visit map report, sales field dashboard.\n- **KPI** – KPI dashboards (see KPI chapter).\n- **Roles** – permissions listed above.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"No active, tested default SMTP configuration is available…\" | No default tested SMTP | Add, test and mark an SMTP configuration as default. |\n| \"The default SMTP configuration has no usable password.\" | Password missing | Edit the SMTP record and test again. |\n| \"Some report sources are unavailable\" | Missing permission or API error | Check role permissions; click **Retry**. |\n| Insights tab empty or redirects | No dashboard permission | Grant the dashboard permission. |\n| Execution **Failed** | Generation or email error | Open the execution, fix SMTP/recipients, **Retry**. |\n| \"Enter a test recipient email address.\" | Test address empty | Enter an email. |\n\n## 11. Best practices\n- Test SMTP before creating schedules.\n- Use **Private** visibility for sensitive saved reports.\n- Prefer XLSX for data analysis, PDF for distribution.\n- Review blocked actions in **Ready?** to fix role gaps.\n\n## 12. Setup checklist\n- [ ] Report permissions granted\n- [ ] SMTP added, tested, set as default\n- [ ] Default templates reviewed\n- [ ] Schedules created and first execution checked\n- [ ] Insights permissions granted to HR, managers, executives\n\n## 13. Not verified / limitations\n- Some catalog reports show an implementation status other than ready (\"Module runner required\"); they cannot be run.\n- The help chat is marked \"under development\".\n- Exact export button label on Identity audit not verified.\n- The system health check is technical and has no dedicated page beyond **Ready?**.\n"},{"path":"part-4-daily-operations/01-daily-operations-guide.md","title":"Daily Operations Guide","md":"# Daily Operations Guide\n\nRoutine work in the HRMS, organized by module and by how often it is done. Step-by-step instructions for each task are in the linked module manual.\n\n## Contents\n- [Working with lists, search and filters](#working-with-lists-search-and-filters)\n- [Your To do list](#your-to-do-list)\n- [Routine calendar](#routine-calendar)\n- [By module](#by-module)\n  - [Attendance](#attendance)\n  - [Leave](#leave)\n  - [Employees and self-service](#employees-and-self-service)\n  - [Onboarding, contracts and offboarding](#onboarding-contracts-and-offboarding)\n  - [Payroll](#payroll)\n  - [Staff finance](#staff-finance)\n  - [Probation, movements and KPI](#probation-movements-and-kpi)\n  - [Field operations](#field-operations)\n  - [Forms, reports and insights](#forms-reports-and-insights)\n- [Correcting mistakes and handling exceptions](#correcting-mistakes-and-handling-exceptions)\n- [Worked examples](#worked-examples)\n\n---\n\n## Working with lists, search and filters\n- **Global search:** the search box in the header (or sidebar on small screens) jumps to any page you have access to — type a word like \"leave\" or \"payslip\".\n- **Tables:** most lists have a search box, filters (status, branch, department, date) and column sorting. Many tables can be resized and scroll sideways on phones.\n- **Exports:** where a list offers export, use the export/download button for Excel/CSV/PDF. Report exports are in **Reports & Analytics**.\n- **Notifications:** the bell in the header shows new alerts; **Notifications → Current notifications** holds the full inbox (read, seen, archive).\n\n> 📷 Screenshot: a typical list page – highlight search box, filters and export button\n\n## Your To do list\nThe **To do** menu gathers everything waiting for you:\n- **Employee Requests** — self-service requests to review\n- **Correction Requests** — attendance corrections to approve\n- **Profile Update Approvals** — employee profile changes\n\nCheck it at the start of every working day. See [Self-service and approvals](../part-3-modules/17-self-service-and-approvals.md).\n\n## Routine calendar\n\n| When | Who | Activity |\n|---|---|---|\n| **Daily** | Employee | Check in/out; check notifications; respond to tasks |\n| Daily | Manager | Clear **To do**: leave, corrections, profile updates; review mobile punch exceptions; review field visits |\n| Daily | HR | Final approvals; review **Daily Summaries**, **Unmatched Logs**; onboarding tasks; document verification |\n| Daily | IT / Attendance Admin | Check **Device Sync Logs** and device status |\n| **Weekly** | HR | Run attendance recalculation where corrections were approved; review pending leave; probation cases due |\n| Weekly | Manager | Review team schedule, team leave calendar, KPI activities |\n| **Monthly** | Payroll / Finance | Open period → inputs → process run → approvals → lock → payment file → mark paid → close |\n| Monthly | HR | Leave accrual/recalculation runs; contract expiry alerts; headcount reports |\n| Monthly | Finance | Loan repayments via payroll, shortfalls, reconciliation |\n| **Yearly** | HR | Generate new-year leave balances, rollover/carry-forward, new holidays; KPI review cycle |\n\n---\n\n## By module\n\n### Attendance\n**Manual:** [Attendance](../part-3-modules/08-attendance.md)\n\n| Task | Who | Where |\n|---|---|---|\n| Check in / out | Employee | **Attendance → My attendance** (web/mobile; today's panel is at the top) or the biometric device |\n| View history and schedule | Employee | **Attendance → My attendance → Attendance History / My Schedule** |\n| Request a correction (missed punch, wrong time) | Employee | **Attendance → My attendance → Correction Requests** |\n| First-stage approval of corrections | Manager | **To do → Correction Requests** |\n| Final approval of corrections | HR | **Attendance → Correction Requests** |\n| Review out-of-location mobile punches | Manager / HR | **Attendance Operations → Mobile Punch Review** |\n| Review processed days | HR | **Attendance Operations → Daily Summaries** |\n| Fix unmatched device logs | HR / IT | **Attendance Operations → Unmatched Logs** |\n| Rebuild a date range | HR | **Attendance Operations → Recalculation Jobs** |\n| Mark staff not tracked | HR | **Attendance Operations → Exemptions** |\n\n> Once a payroll period is closed, attendance for those dates is locked; corrections and exemptions are refused.\n\n### Leave\n**Manual:** [Leave management](../part-3-modules/10-leave-management.md)\n\n| Task | Who | Where |\n|---|---|---|\n| Apply for leave (full / half / short day), attach documents | Employee | **Leave Management → My leave → Requests** |\n| Check balances, holidays, policies | Employee | **Leave Management → My leave → Balances / Holidays / Policies** |\n| Cancel or end leave early | Employee | **Leave Management → My leave → Requests** |\n| Download leave PDF (with QR verification) | Employee / HR | Leave request detail |\n| Approve / reject / return | Manager / approver | **To do** or **Leave Management → Leave Requests** |\n| Appoint an acting employee / approval cover | Manager | Leave request / approval cover |\n| HR approval step, override, cancellation | HR Manager | **Leave Management → Leave Requests** |\n| Adjust balances, import, recalculate | HR | **Leave Management → Leave Balances / Balance Import** |\n| Business trips | Employee / HR | **Leave Management → Business Trips** (same screen as Attendance) |\n\n### Employees and self-service\n**Manuals:** [Employees](../part-3-modules/05-employees.md), [Self-service](../part-3-modules/17-self-service-and-approvals.md)\n\n| Task | Who | Where |\n|---|---|---|\n| Update own details (goes manager → HR) | Employee | **Employees → My employee workspace → Profile** |\n| Request a document, resignation, or detail change (HR only) | Employee | **Employees → My employee workspace** |\n| View team | Manager | **Employees → My team** |\n| Search / view employees | HR | **Employees → All Employees** |\n| Change employee status | HR | Employee profile → status action |\n| Approve profile updates / change requests | Manager, HR | **Employees → Profile Updates / Profile Changes** |\n\n### Onboarding, contracts and offboarding\n**Manuals:** [06](../part-3-modules/06-recruitment-and-onboarding.md), [07](../part-3-modules/07-employment-contracts.md), [18](../part-3-modules/18-offboarding.md)\n\n| Task | Who |\n|---|---|\n| Complete onboarding tasks, upload documents | New employee (**Employees → My employee workspace → Onboarding**) |\n| Verify documents, approve steps, activate | HR |\n| Create contract, company signs, send to employee | HR / signatory |\n| Sign contract with code (authenticator or email) | Employee (**Employees → My employee workspace → My contracts**) |\n| Act on expiry alerts (60/30/7 days, and on the day) | HR |\n| Submit resignation | Employee (**Employees → My employee workspace** / **Employees → My employee workspace → Offboarding**) |\n| Clearance tasks, settlement, finalize exit | Manager, HR, Finance |\n\n### Payroll\n**Manual:** [Payroll](../part-3-modules/11-payroll.md)\n\nMonthly cycle:\n\n```mermaid\nflowchart LR\n  A[Open period] --> B[Enter / approve inputs] --> C[Process run] --> D[HR approve] --> E[Finance approve] --> F[Management approve] --> G[Lock] --> H[Payslips released] --> I[Payment file] --> J[Mark paid] --> K[Close]\n```\n\n- Each approval must be by a different person from the preparer.\n- Payslips appear in **Finance → My finance → Payroll** only after the run is locked.\n- A run can be reversed only before payment is confirmed.\n\n### Staff finance\n**Manual:** [Staff finance](../part-3-modules/12-staff-finance-loans.md)\n\n| Task | Who |\n|---|---|\n| Apply for a loan / advance; respond as guarantor; accept sanction letter | Employee (**Finance → My finance**) |\n| Manager review → HR approval → Finance approval → Management approval | Approvers |\n| Disburse; post repayments; resolve payroll shortfalls; servicing (deferment, reschedule, waiver, write-off) | Finance |\n\n### Probation, movements and KPI\n**Manuals:** [13](../part-3-modules/13-probation.md), [14](../part-3-modules/14-movements-and-promotion.md), [15](../part-3-modules/15-kpi-and-performance.md)\n\n| Task | Who |\n|---|---|\n| Probation self-assessment (after the due date) | Employee |\n| Probation manager review; HR decision (confirm / extend / terminate) | Manager, HR |\n| Create and submit a transfer / promotion; approve; apply | HR, approvers |\n| Record KPI activities, submit achievements, self-assessment, acknowledge review | Employee |\n| Assign KPIs/targets, review achievements, manager assessment | Manager |\n| Open/close review periods, finalize | HR |\n\n### Field operations\n**Manual:** [Field operations](../part-3-modules/16-field-operations.md)\n\n- Employee: plan visits, check in at the customer (GPS within 100 m), record opportunities, expenses and follow-ups. Use the **mobile app** for offline work and sync within 3 days.\n- Manager: review plans and visits, approve/return/reject, view map.\n\n### Forms, reports and insights\n**Manuals:** [19](../part-3-modules/19-forms-and-feedback.md), [20](../part-3-modules/20-reports-insights-and-monitoring.md)\n\n- Employees answer forms/surveys when notified.\n- HR runs reports in **Reports & Analytics** and exports them; schedules recurring reports in **Scheduled Reporting**; monitors **Insights → HR / Readiness**.\n\n---\n\n## Correcting mistakes and handling exceptions\n\n| Mistake | How to correct |\n|---|---|\n| Wrong punch / missed punch | Employee files a correction request; manager then HR approve |\n| Approved wrong leave | HR cancels it (balance is returned to the current year) |\n| Wrong opening leave balance | HR adjusts in **Leave Balances** (adjustment is logged) |\n| Wrong payroll input before lock | Edit or remove the input and re-process |\n| Wrong payroll after lock | Reverse the run (only if payment not confirmed) or add a correction input next period |\n| Wrong employee name/email/phone sync | **Insights → Identity audit** → roll back |\n| Movement failed to apply | **Movements → Operations** → Retry |\n\n## Worked examples\n\n**Example 1 — An employee forgets to check out.**\n1. Next morning the employee opens **Attendance → My attendance → Correction Requests**, creates a request for yesterday with the real check-out time and a reason, and submits.\n2. The manager sees it in **To do → Correction Requests** and approves.\n3. HR gives final approval. The daily summary updates and the day is recalculated.\n\n**Example 2 — Annual leave with a sick-note threshold.**\n1. Employee applies for 5 days of sick leave in **Leave Management → My leave → Requests**. Because it exceeds the document threshold, the form requires an attachment.\n2. The request goes to the approver defined in the workflow (or Reports To manager if no workflow).\n3. After approval the balance reduces and the days show as leave in attendance.\n\n**Example 3 — Month-end payroll.**\n1. Payroll officer opens the period, checks attendance overtime and leave encashment inputs, and processes the run.\n2. HR, Finance and Management each approve (each a different person).\n3. Finance locks the run, generates the payment file, marks it paid, and closes the period. Employees see payslips in **Finance → My finance → Payroll**.\n"},{"path":"part-4-daily-operations/02-role-based-guides.md","title":"Role-Based User Guides","md":"# Role-Based User Guides\n\nWhat each role sees, can do, and is responsible for. Access is controlled by the **roles** assigned to your user account and the **data scope** of those roles (company, branch, department, team, or self). Menu items you cannot use are hidden.\n\n## Contents\n- [Platform roles](#platform-roles)\n- [System / Company Administrator](#system--company-administrator)\n- [IT Administrator](#it-administrator)\n- [HR Manager](#hr-manager)\n- [HR Officer](#hr-officer)\n- [Attendance Administrator](#attendance-administrator)\n- [Leave Administrator](#leave-administrator)\n- [Department Manager / Branch Manager (Approver)](#department-manager--branch-manager-approver)\n- [Finance / Payroll](#finance--payroll)\n- [Management](#management)\n- [Auditor](#auditor)\n- [Employee](#employee)\n- [Acting employee](#acting-employee)\n\n---\n\n## Platform roles\nUsed by the organization that hosts the system, not by company staff.\n\n| Role | Can do |\n|---|---|\n| Super Admin | Everything at platform level, including changing the permission catalogue |\n| Platform Administrator | Create/manage companies, roles; view permissions; notification/SMS settings |\n| Platform Support | Read-only, plus limited company status changes |\n| Platform Auditor | Read-only companies, roles, permissions |\n\n## System / Company Administrator\n**Role:** Company Admin\n- **Access:** all company modules.\n- **Responsible for:** company settings, SMTP/SMS, roles and user accounts, organization structure, numbering, and overseeing the [Master Setup Guide](../part-2-setup/01-master-setup-guide.md).\n- **Daily:** user account issues (locked accounts, 2FA reset), role changes, monitoring **Insights → Readiness**.\n- See the [Administrator Guide](../administrator-guide.md).\n\n## IT Administrator\n**Role:** IT Admin\n- **Responsible for:** biometric devices (register, test connection, sync), doors, week plans, access groups, Wi-Fi networks, device sync and command logs, enrolment of fingerprints/PIN/cards.\n- **Daily:** check **Device Sync Logs** and **Unmatched Logs**; fix offline devices.\n- Manuals: [Access control](../part-3-modules/09-access-control-and-devices.md), [Attendance](../part-3-modules/08-attendance.md).\n\n## HR Manager\n**Role:** HR Manager\n- **Access:** all HR modules company-wide.\n- **Responsible for:** final approvals (profile updates, corrections, leave HR step, status changes), approving leave policy/rollover/statutory versions, activating new employees, finalizing exits, probation decisions, KPI review periods (one of only two roles that can create reporting periods), independent approval of hiring requests.\n- **Daily:** clear **To do**; review onboarding readiness; respond to contract expiry alerts.\n\n## HR Officer\n**Role:** HR Officer\n- **Responsible for:** registering/inviting employees, maintaining profiles and documents, onboarding tasks, creating contracts, creating movements, leave balance maintenance, reports.\n- Cannot approve their own work where maker-checker applies.\n\n## Attendance Administrator\n**Role:** Attendance Admin\n- **Responsible for:** attendance policy, holidays, shifts, timetables, schedules, exemptions, daily summaries, recalculation.\n\n## Leave Administrator\n**Role:** Leave Admin\n- **Responsible for:** leave types, policies (drafting), workflows, balances, balance import, accrual/recalculation runs.\n\n## Department Manager / Branch Manager (Approver)\n**Roles:** Department Manager, Branch Manager (scope: department/branch/team)\n- **Access:** **Employees → My team**, **To do**, team leave/attendance, team probation, team movements, team KPI, field visit review.\n- **Responsible for:**\n  - First-stage approval of leave, attendance corrections, profile updates, self-service requests.\n  - Probation manager review.\n  - Assigning KPIs and targets; manager assessments.\n  - Reviewing team field visits and mobile punch exceptions.\n  - Onboarding/offboarding tasks assigned to them; hiring request approval.\n- **Daily:** open **To do** first thing; nothing moves to HR until you act.\n- You receive requests from employees whose **Reports To** is you.\n\n## Finance / Payroll\n**Role:** Finance (plus payroll permissions)\n- **Responsible for:** payroll setup, inputs, processing, the Finance approval step, lock, payment file, marking paid, journals, close; loan products, Finance approval of loans, disbursement, repayments, shortfalls, servicing; payroll leave encashment confirmation.\n- **Monthly:** see the payroll cycle in the [Daily Operations Guide](01-daily-operations-guide.md#payroll).\n- Manuals: [Payroll](../part-3-modules/11-payroll.md), [Staff finance](../part-3-modules/12-staff-finance-loans.md).\n\n## Management\n**Role:** Management\n- **Access:** read-only dashboards and Insights; may hold the **Management approval** step for payroll runs, movements and loans if granted.\n\n## Auditor\n**Role:** Auditor\n- **Access:** read-only across modules; identity audit, security events, logs.\n\n## Employee\n**Role:** Employee (scope: self)\n\n| You can | Where |\n|---|---|\n| View and update your profile | **Employees → My employee workspace → Profile** |\n| Check in/out, see history and schedule, request corrections | **Attendance → My attendance** |\n| Apply for and track leave, see balances | **Leave Management → My leave** |\n| See payslips | **Finance → My finance → Payroll** |\n| Apply for loans/advances | **Finance → My finance** |\n| Sign contracts | **Employees → My employee workspace → My contracts** |\n| Complete onboarding tasks | **Employees → My employee workspace → Onboarding** |\n| Submit requests (documents, resignation, detail changes) | **Employees → My employee workspace** |\n| Probation self-assessment | **Probation → My probation** |\n| KPI activities, scorecards, evaluations | **KPI & Performance → My KPI & Performance** |\n| Field visits (if field staff) | **Field → My field work** |\n| See transfers/promotions | **Movements → My movements**, **Promotion** |\n\nSee the [Quick Start Guide](../quick-start-guide.md).\n\n## Acting employee\nAn employee appointed to cover for someone on leave. They get **no extra permissions**; they receive approvals only if the manager chose to route approvals to them when appointing.\n\n> **Note:** KPI and recruitment access depend partly on role **names** (e.g. Company Admin, HR Manager). Custom roles with the same permissions may not see all KPI features. See [Roles and permissions reference](../part-6-appendices/04-roles-and-permissions-reference.md).\n"},{"path":"part-5-troubleshooting/01-troubleshooting-guide.md","title":"Troubleshooting Guide and FAQ","md":"# Troubleshooting Guide and FAQ\n\nFind your problem by area. Each module manual also has its own troubleshooting table (section 10).\n\n## Contents\n- [Login and account](#login-and-account)\n- [Permissions and missing menus](#permissions-and-missing-menus)\n- [Configuration problems](#configuration-problems)\n- [Employees and onboarding](#employees-and-onboarding)\n- [Attendance and check-in](#attendance-and-check-in)\n- [Devices and synchronization](#devices-and-synchronization)\n- [Leave](#leave)\n- [Payroll and finance](#payroll-and-finance)\n- [Probation, movements and KPI](#probation-movements-and-kpi)\n- [Email, SMS and reports](#email-sms-and-reports)\n- [Field and mobile](#field-and-mobile)\n- [Frequently asked questions](#frequently-asked-questions)\n- [Getting support](#getting-support)\n\n---\n\n## Login and account\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Too many attempts\" | Rate limits: 10 logins/minute, 3 forgot-password requests/hour, 5 resets/10 min | Wait and try again |\n| Asked to change password at first login | You were given a temporary password | Set a new password |\n| Invitation link does not work | Invitation expired (72 hours by default) | Ask HR to resend the invitation |\n| No password-reset email | Company SMTP not set or failing | Admin checks **Mail / SMTP configuration** and **Mail Logs** |\n| Cannot enter the company | Company is suspended | Contact the platform administrator |\n| Lost 2FA device | — | Use a backup code, or ask an admin to reset 2FA |\n\n## Permissions and missing menus\n| Problem | Cause | Solution |\n|---|---|---|\n| A menu item is missing | Your roles lack the permission | Admin adds the permission/role in **Roles** |\n| HR pages are empty or hidden | Role data scope is *self* | Use a role with company/branch/department scope |\n| New role not taking effect | Permissions are loaded at login | Refresh the page or log out and in |\n| KPI menus missing even with permissions | KPI checks role names | Assign Company Admin / HR Manager / Department Manager etc. |\n| Cannot approve your own item | Maker-checker rule | Another authorised person must approve |\n| Cannot remove a user | They are the last active user | Add another admin first |\n\n## Configuration problems\n| Problem | Cause | Solution |\n|---|---|---|\n| Cannot create employees | **Employee numbering** not set | **Structure → Numbering** |\n| Cannot delete a department / position / grade / cost centre | It is in use | Reassign first, or deactivate |\n| Next employee number cannot be lowered | By design | Only increase it |\n| Bank entered wrongly | Banks cannot be edited or deleted | Add a correct entry and use it instead |\n| Leave policy shows no eligible types | No leave types created | Create **Leave Types** first |\n| Branch holiday is read-only in Leave | Branch holidays live in Attendance | Edit under **Attendance → Holidays** |\n\n## Employees and onboarding\n| Problem | Cause | Solution |\n|---|---|---|\n| Cannot activate a new employee | One of: missing TIN, pension or health enrolment, unverified bank, salary not approved by a second person, no signed contract covering hire date, open tasks/approvals | Readiness panel lists the blocker — complete it |\n| Exit status not available | Requires offboarding | Use Offboarding, or a user with force-exit permission |\n| Requests go straight to HR | Employee has no **Reports To** | Set Reports To on the profile |\n| Hiring request \"approver must be independent\" | Same person at two stages | Use a different approver |\n| Contract signing code expired | Codes are time-limited | Request a new code |\n\n## Attendance and check-in\n| Problem | Cause | Solution |\n|---|---|---|\n| \"No schedule found\" | Employee has no timetable/assignment/schedule | Assign one (Phase 10 of setup) |\n| \"Outside geofence\" | Location not inside the branch area | Move closer, or the punch goes to manager review |\n| Location blocked | Browser permission denied, or site not on HTTPS | Allow location; the site must use HTTPS |\n| Shift does not allow mobile | Shift setting | Use the device, or HR changes the shift |\n| \"App installation owned by another employee\" | Phone already bound to someone else | HR uses **Release device** |\n| Already checked in | Duplicate punch | No action needed |\n| Must acknowledge privacy notice | Active location privacy notice | Open **Employees → My employee workspace → Location privacy notice** and acknowledge |\n| Correction refused for old dates | Payroll period closed/locked | Ask payroll/HR; use a payroll correction instead |\n\n## Devices and synchronization\n| Problem | Cause | Solution |\n|---|---|---|\n| Device sync rejected | Device not ACTIVE, or Sync Mode PUSH | Set ACTIVE and Sync Mode **PULL** |\n| Connection test failed | Wrong IP/port/credentials or network | Check device network settings with IT |\n| Logs appear in **Unmatched Logs** | Device user not linked, or duplicate employee numbers | Link the device user to the employee |\n| Credential change not on device | Changes need a sync | Run **Sync** on the device |\n| Face / QR options greyed out | Not supported in this version | Use fingerprint, PIN or card (**Add card**) |\n| Fingerprint capture failed | Poor scan | Retry; clean finger and sensor |\n\n## Leave\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Attachment required\" | Leave exceeds document threshold | Attach the document |\n| \"Routing required\" / no approver | No workflow and no manager | Create a workflow or set Reports To |\n| Cannot approve own leave | Self-approval is blocked | Another approver acts |\n| Import rows rejected | Invalid rows in strict mode | Fix rows shown in the validation result and re-upload |\n| \"Balance changed since validation\" | Someone changed balances meanwhile | Re-validate the import |\n| QR on leave PDF shows revoked | Leave was cancelled/changed | Download the latest PDF |\n\n## Payroll and finance\n| Problem | Cause | Solution |\n|---|---|---|\n| Employee missing from run | Not eligible: no profile, on hold, no approved salary | Check **Eligibility**, profile and salary |\n| Duplicate payment line | Input entered twice | Remove the duplicate input; re-process |\n| No payslips visible | Run not locked yet | Lock the run |\n| Cannot reverse run | Payment already confirmed | Use a correction / recovery in next period |\n| Loan repayment shortfall | Net pay too low | Finance resolves the shortfall |\n| Form asks for an ID number | Several forms take numeric IDs | Copy the ID from the related list page |\n\n## Probation, movements and KPI\n| Problem | Cause | Solution |\n|---|---|---|\n| Cannot create second probation case | One open case per employee | Close the existing case |\n| Criteria weights error | Must total 100 | Adjust weights |\n| Self-assessment not available | Only after the due date | Wait until due |\n| Cannot confirm employee | Score below minimum | Extend or review |\n| Manager review fails with \"Manager rating for criterion X is required\" | Known limitation: the form does not send per-criterion ratings | Report to system support; use a policy without criteria meanwhile |\n| Movement approval refused | Creator cannot approve; headcount full; backdated over 30 days | Use another approver; adjust position headcount; correct date |\n| \"Employee data changed after submission\" | Profile changed after the movement was submitted | Re-submit the movement |\n| KPI review period cannot close | Unfinished evaluations | Finish or remove them |\n\n## Email, SMS and reports\n| Problem | Cause | Solution |\n|---|---|---|\n| \"No active, tested default SMTP configuration\" | Scheduled reports need one | Test SMTP and mark it **Default** |\n| Emails not arriving | Wrong port/security | 587 + STARTTLS or 465 + SSL/TLS; check **Mail Logs** |\n| SMS not sent | Gateway not set on server, company SMS off, or no registry entry | Fix all three |\n| Anonymous form results unavailable | Round still open or fewer than 5 responses | Wait until closed with ≥5 responses |\n\n## Field and mobile\n| Problem | Cause | Solution |\n|---|---|---|\n| \"GPS accuracy must be within 100 meters\" | Weak GPS | Move outside / wait for better signal |\n| Offline visit rejected | Synced more than 3 days later | Sync daily |\n| Web **Sync** button does nothing | Only the mobile app syncs offline work | Use the mobile app |\n\n---\n\n## Frequently asked questions\n\n**I can't see a menu my colleague sees.** Menus follow your roles. Ask your administrator.\n\n**Who approves my request?** Your **Reports To** manager first (or the workflow defined for that leave type), then HR.\n\n**Why didn't my leave balance change after approval?** Check **Leave Management → My leave → Balances** after refreshing; if a recalculation run is open, it updates after the run.\n\n**Can I use the system on my phone?** Yes — the web pages work on phones, and there is a mobile app for check-in and field visits. See [Mobile, desktop and offline](../part-1-getting-started/04-mobile-desktop-and-offline.md).\n\n**Is single sign-on available?** No.\n\n**Where do I download my payslip?** **Finance → My finance → Payroll**, after payroll is locked for the month.\n\n**How do I sign my contract?** **Employees → My employee workspace → My contracts** → open the contract → sign with the code from your authenticator app or email.\n\n## Getting support\n- The **Help** page lists shortcuts and support information. The built-in help chat is marked \"under development\".\n- Report errors to your system administrator with: the page name, what you clicked, the exact error message, and the time.\n"},{"path":"part-6-appendices/01-glossary.md","title":"Glossary","md":"# Glossary\n\n| Term | Meaning |\n|---|---|\n| **Accrual** | Leave days earned gradually over time |\n| **Acting employee** | Someone appointed to cover duties while another is on leave |\n| **Activation** | The HR step that makes a new hire an Active employee |\n| **Approval cover / delegation** | Temporarily passing your approvals to someone else |\n| **Attendance policy** | Company-wide rules for how attendance is counted; one active at a time |\n| **Auto-approval** | A leave request approved automatically when rules allow |\n| **Branch** | A physical location or office of the company |\n| **Calculation hash** | A fingerprint of a payroll run's figures; approvers approve that exact version |\n| **Carry-forward** | Unused leave moved to the next year |\n| **Checkpoint** | A way of recording attendance: device, GPS, Wi-Fi, QR or manual |\n| **Clearance** | Exit tasks (return assets, settle loans) before an employee leaves |\n| **Comp-off** | Leave earned for working on a rest day or holiday |\n| **Company** | One organization using the system (also called a tenant) |\n| **Component (pay)** | An earning or deduction line in payroll |\n| **Correction request** | An employee's request to fix an attendance record |\n| **Cost centre** | Accounting unit used to group payroll costs |\n| **Daily summary** | The processed attendance result for one employee on one day |\n| **Data scope** | How much data a role can see: company, branch, department, team or self |\n| **Department** | A unit within the company; may be company-wide or tied to a branch |\n| **Device** | A biometric terminal (Hikvision) for attendance/door access |\n| **Disbursement** | Paying out an approved loan or advance |\n| **Encashment** | Paying unused leave days as money |\n| **Escalation** | Moving an overdue approval to a higher approver |\n| **Exemption** | Marking an employee as not tracked for attendance |\n| **Field party** | A customer, prospect or other party a field visit is linked to |\n| **Geofence** | A map area within which mobile check-in is allowed |\n| **Grade** | Pay or seniority level |\n| **Holiday group** | A set of public holidays used by attendance |\n| **HR override** | HR acting in place of a manager on a leave approval |\n| **Input (payroll)** | A one-off amount for a period, e.g. overtime or a bonus |\n| **Invitation** | An email inviting an employee to create their user account |\n| **KPI** | Key Performance Indicator — a measurable goal |\n| **Lapse** | Leave days lost because they were not used in time |\n| **Lock (payroll)** | Freezing an approved run; payslips release after lock |\n| **Maker-checker** | The rule that the person who prepares something cannot approve it |\n| **Movement** | A transfer, promotion, or other change of an employee's job |\n| **Onboarding workflow** | The steps a new hire goes through before activation |\n| **Payroll period** | The pay month (or other cycle) a run belongs to |\n| **Position** | A job post in the structure, with reporting lines and headcount |\n| **Probation case** | The record tracking a new employee's probation |\n| **Punch** | A single check-in or check-out |\n| **Recalculation** | Rebuilding attendance or leave figures for a date range |\n| **Reports To** | The employee's line manager; drives approvals |\n| **Review period (evaluation cycle)** | The time window for performance evaluations |\n| **Role** | A named set of permissions assigned to user accounts |\n| **Rollover** | Year-end processing of leave balances |\n| **Sanction letter** | Loan approval letter the employee must accept |\n| **Scorecard** | A set of weighted KPIs for an employee |\n| **Shift / timetable** | Working hours (shift) and the weekly pattern of shifts (timetable) |\n| **Shortfall** | When a loan deduction cannot be fully taken from pay |\n| **Signatory** | The company person who signs contracts |\n| **SMTP** | The email server settings used to send emails |\n| **Statutory rule** | A legally required calculation (tax, pension, health, leave) |\n| **To do** | Your list of items waiting for your action |\n| **Unmatched log** | A device punch the system could not link to an employee |\n| **User account** | Login identity; linked to an employee record |\n| **2FA** | Two-factor authentication — a code in addition to your password |\n"},{"path":"part-6-appendices/02-configuration-checklists.md","title":"Configuration Checklists","md":"# Configuration Checklists\n\nTick each item in order. Full details: [Master Setup Guide](../part-2-setup/01-master-setup-guide.md). Each module manual also ends with its own checklist (section 12).\n\n## Contents\n- [System and company](#system-and-company)\n- [Organization](#organization)\n- [Attendance and devices](#attendance-and-devices)\n- [Leave](#leave)\n- [Payroll](#payroll)\n- [Hiring, onboarding and contracts](#hiring-onboarding-and-contracts)\n- [Per employee](#per-employee)\n- [Optional modules](#optional-modules)\n- [Go-live](#go-live)\n\n## System and company\n- [ ] Installation complete; platform admin can log in\n- [ ] SMS provider endpoint approved and gateway account saved in **Platform SMS → Global** (if SMS is used)\n- [ ] Company created with correct name, slug, timezone\n- [ ] First admin logged in, changed password, enabled 2FA\n- [ ] Bank directory entries reviewed in **Bank directory**\n- [ ] SMTP added, tested and set as **Default**\n- [ ] SMS enabled and registry entries created (optional)\n- [ ] Roles reviewed, data scopes checked, users assigned\n\n## Organization\n- [ ] Branches created\n- [ ] Departments created (parents first)\n- [ ] Positions with reporting lines and headcount\n- [ ] Grades (optional)\n- [ ] Cost centres (optional)\n- [ ] **Employee numbering** configured\n\n## Attendance and devices\n- [ ] Attendance policy created and activated\n- [ ] Holiday group and holidays (including branch holidays)\n- [ ] Geofences / Wi-Fi networks per branch\n- [ ] Devices registered, connection tested, Sync Mode PULL, synced\n- [ ] Checkpoints on the active policy\n- [ ] Shifts and breaks\n- [ ] Timetables with days, shift options, holiday rules\n- [ ] Location privacy notice published (if required)\n\n## Leave\n- [ ] Company holidays\n- [ ] Leave types\n- [ ] Leave policies approved\n- [ ] Workflows and fallback department and reporting managers reviewed\n- [ ] Statutory / comp-off rules (optional)\n- [ ] Leave payroll components and tax treatment\n- [ ] Legal/Finance sign-off on encashment and sick pay\n\n## Payroll\n- [ ] Default payroll calendar\n- [ ] Pay components\n- [ ] Statutory schemes and approved rule versions\n- [ ] Salary structures\n- [ ] Accounting mappings\n- [ ] Run approval workflow\n- [ ] Overtime / bonus / leave rules (optional)\n- [ ] Attendance deduction policy (optional)\n\n## Hiring, onboarding and contracts\n- [ ] Contract company details, templates, signatories\n- [ ] Onboarding workflow set as default\n- [ ] Exit workflow and notice policies\n\n## Per employee\n- [ ] Reports To, position, department, branch\n- [ ] TIN, pension and health enrolment\n- [ ] Verified bank account\n- [ ] Payroll profile and second-person-approved salary\n- [ ] Signed contract covering hire date\n- [ ] Schedule assigned (or exemption)\n- [ ] Device enrolment\n- [ ] Leave balances generated / imported\n- [ ] User account linked with correct roles\n- [ ] Activated\n\n## Optional modules\n- [ ] Probation policy (weights total 100)\n- [ ] Movement approvers and salary structures\n- [ ] KPI: period → KPIs → assignments → scoring → scorecards → review criteria → review period\n- [ ] Loan products, sanction letter, delegations\n- [ ] Field parties and commercial policy\n- [ ] Forms & feedback permission\n- [ ] Scheduled report schedules\n\n## Go-live\n- [ ] All tests in [Phase 12](../part-2-setup/01-master-setup-guide.md#phase-12--go-live-verification) passed\n- [ ] **Insights → Readiness** shows no blockers\n- [ ] Demo/test payment buttons hidden or disabled in production\n"},{"path":"part-6-appendices/03-dependency-matrix-and-workflows.md","title":"Module Dependency Matrix and Workflow Diagrams","md":"# Module Dependency Matrix and Workflow Diagrams\n\n## Contents\n- [Dependency matrix](#dependency-matrix)\n- [Information flow between modules](#information-flow-between-modules)\n- [Employee lifecycle](#employee-lifecycle)\n- [Leave approval](#leave-approval)\n- [Attendance correction](#attendance-correction)\n- [Payroll run](#payroll-run)\n- [Loan lifecycle](#loan-lifecycle)\n- [Contract signing](#contract-signing)\n- [KPI cycle](#kpi-cycle)\n\n## Dependency matrix\n\n✔ = required first · ○ = optional / used if present\n\n| Module ↓ needs → | Company | Roles | SMTP | Structure | Numbering | Employees | Attendance | Leave | Payroll | Contracts |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Roles & users | ✔ | | | | | | | | | |\n| Email / SMS | ✔ | | | | | | | | | |\n| Org structure | ✔ | ✔ | | | | | | | | |\n| Employees | ✔ | ✔ | ✔ invites | ✔ | ✔ | | | | | |\n| Recruitment & onboarding | ✔ | ✔ | ✔ | ✔ positions | ✔ | | ○ | ○ | ✔ activation | ✔ activation |\n| Contracts | ✔ | ✔ | ✔ codes | | | ✔ | | | | |\n| Attendance | ✔ | ✔ | | ✔ branches | | ✔ | | | | |\n| Access control | ✔ | ✔ | | ✔ | | ✔ | ○ | | | |\n| Leave | ✔ | ✔ | ○ | ✔ | | ✔ | ✔ holidays | | ○ encashment | |\n| Payroll | ✔ | ✔ | | ✔ cost centres | | ✔ | ○ OT/deductions | ○ encashment | | |\n| Staff finance | ✔ | ✔ | | | | ✔ | | | ✔ | |\n| Probation | ✔ | ✔ | | | | ✔ | | | | |\n| Movements | ✔ | ✔ | | ✔ | | ✔ | | | ○ salary | |\n| KPI | ✔ | ✔ role names | | ✔ | | ✔ | | | | |\n| Field | ✔ | ✔ | | | | ✔ | | | | |\n| Offboarding | ✔ | ✔ | | | | ✔ | ○ | ✔ encashment | ✔ settlement | ✔ ends contract |\n| Scheduled reports | ✔ | ✔ | ✔ tested default | | | | | | | |\n\n## Information flow between modules\n\n```mermaid\nflowchart LR\n  ORG[Org structure] --> EMP[Employees]\n  REC[Recruitment] --> ONB[Onboarding] --> EMP\n  CON[Contracts] --> ONB\n  PAYSET[Payroll setup] --> ONB\n  EMP --> ATT[Attendance]\n  EMP --> LV[Leave]\n  ATT -- daily summaries, OT, deductions --> PAY[Payroll]\n  LV -- encashment, unpaid leave --> PAY\n  ATT -- leave deductions --> LV\n  FIN[Staff finance] -- repayments --> PAY\n  MOV[Movements] -- position, salary --> EMP\n  PAY -- closed period locks --> ATT\n  OFF[Offboarding] --> LV\n  OFF --> PAY\n  OFF --> CON\n  EMP --> PRB[Probation]\n  EMP --> KPI[KPI]\n```\n\n## Employee lifecycle\n```mermaid\nflowchart LR\n  A[Hiring request: manager → HR → Finance] --> B[Posting / applicants / interview / offer]\n  B --> C[Invitation] --> D[Onboarding tasks & documents]\n  D --> E[Contract signed] --> F[HR activation] --> G[Active + probation case]\n  G --> H[Movements / promotions]\n  G --> I[Resignation / exit request] --> J[Clearance & settlement] --> K[Finalize: final status, contract ended]\n```\n\n## Leave approval\n```mermaid\nflowchart LR\n  A[Employee submits] --> B{Workflow for leave type?}\n  B -- yes --> C[Workflow steps by role/position/person]\n  B -- no --> D[Department manager → reporting manager]\n  C --> E[HR step if configured]\n  D --> E\n  E --> F[Approved: balance reduced, PDF with QR]\n  C -. reject / return .-> A\n```\n\n## Attendance correction\n```mermaid\nflowchart LR\n  A[Employee: draft → submit] --> B[Manager review] --> C[HR final approval] --> D[Daily summary updated + recalculation]\n  B -. return .-> A\n```\n\n## Payroll run\n```mermaid\nflowchart LR\n  A[Draft] --> B[Processed] --> C[HR approved] --> D[Finance approved] --> E[Management approved] --> F[Locked] --> G[Payment file] --> H[Paid] --> I[Closed]\n  B -. cancel .-> X[Cancelled]\n  F -. reverse if not paid .-> R[Reversed]\n```\n\n## Loan lifecycle\n```mermaid\nflowchart LR\n  A[Application] --> B[Guarantors] --> C[Manager review] --> D[HR] --> E[Finance] --> F[Management] --> G[Sanction letter accepted] --> H[Disbursed] --> I[Repaid via payroll] --> J[Settled]\n  I -. shortfall / deferment / reschedule / write-off .-> I\n```\n\n## Contract signing\n```mermaid\nflowchart LR\n  A[Draft from template] --> B[Company signatory signs] --> C[Sent to employee] --> D[Employee signs with code] --> E[Signed + certificate page] --> F[Expiry alerts 60/30/7/0 days] --> G[Renew / amend / end]\n```\n\n## KPI cycle\n```mermaid\nflowchart LR\n  A[Reporting period] --> B[KPIs published] --> C[Assignments + targets] --> D[Scorecards] --> E[Review period opened + enrolment] --> F[Self-assessment] --> G[Manager assessment] --> H[HR review] --> I[Finalize] --> J[Employee acknowledges / disputes]\n```\n"},{"path":"part-6-appendices/04-roles-and-permissions-reference.md","title":"Roles and Permissions Reference","md":"# Roles and Permissions Reference\n\nFor administrators assigning access in **Roles**. Permission codes are what you tick when editing a role. Each module manual has a detailed \"Who can use it\" table (section 3).\n\n## Contents\n- [Default roles](#default-roles)\n- [Data scope](#data-scope)\n- [Permissions by module](#permissions-by-module)\n- [Role-name-based access](#role-name-based-access)\n\n## Default roles\n\nSee the [complete per-role grant tables](08-default-role-grants.md) for the seeded platform and company roles.\n\n**Platform roles** (hosting organization): Super Admin, Platform Administrator, Platform Support, Platform Auditor.\n\n**Company roles** (created automatically for every new company):\n\n| Role | Purpose |\n|---|---|\n| Company Admin | Full company administration (given to the first admin) |\n| HR Manager | All HR functions incl. final approvals |\n| HR Officer | Day-to-day HR data maintenance |\n| Department Manager | First-stage approvals and team views for a department |\n| Branch Manager | Same, for a branch |\n| Employee | Self-service only (scope: self) |\n| Finance | Payroll and staff finance |\n| Management | Read-only dashboards; optional management approval steps |\n| IT Admin | Devices, access control, technical settings |\n| Attendance Admin | Attendance setup and operations |\n| Leave Admin | Leave setup and balances |\n| Auditor | Read-only |\n\n## Data scope\n`data_scope:company` · `data_scope:branch` · `data_scope:department` · `data_scope:team` · `data_scope:self` — controls how many records a role sees.\n\n## Permissions by module\n\n| Module | Permission codes (plain meaning) |\n|---|---|\n| Companies | `companies:create/read/update/delete` (platform only); `company_dashboard:read`, `company_data:read`, `company_data:update` |\n| Users & roles | `company_users:*` (company membership); `users:read/create/update/delete/assign-role/revoke-role/manage-2fa/enable-2fa/disable-2fa`; `roles:*`, `roles:assign-permission/revoke-permission`; `permissions:read` (changes platform only); `security_events:read`; `identity_audit:read/rollback` |\n| Notifications | `notifications:read/update/delete/send/create/test`, `notifications:settings-read/update`, `notifications:mail-logs-read/retry`, `notifications:delivery-logs-read`, `notification_preferences:manage-own` |\n| SMS / SMTP | `sms:settings-read/update`, `sms:logs-read/retry`, `sms:test`; `scheduled_reports:manage_smtp/test_smtp` |\n| Structure | `branches:*`, `departments:*` (+ `manage-access`), `positions:*` (+ `assign-department`), `cost_centers:*`, `employee_grades:*`, `employee_numbering:read/update` |\n| Employees | Employee records use `employees:read`, `employees:create`, `employees:update`, `employees:delete`, `employees:change-status` and `employees:force-exit-status`. Profile changes use `profile_change_request:view_all`, `profile_change_request:review`, `profile_change_request:approve`, `profile_change_request:reject`, `profile_change_request:request_correction`, `profile_change_request:view_audit` and `profile_change_request:view_pending_files`. |\n| Self-service | `self_service_requests:manager_review` (manager stage), `:final_approve` (HR), `:approve`; `manager_self_service:read`, `manager_team:read`, `team_attendance:read` |\n| Onboarding | `onboarding_requests:read/create/update/approve/complete/cancel` (`complete` = activate), `onboarding_workflows:*`, `onboarding_tasks:*`, `onboarding_documents:*` + `verify` |\n| Contracts | `employment_contracts:read/manage/self`, `contract_signatories:manage` |\n| Offboarding | `offboarding_requests:read/create/submit/update/cancel/complete/finalize`, `offboarding_workflows:*`, `offboarding_tasks:*`, `offboarding_clearances:*`, `offboarding_documents:*`, `offboarding_letters:read`, `offboarding_access:read/retry/emergency-terminate` |\n| Attendance | `attendance_policies`, `holiday_groups`, `holidays`, `geofences`, `wifi_networks`, `checkpoints`, `devices`, `shifts`, `shift_breaks`, `shift_assignments`, `shift_schedules`, `shift_rotation_groups/rules`, `timetables`, `timetable_days`, `timetable_holiday_rules`, `timetable_rotations`, `employee_timetables` (each `:*`); `attendance_summaries:read`, `attendance_processing:read/update`, `attendance_recalculation:execute`, `attendance_mobile_punches:read/update`, `attendance_device_sync_logs:read` |\n| Access control | `access_doors`, `access_schedule_templates`, `access_week_plans`, `access_organizations`, `access_groups` (each `:*`); `employee_device_assignments:*`, `employee_access_credentials:read/update`, `access_control_sync:execute` |\n| Leave | `leave_types:*`, `leave_policies:*` + `approve`, `leave_workflows:*`, `leave_requests:create/read/update/approve/cancel/override`, `leave_balances:list/manage/adjust/generate/carry-forward/export/bulk-import/import-history`, `leave_reports:read`, `leave_rollover:read/manage/approve`, `leave_statutory:read/manage/approve`, `leave_operations:read/e le after a built-in role confers no additional rights.\n"},{"path":"part-6-appendices/05-known-limitations.md","title":"Not Verified and Known Limitations","md":"# Not Verified and Known Limitations\n\nThe module chapters identify which workflows have been checked with the application, PostgreSQL, browser tests or physical equipment. Section 13 of each chapter records the remaining conditions for that module.\n\n## Contents\n- [Functional gaps (system behaviour)](#functional-gaps-system-behaviour)\n- [Screens or labels not verified](#screens-or-labels-not-verified)\n- [Items needing business sign-off](#items-needing-business-sign-off)\n\n## Functional gaps (system behaviour)\n\n| Area | Gap | Effect on users |\n|---|---|---|\n| Login | Live SSO verification requires a registered application at the installation’s identity provider. | Use the sign-in and recovery procedures in Section 2.16. |\n| Self-service | Manager recommendations (promotion/transfer/disciplinary proposals) have no screen; `/dashboard/me/insights` redirects to the dashboard | Not available to users |\n| Attendance devices | Face and QR enrollment require a supported reader integration. Attendance ingestion uses PULL. | Verify credential enrollment and punches on the intended model and firmware. |\n| Access control | Automatic schedule, group-rights and standard card operations have simulated-reader coverage. Physical acceptance and additional credential types require a compatible reader. | Review operations under Groups and qualify the intended device and firmware before enabling automatic changes. |\n| KPI | Some operations retain compatibility with seeded system roles. Custom roles use explicit KPI permissions. | Select the required KPI actions and data scope for custom roles. |\n| Payroll | Demo payment buttons (e.g. **Simulate payment**) visible; many forms need numeric IDs | Hide demo buttons in production |\n| Field | Web **Sync** on My visits sends an empty sync | Use mobile app |\n| Help | Help chat \"under development\"; escalation recipients fixed | Contact admin |\n\n## Screens or labels not verified\n- Some button labels in dialogs across modules (marked \"(label not verified)\" in the manuals).\n- Leave: policy submit/approve, workflow save, employee encashment request, acting-employee routing toggle; PDF layout; holiday import country list; cancellation-approval screen.\n- Attendance: relation between Attendance Holidays and Leave Holidays; permissions for Team attendance.\n- Employees: Profile Updates reject/return labels; row actions; document upload flow; identity audit page.\n- Recruitment/contracts/offboarding: new request/applicant buttons; how hiring managers reach Recruitment; contract type labels; settlement → payroll flow; exit letter screen.\n- Payroll/finance: bank file formats; Security & approvals tab; leave encashment input screen; loan default approval stages; delegation form fields; product eligibility fields; live bank/ERP connectors.\n- Movements: whether applied movements write to Status History; how payroll picks up new salary records.\n- KPI: review-period form labels; evidence rules screen.\n- Field/reports: sidebar alias permissions; selfie/device binding UI; reports marked \"not implemented\" in the catalogue.\n- Mobile app distribution and server address.\n\n## Items needing business sign-off\n- Leave encashment, sick-pay tiers and statutory leave rules — **Legal and Finance**.\n- Payroll statutory rule versions (tax, pension, health) — **Finance**.\n"},{"path":"part-6-appendices/08-default-role-grants.md","title":"Default role grants","md":"# Default role grants\n\nThese tables show the grants given to a newly provisioned role. In HRMS, open Roles, choose a role and open Permissions to inspect the grants stored for your installation. Direct permissions and active company membership also affect an individual user’s access.\n\n## Platform roles\n\n### Platform Super Admin\n\nFull access to platform administration, tenant  | `timetable_holiday_rules:read` |\n| timetable_rotation_rules | `timetable_rotation_rules:read` |\n| timetable_rotations | `timetable_rotations:read` |\n| timetable_shift_rules | `timetable_shift_rules:read` |\n| timetables | `timetables:read` |\n| users | `users:read` |\n"},{"path":"administrator-guide.md","title":"Administrator Guide","md":"# Administrator Guide\n\nFor Company Administrators, IT Administrators and HR system owners who configure and maintain the HRMS.\n\n## Contents\n1. [Your responsibilities](#1-your-responsibilities)\n2. [First-time setup](#2-first-time-setup)\n3. [Managing user accounts](#3-managing-user-accounts)\n4. [Managing roles and permissions](#4-managing-roles-and-permissions)\n5. [Email, SMS and notifications](#5-email-sms-and-notifications)\n6. [Devices and integrations](#6-devices-and-integrations)\n7. [Security](#7-security)\n8. [Monitoring and audit](#8-monitoring-and-audit)\n9. [Routine administration](#9-routine-administration)\n10. [Changing configuration safely](#10-changing-configuration-safely)\n11. [Before go-live](#11-before-go-live)\n\n## 1. Your responsibilities\n- Configure the company in the right order ([Master Setup Guide](part-2-setup/01-master-setup-guide.md)).\n- Give each person the least access they need.\n- Keep email, SMS and devices working.\n- Watch logs, readiness and audit trails.\n- Handle account problems (locked out, 2FA lost, wrong roles).\n\n## 2. First-time setup\nFollow the [Master Setup Guide](part-2-setup/01-master-setup-guide.md) phase by phase and tick the [configuration checklists](part-6-appendices/02-configuration-checklists.md). Critical points:\n- **Employee numbering** before any employee.\n- **Tested default SMTP** before inviting employees or scheduling reports.\n- **Payroll and contract setup** before activating employees.\n- **Attendance policy, timetables and geofences** before staff check in.\n\n## 3. Managing user accounts\n**Manual:** [Roles, permissions and users](part-3-modules/02-roles-permissions-users.md)\n- Prefer **inviting** employees from their employee record so the user account is linked automatically.\n- Linking keeps name, email and phone in sync between user and employee; mistakes can be rolled back in **Insights → Identity audit**.\n- To remove access, deactivate the user or remove them from the company. The last active user cannot be removed.\n- The Users page has no sidebar entry; open it from the address `/dashboard/users`.\n\n## 4. Managing roles and permissions\n**Reference:** [Roles and permissions reference](part-6-appendices/04-roles-and-permissions-reference.md)\n- Start from the 12 default roles; adjust permissions and **data scope**.\n- Keep default role names for KPI and recruitment users (these features check role names).\n- Separate makers and checkers: payroll, statutory rules, salaries, leave policies, hiring requests and movements require a second person to approve.\n- After changing a role, ask users to refresh or log in again.\n\n## 5. Email, SMS and notifications\n**Manual:** [Email, SMS and notifications](part-3-modules/03-email-sms-notifications.md)\n- SMTP: add, **Test**, mark **Default**. Use **Mail Logs** to check and retry failures.\n- SMS: requires the server gateway (IT), company SMS switch, and a registry entry for each message.\n- Notification rules and templates control what is sent through in-app, email and SMS channels.\n\n## 6. Devices and integrations\n**Manuals:** [Access control and devices](part-3-modules/09-access-control-and-devices.md), [Attendance](part-3-modules/08-attendance.md)\n- Register each Hikvision device, **Test connection**, use Sync Mode **PULL**, then **Sync**.\n- Enrol employees (fingerprint, PIN, card via **Add card**). Run a sync after credential changes.\n- Check **Device Sync Logs**, **Command Logs** and **Unmatched Logs** daily.\n- Bank/ERP integrations and loan migration: [Staff finance](part-3-modules/12-staff-finance-loans.md) and [Payroll](part-3-modules/11-payroll.md).\n\n## 7. Security\n- Require admins, HR, payroll, IT and auditors to enable 2FA (it is not forced by policy; set **Require 2FA** per user).\n- Login limits protect against guessing: 10 attempts/minute.\n- Review **security events** and active sessions for suspicious activity.\n- Publish a **location privacy notice** if you collect GPS for attendance/field work.\n- Hide or disable demo payment buttons in production.\n\n## 8. Monitoring and audit\n**Manual:** [Reports, insights and monitoring](part-3-modules/20-reports-insights-and-monitoring.md)\n- **Insights → Readiness**: go-live and health checklist.\n- **Insights → Identity audit**: history and rollback of name/email/phone changes.\n- Access-control **Audit Logs**, mail/SMS logs, scheduled report executions.\n\n## 9. Routine administration\n| Frequency | Task |\n|---|---|\n| Daily | Device and sync logs; mail failures; locked accounts |\n| Weekly | Review role assignments for joiners/leavers; unmatched logs |\n| Monthly | Confirm payroll period closed; review readiness; audit roles of leavers |\n| Yearly | New holidays; new leave year balances and rollover; review statutory rule versions |\n\n## 10. Changing configuration safely\nSee [Change-later reference](part-2-setup/01-master-setup-guide.md#change-later-reference). In short:\n- Versioned items (leave policies, statutory rules) — create a new version and get it approved.\n- Shifts/timetables — changes affect future days; run a recalculation for past days.\n- Never lower the employee number counter; avoid changing the company slug.\n- Items in use cannot be deleted — deactivate or reassign.\n\n## 11. Before go-live\n- Complete [Phase 12](part-2-setup/01-master-setup-guide.md#phase-12--go-live-verification) tests.\n- Review [known limitations](part-6-appendices/05-known-limitations.md) with your team — especially probation manager review and movement acknowledgements.\n- Get Legal/Finance sign-off on leave and payroll statutory rules.\n- Capture screenshots for the 📷 markers in this manual.\n"}],"nav":[{"title":"Start here","items":["README.md","quick-start-guide.md"]},{"title":"Part 1 — Getting started","items":["part-1-getting-started/01-introduction.md","part-1-getting-started/02-login-and-navigation.md","part-1-getting-started/03-roles-and-permissions-overview.md","part-1-getting-started/04-mobile-desktop-and-offline.md"]},{"title":"Part 2 — System setup","items":["part-2-setup/01-master-setup-guide.md"]},{"title":"Part 3 — Module manuals","items":["part-3-modules/01-companies.md","part-3-modules/02-roles-permissions-users.md","part-3-modules/03-email-sms-notifications.md","part-3-modules/04-organization-structure.md","part-3-modules/05-employees.md","part-3-modules/06-recruitment-and-onboarding.md","part-3-modules/07-employment-contracts.md","part-3-modules/08-attendance.md","part-3-modules/09-access-control-and-devices.md","part-3-modules/10-leave-management.md","part-3-modules/11-payroll.md","part-3-modules/12-staff-finance-loans.md","part-3-modules/13-probation.md","part-3-modules/14-movements-and-promotion.md","part-3-modules/15-kpi-and-performance.md","part-3-modules/16-field-operations.md","part-3-modules/17-self-service-and-approvals.md","part-3-modules/18-offboarding.md","part-3-modules/19-forms-and-feedback.md","part-3-modules/20-reports-insights-and-monitoring.md"]},{"title":"Part 4 — Daily operations","items":["part-4-daily-operations/01-daily-operations-guide.md","part-4-daily-operations/02-role-based-guides.md"]},{"title":"Part 5 — Troubleshooting","items":["part-5-troubleshooting/01-troubleshooting-guide.md"]},{"title":"Part 6 — Appendices","items":["part-6-appendices/01-glossary.md","part-6-appendices/02-configuration-checklists.md","part-6-appendices/03-dependency-matrix-and-workflows.md","part-6-appendices/04-roles-and-permissions-reference.md","part-6-appendices/05-known-limitations.md","part-6-appendices/08-default-role-grants.md"]},{"title":"Administration","items":["administrator-guide.md"
