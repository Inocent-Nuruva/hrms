** (title **Onboarding Requests**).\n2. Select employee, workflow, planned start/completion dates.\n3. Choose **Save as draft** or **Submit immediately**.\n**Expected result:** Status Draft, or Submitted / In progress. Tasks are created from the workflow steps.\n**Important notes:** Requests made from an invitation are created automatically. Use **Change Workflow** to switch workflow, **Reopen as draft** to undo a submission.\n\n> 📷 Screenshot: Employees → Onboarding → Requests – the employee onboarding workspace with tabs Overview, Employee details, Tasks & documents, Contract, Payroll\n\n### Feature: Work tasks and documents\n**Steps:**\n1. Open the request. Go to **Tasks & documents**.\n2. For each task click **Complete task** (some task types require an evidence document).\n3. Upload documents with **Upload document**: choose the type (Identity document, Academic certificate, Professional certificate, Bank document, Medical document, Offer letter, Joining form, CV / résumé, Other).\n4. HR clicks **Verify** on each document (or **Mark unverified**).\n5. Use **Change approver** / reassign to move a task to another person.\n\n### Feature: Employee completes \"My onboarding\"\n**Steps (employee):**\n1. Open **Employees → My employee workspace → Onboarding**. The page shows **Your joining checklist**, **Progress** and **Tasks done**.\n2. Under **Your actions**, complete tasks and upload documents.\n3. In **Details**, update your details and click **Send updates to HR**. If HR returns them you see \"HR returned some details for correction\".\n4. Click **Review contract PDF** to read your contract; sign it in **Employees → My employee workspace → My contracts**.\n5. Click **Acknowledge** to acknowledge onboarding.\n**Expected result:** \"Onboarding acknowledged.\" HR sees progress.\n\n### Feature: Activate the employee (final HR step)\n**Purpose:** Make the employee Active.\n**Before you start:** All activation requirements are met (see below).\n**Steps:**\n1. Open **Employees → Onboarding**. The **Readiness overview** tab lists open requests, their **Next required action** and status (**Needs attention**, **Overdue**, **On track**, **Ready for HR activation**).\n2. Open the request. The readiness panel lists each requirement, who is responsible, and a link (**Open payroll setup**, **Open contracts**, **Open salary approvals**, **Open tasks**…).\n3. When all are complete, choose roles, branch access, shift or timetable, devices to enroll and leave policy (provisioning).\n4. Click **Activate employee**, then **Confirm activation**.\n**Expected result:** The request becomes Completed. The employee's status becomes **Active**, hire date is set if missing, leave balances are created, and a probation case is opened. Roles, branch access, shift/timetable, devices and account invitation are applied.\n\n**Activation requirements (all must be true):**\n- Onboarding submitted and started.\n- Every required task completed; no pending or rejected approvals.\n- Position and reporting manager set.\n- Payroll profile with TIN, pension enrollment and health enrollment.\n- A verified bank account.\n- A starting salary approved by a different person than the one who entered it.\n- A signed employment contract (with signature and document) whose period covers the hire date.\n\n**Important notes:** If activation fails (status Activation failed), fix the cause and try again. Device enrollment can be retried from the request. Activation can also be done from the employee status change dialog (see Employees module).\n\n## 6. Important fields and options\n\n| Field | Meaning |\n|---|---|\n| Vacancies | Number of people to hire; limited by position headcount |\n| Monthly budget (TZS) | Maximum monthly salary the offer may use |\n| Posting closes | Last day applicants can be added |\n| Score / 100 | Interview panel score |\n| Check | Reference, Certificate or NIDA verification |\n| Step type | Task, Sign Off, Document, Acknowledgement, System action |\n| Task type | General, HR, IT, Department, Manager, Document, Asset, Induction, Acknowledgement, System |\n| Assign step to | Person or department, Role, or Position |\n| Default workflow | Used when no workflow is chosen |\n\n**Onboarding request statuses**\n\n| Status | Meaning |\n|---|---|\n| Draft | Created, not started |\n| Submitted / In review / In progress | Being worked |\n| Ready for activation | Requirements met (label not verified) |\n| Activating | Activation running |\n| Activation failed | Activation stopped; fix and retry |\n| Completed | Employee activated |\n| Rejected / Cancelled | Closed without activation |\n\n## 7. Daily usage procedures\n\n- **HR**: open **Readiness overview** each morning; filter **Overdue only**; use **Scan** (Onboarding readiness scan) and **Export results**.\n- **Task owners**: complete assigned tasks from **To do → Employee Requests** (old links to onboarding tasks redirect there).\n- **Employees**: check **Employees → My employee workspace → Onboarding** for **Your actions**.\n- **Recruiters**: refresh the **Pipeline**, move candidates forward.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  A[Hiring request] --> B[Manager approves] --> C[HR approves] --> D[Finance approves] --> E[Posted]\n  E --> F[Applicants] --> G[Shortlist] --> H[Interview + score + checks] --> I[Offer draft]\n  I --> J[Finance approves offer] --> K[Offer sent] --> L[Offer accepted] --> M[Create invitation]\n  M --> N[Onboarding request] --> O[Tasks, documents, approvals] --> P{All requirements met?}\n  P -- No --> O\n  P -- Yes --> Q[HR: Activate employee] --> R[Employee Active]\n```\n\nOnboarding approvals (Sign Off steps) can be **Approve**d, **Reject**ed or delegated. A rejected approval blocks activation.\n\n## 9. Links to other modules\n\n- [07. Employment Contracts](07-employment-contracts.md) – signed contract required for activation.\n- Payroll – payroll profile, statutory enrollment, bank verification, salary approval.\n- Leave – balances created on activation.\n- Attendance and Devices – shift/timetable and device enrollment at activation.\n- Probation – a probation case is opened on activation.\n- Employees – invitations and registration.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"HR recruitment access required\" | User lacks HR access | Give `employees:create` or an HR role |\n| \"Vacancies exceed position headcount\" | Too many vacancies | Lower vacancies or raise position headcount |\n| \"HR approval must be independent\" / \"Finance approval must be independent\" | Same person approving twice | Another user must approve |\n| \"Finance approval required\" | Approver lacks `payroll:config` | Ask Finance |\n| \"Valid Tanzanian phone number required\" | Bad phone format | Correct the number |\n| \"Offer salary exceeds approved budget\" | Salary above budget | Lower salary or raise a new request |\n| \"Position assignment is incomplete\" | Position missing branch/department | Fix the position |\n| \"Position headcount is full\" | No free headcount | Increase headcount |\n| \"Configured workflow has no steps\" | Empty workflow | Add steps |\n| \"Employee is not ready for activation: …\" | Missing items listed | Complete each listed item |\n| \"No completed signed employment contract found\" | Contract not signed | Finish signing in Contracts |\n| \"Contract … covers … but the hire date is …\" | Contract dates don't include hire date | Correct the contract or hire date |\n| \"Required tasks and approvals must be completed before finalizing\" | Open tasks/approvals | Complete them |\n\n## 11. Best practices\n\n- Keep one clear default onboarding workflow per company; clone it for special cases.\n- Start the contract early; signing often takes longest.\n- Verify the bank account and approve salary (by a second person) before the start date.\n- Use **Overdue only** filters daily.\n\n## 12. Setup checklist\n\n- [ ] Positions have branch, department and headcount\n- [ ] Onboarding workflow created with steps and set as default\n- [ ] Acknowledgement document configured\n- [ ] Contract templates and signatories set (module 07)\n- [ ] Pension and health schemes configured in Payroll\n- [ ] Finance users have `payroll:config`\n- [ ] HR users have onboarding permissions, including `onboarding_requests:complete`\n\n## 13. Not verified / limitations\n\n> **Limitation:** There is no public job board; applicants are entered by HR. Candidates only use a public page to accept an offer.\n\n> **Limitation:** Recruitment access is based on `employees:create` or HR role names, not dedicated recruitment permissions.\n\n- The exact button that opens **New recruitment request** and **New applicant** was not verified.\n- How a hiring manager without HR access reaches the Recruitment page was not verified.\n- Unsuccessful candidate data is kept for a limited time (default 180 days) before purging; exact behaviour not verified in the UI.\n- Old links under /onboarding/… redirect to the new pages.\n"},{"path":"part-3-modules/07-employment-contracts.md","title":"07. Employment Contracts","md":"# 07. Employment Contracts\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThe Contracts module creates employment contracts from company templates, sends them for signature, and stores the signed PDF with a signature certificate page.\n\n- HR works in **Employees → Contracts**, which has four tabs: **Contracts**, **Templates**, **Signatories & signing**, **Company details**.\n- Employees open **Employees → My employee workspace → My contracts** to view, download and sign. A company signatory also sees **Contracts to sign for the company** there.\n- The order of signing is: the **company signs first**, then the **employee**.\n\n> 📷 Screenshot: Employees → Contracts – tabs and the contract list\n\n## 2. Prerequisites and dependencies\n\n- The employee record exists with position, department and manager (values are pulled into the contract).\n- Salary details come from the employee's compensation (Payroll).\n- Signatories must be active employees with user accounts.\n- Contracts are required to activate a new employee: see [06. Recruitment and Onboarding](06-recruitment-and-onboarding.md).\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View contracts list | `employment_contracts:read` | HR officer |\n| Create, edit, send, cancel, renew, verify uploads, edit templates/company details | `employment_contracts:manage` | HR manager / HR admin |\n| Manage signatories and signing rules | `contract_signatories:manage` | HR admin |\n| Sign for the company | Be the assigned company signatory | Director / HR manager |\n| View and sign own contracts | `employment_contracts:self` (normally all employees) | Employee |\n\nUsers with read only see the list without **New contract** or edit actions.\n\n## 4. Initial setup and configuration\n\n1. **Mandatory – Company details** (company; changeable): **Contracts → Company details**: **Registered (legal) name**, **Registration number**, **TIN**, **Address**, **Phone**, **Email**, **Tagline**, **Logo** (PNG or JPEG). Printed in the header of every contract.\n2. **Mandatory – Templates** (company, one per contract type): **Contracts → Templates**. Edit clauses, insert fields into clauses, reorder (**Move up**/**Move down**), add **New clause**. Some wording is **Required in every contract** or **Wording fixed by the template**. Use **Reset to template** to undo.\n3. **Mandatory – Signatories** (company): **Signatories & signing → Authorized company signatories**: add an active employee. Set the **Default signatory** and a **Backup signatory**.\n4. **Optional – Who signs which contract**: rules by **Positions** or **Grades** that pick a **Rule signatory**.\n5. **Optional – Signing methods and contract defaults**: **Governing law**, **Notice period wording**, **Annual leave days**.\n\nSignatories can be **Revoke**d and **Reactivate**d.\n\n## 5. Features – step by step\n\n### Feature: Create a contract\n**Before you start:** Templates, company details and a signatory exist.\n**Steps:**\n1. **Employees → Contracts → New contract** (also available from onboarding and the employee profile).\n2. Choose **Employee**, **Contract type**, **Start date** and, for fixed-term, **End date**. Choose **Start from** (**The company template** or an earlier contract).\n3. Review the sections **Parties**, **Terms**, **Clauses**, **Review**. Values come from HR records; **Values that differ from HR records** are flagged. To change one, use **Override for this contract** and give a reason.\n4. Check **Company signatory** (default comes from the signatory rules).\n5. Click **Preview**, then **Send for signature**.\n**Expected result:** \"Sent to the company signatory\". Status: Awaiting company signature.\n**Important notes:** Drafts save automatically; if someone else edits at the same time you see \"Someone else changed this draft. Reloading the latest version.\" \"This contract type needs an end date.\" appears for fixed-term contracts without one.\n\n### Feature: Sign for the company\n**Steps:**\n1. Signatory opens **Employees → My employee workspace → My contracts → Contracts to sign for the company** and clicks **Sign now**.\n2. Read the whole document (\"Open the document first\").\n3. Choose signature type: type your full name or draw it. Tick **I agree**.\n4. Enter the **Verification code** (from your authenticator app if two-factor is set up, otherwise sent by email).\n**Expected result:** \"Signed for the company\". Status becomes Awaiting employee signature. HR can use **Reassign signatory** before signing.\n\n### Feature: Employee signs\n**Steps:**\n1. Employee opens **Employees → My employee workspace → My contracts**; **Action required** shows contracts waiting.\n2. Click **Sign now**, read, sign (typed or drawn), tick **I agree**, enter the code.\n3. Alternative: **Upload the signed contract as a PDF** (printed and signed by hand).\n**Expected result:** Digital signing → **Signed** (\"Contract signed\"). Upload → Upload to verify (\"Signed copy uploaded for HR verification\").\n\n### Feature: Verify an uploaded signed copy\n**Steps:** HR opens the contract; under **Employee upload** accept, or reject with a reason (\"Reason (required to reject)\").\n**Expected result:** Accept → Signed. Reject → back to Awaiting employee signature.\n\n### Feature: Signature certificate and download\nWhen signed, a certificate page listing every signing act is added to the PDF. Use **Download signed contract** / **Download PDF**.\n\n### Feature: Renew or amend\n**Steps:**\n1. Open a signed contract. Click **Renew or amend**.\n2. Choose **Renewal** (starts the day after the old end date) or **Amendment** (keeps the start date). Optional **New end date**. Give a reason.\n3. Click **Create draft**, then complete and send as a new contract.\n**Expected result:** A new version; when it is signed, the old one becomes Superseded. \"Contract amendment suggested\" may appear after an employee movement (e.g. promotion).\n\n### Feature: Cancel or replace\n- **Cancel contract** works before signing (draft or awaiting signature/verification).\n- **Replace and issue new version** (with a PDF) cancels the sent version and issues a new one. An external PDF can be attached to a draft with **Use this PDF and send**.\n\n## 6. Important fields and options\n\n| Field | Meaning |\n|---|---|\n| Contract type | Unspecified period, Fixed term, Specific task (labels not verified) |\n| Start date / End date | Contract period; must cover the hire date for activation |\n| Company signatory | Person who signs for the company |\n| Basic salary, Pay frequency (Monthly, Every two weeks, Weekly, Daily), Payment method | Pay terms |\n| Probation (months), Hours of work, Place of work, Place of recruitment | Terms |\n| Allowances and benefits | Extra pay items |\n\n**Statuses (list labels)**\n\n| Status | Meaning |\n|---|---|\n| Draft | Being prepared |\n| Awaiting company signature | Sent; company signs first |\n| Awaiting employee signature | Company signed |\n| Upload to verify | Employee uploaded a scanned copy |\n| Signed | Fully signed (validity shown as Active, Starts later, Expired) |\n| Superseded | Replaced by a newer signed version |\n| Cancelled | Withdrawn before signing |\n| Ended | Ended because the employee exited |\n\n## 7. Daily usage procedures\n\n- HR: filter the list by **Status** and **Validity**; search by reference, name or employee number.\n- Signatories: check **Employees → My employee workspace → My contracts** for contracts to sign.\n- Expiry: HR (issuer) and the line manager get notifications 60, 30 and 7 days before the end date and on the day. Reminders are also sent when a contract waits too long for signature.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  D[Draft] -->|Send for signature| H[Awaiting company signature]\n  H -->|Company signs| E[Awaiting employee signature]\n  E -->|Employee signs| S[Signed]\n  E -->|Employee uploads PDF| V[Upload to verify]\n  V -->|HR accepts| S\n  V -->|HR rejects| E\n  D & H & E & V -->|Cancel| C[Cancelled]\n  S -->|New version signed| SU[Superseded]\n  S -->|Employee exits| T[Ended]\n```\n\n## 9. Links to other modules\n\n- [06. Recruitment and Onboarding](06-recruitment-and-onboarding.md): signed contract required for activation.\n- [18. Offboarding](18-offboarding.md): contracts end on the last working day when offboarding is finalized.\n- Payroll: before a payroll run, contract warnings may be shown and must be acknowledged.\n- Employee movements: may suggest an amendment.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| No **New contract** button | Only read permission | Grant `employment_contracts:manage` |\n| \"This contract type needs an end date.\" | Fixed-term without end date | Enter end date |\n| \"The end date is before the start date.\" | Wrong dates | Fix dates |\n| \"The signing code is not correct\" | Wrong code | Re-enter |\n| \"Request a new signing code; the previous one has expired\" / \"Too many wrong codes…\" | Code expired or locked | Start signing again |\n| \"Only a signed contract can be renewed or amended\" | Contract not signed | Finish signing first |\n| \"The logo must be a PNG or JPEG image\" | Wrong file type | Use PNG/JPEG |\n| Activation blocked by contract | Not signed or period doesn't cover hire date | Sign / renew with correct dates |\n\n## 11. Best practices\n\n- Always set a backup signatory.\n- Give clear reasons for overrides; they are kept in the activity log.\n- Prefer digital signing; uploads need manual verification.\n- Renew fixed-term contracts when the 60-day alert arrives.\n\n## 12. Setup checklist\n\n- [ ] Company legal details and logo saved\n- [ ] Template reviewed for each contract type\n- [ ] Default and backup signatory set\n- [ ] Signatory rules by position/grade (if needed)\n- [ ] HR has `employment_contracts:manage`; admins have `contract_signatories:manage`\n- [ ] Signatories have email or two-factor set up for codes\n\n## 13. Not verified / limitations\n\n- Exact display labels for contract types were not verified.\n- Employment letters (offer, appointment, joining form) are under **Recruitment → Letters**; not documented in detail here.\n- Payroll warning rules for contracts were not reviewed in detail.\n"},{"path":"part-3-modules/08-attendance.md","title":"08. Attendance","md":"# 08. Attendance\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n---\n\n## 1. Overview and purpose\n\nThe Attendance module records when employees start and finish work, compares this with their planned working time, and produces one **daily summary** per employee per day (for example Present, Late, Absent, Off Day, Holiday, Leave).\n\nAttendance comes from three sources:\n- **Biometric devices** (Hikvision terminals) – fingerprint, card or PIN punches pulled from the device.\n- **Web / mobile check-in** – employees click **Check in** and **Check out** in HRMS. HRMS can check GPS location (geofence), office Wi‑Fi and a selfie.\n- **Corrections** – approved correction requests and HR adjustments.\n\nThe daily summaries are used by Payroll (attendance deductions and overtime) and by Leave (attendance-based deductions).\n\nThe module has these work areas in the **Attendance** menu:\n\n| Area | Pages |\n|---|---|\n| **Attendance Setup** | Policies, Holiday Groups, Holidays, Geofences, Wi-Fi Networks, Checkpoints |\n| **Shift Management** | Shift Schedules, Generated Schedules, Shifts, Shift Breaks, Shift Assignments, Rotation Groups, Rotation Rules |\n| **Timetable Management** | Timetables, Timetable Days, Timetable Shift Options, Timetable Holiday Rules, Timetable Rotations and Rules, Employee Timetables |\n| **Attendance Operations** | Daily Summaries, Mobile Punch Review, Processing Exceptions, Recalculation Jobs, Exemptions, Unmatched Logs, Device Sync Logs |\n| **Biometric Access** | Biometric Access (employee cards, fingerprints and PINs) |\n| **My attendance** (every employee) | Attendance History (includes Today), My Schedule, Correction Requests, Work-from-home Requests |\n\nApprovers find attendance correction requests under **Requests → Correction Requests**.\n\nDevices (terminals) are managed in **Access Control → Devices**. See [09. Access Control and Devices](09-access-control-and-devices.md).\n\n> 📷 Screenshot: Attendance menu – the four admin areas and \"My attendance\"\n\n## 2. Prerequisites and dependencies\n\nSet these up first, in other modules:\n\n| Needed | Why | Where |\n|---|---|---|\n| Company | Every attendance record belongs to one company. Only one attendance policy can be active per company. | Companies |\n| Branches | Geofences, Wi‑Fi networks, devices, shifts and timetables are linked to a branch. Mobile check-in checks the employee's branch. | Branches |\n| Departments | Optional on shifts. Department managers approve corrections. | Departments |\n| Employees | Must be **active**. Punches after the exit date are refused. | Employees |\n| Line manager (\"reports to\") / department manager | Decides who reviews correction requests and location exceptions. Without a manager, requests go straight to HR. | Employees, Departments |\n| User accounts | Employees need a user account linked to their employee profile to check in. | Users |\n| Payroll calendar (for locking) | Once a payroll period is closed, attendance in that period cannot be changed. | Payroll |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View / create / edit / delete attendance policies | `attendance_policies:read` / `:create` / `:update` / `:delete` | HR administrator |\n| Holiday groups | `attendance_holiday_groups:read/create/update/delete` | HR administrator |\n| Holidays | `attendance_holidays:read/create/update/delete` | HR administrator |\n| Geofences | `attendance_geofences:read/create/update/delete` | HR / IT administrator |\n| Wi‑Fi networks | `attendance_wifi_networks:read/create/update/delete` | IT administrator |\n| Checkpoints | `attendance_checkpoints:read/create/update/delete` | HR administrator |\n| Shifts, breaks, assignments, schedules | `shifts:*`, `shift_breaks:*`, `shift_assignments:*`, `shift_schedules:*` | HR / scheduler |\n| Rotation groups and rules | `shift_rotation_groups:*`, `shift_rotation_rules:*` | HR / scheduler |\n| Timetables and related pages | `timetables:*`, `timetable_days:*`, `timetable_holiday_rules:*`, `timetable_rotations:*`, `timetable_rotation_rules:*`, `employee_timetables:*` | HR / scheduler |\n| Generated Schedules page | `shift_schedules:read` | HR / scheduler |\n| View daily summaries, Exemptions page | `attendance_summaries:read` | HR, payroll |\n| Processing exceptions, unmatched logs | `attendance_processing:read` (view), `attendance_processing:update` (resolve) | HR / attendance officer |\n| Recalculation jobs | `attendance_processing:read`, `attendance_recalculation:execute` | HR / attendance officer |\n| Mobile punch review | `attendance_mobile_punches:read`, `attendance_mobile_punches:update` (approve/reject) | HR / manager |\n| Device sync logs | `attendance_device_sync_logs:read` | IT administrator |\n| Attendance devices | `attendance_devices:read/create/update/delete` | IT administrator |\n| Review correction requests (manager stage) | `self_service_requests:approve` or `self_service_requests:manager_review` | Manager |\n| Final approval of correction requests (HR stage) | `self_service_requests:final_approve` | HR |\n| Own attendance (Today, history, schedule, check in/out, corrections) | No special permission – every signed-in employee | Employee |\n| Team attendance | Manager permission (`manager:read` or similar) (label not verified) | Manager |\n\nThe **(*)** symbol means read, create, update and delete.\n\n## 4. Initial setup and configuration\n\nThe order below follows the real dependencies in the system. HRMS shows a live checklist of what is missing in **Attendance → Attendance Setup → Policies → Policy creation quickstart**.\n\n| # | Step | Mandatory? | Scope | One-time or changeable |\n|---|---|---|---|---|\n| 1 | Create and activate an **attendance policy** | Mandatory | Company (one active policy) | Changeable |\n| 2 | Create a **holiday group** | Mandatory if the policy's **Holiday Policy Mode** uses holidays | Company | Changeable |\n| 3 | Add **holidays** to the group | Recommended | Company, optionally one branch | Each year |\n| 4 | Create **geofences** | Mandatory if GPS check-in is required | Branch | Changeable |\n| 5 | Create **Wi‑Fi networks** | Mandatory if Wi‑Fi check is required | Branch | Changeable |\n| 6 | Register **attendance devices** | Mandatory for biometric attendance | Branch / device | Changeable |\n| 7 | Create at least one active **checkpoint** for the policy | Mandatory | Policy | Changeable |\n| 8 | Create **shifts** (and **shift breaks**) | Mandatory | Company, optionally branch/department | Changeable |\n| 9 | Create a **timetable**, its **timetable days** and **timetable shift options** | Mandatory (a default timetable or employee timetables) | Company / branch | Changeable |\n| 10 | Add **timetable holiday rules** | Optional | Timetable | Changeable |\n| 11 | Assign work time to employees: **Employee Timetables**, **Shift Assignments**, rotations, or dated **Shift Schedules / Generated Schedules** | Mandatory (unless a default timetable covers everyone) | Employee | Changeable, date-based |\n| 12 | Enrol employees on devices (fingerprint, PIN, card) | Mandatory for device users | Employee + device | Changeable |\n| 13 | Mark staff who are not tracked as **Exemptions** | Optional | Employee | Changeable |\n\n**Why this order?**\n- A checkpoint must belong to a policy, so the policy comes first.\n- A GPS checkpoint needs a geofence, a Wi‑Fi checkpoint needs a Wi‑Fi network, and a Device checkpoint needs a device.\n- A holiday needs a holiday group. A timetable holiday rule needs both a timetable and a holiday group.\n- Shift breaks, timetable shift options, rotation rules and assignments all need a shift.\n- Employee timetables and generated schedules need a timetable.\n- Device enrolment needs the device and the employee.\n\nThe setup checklist is complete when HRMS finds: an active policy, a calculation time, a default timetable or employee timetable, an active checkpoint, and (when required) an active geofence, Wi‑Fi network and holiday group.\n\n```mermaid\nflowchart TD\n  A[Company, branches, employees] --> B[Attendance policy - activate]\n  B --> C[Holiday group]\n  C --> D[Holidays]\n  A --> E[Geofences / Wi-Fi networks]\n  A --> F[Devices in Access Control]\n  B --> G[Checkpoints]\n  E --> G\n  F --> G\n  A --> H[Shifts + breaks]\n  H --> I[Timetable + days + shift options]\n  C --> J[Timetable holiday rules]\n  I --> J\n  I --> K[Employee timetables / assignments / schedules]\n  H --> K\n  F --> L[Enrol employees on devices]\n  K --> M[Daily summaries]\n  L --> M\n  M --> N[Payroll and Leave]\n```\n\n## 5. Features – step by step\n\n### Feature: Policy creation quickstart\n**Purpose:** Create a first policy quickly and see what setup is still missing.\n**Before you start:** You need `attendance_policies:create` or `:update`.\n**Steps:**\n1. Go to **Attendance → Attendance Setup → Policies**.\n2. Click **Policy creation quickstart**.\n3. Read the status (**Not configured**, **In progress** or **Complete**) and the list of remaining items.\n4. If no policy is active, type a name in **Name for this attendance rule set** (for example \"Head office attendance\") and create it.\n5. If a checkpoint is missing, click **Create or activate checkpoint**.\n**Expected result:** \"Starter attendance policy created. Review the remaining setup items below.\"\n**Important notes:** The starter policy is created as active. Review its grace periods and late rules afterwards. If the name already exists, choose another name.\n\n> 📷 Screenshot: Policies – Policy creation quickstart dialog\n\n### Feature: Attendance policies\n**Purpose:** Define the company rules for lateness, absence, overtime, check-in methods and corrections.\n**Before you start:** None.\n**Steps:**\n1. Go to **Attendance → Attendance Setup → Policies** and click **Create**.\n2. Enter **Policy Name**. Leave **Policy Is Active** as No.\n3. Fill in the rules (see [section 6](#6-important-fields-and-options)).\n4. Save. Select the policy and click **Activate**.\n**Expected result:** The policy is the active policy for the company.\n**Important notes:**\n- Only one policy is active per company. Activating one replaces the other.\n- A shift can set its own late, half-day and absent values. A shift value overrides the policy.\n- **Daily Overtime Limit** in the policy is a company ceiling. A shift can only set a lower limit.\n- Overtime **pay rates** are set in Payroll → Overtime policies, not here.\n\n### Feature: Holiday groups and holidays\n**Purpose:** Keep a calendar of public and company holidays.\n**Before you start:** None.\n**Steps:**\n1. Go to **Attendance Setup → Holiday Groups** → **Create**. Enter **Name** and **Description**.\n2. Go to **Attendance Setup → Holidays** → **Create**.\n3. Choose **Holiday Group**, enter **Name**, **Date**, **Type** (PUBLIC, COMPANY, RELIGIOUS, OPTIONAL).\n4. Set **Is Paid**, **Affects Overtime**, **Counts As Working Day**. Optionally limit to one branch.\n**Expected result:** On that date, scheduled employees get the Holiday status (depending on the policy's **Holiday Policy Mode** and any timetable holiday rule).\n**Important notes:** Leave Management has its own Holidays page. Check with your administrator which calendar is used for leave day counting (see section 13).\n\n### Feature: Geofences\n**Purpose:** Define the area where GPS check-in is allowed.\n**Before you start:** The branch must exist.\n**Steps:**\n1. Go to **Attendance Setup → Geofences** → **Create**.\n2. Choose **Branch**, enter **Name** and **Description**.\n3. Choose **Type**: Circle (centre point and radius) or Polygon (several corners).\n4. For Circle: enter **Latitude**, **Longitude**, **Radius Meters**. For Polygon: enter **Polygon Corner Points**, one \"latitude,longitude\" per line, in order.\n5. Set **Allowed Accuracy Meters** (phone GPS error you accept) and **Strict Accuracy** (Yes = reject poor-accuracy readings).\n6. Set **Status** to Active.\n**Expected result:** Mobile/web check-ins from that branch's employees are checked against the area.\n**Important notes:** The geofence must belong to the employee's branch. An inactive geofence is not used.\n\n> 📷 Screenshot: Geofences – map with circle geofence\n\n### Feature: Wi‑Fi networks\n**Purpose:** Accept check-ins only from the office network.\n**Steps:**\n1. Go to **Attendance Setup → Wi-Fi Networks** → **Create**.\n2. Enter **Branch**, **Name**, **SSID** (network name), optionally **BSSID** (router hardware ID) and **Allowed IP CIDRs** (one range per line, for example the office public IP range).\n3. Choose which checks apply: **Require SSID Match**, **Require BSSID Match**, **Require IP Match**.\n4. Set **Allow Mobile Attendance** and **Status** = ACTIVE.\n**Important notes:** Most web browsers do not share the Wi‑Fi name. For browser check-in, the IP range check is the dependable option. The **Find a Wi-Fi network** helper on the page searches current Wi‑Fi details where the device allows it.\n\n### Feature: Checkpoints\n**Purpose:** Say which validation a punch must pass to be accepted.\n**Before you start:** An active policy; plus a device, geofence or Wi‑Fi network depending on the type.\n**Steps:**\n1. Go to **Attendance Setup → Checkpoints** → **Create**.\n2. Choose **Attendance Policy**, enter **Name** (for example \"Main Gate GPS\").\n3. Choose **Type**: Device, GPS, WiFi, QR or Manual.\n4. Pick the **Device**, **Geofence** or **WiFi Network** that matches the type.\n5. Set **Is Required**, **Allow Override** (staff may give a reason when it fails), **Max Distance (meters)** for GPS, **Strict Mode**, and **Status** = Active.\n6. Use **Activate checkpoint** if it was saved inactive.\n**Important notes:** A Device checkpoint is satisfied only by biometric device logs; a mobile/web punch cannot satisfy it.\n\n### Feature: Shifts and shift breaks\n**Purpose:** Define reusable working hours.\n**Steps:**\n1. Go to **Attendance → Shift Management → Shifts** → **Create**.\n2. Enter **Shift Name**, **Shift Code**, **Shift Type** (Fixed, Flexible, Rotational), optional **Branch**/**Department**.\n3. Enter **Start Time**, **End Time**, **Expected Work Duration**, **Minimum Work Duration**, **Half Day Threshold**.\n4. Optionally set grace, late, absent, early-leave and overtime values, and options such as **Night Shift**, **Crosses Midnight**, **Allow Mobile Attendance**, **Allow Remote Attendance**, **Require Geofence**.\n5. Save. Then go to **Shift Breaks** → **Create**: choose **Shift**, **Break Name**, **Break Type** (Lunch, Tea, Rest, Other), times, **Break Duration**, **Paid Break**, **Flexible Break**.\n**Important notes:** Mark overnight shifts with **Crosses Midnight**. If a shift has **Allow Mobile Attendance** off, employees on that shift cannot check in from the app or web.\n\n### Feature: Shift assignments and rotations\n**Purpose:** Give an employee a shift from a date, or a repeating pattern.\n**Steps:**\n1. **Rotation Groups** → **Create**: **Rotation Group Name**, **Rotation Group Code**, **Cycle Days** (for example 14).\n2. **Rotation Rules** → **Create** one rule per day in the cycle: **Rotation Group**, **Day Index**, **Shift** or **Off Day** = Yes.\n3. **Shift Assignments** → **Create**: **Employee**, **Shift**, **Effective From**, optional **Effective To**, optional **Rotation Group**, **Primary Assignment**.\n**Important notes:** Make sure the rules cover every day of the cycle. A shift assignment overrides the employee's timetable.\n\n### Feature: Shift schedules (dated)\n**Purpose:** Set or override the shift for one employee (or many) on a specific date.\n**Steps:**\n1. **Shift Management → Shift Schedules** → **Create**.\n2. Choose **Employee**, or several in **Bulk Employees**.\n3. Choose **Shift** and **Schedule Date**. Optionally **Override Shift**, **Holiday**, **Remarks**, **Off Day**.\n**Important notes:** A dated shift schedule has the highest priority of all schedule sources.\n\n### Feature: Timetables\n**Purpose:** Describe a normal working week (which days are working days and which shift applies).\n**Steps:**\n1. **Timetable Management → Timetables** → **Create**: **Timetable Name**, **Timetable Code**, **Timetable Type**, **Timezone** (for example Africa/Dar_es_Salaam), optional **Branch**. Set **Default Timetable** = Yes for the company default.\n2. **Timetable Days** → **Create** one row per weekday: **Timetable**, **Day Of Week**, **Default Shift**, expected check-in/out times, **Working Day**, flexible-time and break options.\n3. **Timetable Shift Options** (page title \"Timetable Shift Rules\") → link allowed shifts to a timetable day: **Timetable Day**, **Shift**, **Priority Order**, **Max Employees**, **Primary Shift Rule**.\n4. Optional: **Timetable Holiday Rules** → **Timetable**, **Holiday Group**, **Action Type** (Off Day, Paid Holiday, Working Holiday), **Apply Overtime Rules**, **Auto Mark Off Day**.\n5. Optional: **Timetable Rotations and Rules** → rotation blocks (**Rotation Name**, **Cycle Days**) and their day rules.\n6. **Employee Timetables** → **Create**: **Employee**, **Timetable**, **Effective From**, optional **Effective To**.\n**Expected result:** Employees without a more specific schedule follow their timetable, or the default timetable.\n\n### Feature: Generated schedules (published roster)\n**Purpose:** Create a roster of employee/date rows and publish it.\n**Steps:**\n1. **Shift Management → Generated Schedules** → **Create**.\n2. Choose **Employee** (or **Bulk Employees**), **Schedule Date**, and either a **Timetable Shift Option** or a **Shift**. Set **Off Day** if needed.\n3. New rows are drafts. Click **Publish drafts (n)** to publish them.\n**Important notes:** Only published rows are used for attendance. Published rows can be unpublished.\n\n### How HRMS decides an employee's schedule for a day\nHRMS uses the first source it finds, in this order:\n1. Dated **Shift Schedule** (manual override).\n2. Published **Generated Schedule** row.\n3. **Shift Assignment** (including rotation).\n4. **Employee Timetable**.\n5. Company **Default Timetable**.\n6. None – the day shows **No shift schedule** and only policy defaults apply.\n\n### Feature: Check in and check out (employee)\n**Purpose:** Record your own working time from a browser or the mobile app.\n**Before you start:** You need an active employee profile, a schedule for today, and location permission in your browser if GPS is required.\n**Steps:**\n1. Go to **Attendance → My attendance → Attendance History** (the Today panel is at the top).\n2. Click **Check in**. If the policy requires a selfie, attach one (**Attendance selfie (required by policy)**).\n3. Click **Confirm check in**.\n4. At the end of the day click **Check out** → **Confirm check out**.\n**Expected result:** The punch appears in today's panel. If validation failed but override is allowed, it shows as pending review.\n**Important notes:** The system checks, in order of importance:\n- You are active and the date is not after your exit date.\n- You have a timetable or shift for the day (\"No valid timetable or shift found…\").\n- Your shift allows mobile/remote attendance.\n- You are inside an active geofence of your branch (if required).\n- Your Wi‑Fi / IP matches an office network of your branch (if required).\n- You have not already checked in / out, and you check in before checking out.\n- The app installation belongs to you (if the policy prevents device sharing).\n- Selfie attached (if required). Selfies must be compressible below 64 KB.\n- If GPS or Wi‑Fi fails and **Allow Manager Review for Location Exceptions** is on, the punch is saved as **pending override** for manager review.\n- Use **Network check** to see your connection and location status before punching.\n\n> 📷 Screenshot: Attendance History – Today panel with Check in / Check out buttons\n\n### Feature: My Schedule and Attendance History (employee)\n**Purpose:** See your planned shifts and past attendance.\n**Steps:**\n1. **Attendance → My attendance → My Schedule** shows the schedule HRMS resolved for upcoming days.\n2. **Attendance → My attendance → Attendance History** lists each day with status, check-in, check-out, late, overtime and worked minutes. Use **Filter by date range** and **Export**.\n\n### Feature: Correction requests (employee)\n**Purpose:** Ask for a missing or wrong punch or status to be fixed.\n**Steps:**\n1. Go to **Attendance → My attendance → Correction Requests** and click **Request correction**.\n2. Choose **Attendance date** and **Request type**: Missing / wrong check in, Missing / wrong check out, Check in and check out, or Wrong attendance status.\n3. Enter **Requested check-in time**, **Requested check-out time** or **Requested status**, and a **Reason**.\n4. Attach **Supporting evidence** if needed.\n5. Click **Save as draft** or submit.\n6. If the request is returned, open it, read the **Reviewer note**, change it and click **Save & resubmit**.\n**Important notes:** The policy can require a reason or evidence, limit how many days back you may correct, and limit requests per month (cancelled ones still count). You can cancel a request while it is draft, returned or pending. Old links to a single request open this page with the request highlighted.\n\n### Feature: Correction requests (approver)\n**Purpose:** Review employee correction requests.\n**Steps:**\n1. Go to **Requests → Correction Requests**.\n2. Use **Filters** (department, manager, status). Select a request.\n3. Compare **Current** and **Requested** values. Use **Download evidence** to view attachments.\n4. Write a note and click **Approve** (manager) or **Final approve** (HR), **Return**, or **Reject**.\n**Expected result:** Manager approval forwards to HR. HR final approval applies the correction to the daily summary and queues a recalculation for that day.\n**Important notes:** Reject and Return need a reason. Managers see only their direct reports and departments. HR can give final approval even while a request still waits for the manager.\n\n### Feature: Mobile Punch Review\n**Purpose:** Decide on punches that failed GPS/Wi‑Fi checks but were sent for review, and offline punches.\n**Steps:**\n1. **Attendance Operations → Mobile Punch Review**. Filter **Validation Status** = PENDING_OVERRIDE.\n2. Select a punch, look at the location and selfie, enter a review note.\n3. Click **Approve override** or **Reject override**.\n**Important notes:** You cannot review your own punch. The page also lists **Mobile app device registrations**; use **Release device** (with a reason of at least 5 characters) when a phone must be moved to another employee.\n\n### Feature: Daily Summaries\n**Purpose:** See and, if needed, adjust the calculated result for each employee/day.\n**Steps:**\n1. **Attendance Operations → Daily Summaries**. Use filters and search.\n2. To fix a day, select it and use **Adjust daily summary**: set status, times or minutes, then **Save adjustment**. **Clear adjustment** removes it.\n**Important notes:** Days inside a closed payroll period cannot be changed.\n\n### Feature: Processing Exceptions, Recalculation Jobs, Unmatched Logs\n**Purpose:** Fix problems found by the attendance engine.\n**Steps:**\n1. **Processing Exceptions**: review open problems and use **Save exception status** to mark Resolved or Ignored with a **Resolution note**.\n2. **Recalculation Jobs**: **Run pending jobs** to process queued jobs, or **Rebuild** for a date range and employee.\n3. **Unmatched Logs**: punches whose device user number could not be matched to an employee. Link the device user to the employee on the device page (see module 09), then rebuild the affected dates.\n**Important notes:** HRMS processes new punches automatically every few minutes and runs pending recalculation jobs automatically.\n\n### Feature: Exemptions\n**Purpose:** Stop tracking staff who do not punch (for example field staff with no device).\n**Steps:**\n1. **Attendance Operations → Exemptions**.\n2. The **Suggested** list shows employees with no device assignment and no punches in the last 30 days.\n3. Tick employees, choose **Exempt from** date and **Reason**, click **Exempt selected** → confirm **Exempt**.\n4. To undo, tick them under **Exempt employees** and click **Resume tracking**.\n**Expected result:** Exempt employees are never absent or late; punched days show Present, others Not Tracked. Attendance is recalculated in the background.\n**Important notes:** The exempt date must be after the last closed payroll period.\n\n### Feature: Device Sync Logs\n**Purpose:** See when device attendance was pulled and how many records came in.\n**Steps:** **Attendance Operations → Device Sync Logs**. Read Status (SUCCESS, FAILED, PARTIAL), records received/processed/failed and the error message.\n**Important notes:** The page is read-only.\n\n### Feature: Biometric Access\n**Purpose:** See employees' cards, fingerprints and PINs. Same as **Access Control → Credentials**. See [module 09](09-access-control-and-devices.md).\n\n## 6. Important fields and options\n\n**Attendance policy**\n\n| Field | Meaning |\n|---|---|\n| **Grace Period (Minutes)** | Extra minutes before late rules apply. |\n| **Mark Late After / Mark Half Day After / Mark Absent After (Minutes)** | Minutes late that make the day Late, Half Day or Absent. A shift value overrides these. |\n| **Allow Early Check-In / Allow Late Check-Out** | Accept punches outside the shift. |\n| **Auto-Mark Absent If No Check-In** | Scheduled employee with no check-in becomes Absent. |\n| **Ignore Missing Check-Out If Hours Are Enough** | No missing check-out flag when hours are met. |\n| **Maximum Missing Punches Allowed** | Missing punches tolerated before the record needs attention. |\n| **Regularization Backdate Limit (Days)** | How far back employees may request corrections. |\n| **Monthly Regularization Request Limit** | Correction requests per month. |\n| **Require a Reason / Require Supporting Evidence for Regularization** | Mandatory reason / document on corrections. |\n| **Rounding Mode** | NEAREST, UP or DOWN. |\n| **Weekend Days**, **Auto-Mark Weekends As Off Days** | For example SAT,SUN. |\n| **Holiday Policy Mode** | OFF, PAID, UNPAID, OPTIONAL. |\n| **Allowed Check-In Methods** | For example MOBILE_APP,WEB. |\n| **Require Geo-Fencing** | Mobile punches must be inside a geofence. |\n| **Prevent Device Sharing Across Employees** | One phone app = one employee. |\n| **Allow Offline Mobile Punches**, **Maximum Offline Punch Age (Hours)** | Offline punches go to manager review; never auto-approved. |\n| **Allow Manager Review for Location Exceptions** | Failed GPS/Wi‑Fi punches can be sent for review. |\n| **Require Selfie at Check-In / Check-Out** | Selfie photo required. |\n| **Calculate Attendance Automatically**, **Daily Calculation Time** | Daily processing. |\n| **Overtime** fields | Approval, auto-calculation, start after, daily and monthly limits. |\n\n**Daily statuses:** Present, Late, Early departure, Late and early departure, Overtime, Half day, Absent, Off day, Off day present, Holiday, No shift schedule, Not tracked, Leave (and sick, annual, unpaid), Business trip, Official duty, Manual correction.\n\n**Punch validation statuses:** APPROVED, REJECTED, PENDING_OVERRIDE, OVERRIDE_APPROVED, OVERRIDE_REJECTED.\n\n**Correction request statuses:** Draft, Pending manager approval, Pending HR approval, Returned for correction, Approved, Rejected, Cancelled.\n\n## 7. Daily usage procedures\n\n**Employee:** Check in on arrival, check out when leaving. Check **Attendance History** weekly. Request corrections promptly.\n\n**Manager:** Review pending **Correction Requests** and location-exception punches. Check **Team attendance**.\n\n**HR / attendance officer (daily):**\n1. Open **Device Sync Logs** – confirm the latest pulls are SUCCESS.\n2. Open **Unmatched Logs** and **Processing Exceptions** – fix or resolve.\n3. Give final approval on **Correction Requests**.\n4. Review **Mobile Punch Review** pending items.\n5. Before payroll closes: check **Daily Summaries** for the period and run **Recalculation Jobs** if setup changed.\n\n## 8. Approval workflows\n\n**Attendance correction request**\n\n```mermaid\nflowchart TD\n  A[Employee: draft] -->|Submit| B{Has line or department manager?}\n  B -->|Yes| C[Pending manager approval]\n  B -->|No| D[Pending HR approval]\n  C -->|Approve| D\n  C -->|Return| R[Returned for correction]\n  C -->|Reject| X[Rejected]\n  D -->|Final approve| E[Approved - daily summary updated, recalculation queued]\n  D -->|Return| R\n  D -->|Reject| X\n  R -->|Save & resubmit| B\n  A -->|Cancel| Z[Cancelled]\n  C -->|Cancel| Z\n  D -->|Cancel| Z\n```\n\n**Mobile punch with failed location check:** Punch → PENDING_OVERRIDE → reviewer **Approve override** (OVERRIDE_APPROVED) or **Reject override** (OVERRIDE_REJECTED).\n\n## 9. Links to other modules\n\n- **Payroll:** reads daily summaries for attendance deductions and overtime. Overtime approval and rates live in Payroll. Closing a payroll period locks attendance for those dates.\n- **Leave:** approved leave and business trips appear as Leave / Business trip days. Leave balances can be reduced from attendance (attendance-based deductions).\n- **Access Control (module 09):** devices, enrolment, credentials and sync.\n- **Employees:** status, exit date, branch and manager drive attendance rules.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"No valid timetable or shift found for this employee on this attendance day.\" | No schedule source for the employee. | Add an employee timetable, shift assignment, or default timetable. |\n| \"Location is not inside the allowed geofence.\" | Employee outside the area or poor GPS. | Move closer / outdoors; check radius and **Allowed Accuracy Meters**. |\n| \"No active registered geofence is configured for the employee branch.\" | Geofence missing, inactive or on another branch. | Create/activate a geofence for that branch. |\n| \"WiFi network does not match any allowed office network.\" | Not on office network, or IP range wrong. | Connect to office Wi‑Fi; check **Allowed IP CIDRs**. |\n| \"Location permission was not allowed…\" / \"open HRMS using your organization's secure link\" | Browser blocked location, or site not on HTTPS. | Allow location; use the HTTPS address. |\n| \"The assigned shift does not allow mobile attendance.\" | Shift setting. | Turn on **Allow Mobile Attendance** on the shift, or use a device. |\n| \"This mobile app installation is registered to another employee.\" | Device sharing prevention. | Administrator uses **Release device** in Mobile Punch Review. |\n| \"Employee has already checked in for this attendance day.\" | Second check-in. | Use **Check out**; request a correction if wrong. |\n| \"Attach a selfie before submitting…\" | Policy requires a selfie. | Attach a clear photo. |\n| Punches from a device do not appear | Device not ACTIVE, sync failed, or user not linked. | Check **Device Sync Logs** and **Unmatched Logs**; use **Sync attendance** on the device page. |\n| Day shows No shift schedule | Schedule missing for that date. | Assign a schedule and rebuild. |\n| Cannot adjust a day / exempt from a date | Date is in a closed payroll period. | Choose a later date or reopen payroll per Payroll procedure. |\n| \"This request is not awaiting your decision.\" | Request already passed your stage. | No action, or HR completes it. |\n\n## 11. Best practices\n\n- Finish setup in the order of section 4; use **Policy creation quickstart** to confirm it is complete.\n- Keep one clear default timetable; use assignments only for exceptions.\n- Use dated shift schedules for one-off changes, not new shifts.\n- Use IP ranges for Wi‑Fi checks; browsers rarely share Wi‑Fi names.\n- Rebuild attendance after changing shifts, timetables or holidays for past dates.\n- Resolve unmatched logs and exceptions before the payroll cut-off.\n\n## 12. Setup checklist\n\n- [ ] Branches, departments, managers and active employees exist\n- [ ] Attendance policy created and **activated**\n- [ ] Holiday group and holidays for the year\n- [ ] Geofences (if GPS required) – active, correct branch\n- [ ] Wi‑Fi networks / IP ranges (if required)\n- [ ] Devices registered (module 09)\n- [ ] At least one active checkpoint on the active policy\n- [ ] Shifts and breaks\n- [ ] Default timetable with days and shift options\n- [ ] Employee timetables / shift assignments / rotations\n- [ ] Employees enrolled on devices\n- [ ] Exemptions for untracked staff\n- [ ] Quickstart shows **Complete**\n\n## 13. Not verified / limitations\n\n> **Limitation:** The relation between Attendance **Holidays** and **Leave Management → Holidays** was not verified; they are separate pages.\n\n> **Limitation:** The search index lists \"Attendance / Today\", but the Today page redirects to **Attendance History**, where Today is shown at the top.\n\n> **Limitation:** Team attendance permission name was not verified.\n\n> **Limitation:** Exact rules for which policy fields the mobile app (as opposed to the web) uses were not tested.\n\n> **Limitation:** Work-from-home requests and Processing Exceptions details are only briefly covered.\n"},{"path":"part-3-modules/09-access-control-and-devices.md","title":"09. Access Control and Devices","md":"# 09. Access Control and Devices\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Device support and verification](#13-device-support-and-verification)\n\n---\n\n## 1. Overview and purpose\n\nAccess Control manages the physical **Hikvision** terminals used for attendance and door access. With it you:\n- register devices and test the connection;\n- enrol employees on a device (fingerprint, PIN, password, card);\n- define doors, door schedules (week plans and templates), organizations and access groups;\n- copy (sync) people, schedules and settings between HRMS and devices;\n- pull attendance punches from devices into Attendance (module 08);\n- review credentials, audit logs, command logs and sync logs.\n\nMenu: **Access Control** with tabs **Devices**, **Doors**, **Templates**, **Week Plans**, **Organization**, **Groups**, **Credentials**, **Audit Logs**, **Command Logs**, **Sync Logs** (plus **Roles** and **Permissions**, covered in the Governance chapter).\n\nDetail pages: **Access Control → Devices → (device)**, **Groups → (group)**, **Organization → (organization)**. Old links under Attendance (devices and groups) open the same pages.\n\n> 📷 Screenshot: Access Control – tab bar\n\n## 2. Prerequisites and dependencies\n\n| Needed | Why |\n|---|---|\n| Branches | Each device is installed at a branch. |\n| Employees (active, with employee number) | Device users are linked to HR employees by employee number. |\n| Attendance policy (module 08) | Needed if you create a Device checkpoint for the device. |\n| Network access from the HRMS server to the device | HRMS connects to the device's IP address and port. |\n| Device API username and password | Stored encrypted; never shown again after saving. |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View / add / edit / delete devices | `attendance_devices:read/create/update/delete` | IT administrator |\n| Doors | `access_doors:read/create/update/delete` | IT / security |\n| Templates | `access_schedule_templates:read/create/update/delete` | IT / security |\n| Week plans | `access_week_plans:*` (page also checks `access_schedule_templates`) | IT / security |\n| Organizations | `access_organizations:read/create/update/delete` | IT / security |\n| Groups | `access_groups:read/create/update/delete` | IT / security |\n| Assign employees to devices | `employee_device_assignments:read/create/update/delete` | IT / HR |\n| View / change credential status | `employee_access_credentials:read`, `employee_access_credentials:update` | IT / HR |\n| Run sync with devices | `access_control_sync:execute` | IT administrator |\n| Device setup overview and dependency previews | `attendance_devices:read`, `access_groups:read`, `access_schedule_templates:read`, `data_scope:company` | IT administrator |\n\n## 4. Initial setup and configuration\n\n| # | Step | Mandatory? | Scope |\n|---|---|---|---|\n| 1 | Register the device (**Devices** → Create) | Mandatory | Device / branch |\n| 2 | **Test connection** on the device page | Mandatory | Device |\n| 3 | **Sync device** (pull doors, templates, week plans, users, fingerprints) | Recommended | Device |\n| 4 | Create a Device **checkpoint** in Attendance (module 08) | Mandatory if device punches must satisfy the policy | Policy |\n| 5 | Week plans → Templates → Doors | Optional (door access only) | Device |\n| 6 | Organizations and Groups; assign doors, devices and employees | Optional (door access) | Company / device |\n| 7 | Assign employees to the device and add credentials | Mandatory for each employee using the device | Employee + device |\n| 8 | Confirm automatic attendance pull (device **Status** ACTIVE, **Sync Mode** PULL) | Mandatory | Device |\n\n```mermaid\nflowchart LR\n  A[Branch] --> B[Register device]\n  B --> C[Test connection]\n  C --> D[Sync device]\n  D --> E[Week plans]\n  E --> F[Templates]\n  F --> G[Doors]\n  B --> H[Groups / Organizations]\n  G --> H\n  C --> I[Assign employee + verify mode]\n  I --> J[Fingerprint / PIN / password / card]\n  J --> K[Punches pulled every 10 min]\n  K --> L[Attendance daily summaries]\n```\n\n## 5. Features – step by step\n\n### Feature: Register a device\n**Purpose:** Add a Hikvision terminal to HRMS.\n**Before you start:** Know the IP address, port, serial number and API login of the device.\n**Steps:**\n1. Go to **Access Control → Devices** and click **Create**.\n2. Fill in **Device Name**, **Device Code**, **Serial Number**, **Model**, **Vendor Name**, **IP Address**, **Port**.\n3. Choose **Integration Type** = Hikvision, **Auth Type** = Digest, **Protocol** (HTTP, HTTPS or ISAPI (legacy HTTP)).\n4. Choose **Sync Mode** = PULL, **Status** = ACTIVE, **Branch**, **Timezone**, optional **Location Description**.\n5. Enter **API Username** and **API Password**. Save.\n**Expected result:** The device appears in the list. Click it to open the device page.\n**Important notes:** The password is never shown again. When editing, leave **API Password** blank to keep it. If no branch or policy exists yet, the page shows links such as **Create a branch**.\n\n> 📷 Screenshot: Devices – create device form\n\n### Feature: Device page (Details, Employees, Sync, Logs)\n**Purpose:** Manage one device.\n**Steps:**\n1. Open **Access Control → Devices** and click a device.\n2. Header buttons: **Test connection**, **Manage device** (runs a full sync job), **Refresh**.\n3. **Details** tab: connection details, **Last Successful Connection**, **Last Error**, and the read-only **Device setup overview** (linked groups, readiness, employee counts).\n4. **Employees (n)** tab: employees on the device and their credentials.\n5. **Sync** tab: steps **Device**, **Doors**, **Templates**, **Week plans**, **Users**, **Fingerprints** with their status; buttons **Sync device** and **Check status**; **Sync attendance** pulls punches for one date.\n6. **Logs** tab: **Device audit** and command logs.\n\n### Feature: Enrol an employee on a device\n**Purpose:** Let an employee punch on the terminal.\n**Before you start:** The device connects. The employee is active.\n**Steps:**\n1. On the device page open **Employees** and click **Assign To Device**.\n2. Choose the employee, an **Access Group** (optional) and a **User Verify Mode** (for example Fingerprint Or Card).\n3. HRMS searches the device for an existing user. Choose the matched user, or **Register as a new device user**.\n4. Save. Then use the row action **Credentials**:\n   - **Fingerprint:** pick the finger (for example Right Index), click **Save & Capture Fingerprint**, and place the finger on the device when you see **Waiting for fingerprint capture**.\n   - **PIN** or **Password:** enter it and click **Save Credentials**.\n5. If the saved verify mode supports Card, select **Card** in **Credentials** and enter the **Card number**. The **Add card** shortcut also opens card registration.\n**Expected result:** \"Employee assigned to device and credentials saved successfully.\" Test a punch on the assigned reader to verify enrollment.\n**Important notes:**\n- Only credential types allowed by the verify mode can be added (\"Select a credential type allowed by the saved verify mode.\").\n- Device users that are **Not linked** to an HR employee cannot get credentials. Link them first.\n- Use **View imported fingerprints** to see fingerprints already on the device.\n- Use **History** on a row for the employee's access history.\n\n> 📷 Screenshot: Device page – Employees tab with Credentials dialog\n\n### Feature: Pull attendance from a device\n**Purpose:** Bring punches into Attendance.\n**Steps:**\n1. Automatic: HRMS pulls punches every 10 minutes from every Hikvision device with **Status** ACTIVE and **Sync Mode** PULL.\n2. Manual: on the device page **Sync** tab, click **Sync attendance**, enter the date (YYYY-MM-DD).\n**Expected result:** \"Attendance sync started…\". Results appear in **Attendance → Device Sync Logs** and daily summaries update after processing.\n\n### Feature: Week plans and templates\n**Purpose:** Define when doors (or attendance) are allowed.\n**Steps:**\n1. **Week Plans** → **Create**: **Device**, **Hikvision Plan No**, **Plan Name**, **Enabled**, **Segments** (days and begin/end times).\n2. Or click **Pull week plans from device**. Use **Sync week plan to device** to push.\n3. **Templates** → **Create**: **Device**, **Template Name**, **Hikvision Template No**, **Week Plan**, **Hikvision Week Plan No**, **Schedule Type** (DOOR, ATTENDANCE, MIXED), **Status**.\n4. Or **Pull templates from device**; **Sync template to device** to push.\nUse **Preview configuration impact** before changing a plan. **Schedule history** shows recent revisions. Administrators with the applicable schedule-update, synchronization and company-scope permissions can enable automatic deployment to the assigned reader. Each successful deployment requires a matching read-back.\n\n### Feature: Doors\n**Purpose:** Configure door relays on a device.\n**Steps:**\n1. **Doors** → **Create**: **Device**, **Door Number**, **Door Name**, optional branch and door settings (open duration, alarm timeout, leader card).\n2. **Load device config** reads the door's current settings from the device.\n3. **Live door control** lets you open, close, set **Always open** or **Always closed** (needs `access_doors:update`).\n\n### Feature: Organizations and groups\n**Purpose:** Group employees and give them access to doors/devices.\n**Steps:**\n1. **Organization** → **Create**: **Organization Name**, optional branch, department, device, **Parent Organization**. Open it to **Assign Employee To Organization**, **Push to device** or **Pull from device**.\n2. **Groups** → **Create**: **Group Name**, **Group Code**, **Device**, **Branch**, **Status**. Open it to **Assign Door To Group**, **Assign Device To Group**, **Assign Employee To Group**.\n3. In the group page check **Access preview and readiness**. If you see **Resolve these issues before syncing**, fix them. When it shows **Ready to sync**, click **Sync Group**.\n**Important notes:** \"Pending access changes\" are review records only; device revocation is not automatic.\n\n### Feature: Credentials (Biometric Access)\n**Purpose:** See cards, fingerprints and PINs and turn them on or off.\n**Steps:**\n1. **Access Control → Credentials** (also **Attendance → Biometric Access**).\n2. Filter by **Credential type** or status. Select a row → **Manage credential status**, enter a reason.\n**Important notes:** This changes the HRMS record only (\"Backend lifecycle update only. Device sync remains explicit.\"). Run a device sync afterwards.\n\n### Feature: Audit, command and sync logs\n- **Audit Logs:** who changed employee device access.\n- **Command Logs:** commands sent to devices and whether they succeeded (**Response code**).\n- **Sync Logs:** when people, doors and schedules were copied to or from devices; filter by direction and status.\n\n## 6. Important fields and options\n\n| Field | Options / meaning |\n|---|---|\n| **Status** (device) | ACTIVE, INACTIVE, OFFLINE. Only ACTIVE devices are pulled automatically. |\n| **Sync Mode** | PULL (HRMS fetches punches). |\n| **Protocol** | HTTP, HTTPS, ISAPI (legacy HTTP). |\n| **User Verify Mode** | Fingerprint Or Card, Card Only, Fingerprint Only, Card And Password, Fingerprint And Card, Fingerprint And Password, Fingerprint Card And Password, Card Or Fingerprint Or Password. |\n| **Schedule Type** (template) | DOOR, ATTENDANCE, MIXED. |\n| Sync step state | Not started, queued, running, success, error. |\n\n## 7. Daily usage procedures\n\n1. Check **Sync Logs** and **Attendance → Device Sync Logs** for failures.\n2. Enrol new joiners on their device; disable credentials of leavers and sync.\n3. Check **Command Logs** after door changes.\n\n## 8. Approval workflows\n\nThere is no approval workflow in this module. Changes take effect when you save and sync.\n\n## 9. Links to other modules\n\n- **Attendance (08):** device punches become daily summaries; Device checkpoints refer to devices; unmatched device users show in Unmatched Logs.\n- **Employees / Onboarding / Offboarding:** onboarding shows device provisioning status; removing an employee offers access removal (label not verified).\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"Connection test failed.\" | Wrong IP/port/protocol/password, or the server cannot reach the device. | Check network and details; re-enter the API password. |\n| No punches arrive | Device not ACTIVE or not PULL, or connection fails. | Fix status; **Test connection**; **Sync attendance** for the date. |\n| Punches in Unmatched Logs | Device user not linked to an HR employee, duplicate employee numbers, or conflicting mappings. | Link the device user on the **Employees** tab; fix duplicates; rebuild dates. |\n| \"Link this device user to an HR employee first\" | Device user not linked. | Link, then add credentials. |\n| \"Set a supported verify mode…\" | No verify mode on the assignment. | Choose a **User Verify Mode** and save. |\n| \"Fingerprint capture failed\" | Finger not placed in time, or device busy. | Retry; check device is online. |\n| \"The device rejected the synchronization…\" | Device refused data. | Check **Command Logs**/response; fix and retry. |\n| \"Some device records could not be imported.\" | Partial import. | Review sync results in **Sync Logs**. |\n| \"Sync the device first before syncing linked resources.\" | Core device sync not done. | Click **Sync device** first. |\n| \"Resolve these issues before syncing\" (group) | Group not ready (for example overlapping groups). | Fix the listed issues. |\n\n## 11. Best practices\n\n- Test connection right after registering a device.\n- Keep employee numbers unique; they link device users to employees.\n- Sync the device before working on doors, templates or groups.\n- After changing credentials or groups, always run a sync and check the logs.\n- Rotate device passwords if they may have been exposed.\n\n## 12. Setup checklist\n\n- [ ] Device registered with branch, timezone, ACTIVE, PULL\n- [ ] **Test connection** succeeds\n- [ ] **Sync device** completed\n- [ ] Device checkpoint created in Attendance (if required)\n- [ ] Week plans, templates, doors (if using door access)\n- [ ] Organizations / groups synced (if using door access)\n- [ ] All employees enrolled with credentials\n- [ ] First punches visible in Attendance → Device Sync Logs and Daily Summaries\n\n## 13. Device support and verification\n\n**Command Logs**, **Sync Logs** and **Audit Logs** require `access_control_sync:execute` in the active company. **Credentials** requires `employee_access_credentials:read`.\n\nWeek plans and schedule templates retain a version history. Use **Schedule history** on a row to inspect the latest 20 revisions. A manual sync reads the schedule back from the device and compares it to the requested configuration. An acknowledgement alone leaves the schedule unverified.\n\nIn **Devices → Details**, enable **Automatic access reconciliation** for the intended reader. New group, employment and supported card-status changes enter the queue. The worker verifies the current permission, identity and observed device state. It can remove rights it previously deployed while preserving independently configured rights. An unresolved identity or conflict appears in **Access Control → Groups** for review. A device-bound standard card can be suspended and restored following an explicit status change. Other credentials require the reader-specific procedure.\n\nFace and QR enrollment require a supported reader and integration. Physical enrollment, door response and punches still require acceptance testing on an isolated device of the intended model and firmware.\n"},{"path":"part-3-modules/10-leave-management.md","title":"10. Leave Management","md":"# 10. Leave Management\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nLeave Management controls how employees take time off and how much leave they have. It covers:\n\n- **Holidays** – the public and company holidays that are not counted as leave.\n- **Leave Types** – the kinds of leave (for example Annual, Sick, Maternity), whether they are paid, and their basic rules.\n- **Policies** – who gets which leave, how much, how it is earned (accrual), carried forward, capped, lapsed and encashed.\n- **Workflows** – who approves leave, in what order, with reminders and escalation.\n- **Leave Balances**, **Balance Transactions** and **Balance Import** – each employee's available days and every change to them.\n- **Leave Requests**, **Team Calendar**, **Leave Reports** and **Business Trips**.\n- Advanced screens: **Year-end Rollover**, **Statutory Rules**, **Leave Payroll** and **Leave Operations**.\n- Employee self-service under **Leave Management → My leave** (**Requests**, **Balances**, **Holidays**, **Policies**).\n- A printable leave **PDF** with a QR code that anyone can scan to check the leave is genuine.\n\nYou open the HR screens from the sidebar: **Leave Management**, then the tab you need (for example **Leave Management → Leave Types**). Employees use **Leave Management → My leave**.\n\n## 2. Prerequisites and dependencies\n\n| Must exist first | Why | Where |\n|---|---|---|\n| Company, branches, departments, positions | Policies and workflow steps can be limited to a branch, department, position or grade. | Organisation structure module |\n| Employees with a user account, department and reporting manager | The manager step of approval uses the department manager, or the employee's reporting manager. | Employees module |\n| Employee gender, employment type, probation/confirmation status, hire date | Used for eligibility (for example \"Female employees only\", \"During probation\", \"Service months\") and pro-rata accrual. | Employees module |\n| Work schedules / shifts | Weekly offs can be counted from the employee's own schedule. | Attendance module |\n| Roles with leave permissions | Controls who can set up, approve and adjust leave. | Roles & Permissions |\n| Payroll components (for encashment and leave pay) | Encashment is handed to payroll as a draft input. | Payroll module |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See leave types | `leave_types:read` | HR, managers |\n| Create / edit / delete leave types | `leave_types:create`, `leave_types:update`, `leave_types:delete` | HR admin |\n| See holidays | `holidays:read` or `attendance_holidays:read` | Everyone in HR |\n| Add / change / remove holidays | `holidays:create`, `holidays:update`, `holidays:delete` | HR admin |\n| See policies | `leave_policies:read` | HR |\n| Create / edit / delete policies | `leave_policies:create`, `leave_policies:update`, `leave_policies:delete` | HR admin |\n| Approve a policy version (make it effective) | `leave_policies:approve` | HR manager |\n| See / build approval workflows | `leave_workflows:read`, `leave_workflows:create`, `leave_workflows:update`, `leave_workflows:delete` | HR admin |\n| Apply for leave | `leave_requests:create` | Employee |\n| See leave requests | `leave_requests:read` | HR, managers |\n| Edit leave requests | `leave_requests:update` | HR |\n| Approve, reject, return requests | `leave_requests:approve` | Managers, HR |\n| Act in place of the manager (HR override) | `leave_requests:override` | HR manager |\n| Cancel leave requests | `leave_requests:cancel` | HR |\n| See balances and transactions | `leave_balances:list` | HR |\n| Adjust balances, generate balances, encashment | `leave_balances:manage`, `leave_balances:adjust-manually`, `leave_balances:generate` | HR admin |\n| Carry-forward | `leave_balances:carry-forward` | HR admin |\n| Download balance template / export | `leave_balances:export` | HR admin |\n| Import balances from Excel | `leave_balances:import` | HR admin |\n| See import history | `leave_balances:read-import-history` | HR admin, auditors |\n| Leave reports | `leave_reports:read` (or balance view/export, or approve) | HR, managers |\n| Year-end rollover | `leave_rollover:read`, `leave_rollover:manage`, `leave_rollover:approve` | HR admin / HR manager |\n| Statutory rules | `leave_statutory:read`, `leave_statutory:manage`, `leave_statutory:approve` | HR / legal |\n| Leave Operations (readiness, reconciliation, backfill) | `leave_operations:read`, `leave_operations:execute` | HR admin |\n| Confirm leave payroll treatment / encashment for Finance | `leave_encashment:finance_confirm` | Finance |\n| My leave (self-service) | No special permission – every signed-in employee | Employee |\n\n> **Note:** Employees normally see only their own leave under **Leave Management → My leave**. Having \"read\" on requests does not by itself open the HR set-up tabs (**Leave Types**, **Policies**, **Workflows**).\n\n## 4. Initial setup and configuration\n\nDo the steps in this order. Later steps use what earlier steps create.\n\n| # | Step | Mandatory? | Scope | One-time or changeable |\n|---|---|---|---|---|\n| 1 | Holidays | Mandatory | Company-wide (branch-specific holidays come from **Attendance → Holidays**) | Yearly; changeable |\n| 2 | Leave types | Mandatory | Company | Changeable; deactivate instead of delete once used |\n| 3 | Policies (entitlements per leave type) | Mandatory | Company, narrowed by branch / department / position / grade / employment type / confirmation status | Changes create a new version with an effective date |\n| 4 | Approval workflows | Recommended (without one, requests go manager → HR) | Company, per leave type, steps per branch/department | Changeable |\n| 5 | Statutory rules | Optional (recommended where law applies) | Jurisdiction, assigned to company | Versioned; needs approval |\n| 6 | Comp-off rules | Optional | Per leave type | Changeable; needs HR approval |\n| 7 | Generate balances / import opening balances | Mandatory before go-live | Employee + leave type + year | Once at go-live, then as needed |\n| 8 | Check **Leave Operations → Configuration readiness** | Recommended | Company | Any time |\n\n### Step 1 – Holidays\nSee [Feature: Holidays](#feature-holidays). Add each holiday or import a country's official list.\n\n### Step 2 – Leave types\nSee [Feature: Leave types](#feature-leave-types).\n\n### Step 3 – Policies\nSee [Feature: Leave policies](#feature-leave-policies). Attach each leave type to a policy and set its allowance.\n\n### Step 4 – Workflows\nSee [Feature: Approval workflows](#feature-approval-workflows).\n\n### Step 5 – Balances\nUse **Generate leave balances** on **Leave Balances** for the fiscal year, then correct opening balances with [Balance Import](#feature-balance-import-from-excel).\n\n## 5. Features – step by step\n\n### Feature: Holidays\n**Purpose:** Record holidays so they are excluded (or included, per policy) when counting leave days.\n**Before you start:** You need `holidays:create`. Decide which country list applies.\n**Steps:**\n1. Go to **Leave Management → Holidays**.\n2. Click **Add Holiday**.\n3. Enter the **Holiday name** and **Holiday date**.\n4. Choose **Recurring** if it falls on the same date every year, or **One-time**.\n5. Click **Add Holiday**.\n6. To load official holidays, click **Import Country Holidays**, choose **Country** and year, check the \"ready to import\" count, then click **Import Holidays**.\n7. To undo an imported set, use **Remove Country Holidays**.\n\n> 📷 Screenshot: Leave Management → Holidays – Add Holiday dialog and Import Country Holidays\n\n**Expected result:** The holiday appears in the list with **All branches** in the branch column. Employees see it under **Leave Management → My leave → Holidays**.\n**Important notes:**\n- Holidays with a branch show a note \"Branc
