<style>
:root{--bg:#ffffff;--panel:#f6f7f9;--text:#1c2430;--muted:#5b6675;--border:#e2e6ec;--accent:#1f5fbf;--accent-soft:#e8f0fc;--code:#f1f3f6;--note:#fff8e6;--note-border:#e8c766}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#181d25;--text:#e3e8ef;--muted:#9aa5b4;--border:#2a313c;--accent:#7aa7ff;--accent-soft:#1d2a40;--code:#1e242e;--note:#2a2516;--note-border:#6b5a22}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#181d25;--text:#e3e8ef;--muted:#9aa5b4;--border:#2a313c;--accent:#7aa7ff;--accent-soft:#1d2a40;--code:#1e242e;--note:#2a2516;--note-border:#6b5a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;white-space:nowrap}
header input{flex:1;max-width:420px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px}
header button{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px}
#menuBtn{display:none}
.layout{display:flex}
nav{width:300px;flex:none;height:calc(100vh - 53px);position:sticky;top:53px;overflow:auto;padding:12px 8px 40px;border-right:1px solid var(--border);background:var(--panel)}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 8px 4px}
nav a{display:block;padding:5px 8px;border-radius:5px;text-decoration:none;color:var(--text);font-size:14px}
nav a:hover{background:var(--accent-soft)}
nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{flex:1;min-width:0;padding:24px 40px 80px;max-width:1000px}
main h1{font-size:30px;line-height:1.25;border-bottom:1px solid var(--border);padding-bottom:8px}
main h2{margin-top:36px;border-bottom:1px solid var(--border);padding-bottom:4px}
main h3{margin-top:28px}
main img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:6px}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
pre{background:var(--code);padding:12px;border-radius:6px;overflow:auto}
pre code{padding:0;background:none}
pre.mermaid{background:var(--bg);border:1px solid var(--border);text-align:center}
blockquote{margin:12px 0;padding:8px 14px;background:var(--note);border-left:4px solid var(--note-border);border-radius:4px}
blockquote p{margin:4px 0}
li input[type=checkbox]{margin-right:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:16px;border-top:1px solid var(--border)}
.pager a{max-width:48%;text-decoration:none;padding:10px 14px;border:1px solid var(--border);border-radius:6px}
.pager small{display:block;color:var(--muted)}
.results a{display:block;padding:8px 0;border-bottom:1px solid var(--border);text-decoration:none}
.results small{color:var(--muted);display:block}
.muted{color:var(--muted);font-size:13px}
.page-break{page-break-before:always}
@media (max-width:860px){
 #menuBtn{display:inline-block}
 nav{position:fixed;left:0;top:53px;z-index:4;transform:translateX(-100%);transition:transform .2s;width:85vw;max-width:320px}
 nav.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
 main{padding:16px 16px 60px}
 header h1{font-size:15px}
}
@media print{header,nav,.pager{display:none!important}main{max-width:none;padding:0}body{background:#fff;color:#000}}
</style>

<script id="manual-data" type="application/json">{"pages":[{"path":"README.md","title":"HRMS User Manual — Master Index","md":"# HRMS User Manual — Master Index\n\nThis is the complete user manual for the HRMS. It is written in Markdown so it can be converted to Word or PDF (see [Converting to Word/PDF](#converting-to-wordpdf)).\n\n## How to use this manual\n\n| If you are… | Start here |\n|---|---|\n| A new user (any role) | [Quick Start Guide](quick-start-guide.md) |\n| Setting the system up for the first time | [Master System Setup Guide](part-2-setup/01-master-setup-guide.md) |\n| A system or HR administrator | [Administrator Guide](administrator-guide.md) |\n| Doing routine work | [Daily Operations Guide](part-4-daily-operations/01-daily-operations-guide.md) |\n| Stuck on an error | [Troubleshooting Guide](part-5-troubleshooting/01-troubleshooting-guide.md) |\n\n## Contents\n\n### Part 1 — Getting started\n1. [Introduction to the system](part-1-getting-started/01-introduction.md)\n2. [Login and navigation](part-1-getting-started/02-login-and-navigation.md)\n3. [Roles and permissions overview](part-1-getting-started/03-roles-and-permissions-overview.md)\n4. [Mobile, desktop and offline use](part-1-getting-started/04-mobile-desktop-and-offline.md)\n\n### Part 2 — System setup and configuration\n1. [Master System Setup Guide](part-2-setup/01-master-setup-guide.md) — the full configuration sequence, first to last\n\n### Part 3 — Module manuals (in setup-dependency order, not sidebar order)\n\n| # | Module | Depends on |\n|---|---|---|\n| 01 | [Companies](part-3-modules/01-companies.md) | — |\n| 02 | [Roles, permissions and user accounts](part-3-modules/02-roles-permissions-users.md) | 01 |\n| 03 | [Email (SMTP), SMS and notifications](part-3-modules/03-email-sms-notifications.md) | 01 |\n| 04 | [Organization structure: branches, departments, positions, cost centres, grades, numbering](part-3-modules/04-organization-structure.md) | 01 |\n| 05 | [Employees](part-3-modules/05-employees.md) | 02, 04 |\n| 06 | [Recruitment and onboarding](part-3-modules/06-recruitment-and-onboarding.md) | 04, 05 |\n| 07 | [Employment contracts](part-3-modules/07-employment-contracts.md) | 05 |\n| 08 | [Attendance](part-3-modules/08-attendance.md) | 04, 05 |\n| 09 | [Access control and devices](part-3-modules/09-access-control-and-devices.md) | 05, 08 |\n| 10 | [Leave management](part-3-modules/10-leave-management.md) | 04, 05, 08 (holidays) |\n| 11 | [Payroll](part-3-modules/11-payroll.md) | 04, 05, 08, 10 |\n| 12 | [Staff finance (loans and advances)](part-3-modules/12-staff-finance-loans.md) | 05, 11 |\n| 13 | [Probation](part-3-modules/13-probation.md) | 05 |\n| 14 | [Movements and promotion](part-3-modules/14-movements-and-promotion.md) | 04, 05 |\n| 15 | [KPI and performance](part-3-modules/15-kpi-and-performance.md) | 04, 05 |\n| 16 | [Field operations](part-3-modules/16-field-operations.md) | 05 |\n| 17 | [Self-service and approvals (To do)](part-3-modules/17-self-service-and-approvals.md) | 02, 05 |\n| 18 | [Offboarding](part-3-modules/18-offboarding.md) | 05, 10, 11, 12 |\n| 19 | [Forms and feedback](part-3-modules/19-forms-and-feedback.md) | 05 |\n| 20 | [Reports, insights and monitoring](part-3-modules/20-reports-insights-and-monitoring.md) | 03 + data modules |\n\n> **Setup order note:** module numbers follow dependency order for *using* each module, but some **setup** must happen earlier: payroll setup (bank list, statutory schemes, salary approval) and contract templates must be ready **before new employees can be activated**. Always follow the [Master System Setup Guide](part-2-setup/01-master-setup-guide.md) for the configuration sequence.\n\n### Part 4 — Daily operations\n1. [Daily Operations Guide](part-4-daily-operations/01-daily-operations-guide.md) — routines by module (daily / weekly / monthly)\n2. [Role-based guides](part-4-daily-operations/02-role-based-guides.md) — what each role can see and do\n\n### Part 5 — Troubleshooting and support\n1. [Troubleshooting Guide and FAQ](part-5-troubleshooting/01-troubleshooting-guide.md)\n\n### Part 6 — Appendices\n1. [Glossary](part-6-appendices/01-glossary.md)\n2. [Configuration checklists](part-6-appendices/02-configuration-checklists.md)\n3. [Module dependency matrix and workflow diagrams](part-6-appendices/03-dependency-matrix-and-workflows.md)\n4. [Roles and permissions reference](part-6-appendices/04-roles-and-permissions-reference.md)\n5. [Not verified / known limitations](part-6-appendices/05-known-limitations.md)\n6. [Default role grants by module](part-6-appendices/08-default-role-grants.md)\n\n### Stand-alone deliverables\n- [Quick Start Guide](quick-start-guide.md)\n- [Administrator Guide](administrator-guide.md)\n\n## About screenshots\nScreenshots could not be captured while writing this version. Every place where a screenshot belongs is marked like this:\n\n> 📷 Screenshot: *page name – what to highlight*\n\nCapture them from the live system and replace the marker with the image.\n\n## HTML version\nOpen [html/hrms-user-manual.html](html/hrms-user-manual.html) in any browser. It is one self-contained file with a sidebar, search, dark mode, diagrams, previous/next links and a **Print all** button (prints or saves the whole manual as PDF). Viewing it needs an internet connection; it loads the Markdown and diagram renderers from a CDN.\n\nAfter editing any Markdown file, rebuild it from the project root:\n\n```bash\nnode docs/user-manual/_build/build-html.mjs\n```\n\n## Converting to Word/PDF\nWith [pandoc](https://pandoc.org) installed, from this folder:\n\n```bash\npandoc README.md part-1-getting-started/*.md part-2-setup/*.md part-3-modules/*.md \\\n  part-4-daily-operations/*.md part-5-troubleshooting/*.md part-6-appendices/*.md \\\n  -o HRMS-User-Manual.docx --toc\n```\n\nDiagrams are written as `mermaid` blocks; use a pandoc mermaid filter (e.g. `mermaid-filter`) to render them as images.\n\n## Keeping the manual up to date\nEach module is its own file. When a screen changes, update only that module file, then check whether the [Master Setup Guide](part-2-setup/01-master-setup-guide.md) or [checklists](part-6-appendices/02-configuration-checklists.md) refer to it.\n"},{"path":"quick-start-guide.md","title":"Quick Start Guide","md":"# Quick Start Guide\n\nEverything a new user needs on day one. Takes about 10 minutes.\n\n## Contents\n1. [Log in for the first time](#1-log-in-for-the-first-time)\n2. [Find your way around](#2-find-your-way-around)\n3. [Check your details](#3-check-your-details)\n4. [Check in and out](#4-check-in-and-out)\n5. [Apply for leave](#5-apply-for-leave)\n6. [See your payslip](#6-see-your-payslip)\n7. [Requests and approvals](#7-requests-and-approvals)\n8. [If you are a manager](#8-if-you-are-a-manager)\n9. [Getting help](#9-getting-help)\n\n## 1. Log in for the first time\n1. Open the invitation email from HR and click the link (valid for 72 hours), **or** use the username and temporary password HR gave you.\n2. Set your new password.\n3. If asked, set up two-factor authentication with an authenticator app and keep your backup codes safe.\n\n> Forgot your password? Click **Forgot password** on the login page. Details: [Login and navigation](part-1-getting-started/02-login-and-navigation.md).\n\n## 2. Find your way around\n- **Sidebar** (left): your modules. You only see what your role allows.\n- **Search** (top): type any page name, e.g. \"leave\".\n- **Bell** (top): your notifications.\n- **To do**: items waiting for you.\n- **Settings**: theme, colour, your preferences.\n\n> 📷 Screenshot: dashboard – highlight sidebar, search, bell\n\n## 3. Check your details\nOpen **Employees → My employee workspace → Profile**. If something is wrong, request an update — it goes to your manager, then HR.\n\n## 4. Check in and out\n- **Device:** use your fingerprint, PIN or card at the office terminal.\n- **Phone / web:** **Attendance → My attendance** → **Check in** (today's panel is at the top). Allow location access. You must be inside your branch area (or on the office Wi-Fi). If your company has a location privacy notice, acknowledge it first.\n- Forgot to punch? **Attendance → My attendance → Correction Requests** → create and submit.\n\n## 5. Apply for leave\n1. **Leave Management → My leave → Requests** → new request.\n2. Choose leave type and dates (full, half or short day).\n3. Attach a document if asked (e.g. sick note).\n4. Submit. Follow the status in the same list. Check remaining days in **Leave Management → My leave → Balances**.\n\n## 6. See your payslip\n**Finance → My finance → Payroll** — payslips appear after payroll is finalized each month.\n\n## 7. Requests and approvals\n- **Employees → My employee workspace**: ask for documents, resign, or change details.\n- **Employees → My employee workspace → My contracts**: sign your employment contract with a code from your authenticator app or email.\n- **Employees → My employee workspace → Onboarding**: complete tasks if you are new.\n- **Finance → My finance**: apply for a loan or salary advance (if offered).\n\n## 8. If you are a manager\n- Start each day in **To do**: approve leave, attendance corrections and profile updates.\n- **Employees → My team** shows your team's attendance, leave and actions.\n- Requests come to you from staff whose **Reports To** is you.\n\nMore: [Role-based guides](part-4-daily-operations/02-role-based-guides.md).\n\n## 9. Getting help\n- [Troubleshooting Guide and FAQ](part-5-troubleshooting/01-troubleshooting-guide.md)\n- Your HR department or system administrator.\n"},{"path":"part-1-getting-started/01-introduction.md","title":"1. Introduction","md":"# 1. Introduction\n\n## Contents\n- [1.1 What is Alliance HRMS?](#11-what-is-alliance-hrms)\n- [1.2 Who uses the system](#12-who-uses-the-system)\n- [1.3 Modules at a glance](#13-modules-at-a-glance)\n- [1.4 Ways to access the system](#14-ways-to-access-the-system)\n- [1.5 How this manual is organised](#15-how-this-manual-is-organised)\n- [1.6 Module names are the same for every role](#16-module-names-are-the-same-for-every-role)\n\n## 1.1 What is Alliance HRMS?\nAlliance HRMS is a web-based Human Resource Management System. It keeps your employee records, attendance, leave, payroll, staff loans, performance and approvals in one place.\n\nThe system can hold **more than one company**. Each company keeps its own employees, settings, roles and data. A platform administrator creates companies. A company administrator then sets up that company.\n\n> 📷 Screenshot: Dashboard home page – the sidebar on the left and the header bar at the top\n\n## 1.2 Who uses the system\n| User | What they typically do |\n|---|---|\n| Platform administrator | Creates and suspends companies, manages platform roles and permissions, watches mail and SMS delivery. |\n| Company administrator | Sets up the company: branches, departments, positions, roles, email (SMTP), SMS and other settings. |\n| HR staff | Manage employees, onboarding, leave, attendance, probation, movements and reports. |\n| Finance / payroll staff | Run payroll and manage staff loans and advances. |\n| Managers | Approve requests from their team and see team dashboards. |\n| Employees | Use self-service: view their profile, check in and out, apply for leave, see payslips and make requests. |\n\nWhat each person sees depends on the **roles and permissions** given to their user account. See [Roles and permissions overview](03-roles-and-permissions-overview.md).\n\n## 1.3 Modules at a glance\nThe sidebar shows only the modules you are allowed to use. The full list for a company is:\n\n| Sidebar item | What it is for |\n|---|---|\n| **Dashboard** | Your home page. It shows the dashboard that matches your role (HR, management, manager, employee and so on). |\n| **KPI & Performance** | Your own KPIs and performance (**My KPI & Performance**) and, for HR, **KPI Management**. |\n| **Forms & Feedback** | Forms and feedback collection. |\n| **To do** | Items waiting for you: **Employee Requests**, **Correction Requests** and **Profile Update Approvals**. |\n| **Access Control** | Company roles and permissions, plus door access devices, doors, groups, credentials and logs. |\n| **Attendance** | Check-in/out, shifts, timetables, attendance policies, holidays, geofences, devices and daily summaries. |\n| **Branches** | The company's branches (offices / locations). |\n| **Companies** | Company details and the users who belong to the current company. |\n| **Departments** | The company's departments. |\n| **Employees** | Employee directory, profiles, onboarding, offboarding, profile change approvals, recruitment. |\n| **Promotion** | Your promotion information (self-service). |\n| **Leave Management** | Leave types, policies, workflows, requests, balances, holidays and business trips. |\n| **Probation** | Probation policies, cases and team reviews. |\n| **Field** | Field visits, parties (customers) and the field map. |\n| **Finance** | Payroll, payroll deductions, your own payslips (**My finance**) and staff loans/advances (**Finance management**). |\n| **Movements** | Transfers, promotions and other employee movements. |\n| **Positions** | Job positions. |\n| **Structure** | Organisation structure items such as cost centres, grades and numbering. |\n| **Reports & Analytics** | Reports, downloads and scheduled reports. |\n| **Notifications** | Your notification inbox and the email (SMTP) and SMS setup. |\n| **Insights** | HR, management, manager and sales/field dashboards, readiness and identity change audit. |\n\nPlatform administrators see a shorter sidebar: **Companies**, **Access Governance** (**Roles**, **Permissions**) and **Notifications**.\n\nEach module has its own chapter in Part 3 of this manual.\n\n## 1.4 Ways to access the system\n- **Web app (main way).** Open the HRMS address in a modern browser (Chrome, Edge, Firefox or Safari). All features in this manual are described for the web app.\n- **Mobile app (employees).** A separate employee app for Android and iPhone exists. It covers self-service: sign-in (including two-factor codes), your profile, your leave requests and balances, and mobile check-in/check-out.\n- **Desktop app.** A desktop (Windows) wrapper also exists. It opens the same web screens inside an application window.\n\n> **Limitation:** The mobile and desktop apps are not covered step by step in this manual. Ask your administrator whether they are available in your company and how to install them.\n\n## 1.5 How this manual is organised\n| Part | Content |\n|---|---|\n| Part 1 – Getting started | This introduction, signing in and moving around, roles and permissions. |\n| Part 2 – Setup | The order in which to set up a new company. |\n| Part 3 – Modules | One chapter per module, step by step. |\n| Part 4 – Daily operations | Everyday tasks for HR, managers and employees. |\n| Part 5 – Troubleshooting | Common problems and how to fix them. |\n| Part 6 – Appendices | Glossary, permission lists and checklists. |\n\n## 1.6 Module names are the same for every role\n> **Verification in progress:** The sidebar naming change has automated coverage, but live checks across all roles and mobile devices are still outstanding.\n\nEvery module keeps the same name in the sidebar whatever your role: administrator, HR, manager or employee. Your role decides **which** modules and pages you can open, not what they are called.\n\nInside a module, your personal pages are grouped separately from the management pages:\n\n| Module | Your personal pages | Management pages (only with permission) |\n|---|---|---|\n| **Employees** | **My employee workspace**: Profile, Location privacy notice, Organization, History, Documents, Update details, Resignation, Onboarding, Offboarding, My contracts, and (for managers) Team overview, Team members, Team attendance, Team actions | **Employee management**, **Joining & onboarding** |\n| **Attendance** | **My attendance**: Attendance History (today's check-in panel is at the top), My Schedule, Correction Requests, Work-from-home Requests | Attendance Setup, Shift Management, Timetable Management, Attendance Operations, Biometric Access |\n| **KPI & Performance** | **My KPI & Performance** | **KPI Management** |\n| **Finance** | **My finance** | **Payroll**, **Finance management** |\n\nFor example, an employee and an HR manager both see **Attendance**. The employee sees only **My attendance** inside it; HR also sees the setup and operations groups.\n\nMenu paths in this manual are written in full, for example **Attendance → My attendance → Correction Requests**. If only one destination is available, the module may link directly to it. Pinned favourites identify the destination and may therefore use its page name. Search results can also show page or group names.\n"},{"path":"part-1-getting-started/02-login-and-navigation.md","title":"2. Signing In and Finding Your Way Around","md":"# 2. Signing In and Finding Your Way Around\r\n\r\n## Contents\r\n- [2.1 Signing in](#21-signing-in)\r\n- [2.2 Two-factor authentication (2FA)](#22-two-factor-authentication-2fa)\r\n- [2.3 First login: invitations and temporary passwords](#23-first-login-invitations-and-temporary-passwords)\r\n- [2.4 Forgot or reset your password](#24-forgot-or-reset-your-password)\r\n- [2.5 Verifying your email address](#25-verifying-your-email-address)\r\n- [2.6 Sessions and signing out](#26-sessions-and-signing-out)\r\n- [2.7 The screen layout](#27-the-screen-layout)\r\n- [2.8 Global search](#28-global-search)\r\n- [2.9 Notifications bell](#29-notifications-bell)\r\n- [2.10 Settings page](#210-settings-page)\r\n- [2.11 Help page](#211-help-page)\r\n- [2.12 Theme and colour](#212-theme-and-colour)\r\n- [2.13 Which dashboard you see](#213-which-dashboard-you-see)\r\n- [2.14 Switching company](#214-switching-company)\r\n- [2.15 Troubleshooting](#215-troubleshooting)\r\n- [2.16 Company sign-in and session management](#216-company-sign-in-and-session-management)\r\n\r\n## 2.1 Signing in\r\n\r\n### Feature: Sign in\r\n**Purpose:** Open the system with your work account.\r\n**Before you start:** You need a user account. HR creates it for you, usually by sending you an invitation (see 2.3).\r\n**Steps:**\r\n1. Open the HRMS web address. You are taken to the sign-in page (**Welcome back.**).\r\n2. Type your work email in **Email**.\r\n3. Type your password in **Password**. Click the eye icon to show or hide it.\r\n4. Leave **Remember me** ticked if you want the system to remember your email on this computer.\r\n5. Click **Sign in**.\r\n\r\n**Expected result:** The message **Checking your access…** appears, then your dashboard opens.\r\n\r\n**Important notes:**\r\n- The password must be at least 6 characters on this screen; new passwords must meet the stronger rules in 2.4.\r\n- If you get **Please check the email and password and try again.**, check for typing mistakes and Caps Lock.\r\n- Too many sign-in attempts in a short time (about 10 per minute) are blocked for a while. Wait a minute and try again.\r\n- There is no \"Sign in with Google/Microsoft\" (single sign-on) button. Only email and password are supported.\r\n\r\n> 📷 Screenshot: Sign-in page – Email, Password, Remember me, Forgot password? and Sign in\r\n\r\n## 2.2 Two-factor authentication (2FA)\r\nTwo-factor authentication adds a second step: after your password, you type a 6-digit code from an authenticator app on your phone (Google Authenticator, Authy, Microsoft Authenticator).\r\n\r\n### Feature: Sign in with 2FA\r\n**Steps:**\r\n1. Sign in with email and password as usual.\r\n2. The **Two-factor authentication** step appears. Type the code from your app in **Authentication code**.\r\n3. Click **Verify & continue**.\r\n\r\n**Important notes:**\r\n- If you have lost your phone, type one of your **backup codes** instead (10 characters, or 5-5 with a dash). Each backup code works once.\r\n- **Your 2FA session expired. Please sign in again.** means you waited too long. Click **Back to sign in** and start again.\r\n\r\n### Feature: Turn on 2FA for your account\r\n**Steps:**\r\n1. Open **Settings** (gear icon at the top right) → **Security** tab.\r\n2. Under **Security & Authentication**, click **Set up 2FA**.\r\n3. Scan the QR code with your authenticator app. If you cannot scan it, copy the **Manual secret** into the app.\r\n4. Type the 6-digit code in **Authenticator code** and confirm.\r\n5. Copy your **Backup codes** and store them somewhere safe.\r\n\r\n**Expected result:** **Two-factor authentication is now enabled. Save your backup codes.**\r\n\r\n**Important notes:**\r\n- **Regenerate backup codes** replaces any unused codes. You need a current code to do it.\r\n- To turn 2FA off, enter a current authenticator code in the disable section.\r\n- An administrator can **Require 2FA** for a user, **Make 2FA optional** again, or **Disable 2FA** (for example when a user lost their phone). See [Roles, permissions and users](../part-3-modules/02-roles-permissions-users.md).\r\n- The system recommends 2FA for administrator, HR, IT, auditor and payroll users, but does not force it unless an administrator ticks **Require 2FA** for the user.\r\n\r\n> 📷 Screenshot: Settings → Security – Set up 2FA, QR code and backup codes\r\n\r\n## 2.3 First login: invitations and temporary passwords\r\n\r\n### Feature: Accept an invitation\r\n**Purpose:** Create your password when HR invites you.\r\n**Before you start:** HR sends you an email (and sometimes an SMS) with an invitation link.\r\n**Steps:**\r\n1. Open the link. The page **Complete your registration** shows your name, email and the company that invited you.\r\n2. If you are new, type a password in **Create password** and again in **Confirm password**, then click **Complete registration**.\r\n3. If you already have an account (for example in another company), type your **Current password** and click **Join company**.\r\n4. When you see **Registration complete**, click **Continue to sign in**.\r\n\r\n**Important notes:**\r\n- **This invitation is no longer available.** or **This invitation link is incomplete. Ask HR to send a new invitation.** means the link was used, expired or cut off. Ask HR to resend it.\r\n- After registration you may be taken to an **onboarding** checklist to complete your details.\r\n\r\n### Feature: Change a temporary password\r\nIf an administrator gave you a temporary password (for example the first company administrator), the system opens **Set a new password** after sign-in: *\"Change the temporary password you received before you can continue.\"* You cannot use the rest of the system until you change it.\r\n\r\n1. Enter the temporary password, then your new password twice.\r\n2. Click **Update password**.\r\n\r\n## 2.4 Forgot or reset your password\r\n\r\n### Feature: Reset a forgotten password\r\n**Steps:**\r\n1. On the sign-in page click **Forgot password?**.\r\n2. Type your work email and click **Send reset link**.\r\n3. Open the email and click the link. The **Reset password** page opens.\r\n4. Type a new password twice and click **Reset password**.\r\n5. Sign in with the new password.\r\n\r\n**Password rules** (a strength meter shows them as you type):\r\n- At least 8 characters\r\n- One uppercase letter, one lowercase letter\r\n- One number\r\n- One special character\r\n\r\n**Important notes:**\r\n- Reset emails are limited to about 3 requests per hour.\r\n- **Reset token is missing. Open the link from your email again.** means the link was not opened completely.\r\n- The reset email is only sent if the company (or the system) has working email. See [Email, SMS and notifications](../part-3-modules/03-email-sms-notifications.md).\r\n\r\n### Feature: Change your password while signed in\r\nGo to **Settings → Security** and use the change password form (**Current password**, new password, **Re-enter new password**, then **Update password**).\r\n\r\n## 2.5 Verifying your email address\r\nUnder **Settings → Security** you see **Email is verified** or **Email is not verified**. If not verified, click **Resend verification** and open the link in your email. A verified email is used for account recovery and security alerts.\r\n\r\n## 2.6 Sessions and signing out\r\n- **Sign out:** click your name or picture at the bottom of the sidebar (account menu) → **Log out**.\r\n- **Automatic sign-out.** If your session expires or your access changes, you see **Your session expired. Please sign in again.** and return to the sign-in page. The server enforces the inactivity timeout and maximum session lifetime shown under **Settings → Security → Devices**. Section 2.16 explains the expiry warning and policy controls.\r\n- **Active sessions.** Open **Settings → Security → Devices** to see the browsers and devices signed in to your account, including when each one was last used. Choose **Revoke session** for another device, **Sign out this device** for the current one, or **Sign out all** for all devices.\r\n- **Token lifetimes.** The Devices tab shows how long access and refresh tokens last for your current session. Access renews in the background while the session and refresh token are valid. Renewing a token preserves the session's original maximum lifetime.\r\n\r\n> **Important:** If you think someone else knows your password, change it and then click **Sign out all**.\r\n\r\n## 2.7 The screen layout\r\n| Area | What it contains |\r\n|---|---|\r\n| **Sidebar** (left) | The modules you can open. Click a module to expand its pages. On a phone, tap the menu button (**Open navigation**). |\r\n| **Header** (top) | Search box, local time, **Refresh page data**, **Fullscreen**, the **Notifications** bell and **Settings** (gear). |\r\n| **Section tabs** | Inside a module, tabs or sub-menus take you to its pages (for example **Leave Management → Leave Types**). |\r\n| **Account menu** (bottom of sidebar) | Your name and picture, link to your profile, and **Log out**. |\r\n\r\nThe sidebar only shows pages your permissions allow. If a colleague sees a menu you do not, your roles are different (see [Roles and permissions overview](03-roles-and-permissions-overview.md)).\r\n\r\n> 📷 Screenshot: Dashboard – sidebar expanded and header icons labelled\r\n\r\n## 2.8 Global search\r\n### Feature: Search for a page\r\n1. Click **Search HRMS** in the header, or press **Ctrl K**.\r\n2. Type a word, for example \"leave\", \"payslip\" or \"smtp\".\r\n3. Use the **↑ ↓** arrow keys to move through results and **Enter** to open one.\r\n\r\n**Important notes:** Search finds **pages** (screens), not individual employees or records. It only lists pages you are allowed to open. **No matching pages** means there is no page with that word that you can access.\r\n\r\n## 2.9 Notifications bell\r\nThe bell in the header shows your in-app notifications (for example leave approvals or tasks waiting for you).\r\n- Filter the list by category (**General**, **Requests**, **Mentions**) and show **Unread** ones.\r\n- Click **Mark read** on one item, or **Dismiss all**.\r\n- Items are grouped by time (**Yesterday**, **Last week**, **Earlier**). Click **Load more notifications** for older ones.\r\n- The gear icon (**Notification settings**) opens your notification preferences.\r\n\r\nThe full inbox is also at **Notifications → Current notifications**.\r\n\r\n## 2.10 Settings page\r\nOpen it with the gear icon in the header (**Open settings**). It has three tabs:\r\n\r\n| Tab | What you can do |\r\n|---|---|\r\n| **Profile** | See your profile and change your **Profile Picture** (choose a **Default avatar** or **Upload your own image** – PNG, JPG or WEBP). Administrators also see **Manage avatars** (company default avatars). |\r\n| **Security** | Change your password, set up or turn off 2FA, regenerate backup codes, see and revoke **Active sessions**, verify your email. |\r\n| **Notifications** | **Notification Preferences**: choose which channels (in-app, email, SMS, browser push) alert you for leave, onboarding, offboarding, attendance, KPI and system events. Rows marked **Default on** are enabled unless you turn them off or an administrator disables delivery system-wide. Use **Search notification types** to find a row. |\r\n\r\n## 2.11 Help page\r\n**Help** (search \"help\") shows:\r\n- **Keyboard** shortcuts (**Ctrl K**, arrow keys, **Enter**).\r\n- **Sign-in** guidance.\r\n- **Pages you can open** – a list of the areas you have access to, each with a short hint. If you see **No other pages are available for your access.**, ask your administrator for the right role.\r\n\r\n## 2.12 Theme and colour\r\n- **Light / dark / system theme:** use the theme button (sun/moon) in the header or on the sign-in page.\r\n- **Accent colour:** pick an accent colour, or click **Customize color** to choose your own. This only changes how the screen looks for you.\r\n\r\n## 2.13 Which dashboard you see\r\nWhen you open **Dashboard**, the system chooses a home page from your roles and permissions:\r\n\r\n| Your access | Home dashboard |\r\n|---|---|\r\n| Platform administrator | Platform dashboard: **Company administration**, **Access governance**, **Notification operations**, **Delivery services** |\r\n| Company administrator or HR | Full company workforce dashboard |\r\n| Management / line manager / sales-field | Matching Insights dashboard with KPI widget |\r\n| Employee (self-service) | Employee home: your attendance, leave, profile completion and tasks |\r\n\r\nYou cannot choose the dashboard yourself; it follows your permissions.\r\n\r\n## 2.14 Switching company\r\nIf your login has active memberships in multiple companies, open the account menu in the header. Under **Switch company**, choose the company you want. The current company is marked **(current)**. The dashboard reloads with the selected membership’s roles, permissions and employee profile. A platform administrator with company access can also use **Companies → Switch to this company**.\r\n\r\n## 2.15 Troubleshooting\r\n| Problem | Cause | Solution |\r\n|---|---|---|\r\n| **Please check the email and password and try again.** | Wrong email or password | Re-type carefully, or use **Forgot password?**. |\r\n| **Please verify your email address before continuing.** | Email not verified | Open the verification email or request a new one. |\r\n| **We couldn’t connect to the sign-in service.** | No internet or server down | Check your connection; try later; tell IT. |\r\n| No reset email arrives | Email (SMTP) not set up, spam folder, or limit reached | Check spam; wait an hour; ask the administrator to check **Mail Logs**. |\r\n| Menu item missing | Your role lacks the permission | Ask your administrator. |\r\n| Sent back to sign-in suddenly | Session expired or was revoked | Sign in again. |\r\n| 2FA code rejected | Phone clock wrong, or code expired | Set the phone time to automatic; use the newest code or a backup code. |\r\n\r\n## 2.16 Company sign-in and session management\r\n\r\n### Sign in and recover access\r\n\r\nUse **Sign in with SSO** on the web sign-in page after linking your company identity. Enter the company sign-in code supplied by your administrator, sign in with your identity provider in the same browser tab, and complete your HRMS authenticator challenge if prompted. HRMS opens the linked account in that company. Your assigned memberships and permissions control access when you switch company.\r\n\r\nFor first-time linking, sign in with your HRMS password. Open **Settings → Security → Devices → My company sign-in**, enter your current HRMS password and choose **Link company identity**. Complete the provider sign-in in the same tab. HRMS binds that provider identity to your existing account. Matching email addresses alone do not create a link. Use **Unlink identity** with your HRMS password to remove the link.\r\n\r\nIf the provider is unavailable, use your HRMS password and existing authenticator or backup code. Use **Forgot password?** for password recovery. If the SSO request expires, start again in the same tab. Ask your administrator to check the company code, registration and membership if the provider accepts your credentials but HRMS cannot finish sign-in. Signing out ends the HRMS session. On a shared device, sign out of the identity provider as well.\r\n\r\n### Configure and test a company provider\r\n\r\n1. Have the deployment administrator approve the exact HTTPS issuer in `OIDC_ALLOWED_ISSUERS`, configure the server field-encryption keyring and set `APP_FRONTEND_URL` to the public HTTPS frontend URL. For Microsoft Entra, use the tenant-specific v2.0 issuer. If discovery advertises an endpoint on another host, the deployment administrator must approve its HTTPS origin in `OIDC_ENDPOINT_ORIGINS`.\r\n2. In the selected company, an administrator with `company_users:manage` opens **Settings → Security → Devices → Company identity provider**. Register the displayed redirect URI as a web application callback at the provider. Enter the issuer URL, client ID and client secret, then choose **Save registration**. HRMS encrypts the secret on the server. The settings screen never returns a saved secret.\r\n3. Choose **Test provider sign-in** and complete the provider sign-in. HRMS checks the callback and signed identity token before recording a successful test. Choose **Enable SSO** and distribute the displayed company code. Changing registration details pauses SSO until a new test succeeds and an administrator enables it again.\r\n4. Test password recovery and a linked, non-production account before rollout. A real provider registration, its credentials in the authorized environment and a successful live sign-in are deployment-specific prerequisites. A successful automated provider test does not establish that a particular Entra tenant is configured.\r\n\r\n### Session limits, warnings and devices\r\n\r\n**Settings → Security → Devices** shows the policy for your current sign-in and your active devices. **Revoke session** signs out a selected device. **Sign out all** revokes every HRMS session for your account.\r\n\r\n- Access tokens renew automatically while the session is valid. Each refresh token is single-use. The absolute lifetime runs from sign-in and a renewal cannot extend it.\r\n- Interaction with the application updates the inactivity deadline. An open, unattended tab can time out while background updates continue. A warning appears during the final minute. Choose **Stay signed in** to extend an idle session. At the absolute deadline, save your work and sign in again.\r\n- A platform owner can open **Session policy** under **Settings → Security → Devices**. The form accepts access lifetimes of 60–3,600 seconds, refresh lifetimes of 300–7,776,000 seconds, absolute lifetimes of 3,600–7,776,000 seconds, inactivity timeouts of 300–86,400 seconds and 1–50 simultaneous sessions per account. The access lifetime must fit within the refresh lifetime.\r\n- Saved policies take effect at the next sign-in. Existing sessions retain the settings issued to them. When a new sign-in reaches the device limit, HRMS revokes the oldest active sign-ins for that account. Before an administrator saves a policy, the installation supplies the token and absolute lifetimes. The initial inactivity timeout is 30 minutes and the initial device limit is five.\r\n- An administrator with `company_users:manage` can open **Manage active sessions** and confirm revocation of a device in their authorized scope. Company administrators manage company-user sessions in their active company. Users with `security_events:read` can open **Authentication events** to review sign-ins, failed attempts, identity links, policy changes and revocations within their scope.\r\n"},{"path":"part-1-getting-started/03-roles-and-permissions-overview.md","title":"3. Roles and Permissions – Overview","md":"# 3. Roles and Permissions – Overview\n\n## Contents\n- [3.1 Key ideas](#31-key-ideas)\n- [3.2 Two levels: platform and company](#32-two-levels-platform-and-company)\n- [3.3 Permissions](#33-permissions)\n- [3.4 Roles](#34-roles)\n- [3.5 Data scope: whose records you can see](#35-data-scope-whose-records-you-can-see)\n- [3.6 Default roles](#36-default-roles)\n- [3.7 How the sidebar hides items](#37-how-the-sidebar-hides-items)\n- [3.8 Common questions](#38-common-questions)\n- [3.9 Permission keys](#39-permission-keys)\n\n## 3.1 Key ideas\n| Term | Meaning |\n|---|---|\n| **User account** | Your login (email and password). One user account can belong to several companies. |\n| **Employee** | The HR record of a person (job, salary, leave…). An employee is usually linked to a user account so they can sign in. |\n| **Permission** | One allowed action, for example \"read employees\" or \"approve leave\". |\n| **Role** | A named bundle of permissions, for example **HR Officer**. |\n| **Data scope** | A special permission that limits *which records* you see: whole company, your branch, your department, your team or only yourself. |\n\nYou get access by being given **roles** (and, rarely, single **direct permissions**) in a company.\n\n```mermaid\nflowchart LR\n  U[User account] -->|member of| C[Company]\n  U -->|has| R[Roles in that company]\n  U -->|may have| DP[Direct permissions]\n  R --> P[Permissions]\n  DP --> P\n  P --> S[Sidebar pages and buttons you can use]\n  P --> D[Data scope: company / branch / department / team / self]\n```\n\n## 3.2 Two levels: platform and company\n- **Platform level** – the people who run the whole system. They create and suspend companies and maintain the master list of permissions. Their sidebar shows **Companies**, **Access Governance** and **Notifications** only.\n- **Company level** – everyone working inside a company (administrator, HR, finance, managers, employees). Roles are **per company**: a role created in Company A does not exist in Company B. If you belong to two companies you can have different roles in each.\n\nA platform administrator can enter a company (**Switch to this company**) to work inside it.\n\n## 3.3 Permissions\n- Permissions are a fixed catalogue maintained at platform level. Only platform users can create or change permissions (company users get *\"Only platform-scoped users can create permissions\"*).\n- Each permission has a key (for example `leave_requests:approve`), a display name, a description and a **Module** it belongs to.\n- Administrators see the catalogue under **Access Governance → Permissions** (platform) or **Access Control → Permissions** (company).\n- A platform administrator can turn the roles and permissions pages on or off for each company (**Enable roles**, **Enable permissions** on the company).\n\n## 3.4 Roles\n- A role is created with a **Display name**, a **Key**, an optional **Description** and a list of **Permissions**.\n- Roles marked **System** come from the default set; roles you create are marked **Custom**.\n- You can start a new role from **Suggested roles** and then remove what you do not need.\n- A user can have several roles. Their permissions add up.\n- Administrators can also give a person a single **direct permission** without a role (company **Manage member access**). Use this sparingly.\n\n## 3.5 Data scope: whose records you can see\nSome permissions decide *how wide* your view is:\n\n| Data scope permission | You see records of… |\n|---|---|\n| `data_scope:company` | Everyone in the active company |\n| `data_scope:branch` | Only branches assigned to you |\n| `data_scope:department` | Only departments assigned to you or that you manage |\n| `data_scope:team` | Yourself and your direct reports |\n| `data_scope:self` | Only yourself |\n\nIf a user has only `data_scope:self`, the system hides HR workspaces (employee directory, leave administration, operations) even if other read permissions are present, and shows only their personal pages.\n\n## 3.6 Default roles\nEvery company receives these roles (they can be adjusted afterwards):\n\n| Role | Purpose |\n|---|---|\n| **Company Admin** | Company setup, users, branches, departments, roles and all settings. |\n| **HR Manager** | All HR operations: employees, leave, attendance, onboarding, offboarding, shifts, reports. |\n| **HR Officer** | Daily HR work: employee records, documents, leave review, attendance, onboarding tasks. |\n| **Department Manager** | Manages and approves for their department. No HR lifecycle powers. |\n| **Branch Manager** | Same as Department Manager but for their branch. |\n| **Employee** | Self-service only: own profile, attendance, leave and requests. |\n| **Finance** | Payroll, staff loan deductions and repayments, salary payment reports. |\n| **Management** | Company-wide read-only management dashboards and reports. |\n| **IT Administrator** | User accounts, sign-in security, access-control devices. |\n| **Attendance Administrator** | Attendance policies, shifts, devices, corrections and processing. |\n| **Leave Administrator** | Leave types, policies, balances, workflows and HR leave approvals. |\n| **Auditor** | Read-only access to reports, logs, HR data and compliance records. |\n\nPlatform roles: **Platform Super Admin**, **Platform Administrator**, **Platform Support**, **Platform Auditor**. See [Roles, permissions and users](../part-3-modules/02-roles-permissions-users.md) for details.\n\n## 3.7 How the sidebar hides items\n- After sign-in the system loads your permissions for the active company.\n- Every page has a required permission. If you have none of the required permissions, the page is **not shown** in the sidebar, in search or on the Help page.\n- If a whole module has no page you can open, the module disappears.\n- Buttons inside a page (for example **Create role**, **Delete**) also appear only if you have the matching create/update/delete permission.\n- The server checks permissions again on every action, so hiding is not the only protection. If you open a link you are not allowed to use, you are redirected or see *\"You do not have permission to perform this action\"*.\n- The server checks your current grants on the next protected request. The dashboard refreshes your menu periodically and when you return to the tab.\n\n## 3.8 Common questions\n| Question | Answer |\n|---|---|\n| Why can my colleague see a menu I cannot? | Your roles differ. Ask the company administrator. |\n| I was given a role but nothing changed. | Check the active company in the account menu, then return to the dashboard tab. If the item is still missing, ask the administrator to verify your action permission and data scope in that company. |\n| Can I have different access in two companies? | Yes. Roles are per company. |\n| Who can create new permissions? | Only platform administrators. Companies build roles from the existing catalogue. |\n\n## 3.9 Permission keys\nEach assignable permission has one `module:action` key. Search the catalogue in **Access Control → Permissions**. A user’s active roles and direct grants combine within their current company. An operation on employee records also requires a matching data scope. See the [default role grants](../part-6-appendices/08-default-role-grants.md).\n"},{"path":"part-1-getting-started/04-mobile-desktop-and-offline.md","title":"4. Mobile App, Desktop App and Offline Use","md":"# 4. Mobile App, Desktop App and Offline Use\n\nThe HRMS can be used in three ways: the web browser, the **mobile app** (Android and iPhone), and a **desktop app** (Windows). This chapter explains what each gives you and what happens when you lose your internet connection.\n\n## 4.1 Web browser (installable)\n\n- You can use HRMS in any modern browser.\n- The web app can be installed like an app (\"HRMS is still installed…\"). It stores only the sign-in page, the offline page and icons on your device.\n- **If you lose your connection**, pages that need fresh data show **You're currently offline** with the message \"HRMS is still installed, but this page needs a network connection to load fresh data. Reconnect and try again.\" Click **Retry** after reconnecting, or **Go to sign in**.\n- Your data is **not** saved offline in the browser. Do not fill long forms while offline.\n\n> 📷 Screenshot: Offline page – the **Retry** and **Go to sign in** buttons\n\n## 4.2 Mobile app (employee self-service)\n\nThe mobile app is for employees. It uses the same account and permissions as the website. Main tabs: **Home**, **Attendance**, **Leave**, **Settings** (plus profile and other screens).\n\nWhat you can do:\n- **Clock in and out** from your phone. Your location is included with the attendance record. If your workplace requires it, **Scan attendance QR checkpoint** before punching. If your shift allows it, choose **Working remotely** (the app warns \"Your assigned shift must allow remote attendance.\") and give a **Location exception reason** if needed.\n- View your **Punch history** and hours worked.\n- Request leave and view balances.\n- **Field visits**: check in and out of customer visits, and **Add opportunity**.\n- Receive notifications.\n\n**Offline behaviour in the mobile app:**\n- If you clock in or out without a connection, the app saves the punch securely on the phone: \"Check-in saved securely on this device. It will be submitted for manager review when you are online.\" Punches sent later go to your manager for review.\n- Field visit check-in, check-out and new opportunities are also saved and sent when you are back online (\"Check-in saved securely and will sync when you are online.\").\n- Field visit events older than **3 days** are refused when they finally sync. Open the app online regularly.\n- If the server rejects a saved item, it is marked for review. You can discard it (**Discard rejected action**) or clear reviewed copies (**Clear reviewed local copies**).\n\n**Before first use:** acknowledge the company **location privacy notice** (see [Field Operations](../part-3-modules/16-field-operations.md)) and allow location access for the app.\n\n## 4.3 Desktop app (Windows)\n\nThe desktop app opens the same HRMS screens in its own window, starting at the dashboard. Links to other websites open in your normal browser. It needs a network connection to the HRMS server, like the website.\n\n## 4.4 Not verified / limitations\n- How the mobile app is distributed (app store, company download) and the server address it connects to are set by your IT team; not verified.\n- The full list of mobile screens and their exact labels was only partly verified.\n- The desktop app has no offline mode of its own.\n"},{"path":"part-2-setup/01-master-setup-guide.md","title":"Master System Setup Guide","md":"# Master System Setup Guide\n\nThis guide takes you through setting up the HRMS from an empty installation to a company that is ready for daily use. Follow the phases **in order**. Each step lists what it needs first, so you do not hit \"missing setup\" errors later.\n\n## Contents\n- [How to read this guide](#how-to-read-this-guide)\n- [Setup at a glance](#setup-at-a-glance)\n- [Phase 0 — System installation (one time)](#phase-0--system-installation-one-time)\n- [Phase 1 — Company and administrator](#phase-1--company-and-administrator)\n- [Phase 2 — Communication: email and SMS](#phase-2--communication-email-and-sms)\n- [Phase 3 — Roles and access](#phase-3--roles-and-access)\n- [Phase 4 — Organization structure](#phase-4--organization-structure)\n- [Phase 5 — Attendance foundations](#phase-5--attendance-foundations)\n- [Phase 6 — Leave](#phase-6--leave)\n- [Phase 7 — Payroll foundations](#phase-7--payroll-foundations)\n- [Phase 8 — Hiring, onboarding and contracts](#phase-8--hiring-onboarding-and-contracts)\n- [Phase 9 — Bring in employees](#phase-9--bring-in-employees)\n- [Phase 10 — Employee-level setup](#phase-10--employee-level-setup)\n- [Phase 11 — Optional modules](#phase-11--optional-modules)\n- [Phase 12 — Go-live verification](#phase-12--go-live-verification)\n- [Configuration levels explained](#configuration-levels-explained)\n- [Change-later reference](#change-later-reference)\n\n---\n\n## How to read this guide\n\nEach step shows:\n\n| Label | Meaning |\n|---|---|\n| **Mandatory** | The system or a later step will not work without it |\n| **Recommended** | It works without it, but results will be wrong or incomplete |\n| **Optional** | Only if your organization uses that feature |\n| **Scope** | Where the setting applies: *System*, *Company*, *Branch*, *Department*, *Employee*, or *Device* |\n| **Once / Changeable** | Whether you set it once or can safely change it later |\n\nDetailed screen-by-screen instructions are in the module manual linked from each step.\n\n## Setup at a glance\n\n```mermaid\nflowchart TD\n  P0[0. Installation & seed data] --> P1[1. Company + first admin]\n  P1 --> P2[2. Email SMTP / SMS]\n  P1 --> P3[3. Roles & access]\n  P1 --> P4[4. Branches → Departments → Positions → Grades / Cost centres → Employee numbering]\n  P4 --> P5[5. Attendance: policy, holidays, locations, devices, shifts, timetables]\n  P5 --> P6[6. Leave: types, policies, workflows]\n  P4 --> P7[7. Payroll: banks, calendar, components, statutory, structures]\n  P7 --> P8[8. Onboarding workflow, contract templates, signatories]\n  P2 --> P9\n  P3 --> P9[9. Employees: invite / register / import]\n  P8 --> P9\n  P9 --> P10[10. Per-employee: Reports To, salary, bank, contract, schedule, balances, device enrolment → Activate]\n  P10 --> P11[11. Optional: Probation, KPI, Movements, Finance loans, Field, Forms, Reports]\n  P11 --> P12[12. Go-live checks]\n```\n\n> **Why payroll comes before employees:** a new employee only becomes **Active** after HR activation, and activation is refused until the employee has a tax number (TIN), pension and health enrolment, a verified bank account, a salary approved by a second person, and a signed contract covering the hire date. Those need the payroll and contract setup from Phases 7–8. See [Recruitment and onboarding](../part-3-modules/06-recruitment-and-onboarding.md).\n\n---\n\n## Phase 0 — System installation (one time)\n\n| | |\n|---|---|\n| **Who** | IT / installer (not done in the web screens) |\n| **Scope** | System |\n| **Once / Changeable** | Once |\n\n**What:** Install the application and database, load the seed data (permission catalogue, platform roles, default company roles), and set server settings: the fallback mail server, approved SMS provider endpoints, field encryption and file storage. Authorized administrators configure the SMS account and session policy in HRMS.\n\n**Why:** Everything else depends on the permission catalogue and the platform administrator account.\n\n**Verify:** The platform administrator can log in at the login page and sees **Companies** and **Access Governance** in the sidebar.\n\nOpen **Platform SMS → Global → SMS gateway** to configure the account and sender short code. For identity-provider configuration and recovery, see Section 2.16 of the sign-in guide.\n\n---\n\n## Phase 1 — Company and administrator\n\n### Step 1.1 Create the company — **Mandatory** · Company · Once (name/timezone changeable)\n- **Where:** **Companies → Create company** (platform administrator).\n- **Fields:** company name, slug (short web name), timezone, first administrator's name, email, phone (+255/+256 format) and temporary password, **Enable roles/permissions**.\n- **What happens:** the 12 default company roles are created automatically and the first administrator receives **Company Admin**.\n- **Manual:** [Companies](../part-3-modules/01-companies.md)\n\n### Step 1.2 First administrator sign-in — **Mandatory** · User · Once\n- Log in with the temporary password; you are forced to set a new password.\n- Set up two-factor authentication (2FA). It is recommended for admin, HR, IT, payroll and auditors.\n- **Manual:** [Login and navigation](../part-1-getting-started/02-login-and-navigation.md)\n\n### Step 1.3 Company settings — **Recommended** · Company · Changeable\n- Company details, **Default Avatars** (Settings → Default Avatars).\n- Open **Bank directory** in the company administration sidebar (`/dashboard/settings/banks`). Authorized users can add, edit, deactivate or delete directory entries. Existing employee bank-account history is retained.\n\n**Before proceeding:** you can log in as the company admin and the company appears active.\n\n---\n\n## Phase 2 — Communication: email and SMS\n\n### Step 2.1 Email (SMTP) — **Mandatory in practice** · Company · Changeable\n- **Where:** **Notifications → Mail / SMTP configuration**.\n- Add the server (port 587 with STARTTLS, or 465 with SSL/TLS), **Test** it, then mark it **Default**.\n- **Why:** invitations, password resets, approvals, contract signing codes and scheduled reports are sent by email. Scheduled reports are **refused** until a *tested default* SMTP exists. If no company SMTP exists, the system-wide fallback mail server is used.\n\n### Step 2.2 SMS and notification channels — **Optional** · Company · Changeable\n- **Where:** **Notifications → SMS configuration** (overview, registry, logs) and channel settings.\n- Company SMS delivery requires an enabled gateway, both the platform and company SMS switches, and an enabled entry for the message type.\n\n**Verify:** send a test email and (if used) a test SMS; check **Mail Logs** / **SMS logs** show \"sent\".\n**Manual:** [Email, SMS and notifications](../part-3-modules/03-email-sms-notifications.md)\n\n---\n\n## Phase 3 — Roles and access\n\n### Step 3.1 Review default roles — **Mandatory** · Company · Changeable\n- **Where:** **Access Control → Roles / Permissions** (or **Access Governance**).\n- Default company roles: Company Admin, HR Manager, HR Officer, Department Manager, Branch Manager, Employee, Finance, Management, IT Admin, Attendance Admin, Leave Admin, Auditor.\n- Check each role's **data scope** (company / branch / department / team / self). A role limited to *self* will not see HR workspaces.\n\n### Step 3.2 Create custom roles if needed — **Optional**\n- Some modules check **role names**, not only permissions: KPI (only Company Admin or HR Manager can create reporting periods) and Recruitment (needs `employees:create` or an HR role). Keep the default role names for these users.\n\n**Manual:** [Roles, permissions and users](../part-3-modules/02-roles-permissions-users.md), [Roles and permissions reference](../part-6-appendices/04-roles-and-permissions-reference.md)\n\n---\n\n## Phase 4 — Organization structure\n\nCreate in this exact order. **Manual:** [Organization structure](../part-3-modules/04-organization-structure.md)\n\n| # | Step | Status | Scope | Needs |\n|---|---|---|---|---|\n| 4.1 | **Branches** | Mandatory | Company | 1.1 |\n| 4.2 | **Departments** (parent before child; no branch = company-wide) | Mandatory | Branch / company | 4.1 |\n| 4.3 | **Positions** (branch, departments, Reports To Position, Manager Position, staffing limit) | Mandatory for recruitment & movements | Branch / department | 4.2 |\n| 4.4 | **Grades** (Structure → Grades) | Optional (needed for grade-based leave policies) | Company | 4.1 |\n| 4.5 | **Cost centres** (department must belong to the branch) | Optional (payroll accounting) | Branch / department | 4.2 |\n| 4.6 | **Employee numbering** (Structure → Numbering) | **Mandatory before the first employee** | Company | 1.1 |\n\n> **Important:** if numbering is missing, creating employees fails. The next number can never be lowered.\nSet **Department manager** in **Departments**. For a reporting-manager step, **Reports To** on the employee takes precedence over the eligible holder of **Reports To Position**. Set company-wide staffing enforcement under **Positions → Department staffing policy**.\n\n**Verify:** the structure lists show all branches/departments/positions; Numbering shows the prefix and next number.\n\n---\n\n## Phase 5 — Attendance foundations\n\n**Manuals:** [Attendance](../part-3-modules/08-attendance.md), [Access control and devices](../part-3-modules/09-access-control-and-devices.md)\n\n| # | Step | Status | Scope |\n|---|---|---|---|\n| 5.1 | **Attendance policy**, then activate it (one active per company). The Policies page has a quick-start checklist. | Mandatory (if attendance is used) | Company |\n| 5.2 | **Holiday group → Holidays** (Attendance Setup). Branch-specific holidays are maintained here. | Mandatory if holiday mode is on | Company / branch |\n| 5.3 | **Geofences** and/or **Wi-Fi networks** | Mandatory for mobile/web check-in | Branch |\n| 5.4 | **Register devices** (Access Control → Devices): Test connection, Sync. Use Sync Mode **PULL** (PUSH is offered but rejected). | Optional (biometric) | Device |\n| 5.5 | **Checkpoints** (Device / GPS / Wi-Fi / QR / Manual) on the active policy | Mandatory | Policy |\n| 5.6 | **Shifts → Shift breaks** | Mandatory | Company (opt. branch/dept) |\n| 5.7 | **Timetables → Days → Shift options → Holiday rules** | Mandatory | Company / branch |\n| 5.8 | Optional access control: week plans → templates → doors → organizations/groups → Sync Group | Optional | Device |\n\nSchedule assignment to employees happens in Phase 10.\n\n**Location privacy notice** (Field → privacy / *My location privacy*): if your company publishes a notice that requires acknowledgement, employees cannot clock in on mobile or check in to field visits until they acknowledge it. Publish it now if you need one. See [Field operations](../part-3-modules/16-field-operations.md).\n\n---\n\n## Phase 6 — Leave\n\n**Manual:** [Leave management](../part-3-modules/10-leave-management.md)\n\n| # | Step | Status | Scope |\n|---|---|---|---|\n| 6.1 | **Holidays** (Leave Management → Holidays — company-wide only; branch holidays come from Phase 5.2) | Mandatory | Company |\n| 6.2 | **Leave Types** | Mandatory | Company |\n| 6.3 | **Policies** (versioned; need approval by a second person; scope by branch/department/position/grade/employment type) | Mandatory | Company → scoped |\n| 6.4 | **Workflows** (per leave type or default; steps by role/position/person). Fallback if none: department manager → reporting manager (employee assignment or parent position) → existing escalation | Recommended | Company / branch / department |\n| 6.5 | Statutory rules and comp-off rules | Optional | Company |\n| 6.6 | Leave payroll tax treatment + payroll components (after Phase 7) | Mandatory if encashment is paid | Company |\n\nOpening balances are loaded in Phase 10.\n\n> Encashment and sick-pay calculations should be signed off by Legal and Finance before go-live.\n\n---\n\n## Phase 7 — Payroll foundations\n\n**Manual:** [Payroll](../part-3-modules/11-payroll.md)\n\n| # | Step | Status | Scope |\n|---|---|---|---|\n| 7.1 | Bank directory (if not done in 1.3) | Mandatory | Company |\n| 7.2 | **Payroll calendar** (set default) | Mandatory | Company |\n| 7.3 | **Pay components** (earnings, deductions) | Mandatory | Company |\n| 7.4 | **Statutory schemes + rule versions** (tax, pension, health…) — second-person approval | Mandatory | Company |\n| 7.5 | **Salary structures** | Mandatory | Company |\n| 7.6 | Payroll groups / assignments | Optional | Branch / dept / employee |\n| 7.7 | Accounting mappings (cost centres from 4.5) | Recommended | Company |\n| 7.8 | Overtime, bonus, leave rules | Optional | Company |\n| 7.9 | **Run approval workflows** (HR → Finance → Management) | Mandatory | Company / branch / group |\n| 7.10 | Attendance deduction policy (inactive = no deductions) | Optional | Company |\n\n> Every approval in payroll uses **maker-checker**: the person who prepares something cannot approve it.\n\n---\n\n## Phase 8 — Hiring, onboarding and contracts\n\n**Manuals:** [Recruitment and onboarding](../part-3-modules/06-recruitment-and-onboarding.md), [Employment contracts](../part-3-modules/07-employment-contracts.md)\n\n| # | Step | Status | Scope |\n|---|---|---|---|\n| 8.1 | Contract company details, **templates per contract type**, default and backup **signatory**, signatory rules | Mandatory (activation needs a signed contract) | Company |\n| 8.2 | **Onboarding workflow** with steps; set as default | Recommended | Company |\n| 8.3 | Acknowledgement document | Optional | Company |\n| 8.4 | Exit workflow and notice policies (for later offboarding) | Recommended | Company |\n\n---\n\n## Phase 9 — Bring in employees\n\n**Manual:** [Employees](../part-3-modules/05-employees.md)\n\nChoose one route per person:\n1. **Recruitment → offer accepted** → automatic invitation + onboarding.\n2. **Invite** an employee (email invitation, valid 72 hours by default) — needs SMTP (Phase 2).\n3. **Register** directly as HR.\n4. **Import** in bulk (if your role has it).\n\nAlways set **Reports To** — it drives approvals for leave, corrections, profile updates and probation. Link the employee to a **user account** and assign roles (Employee by default; manager or HR roles as needed).\n\n---\n\n## Phase 10 — Employee-level setup\n\nFor each employee (or in bulk where offered):\n\n| # | Item | Where | Needed for |\n|---|---|---|---|\n| 10.1 | Reports To manager, position, department, branch | Employee profile | All approvals |\n| 10.2 | TIN, pension and health enrolment | Employee profile / payroll profile | Activation, payroll |\n| 10.3 | Bank account (verified) | Employee profile | Activation, payroll |\n| 10.4 | Payroll profile + salary (approved by a second person) | Payroll | Activation, payroll |\n| 10.5 | Contract created, company signs, employee signs | Contracts | Activation |\n| 10.6 | Schedule: employee timetable, shift assignment, rotation, or published generated schedule | Attendance | Attendance, payroll OT |\n| 10.7 | Device enrolment (fingerprint / PIN / card) | Access Control → Devices / Biometric access | Biometric attendance |\n| 10.8 | Exemption (if not tracked) | Attendance → Exemptions | Attendance |\n| 10.9 | Leave balances: **Generate** for the year, then **Balance Import** (Excel) for opening balances | Leave Management | Leave |\n| 10.10 | **Activate** (complete onboarding) | Onboarding | Employee becomes Active |\n\nSchedule precedence when more than one applies: dated shift schedule → published generated schedule → shift assignment → employee timetable → company default timetable.\n\n---\n\n## Phase 11 — Optional modules\n\n| Module | Key setup order | Manual |\n|---|---|---|\n| Probation | Policy (criteria weights = 100; default 180 days if none) → cases auto-created on activation | [13](../part-3-modules/13-probation.md) |\n| Movements & promotion | Structure with headcount → approver permissions → salary structures | [14](../part-3-modules/14-movements-and-promotion.md) |\n| KPI & performance | Reporting period → KPIs → assignments + targets → scoring policy → scorecards → review criteria → review period → enrol | [15](../part-3-modules/15-kpi-and-performance.md) |\n| Staff finance (loans) | Products (+tiers) → sanction letter → delegations → bank/ERP → migration. Needs payroll working | [12](../part-3-modules/12-staff-finance-loans.md) |\n| Field operations | Privacy notice → parties → commercial policy → activity categories | [16](../part-3-modules/16-field-operations.md) |\n| Forms & feedback | Grant `forms_feedback:manage` → create forms | [19](../part-3-modules/19-forms-and-feedback.md) |\n| Reports & scheduled reports | Tested default SMTP → templates → schedules | [20](../part-3-modules/20-reports-insights-and-monitoring.md) |\n\n---\n\n## Phase 12 — Go-live verification\n\nRun these end-to-end tests with real test users (one per role):\n\n- [ ] An invited employee receives the email, sets a password and logs in.\n- [ ] Employee checks in and out (mobile/web or device); the punch appears in **Daily Summaries**.\n- [ ] Employee submits a leave request; the manager approves; the balance reduces.\n- [ ] Employee submits an attendance correction; manager then HR approve; the daily summary updates.\n- [ ] A payroll run processes, is approved by three different people, is locked, and payslips appear in **Finance → My finance → Payroll**.\n- [ ] A scheduled report is emailed.\n- [ ] **Insights → Readiness** shows no blocking items.\n\nSee the full [configuration checklists](../part-6-appendices/02-configuration-checklists.md).\n\n---\n\n## Configuration levels explained\n\n| Level | Examples | Who |\n|---|---|---|\n| **One-time system setup** | Installation, seed data, approved SMS endpoints, field encryption, mail fallback | IT / installer |\n| **Company-level** | Company, SMTP, roles, numbering, attendance policy, leave types/policies, payroll calendar/components/statutory, workflows, templates | Company Admin / HR / Finance |\n| **Branch / department-level** | Branches, departments, positions, geofences, Wi-Fi, branch holidays, workflow scope, cost centres | HR / Admin |\n| **Device-level** | Device registration, doors, week plans, access groups | IT Admin |\n| **Employee / user-level** | Reports To, salary, bank, contract, schedule, balances, device enrolment, roles, 2FA, password | HR / the user |\n| **Daily operations** | Punches, leave, approvals, payroll runs, reports | Everyone — see [Daily Operations Guide](../part-4-daily-operations/01-daily-operations-guide.md) |\n\n## Change-later reference\n\n| Setting | Safe to change later? | Notes |\n|---|---|---|\n| Company slug | Avoid | Used in sign-in links |\n| Employee numbering next number | Increase only | Cannot be decreased |\n| Departments / positions / grades / cost centres | Yes | Cannot delete while in use |\n| Leave policies, statutory rules | Yes, as a **new version** needing approval | Old versions stay in history |\n| Attendance policy | Yes | Only one active at a time |\n| Shifts / timetables | Yes | Affects future days; past days need recalculation |\n| Payroll components / structures | Yes | Changes apply to unlocked periods |\n| Bank directory entries | Yes | Edit, deactivate or delete on **Bank directory**. Historical employee accounts retain their recorded details. |\n| Device Sync Mode | Use PULL only | |\n"},{"path":"part-3-modules/01-companies.md","title":"01. Companies","md":"# 01. Companies\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Quick reference](#13-quick-reference)\n\n## 1. Overview and purpose\nA **company** is a separate organisation (tenant) inside HRMS. Each company has its own employees, branches, roles, settings and data. Nothing is shared between companies except user accounts that belong to more than one.\n\nThe **Companies** page has two parts:\n- **Tenant companies** lists the organisations a platform administrator can manage. Available row actions depend on the administrator's platform permissions.\n- **Current Company** and **Current Company Users** – details of the company you are working in and the user accounts that belong to it.\n\nThis chapter also covers two company-wide settings pages: **Bank directory** and **Default Avatars**.\n\n## 2. Prerequisites and dependencies\n- The platform must be installed and at least one platform administrator must exist.\n- To add existing users to a company, those user accounts must already exist on the platform.\n- Email (SMTP) is not required to create a company, but it is needed later for invitations. See [Email, SMS and notifications](03-email-sms-notifications.md).\n- Roles for the company are created automatically. See [Roles, permissions and users](02-roles-permissions-users.md).\n\n## 3. Who can use it (roles and permissions)\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See the company list | `companies:read` | Platform Super Admin, Platform Administrator, Platform Support, Platform Auditor |\n| Create a company and its first administrator | `companies:create` | Platform Super Admin, Platform Administrator |\n| Edit, activate or suspend a company, or change its module settings | `companies:update` | Platform Super Admin, Platform Administrator |\n| Delete a company from the list and end access | `companies:delete` in platform scope | Platform Super Admin by default |\n| See users of the current company | `company_users:read` | Company Admin, IT Administrator |\n| Add an existing user to the current company | `company_users:create` | Company Admin |\n| Change a member's roles or direct permissions | `company_users:update` | Company Admin |\n| Remove a user from the current company | `company_users:delete` | Company Admin |\n| Manage the bank directory | `employees:update` | Company Admin, HR Manager |\n| Manage default avatars | `company_data:read`, `users:update`, `employees:update` or `employees:create` | Company Admin, HR |\n\n## 4. Initial setup and configuration\n| # | Step | Mandatory? | Scope | One-time or changeable |\n|---|---|---|---|---|\n| 1 | Platform administrator creates the company and its first administrator (5.1) | Mandatory | Company | One-time (details changeable) |\n| 2 | Set the **Company timezone** (part of step 1) | Mandatory | Company | Changeable |\n| 3 | Decide whether the company may manage roles and permissions (**Enable roles**, **Enable permissions**) | Optional | Company | Changeable |\n| 4 | Company administrator signs in and changes the temporary password | Mandatory | User | One-time |\n| 5 | Company administrator sets up SMTP email | Strongly recommended | Company | Changeable |\n| 6 | Add banks to the **Bank directory** (5.8) | Optional (needed for payroll bank accounts) | Company | Changeable |\n| 7 | Set up **Default Avatars** (5.9) | Optional | Company | Changeable |\n| 8 | Continue with branches, departments, positions (see Part 2 – Setup) | Mandatory | Company | Changeable |\n\n## 5. Features – step by step\n\n### Feature: 5.1 Create a company\n**Purpose:** Add a new organisation to the platform together with its first administrator.\n**Before you start:** Have the company name, timezone and the administrator's name, email and phone ready.\n**Steps:**\n1. Go to **Companies**.\n2. Click **Create company**.\n3. Fill in **Company name** and **Company timezone** (for example `Africa/Dar_es_Salaam`).\n4. Optionally type a **Company slug** (a short web-friendly name such as `alliance-insurance`). If left empty, one is generated.\n5. Fill in **Admin first name**, **Admin last name**, **Admin email**, **Admin phone** and **Temporary admin password** (minimum 8 characters).\n6. Under **Roles and permissions**, tick **Enable roles** and/or **Enable permissions** if the company may manage them.\n7. Click **Create company**.\n\n**Expected result:** **Company and its first administrator were created successfully.** The company receives the default roles, and the administrator receives the **Company Admin** role.\n\n**Important notes:**\n- The administrator's phone must be a valid Tanzanian (+255) or Ugandan (+256) number.\n- Names may only contain letters and spaces.\n- The slug must be unique (**Company slug already exists**).\n- The timezone must be a valid IANA timezone name. It controls date boundaries on dashboards.\n- Give the temporary password to the administrator securely. They must change it on first sign-in.\n\n> 📷 Screenshot: Companies – Create company panel with all fields\n\n### Feature: 5.2 Edit a company\n**Steps:**\n1. In **Tenant companies**, find the company (use **Search company**).\n2. Click **Edit company**.\n3. Change **Name**, **Company timezone** or the **Roles and permissions** switches.\n4. Click **Save**.\n\n**Important notes:** Leaving the timezone blank marks it as unconfigured. The name cannot be empty.\n\n### Feature: 5.3 Activate or suspend a company\n**Purpose:** Temporarily stop a company from being used, or bring it back.\n**Steps:**\n1. In **Tenant companies**, click **Suspend** (or **Activate**) on the company row.\n2. Confirm (**Suspend company** / **Activate company**).\n\n**Expected result:** The **Status** column changes.\n**Important notes:** A suspended company cannot be entered (**Activate the company before entering it**).\n\n### Feature: 5.4 Enter (switch to) a company\n**Purpose:** Let a platform administrator work inside a company.\n**Steps:**\n1. Click **Switch to this company** on the company row.\n2. The dashboard reloads in that company.\n\n### Feature: 5.5 View the current company\nThe **Current Company** card shows **Company**, **Slug** and **Onboarding** status (**Complete** or **In progress**). Use **Refresh companies** to reload.\n\n### Feature: 5.6 Add an existing user to the current company\n**Purpose:** Give a person who already has a user account access to this company.\n**Steps:**\n1. In **Current Company Users**, choose the person in **Platform user**.\n2. Under **Seed roles**, click the roles to give them (optional).\n3. Click **Add to current company**.\n\n**Important notes:**\n- New employees are normally given accounts through the employee invitation, not here. See the Employees chapter.\n- **User is already active in this company** – they are already a member.\n- Platform owner accounts cannot be assigned to a company.\n\n### Feature: 5.7 Manage a member's access or remove them\n**Steps:**\n1. In **Current Company Users**, click **Manage member access** on the person's row.\n2. Tick or untick **Company Roles**.\n3. Tick or untick **Direct Permissions** (single permissions given outside a role).\n4. Click **Save Access**.\n5. To remove the person from this company, click **Remove from current company** and confirm.\n\n**Important notes:** You cannot remove the last active user of a company (**Cannot remove the last active user from the company**). Removing a user from a company does not delete their account in other companies.\n\n### Feature: 5.8 Bank directory\nThe directory supplies bank choices for the current company's employee bank account forms. It starts with the 34 bank names previously offered in those forms. Existing company entries keep their names, logos and active settings. Managing entries requires `employees:update`.\n\n1. In the company administration sidebar, open **Bank directory**. Its direct path is `/dashboard/settings/banks`.\n2. To add a bank, enter **Bank name**, optionally enter a **Logo URL** or upload a PNG, JPEG or WebP image (up to 2 MB), and select **Add bank**. Leave **Active** selected to make the bank available in account forms.\n3. To rename a bank, change its logo, or change its availability, select **Edit** on its card, make the changes and select **Save changes**. Clear **Active** to take the bank off the list of choices. Select **Active** again to bring it back.\n4. To remove the entry, select **Delete** on its card. Check the bank name in the confirmation, then select **Delete bank**. **Cancel** keeps the entry.\n\nThe bank name must be unique within the company, including inactive entries. Renaming, deactivating or deleting a directory entry preserves the bank details already saved on employee accounts and payroll records. Employees can still choose **Other bank** to enter a name manually.\n\n![Bank directory showing an inactive example bank with Edit and Delete actions](../images/company-bank-directory.png)\n\n### Feature: 5.9 Default Avatars\n**Purpose:** Provide profile pictures that users and employees can pick instead of uploading a photo.\n**Steps:**\n1. Open **Settings → Profile → Manage a
