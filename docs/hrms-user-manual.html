<script>
const DATA = JSON.parse(document.getElementById("manual-data").textContent);
const byPath = Object.fromEntries(DATA.pages.map(p => [p.path, p]));
const order = DATA.pages.map(p => p.path);
const $ = id => document.getElementById(id);

function slug(t){return t.toLowerCase().trim().replace(/<[^>]+>/g,"").replace(/[^\p{L}\p{N}\s_-]/gu,"").replace(/\s/g,"-");}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function resolve(base, rel){
  const parts = base.split("/").slice(0,-1);
  for (const seg of rel.split("/")) { if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg); }
  return parts.join("/");
}
let currentPath = order[0];
marked.use({ gfm:true, renderer:{
  image(href, title, text){ const src = DATA.images[resolve(currentPath,href)] || href; return '<img src="'+esc(src)+'" alt="'+esc(text)+'"'+(title?' title="'+esc(title)+'"':"")+'>'; },
  heading(text, level, raw){ return '<h'+level+' id="'+slug(raw)+'">'+text+'</h'+level+'>'; },
  code(code, lang){ if ((lang||"").trim()==="mermaid") return '<pre class="mermaid">'+esc(code)+'</pre>'; return '<pre><code>'+esc(code)+'</code></pre>'; },
  link(href, title, text){
    let h = href || "";
    if (!/^(https?:|mailto:)/.test(h)) {
      const [file, anchor] = h.split("#");
      if (file && file.endsWith(".md")) h = "#" + resolve(currentPath, file) + (anchor ? "::" + anchor : "");
      else if (!file && anchor) h = "#" + currentPath + "::" + anchor;
    }
    const ext = /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : "";
    return '<a href="'+esc(h)+'"'+ext+(title?' title="'+esc(title)+'"':"")+'>'+text+'</a>';
  }
}});

function buildNav(){
  $("nav").innerHTML = DATA.nav.map(s => '<h2>'+esc(s.title)+'</h2>' + s.items.map(p =>
    '<a href="#'+p+'" data-path="'+p+'">'+esc(byPath[p].title.replace(/^\d+\.\s*/,""))+'</a>').join("")).join("")
    + '<p class="muted" style="margin:20px 8px">Built '+DATA.built+'</p>';
}
function renderPage(path){ currentPath = path; return marked.parse(byPath[path].md); }
async function drawDiagrams(){
  if (!window.mermaid) return;
  const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  mermaid.initialize({ startOnLoad:false, theme: dark ? "dark" : "default", securityLevel:"strict" });
  try { await mermaid.run({ querySelector: "pre.mermaid" }); } catch(e) { console.warn(e); }
}
function show(){
  const raw = decodeURIComponent(location.hash.slice(1));
  let [path, anchor] = raw.split("::");
  if (!byPath[path]) path = order[0];
  const i = order.indexOf(path);
  const prev = order[i-1], next = order[i+1];
  $("content").innerHTML = renderPage(path) + '<div class="pager">' +
    (prev ? '<a href="#'+prev+'"><small>← Previous</small>'+esc(byPath[prev].title)+'</a>' : '<span></span>') +
    (next ? '<a href="#'+next+'" style="text-align:right"><small>Next →</small>'+esc(byPath[next].title)+'</a>' : '<span></span>') + '</div>';
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.path === path));
  document.title = byPath[path].title + " · HRMS User Manual";
  $("nav").classList.remove("open");
  drawDiagrams();
  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView(); else window.scrollTo(0,0);
}
function search(q){
  q = q.trim().toLowerCase();
  if (q.length < 2) return show();
  const hits = DATA.pages.map(p => {
    const text = p.md.toLowerCase(); let n = 0, idx = text.indexOf(q), first = idx;
    while (idx !== -1) { n++; idx = text.indexOf(q, idx + q.length); }
    return { p, n: n + (p.title.toLowerCase().includes(q) ? 50 : 0), first };
  }).filter(h => h.n).sort((a,b) => b.n - a.n);
  $("content").innerHTML = '<h1>Search: '+esc(q)+'</h1>' + (hits.length ? '<div class="results">' + hits.map(h => {
    const s = Math.max(0, h.first - 60), snip = h.p.md.slice(s, h.first + 120).replace(/[#*|>`]/g," ");
    const sec = (h.p.md.slice(0, h.first).match(/^#{2,3}\s+(.+)$/gm) || []).pop();
    const anchor = sec ? "::" + slug(sec.replace(/^#+\s+/,"")) : "";
    return '<a href="#'+h.p.path+anchor+'">'+esc(h.p.title)+'<small>…'+esc(snip)+'… ('+(h.n % 50 || h.n)+' matches)</small></a>';
  }).join("") + '</div>' : '<p>No results.</p>');
  window.scrollTo(0,0);
}
$("search").addEventListener("input", e => search(e.target.value));
$("search").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; show(); } });
$("menuBtn").onclick = () => $("nav").classList.toggle("open");
$("printAll").onclick = async () => {
  $("content").innerHTML = order.map((p,i) => '<section'+(i?' class="page-break"':'')+'>'+renderPage(p)+'</section>').join("");
  await drawDiagrams(); setTimeout(() => window.print(), 300);
};
try { const t = localStorage.getItem("hrms-manual-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("hrms-manual-theme", next); } catch(e) {}
  show();
};
window.addEventListener("hashchange", show);
buildNav(); show();
</script>
</body>
</html>
