h holiday. Manage it under Attendance > Holidays.\" They cannot be changed here. Branch-specific holidays are maintained in the Attendance module.\n- Duplicate dates give \"Holiday already exists\".\n- Whether holidays inside a leave count as leave is set in the policy (**Holidays** option).\n\n### Feature: Leave types\n**Purpose:** Define each kind of leave and its basic rules.\n**Before you start:** You need `leave_types:create`.\n**Steps:**\n1. Go to **Leave Management → Leave Types** and click **Add Leave Type**.\n2. Enter **Leave name** (for example \"Sick Leave\") and a **Description**.\n3. Set **Availability** (Active / Inactive) and **Paid leave**.\n4. Set **Who can use this leave?** – Everyone, Male employees only, or Female employees only.\n5. Set **Yearly maximum** (0 = no limit).\n6. Documents: switch on **Document required**. Optionally fill **Only require it for requests longer than (days)** (blank = always required). Switch on **Allow documents after submission** and set **Evidence due after submission (calendar days)** if employees may upload later.\n7. **Carry unused days** and **Days that can move forward** (blank = no cap).\n8. **Count days in between (sandwich rule)** – weekends/holidays between two leave days count as leave.\n9. **Auto-approve after (days)** – leave blank (\"Off\") unless you want the system to approve requests still waiting after that many days.\n10. Click **Create Leave Type**.\n\n**Expected result:** The type appears in the catalog with Pay, Attachment, Carry forward and Yearly maximum.\n**Important notes:**\n- A type must be attached to a policy before employees get an allowance.\n- Deactivate a type instead of deleting it once requests exist. Inactive types give \"Leave type is inactive\" on new requests.\n- If a document is overdue, the request shows **Evidence pending** / **Evidence overdue** and the employee gets a reminder.\n\n### Feature: Leave policies\n**Purpose:** Decide who is entitled to which leave and how it is earned, carried, capped and encashed.\n**Before you start:** Leave types exist. You need `leave_policies:create`; a second person with `leave_policies:approve` approves versions.\n**Steps:**\n1. Go to **Leave Management → Policies** and create a policy. The editor has four sections: **Basics**, **Eligibility**, **Day rules**, **Entitlements**.\n2. **Basics:** **Policy name**, **Priority** (higher-priority policy wins when several match), **Status**, **Leave year** (with **Starts in month** / **Starts on day** if not calendar year), **Year-end rollover** mode.\n3. **Eligibility:** limit by **Branch**, **Department**, **Position**, **Grade**, **Employment type**, **Confirmation**; set **Service months** and **During probation**. Leave blank to apply to everyone.\n4. **Day rules:** **Weekly offs** and **Holidays** (Exclude / Include / follow employee schedule), **Half day**, **Short leave** with **Min short leave (min)** / **Max short leave (min)**, **Notice days**, **Backdate days**, **Longest stretch**, **Negative balance**, **Cancel needs approval**, **Cancel cutoff days**, **Maximum accumulated balance**. Optional **Deduct from attendance** with **Absent day**, **Unpaid day** and **Half-day deduction** values.\n5. **Entitlements:** click **Attach existing type**, then set for each type the **Accrual schedule** (Daily, Weekly, Monthly, Yearly, Manual), **Days added each period**, **Accrual starts**, **Partial first year**, **Max per request**, carry-forward (**Carry-forward**, **How much is carried**, **Percentage carried**, **Max days carried**, **Carried days expire**, **Months into the new year** / **Expiry date (MM-DD)**, **Use carried days first**, **Unused days may lapse**, **Protected days (never lapse)**, **Overall carry-over cap**) and encashment (**Encashment**, **How much is encashed**, **Max days encashed**, **Min balance after**, **Encashment salary basis**, **Salary divisor for encashment**, **Encashment approval**, **Automatic year-end encashment**).\n6. Enter **Change takes effect** date and **Reason for change**.\n7. Save with **Save as draft version**, then submit. An approver approves the version.\n\n> 📷 Screenshot: Policy editor – Entitlements section with accrual and carry-forward fields\n\n**Expected result:** The approved version becomes effective on its date. Earlier versions remain as history (see the versions panel).\n**Important notes:**\n- Only a draft version can be submitted.\n- The system warns if **Maximum accumulated balance** is below the yearly quota, or the carry-forward cap is above the yearly entitlement.\n- If no policy is effective on a date, the leave-type defaults apply to everyone.\n- Use **preview** / the accrual simulator to see what an employee would earn before approving.\n- After changing a policy you may need to [recalculate balances](#feature-recalculate-leave-balances).\n\n### Feature: Approval workflows\n**Purpose:** Decide who approves leave and in what order.\n**Before you start:** Roles, positions and users exist. You need `leave_workflows:create`.\n**Steps:**\n1. Go to **Leave Management → Workflows** and create a workflow.\n2. In **Details**, enter **Workflow name**, choose the **Leave type** (or leave it general / default), **Status**.\n3. Optional: **Remind approvers after (days)**, **Escalate after (days)** (repeats every N days while a step is waiting), **Maximum escalations per step**.\n4. In **Approval path**, add steps. For each step set **Level** (lower runs first, each level unique), **Action** (**Recommend**, **Verify**, **Approve**), **Approver** via **Role**, **Position** or **Person**, optional **Branch**/**Department** scope (blank = company-wide), and **Required?**.\n5. Save. You may save as draft while you build.\n\n**Expected result:** New requests of that leave type follow this path. See [section 8](#8-approval-workflows).\n**Important notes:** \"Workflow approval levels must be unique\" appears if two steps share a level.\n\n### Feature: Generate and adjust balances\n**Purpose:** Create balance records and correct individual balances.\n**Steps:**\n1. Go to **Leave Management → Leave Balances**.\n2. Choose **Balance fiscal year**. Use **Generate leave balances** → **Generate** to create missing records (the screen lists **Employees with missing balance records**).\n3. To change one balance, click **Adjust** on the row (**Adjust leave balance**). Choose **Add days**, **Deduct days** or **Set remaining to**, enter the days and a **Reason** (\"Why is this balance being changed?\").\n4. Fill the override reason only to credit above the maximum accumulation.\n\n**Expected result:** The balance updates and an entry is written to **Balance Transactions**.\n**Important notes:** Every change (accrual, taken, reserved, carry-forward, lapse, encashment, attendance deduction, adjustment) is listed in **Leave Management → Balance Transactions**.\n\n### Feature: Balance import from Excel\n**Purpose:** Set many opening or corrected balances at once.\n**Before you start:** Balances exist for the year. You need `leave_balances:export` and `leave_balances:import`.\n**Steps:**\n1. Go to **Leave Management → Balance Import**.\n2. Filter by branch, department, leave type and leave year, then click **Download Leave Balance Template**.\n3. In Excel, fill **New Leave Balance** and **Adjustment Reason / Remarks** only for rows you want to change. Save as .xlsx. Do not change the template structure.\n4. Upload the file. Optionally enter a **Default adjustment reason** (used where a changed row has no reason).\n5. Click **Validate file**. Review the **Import preview** (Database balance, Template balance, New balance, Adjustment, Status).\n6. Choose **Import mode**: **Strict (recommended)** – nothing is imported unless every row is valid; or **Valid rows only** – invalid rows are skipped.\n7. Acknowledge warnings and confirm.\n8. Review **Import result** and **Download report** / **Download error report**.\n\n> 📷 Screenshot: Balance Import – preview table and Import mode choice\n\n**Expected result:** Changed balances are updated in one step and listed in **Import History**.\n**Important notes:**\n- If a balance changes between validation and confirmation (for example a leave was approved), that row is rejected; download a fresh template.\n- You cannot change your own balance.\n- Typical row errors: employee not found/inactive, leave type not eligible, wrong year, negative balance not allowed, above maximum accumulation, duplicate row, missing reason, outdated template.\n\n### Feature: Leave requests (HR view)\n**Purpose:** View, create, approve and manage requests for all employees.\n**Steps:**\n1. Go to **Leave Management → Leave Requests**. Search or filter by status.\n2. To file on behalf of an employee, click **Create leave request**: choose **Employee**, **Leave type**, **Start date**, **End date**, **Reason**. If notice is too short you can give a **Notice override reason**.\n3. To bulk-load, use **Import Leave Requests** and **Download Excel template**.\n4. Open a request to see **Approval details**, **Approval chain**, documents and comments. Use **Approve**, **Reject** (reason required) or **Return** for correction.\n5. HR with override permission can **Approve in place of manager**, **Reject in place of manager** or **Return for correction in place of manager**, giving a reason (at least 5 characters).\n6. On approved leave, use **End leave early** to set a **New last day of leave**; unused days return to the balance.\n7. Use **Cancel Leave Request** with a reason to cancel.\n8. Use **PDF** to download the leave form, or revoke its QR code (see [Leave PDF and verification](#feature-leave-pdf-and-qr-verification)).\n\n**Important notes:** \"You cannot approve your own leave request\" – no one approves their own leave at any level.\n\n### Feature: Acting employee (cover during leave)\n**Purpose:** Name a colleague who covers while an employee is on leave.\n**Steps:**\n1. On the leave request, open the acting employee panel and search by name or employee number.\n2. Set **Responsibilities** (for example \"Approve routine requests…\") and the **Delegation period** (follows the leave dates by default).\n3. Optionally let the acting employee also receive the absent person's leave approvals.\n\n**Expected result:** The assignment is pending until the leave starts, active during it, and completed at the end. It is cancelled if the leave is cancelled or rejected. The acting employee is notified (\"You will act for … from … to …\").\n**Important notes:** The acting employee gets no extra permissions; only approval routing (if chosen) is delegated, and only for the leave period. You cannot pick yourself.\n\n### Feature: Approval cover (delegations)\n**Purpose:** Let another person approve while an approver is away.\n**Steps:** In the delegations panel choose **Approver away…**, **Covered by…**, **Cover starts**, **Cover ends** and an optional **Reason**.\n\n### Feature: Team Calendar and Leave Reports\n- **Leave Management → Team Calendar** shows who is on leave.\n- **Leave Management → Leave Reports**: **Choose report** (for example **Approved leave taken**) and **Download CSV**.\n\n### Feature: Business Trips\n**Leave Management → Business Trips** opens the same business-trip screen as the Attendance module. See the Attendance manual.\n\n### Feature: Compensatory off (comp-off)\n**Purpose:** Turn approved overtime into leave days.\n**Before you start:** The leave type has comp-off switched on, and HR has approved a comp-off policy for it (**Hours per day**, **Expiry days**). Without an approved policy the screen says \"No compensatory-off policy. Earning is blocked.\"\n**Steps:** In **Compensatory off**, choose the **Comp-off leave type** and **Approved overtime**, then submit. Credits show as **Waiting for approval**, **Credited (not yet expired)**, with **Next expiry**.\n\n### Feature: Encashment\n**Purpose:** Pay out unused leave days.\n**Steps:**\n1. Employees request encashment from self-service, or HR files one. Requests appear under **Encashment requests** on the balances area.\n2. HR uses **Approve encashment** / **Reject encashment**. The amount is calculated from the salary basis ÷ divisor × days; HR can change it with an **Override reason**.\n3. Click **Send encashment to payroll** with a **Payroll period code**. Payment status goes **NOT PAID → IN PAYROLL → PAID** when the payroll run is paid.\n4. **Record encashment payment** (manual) or **Reverse encashment** if needed.\n\n### Feature: Recalculate leave balances\n**Purpose:** Correct balances after a policy or employee data change.\n**Steps:** Open **Recalculate leave balance**, choose **Scope** (**All employees in the company**, **Branch**, **Department**, **One employee**), leave type and **Cutoff date**. Review **Current balance**, **Recalculated**, **Difference** and **How it was calculated**. Enter a **Reason for applying these corrections** and click **Approve and apply**. Download the CSV for records.\n**Important notes:** Only one run can be open for the same scope. Closed (rolled-over) years are not recalculated.\n\n### Feature: Year-end Rollover\n**Leave Management → Year-end Rollover**: choose **Leave year to close**, preview each balance (Carry, Encash, Lapse, Retained, exceptions), submit, approve and post. Posted years are closed. Employees get a notice; carried days that will expire are announced.\n\n### Feature: Statutory Rules\n**Leave Management → Statutory Rules** holds legal minimums per jurisdiction (for example Tanzania Mainland, Zanzibar). A rule set includes days, **Pay stages (in order)** (for example sick pay tiers with **Days** and **Pay percent**), **Medical certificate after (days)**, **Public holiday work pay**, **Pay unused annual leave**, and **Legal references**. A rule set applies only after legal sources are recorded and it is approved. Company policies may give more but never less.\n\n### Feature: Leave Payroll and Leave Operations\n- **Leave Payroll**: Finance confirms how each leave pay item is taxed (**Tax treatment**, **Taxable %**, **Pensionable (NSSF)**, **GL account**) with **Confirm payroll treatment**. Encashments and public-holiday pay reach payroll as draft inputs.\n- **Leave Operations**: tabs **Configuration readiness** (set-up problems, \"Blocked until fixed\"), **Payroll reconciliation**, **Allocation backfill**, **Notifications**, **History**, and lists of **Encashments**, **Exit settlements** and **Leave days in payroll**.\n\n### Feature: Exit leave settlement\nWhen an employee leaves (offboarding), the system calculates leave earned to the exit date, minus used. Positive days are paid out; negative days are recovered. HR approves the settlement and it goes to the final payroll settlement. Failed calculations can be re-run from **Leave Operations**.\n\n### Feature: My leave (employee self-service)\n**Purpose:** Employees apply for and track their own leave.\n**Steps:**\n1. Go to **Leave Management → My leave → Requests** and click **Request leave**.\n2. Choose **Leave type**, then **Full day or multiple days**, **Half day** (**First half** / **Second half**, same start and end date) or **Short leave by hours**.\n3. Pick dates, enter the reason, attach a document if required, and submit (or save as draft).\n4. Track status. If returned, edit and resubmit. You can cancel a request, or **End leave early** on approved leave. Download the PDF.\n5. **Leave Management → My leave → Balances** shows **Annual entitlement**, **Carried over**, **Days taken**, **Awaiting approval** and **Available to use**.\n6. **Leave Management → My leave → Holidays** shows company holidays; **Leave Management → My leave → Policies** shows the rules that apply to you.\n\n> 📷 Screenshot: My leave → Requests – Request leave form\n\n### Feature: Leave PDF and QR verification\n**Purpose:** Print a leave form that third parties can check.\n**Steps:**\n1. Download the PDF from the request (HR or employee).\n2. Anyone scanning the QR code opens the **Leave request verification** page. It shows employee number, department, leave type, dates, total days and approval status, for example **Verified and Approved**, **Pending manager approval**, **Approval revoked**, or \"This leave was approved but later cancelled…\".\n3. HR can **Revoke QR verification code** if a PDF was misused. Old PDFs then show **Approval revoked**; the next download gets a new code.\n\n## 6. Important fields and options\n\n### Leave request statuses\n| Status | Meaning |\n|---|---|\n| Draft | Saved, not submitted |\n| Pending department manager | Waiting for the manager |\n| Pending HR | Waiting for HR |\n| In review | Waiting at a later workflow level |\n| Returned for correction | Sent back to the employee |\n| Approved | Final approval given; days are taken from the balance |\n| Rejected | Not approved |\n| Cancelled | Withdrawn or cancelled |\n\n### Day treatment (policy)\n| Option | Effect |\n|---|---|\n| Exclude | Weekly offs / holidays inside the leave are not counted |\n| Include | They are counted as leave |\n| Employee schedule | Uses the employee's own work schedule |\n\n### Accrual methods\n| Method | How days are earned |\n|---|---|\n| Daily | Pro-rata by days employed in the leave year |\n| Weekly | Entitlement ÷ 52 per week |\n| Monthly | A share each month |\n| Yearly | Full allowance at the start of the cycle (or at the end, if set \"in arrears\") |\n| Manual | Only by HR adjustment or import |\n\n### Balance import modes\n| Mode | Effect |\n|---|---|\n| Strict (recommended) | Imports only if every row is valid |\n| Valid rows only | Imports valid rows, skips the rest |\n\n## 7. Daily usage procedures\n\n- **Managers:** check pending approvals each morning; approve, reject (with reason) or return.\n- **HR:** watch **Pending HR** requests, **Evidence overdue** items and escalation flags; use the override only when the manager cannot act.\n- **HR:** review **Balance Transactions** after imports or adjustments.\n- **Employees:** apply with enough notice, upload documents on time, check **Leave Management → My leave → Balances**.\n\n## 8. Approval workflows\n\n**How the approver is chosen:**\n1. If a workflow exists for the leave type (or a default workflow), its steps run from the lowest level up.\n2. Without one, the request goes to the department manager, then HR.\n3. If there is no department manager, the employee's reporting manager is used. If there is no reporting manager either, HR reviews directly.\n4. If the employee is the department manager, it goes to their own manager. Nobody ever approves their own leave.\n5. If a manager cannot be determined, the request waits as \"routing required\" until HR corrects the assignment and retries.\n\n**Reminders and escalation:** Approvers are reminded every **Remind approvers after (days)**. After **Escalate after (days)**, the waiting approvers' own managers (or HR) are added as approvers, up to **Maximum escalations per step**. After the last escalation, HR is flagged once.\n\n**Auto-approval:** If the leave type has **Auto-approve after (days)**, a daily job approves requests still pending after that many days.\n\n**HR override:** A user with `leave_requests:override` can approve, reject or return in place of the manager, with a reason. The trail shows who decided; waiting manager steps are marked skipped.\n\n**Cancellation:** Controlled by **Cancel needs approval** and **Cancel cutoff days** in the policy. Cancelling approved leave returns the days to the balance. **End leave early** returns only the unused days.\n\n```mermaid\nflowchart TD\n    A[Employee submits request] --> B{Workflow for leave type?}\n    B -- Yes --> C[Workflow steps, lowest level first]\n    B -- No --> D[Department / reporting manager]\n    D --> E[HR]\n    C --> F{Decision}\n    E --> F\n    F -- Approve all levels --> G[Approved: balance deducted, attendance updated]\n    F -- Reject --> H[Rejected]\n    F -- Return --> I[Returned for correction] --> A\n    C -. waiting too long .-> J[Reminder, then escalation, then HR flag]\n    D -. HR override .-> F\n```\n\n## 9. Links to other modules\n\n| Module | Connection |\n|---|---|\n| Attendance | Approved leave triggers recalculation of attendance for those days. Policy **Deduct from attendance** can deduct absent / unpaid / half days from the leave balance. Branch holidays are managed under **Attendance → Holidays**. Business trips are shared. |\n| Payroll | Unpaid leave and leave days feed payroll; encashment, public-holiday pay and exit settlements are handed over as draft payroll inputs; payment status syncs back when the run is paid. |\n| Employees / Offboarding | Eligibility uses employee data; exit triggers a leave settlement. |\n| Notifications | Submission, approval, reminders, escalation, evidence due, acting assignments, year-end notices. |\n| Roles & Permissions | See section 3. |\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| \"No leave types available\" for an employee | No active policy covers the employee, or type restricted by gender/probation/service | Check policy eligibility and the employee's profile |\n| \"Your profile is not ready for leave requests\" | User account not linked to an employee | Link the user to the employee record |\n| \"You cannot approve your own leave request\" | Approver is the applicant | Another approver or HR override must act |\n| Request stuck \"waiting for a manager assignment\" | No manager could be found | Set department manager / reports-to, then retry routing |\n| \"This leave type requires a supporting attachment before submission.\" | Document required and late upload not allowed | Attach the document, or enable **Allow documents after submission** |\n| \"Workflow approval levels must be unique\" | Two steps share a level | Give each step a different level |\n| Import: \"Strict mode cannot import a file with N invalid row(s)\" | Invalid rows in strict mode | Fix the file or choose **Valid rows only** |\n| Import: balance changed since validation | A leave/adjustment happened in between | Download a new template and re-import |\n| Branch holiday cannot be edited | It belongs to Attendance | Edit in **Attendance → Holidays** |\n| \"Recalculation … is already open for this scope\" | Earlier run not finished | Finish or cancel it first |\n| Encashment not sent to payroll: \"Payroll component … does not exist\" | Payroll component missing | Create the component in Payroll, retry |\n| QR shows \"Approval revoked\" | HR revoked the code | Download the PDF again |\n\n## 11. Best practices\n\n- Set holidays for the whole year before employees apply.\n- Keep one default workflow plus specific ones only where needed.\n- Use **Strict** import mode and always give a reason.\n- Make policy changes as new versions with a clear effective date; preview, then recalculate.\n- Run **Configuration readiness** after any set-up change.\n- Use the HR override sparingly and always explain why.\n\n## 12. Setup checklist\n\n- [ ] Holidays for the year added or imported\n- [ ] Branch holidays maintained in Attendance\n- [ ] Leave types created (paid, documents, carry-forward, sandwich rule, auto-approval)\n- [ ] Policies created, eligibility set, entitlements attached, version approved\n- [ ] Statutory rule set approved (if applicable)\n- [ ] Default and type-specific workflows built\n- [ ] Every employee has a department manager or reporting manager\n- [ ] Leave balances generated for the year\n- [ ] Opening balances imported and checked in Balance Transactions\n- [ ] Payroll components and Leave Payroll tax treatment confirmed\n- [ ] Configuration readiness shows no blockers\n- [ ] Roles given the correct leave permissions\n\n## 13. Not verified / limitations\n\n> **Limitation:** The exact button labels on some dialogs (policy submit/approve buttons, workflow save, encashment request in self-service, acting-employee \"route approvals\" option) were not confirmed (label not verified).\n\n> **Limitation:** Holidays in **Leave Management → Holidays** are company-wide; branch holidays are read-only here.\n\n> **Limitation:** The leave PDF layout and the exact list of countries in **Import Country Holidays** were not reviewed in detail.\n\n> **Limitation:** Statutory rule content and encashment/sick-pay calculations require legal and Finance sign-off before use; this manual describes the screens only.\n\n> **Limitation:** The Business Trips screen is documented in the Attendance manual.\n"},{"path":"part-3-modules/11-payroll.md","title":"11. Payroll","md":"# 11. Payroll\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nThe Payroll module calculates what each employee is paid for a pay period, takes it through approval, produces payslips and payment files, and records the accounting journal.\n\nYou find it in the sidebar under **Finance → Payroll → Payroll setup & operations**. The page has these tabs:\n\n| Tab | What it is for |\n|---|---|\n| **Overview** | Summary tiles (**Active runs**, **Open inputs**, **Enabled profiles**, **Periods**) and readiness tools: **1. Check setup**, **2. Compare runs**, **3. Final pay**, **4. Match bank results**. |\n| **Runs** | Create, calculate, approve, lock, pay and close payroll runs. |\n| **Inputs** | One-off amounts for a period (overtime, bonus, adjustments, arrears, corrections). |\n| **Sources** | Amounts coming from other systems or modules, imported and optionally posted as inputs. |\n| **Approved OT** | Overtime approved in attendance that is waiting to be paid. |\n| **Profiles** | Each employee's payroll profile (tax and pension numbers, payment method, hold). |\n| **Periods** | Monthly pay periods with cut-off and payment dates. |\n| **Reports** | Statutory, cost, reconciliation and year-to-date reports. |\n| **Recoveries** | Overpayment recoveries for salary already paid. |\n| **Configuration** | All setup: components, calendars, structures, statutory schemes, accounting mappings, groups, overtime, bonus, leave rules, security and approvals, approval workflows and attendance deductions. |\n\nEmployees see their own pay under **Finance → My finance → My payroll** (see [Feature: My payroll](#feature-my-payroll-employee)).\n\n> 📷 Screenshot: Payroll setup & operations – the tab bar with Overview selected\n\n## 2. Prerequisites and dependencies\n\nSet these up first:\n\n- **Employees** with a hire date, branch, department and employment status — see the Employees module manual.\n- **Banks list** (**Bank directory** page) so employees' bank accounts can be recorded — see [Feature: Bank directory](#feature-bank-directory).\n- **Employee bank accounts** on the employee record (**Employees → My employee workspace → Profile → Records → Bank accounts** for self-service, or HR on the employee file).\n- **Attendance** (for approved overtime) and **Leave** (for unpaid leave, leave pay rules and leave encashment) — see 08-attendance and 09-leave manuals.\n- **Staff Finance (loans and advances)** if loan deductions are used — see [12. Staff Finance and Loans](12-staff-finance-loans.md).\n- **Two-factor authentication** for the users who calculate payroll (calculation may ask for a fresh authenticator code).\n\n## 3. Who can use it (roles and permissions)\n\nThe sidebar shows **Payroll setup & operations** to users holding any payroll permission. Each button then checks its own permission.\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View configuration | `payroll:config-read` | Payroll officer, auditor |\n| Change configuration (components, calendars, structures, schemes, mappings, groups, overtime, bonus, leave rules, workflows) | `payroll:config` | Payroll administrator |\n| Approve statutory rule versions and activate attendance deduction policies | `payroll:statutory-approve` | Finance manager / legal reviewer (not the preparer) |\n| Approve salary assignments and revisions | `payroll:salary-approve` | HR manager / Finance manager |\n| View / edit payroll profiles | `payroll:profiles-read` / `payroll:profiles` | Payroll officer |\n| View / manage periods | `payroll:periods-read` / `payroll:periods` | Payroll officer |\n| View / create inputs | `payroll:inputs-read` / `payroll:inputs` | Payroll officer |\n| Approve inputs | `payroll:inputs-approve` | Payroll supervisor |\n| View runs | `payroll:runs-read` | Payroll, Finance, auditors |\n| Create runs | `payroll:runs` | Payroll officer |\n| Calculate (process) a run | `payroll:runs-process` | Payroll officer |\n| Approve or reject a run | `payroll:runs-approve` | HR, Finance and Management approvers |\n| Lock a run | `payroll:runs-lock` | Finance manager |\n| Cancel a run | `payroll:runs-cancel` | Payroll supervisor |\n| Reverse a run | `payroll:runs-reverse` | Finance manager |\n| Confirm a run as paid (manually) | `payroll:payments-confirm` | Finance (not the preparer) |\n| Close a run | `payroll:runs-close` | Finance manager |\n| Generate / view payslips | `payroll:payslips` / `payroll:payslips-read` | Payroll officer |\n| Bank files and payment import | `payroll:banking` | Finance / treasury |\n| Accounting journals | `payroll:accounting` | Accountant |\n| Reports | `payroll:reports` | Payroll, Finance |\n| Overpayment recoveries | `payroll:recoveries-manage` / `payroll:recoveries-approve` | Payroll officer / Finance manager |\n| Final settlements (exit pay) | `payroll:final-settlements` | Payroll officer |\n| See own payslips | `payroll:payslips-self` | Every employee |\n\n> **Important:** The system separates duties. The person who prepares or calculates a run cannot approve it, each approval stage needs a different person, and the person who prepared a payment cannot confirm it as paid.\n\n## 4. Initial setup and configuration\n\nDo these steps in order. All are under **Payroll setup & operations → Configuration** unless stated. Scope is **company** unless stated.\n\n1. **Bank directory** — Mandatory if paying by bank. Add each bank. One-time, add more later.\n2. **Calendars** (**Configuration → Calendars**) — Mandatory. Set **Cut-off day**, **Payment day**, **Timezone**, **Currency** and tick **Default calendar**. Changeable.\n3. **Components** (**Configuration → Components**) — Mandatory. Create earnings (for example basic salary, allowances), deductions, employer contributions and levies. Changeable; changes keep history.\n4. **Statutory schemes and rules** (**Configuration → Schemes**) — Mandatory. Create schemes for PAYE, pension, health insurance and employer levies, then add a rule version with **Create statutory rule**. A second person must approve the rule (**Approve rule**). Changeable by new versions only.\n5. **Structures** (**Configuration → Structures**) — Mandatory for structured pay. A salary structure lists component lines with default amounts or rates. Status **Draft → Active → Retired**. Use **New structure version** to change.\n6. **Groups** (**Configuration → Groups**) — Optional. Group employees by branch, department, category or employment type, each with its own calendar and currency. Use **Assignments** to put individual employees in a group. Scope: branch/department/employee.\n7. **Mappings** (**Configuration → Mappings**) — Mandatory for accounting. Map each component to a **Debit account code** and **Credit account code**, optionally by project, cost center, department, branch, category or payroll group.\n8. **Overtime** (**Configuration → Overtime**) — Optional. Set **Regular multiplier**, **Weekend multiplier**, **Holiday multiplier** and **Minimum minutes** for the overtime component.\n9. **Bonus** (**Configuration → Bonus**) — Optional. Bonus, commission, incentive or thirteenth-month schemes.\n10. **Leave rules** (**Configuration → Leave rules**) — Optional. For each leave type set **Paid percentage**, **Paid days cap**, **Half pay after days**, **Unpaid after days** and **Carry forward cap**.\n11. **Approval workflows** (**Configuration → Approval workflows**) — Recommended. Define which stages approve a run (HR, Finance, Management) for the **Whole company**, **One branch** or **One payroll group**. Saving a new version replaces the active workflow for that scope.\n12. **Attendance deductions** (**Configuration → Attendance deductions**) — Optional. See [Feature: Attendance deduction policies](#feature-attendance-deduction-policies).\n13. **Security & approvals** (**Configuration → Security & approvals**) — Review the mandatory approvals and payroll generation security settings.\n14. **Employee payroll profiles** (**Profiles** tab) — Mandatory per employee. Scope: employee.\n15. **Employee salary** — Mandatory per employee. Assign base salary and structure, then have it approved. Scope: employee.\n16. **Periods** (**Periods** tab) — Mandatory. Generate each month's period.\n\n## 5. Features – step by step\n\n### Feature: Bank directory\n**Purpose:** Keep the list of banks that appear in employee bank account forms.\n**Before you start:** You need access to company settings.\n**Steps:**\n1. Open the **Bank directory** page (web address `/dashboard/settings/banks`).\n2. Enter **Bank name**.\n3. Optionally enter a **Logo URL** or use **Or upload a logo**.\n4. Click **Add bank**.\n**Expected result:** The bank appears in the list below the form.\n**Important notes:** There is no edit or delete button on this page.\n\n> **Limitation:** This page is not linked from the sidebar. Open it by its web address. Required permission not verified.\n\n### Feature: Pay components\n**Purpose:** Define every line that can appear on a payslip.\n**Before you start:** Decide component codes with Finance.\n**Steps:**\n1. Go to **Configuration → Components** and click **New component**.\n2. Enter **Code** and **Name**.\n3. Choose **Component type**, **Frequency**, **Calculation method** and **Tax treatment**.\n4. If partly taxable, enter **Taxable percentage**.\n5. Set **Calculation order** (lower numbers are calculated first).\n6. Save.\n**Expected result:** The component appears in the list and can be used in structures, inputs and mappings.\n**Important notes:** See [Section 6](#6-important-fields-and-options) for option meanings.\n\n### Feature: Statutory rules (tax, pension, health, levies)\n**Purpose:** Set legal rates and tax bands.\n**Before you start:** Create the scheme in **Configuration → Schemes** (**Code**, **Name**, **Scheme type**, **Jurisdiction**). Have the official source document.\n**Steps:**\n1. Click **Create statutory rule**.\n2. Choose **Scheme**, enter **Version number**, **Calculation method**, **Effective from** and **Effective to**.\n3. Enter **Official source / evidence reference**.\n4. Enter **Employee rate**, **Employer rate**, **Maximum basis** and **Deduct before tax** as needed.\n5. For employer levies, answer **Employer exempt from SDL** (**No - standard levy applies** or **Yes - exemption approved**).\n6. For PAYE bands, add each band: **Band lower limit**, **Band upper limit**, **Base tax**, **Rate percent**, **Band sort order**. Use **Add rule** / **Add line** as needed.\n7. Save. A different user with `payroll:statutory-approve` opens **Statutory rule versions** and clicks **Approve rule**.\n**Expected result:** The approved version applies to runs whose period falls inside its effective dates.\n**Important notes:** PAYE is calculated on the whole period's taxable income. If two runs fall in the same period, the second run deducts only the extra tax.\n\n### Feature: Salary structures\n**Purpose:** A reusable template of pay lines (for example basic, housing, transport).\n**Steps:**\n1. Go to **Configuration → Structures** and click **New structure**.\n2. Enter **Code**, **Name**, **Currency**, **Effective from**, **Effective to** and **Description**.\n3. Add lines: choose **Component**, enter **Default amount** or **Default rate**, and **Order**. Use **Add line** / **Remove line**.\n4. Save. To change an active structure, use **New structure version**.\n**Expected result:** The structure can be assigned to employees.\n\n### Feature: Employee payroll profile\n**Purpose:** Hold each employee's payroll identity and payment details.\n**Steps:**\n1. Open the **Profiles** tab and click **New profile**.\n2. Enter **Employee ID**, **Payroll number**, **Effective from** / **Effective to**.\n3. Choose **Payment method**, **Primary bank account ID**, **Currency**, **Pay frequency**.\n4. Enter **TIN**, **Social security scheme**, **Social security number**, **Health scheme**, **Health number**, **Tax residency code**, **Tax category**.\n5. Set **Payroll enabled** to **Yes**. To stop pay temporarily, set **Payroll hold** to **Yes** and enter **Hold reason**.\n**Expected result:** The employee is included in runs for their group.\n**Important notes:** Bank account numbers are shown masked (only the last 4 digits).\n\n### Feature: Employee salary and structure\n**Purpose:** Set an employee's base salary and structure, with independent approval.\n**Steps:**\n1. Open the **Salary & structure** panel for the employee (from the Profiles tab or the onboarding payroll drawer).\n2. Use **Assign salary** (or **Start salary revision** for a change).\n3. Enter **Base salary**, **Effective from**, choose **Structure** (**Select structure**) and enter a **Justification**.\n4. Optionally override structure lines under **Employee overrides**: **Use default**, **Fixed amount**, **% of base** or **Exclude**.\n5. Choose **Salary approver** (**Select the independent approver**).\n6. Review **Monthly breakdown** (**Gross**, **Recurring deductions**, **Net before statutory**, **Employer cost**).\n7. Submit. The approver clicks **Approve starting salary** (or approves the revision).\n**Expected result:** **Compensation history** and **Approval trail** show the approved salary.\n**Important notes:** The approver must not be the person who submitted. Salary is prorated if it changes mid-period.\n\n### Feature: Payroll periods\n**Purpose:** Create the month to be paid.\n**Steps:**\n1. Open the **Periods** tab and click **Generate period**.\n2. Choose **Payroll calendar**, **Year** and **Month**. Save.\n3. To change dates, click **Edit dates** (**Edit payroll period dates**): **Cut-off date**, **Payment date**, **Reason for change**.\n**Expected result:** The period appears with its status. Period statuses: Draft, Open, Input closed, Processing, Review, Approved, Locked, Paid, Closed, Cancelled.\n\n### Feature: Payroll inputs\n**Purpose:** Add one-off amounts to a period.\n**Steps:**\n1. Open the **Inputs** tab and click **New input**.\n2. Choose **Payroll period**, enter **Employee ID**, **Component code**, and **Amount** (or **Quantity** and **Rate**), **Currency**.\n3. Optionally enter **Source module** and **Source reference**.\n4. If the period cut-off has passed, enter **Late adjustment reason** (required).\n5. Save. A user with `payroll:inputs-approve` clicks **Approve** on the row.\n**Expected result:** Only approved inputs are paid.\n**Important notes:** For corrections and arrears, use **New adjustment** and choose **Adjustment type** (**Adjustment**, **Arrears**, **Retroactive salary**, **Correction**, **Bonus**, **Commission**), **Effective period code**, **Corrects paid run ID** and **Reason**.\n\n### Feature: Sources (external and module inputs)\n**Purpose:** Bring in amounts from other systems (for example piece-rate, commission) in bulk.\n**Steps:**\n1. Open **Sources**. Use **New source** for one line or **Import sources** for many.\n2. For import, choose **Payroll period**, **Provider**, **Source type**, **Default component**, **Currency**.\n3. Choose **Approval**: **Auto approve** or **Keep draft**.\n4. Choose **Posting**: **Do not post yet** or **Post to payroll inputs**.\n5. Paste **CSV or TSV rows**. Save.\n**Expected result:** Rows appear in Sources and, if posted, in Inputs.\n\n### Feature: Approved overtime\n**Purpose:** Pay overtime approved in Attendance.\n**Steps:**\n1. Open **Approved OT**. Review **Requested**, **Approved**, **Payable** and **Unapproved calculated** minutes per **Work date**.\n2. Approve or reject rows with **Approve** / **Reject**.\n**Expected result:** Approved overtime is paid in the regular run using the overtime policy multipliers.\n\n### Feature: Payroll runs (create and calculate)\n**Purpose:** Calculate pay for a period.\n**Before you start:** The period exists, inputs are approved, profiles and salaries are approved.\n**Steps:**\n1. Open **Runs** and click **New run**.\n2. Choose **Payroll period**, **Run type** and optionally **Payroll group**. For a correction run enter **Parent run ID**; for a final settlement enter **Offboarding request ID**.\n3. Save. The run is created as **Draft**.\n4. Click **Eligibility** to see who is included and why others are excluded.\n5. Click **Validate** to check for problems.\n6. Click **Process**. In **Generate payroll run**, enter a **Fresh six-digit authenticator code** if asked, and confirm.\n**Expected result:** The run is calculated and moves to the first approval stage (for example **Pending HR approval**). If there are blocking problems it shows **Validation failed**.\n**Important notes:**\n- Run types: **Regular** (salary, components, overtime, statutory, loans), **Supplementary**, **Bonus**, **Off cycle**, **Adjustment** (correction of a paid run), **Final settlement** (exit pay).\n- The system stops a run that would pay the same salary or one-off item twice (error about duplicate payment).\n- Recalculating a run cancels all approvals given so far.\n\n### Feature: Approve, lock and pay a run\n**Steps:**\n1. Each approver opens the run and clicks **Approve**. In **Approve payroll run**, choose **Approval stage**, check the **Calculation hash** (it confirms you approve the numbers you reviewed) and add **Comments**. Click **Approve run**, or **Reject to preparer** with the reason in **Comments**.\n2. When all stages approve, the run is **Approved**. A Finance user clicks **Lock**.\n3. Click **Payslips** to generate and publish payslips.\n4. Click **Internal payment list** (or **Bank-ready file** where an approved bank format and encryption key exist) to produce the payment file.\n5. After the bank pays, import bank results (**Overview → 4. Match bank results**: **Import payments** or **Enter payments** with **Masked bank account**, **Bank reference**, **Amount paid**, **Bank result** = **Paid**, **Failed** or **Pending**) or click **Paid** to confirm manually with **Bank payment reference** and **Value date**.\n6. Click **Journals** to produce the accounting journal (**Download journal**, **Mark as posted**, **Reverse journal**).\n7. Click **Close** to close a paid run.\n**Expected result:** Status moves Approved → Locked → Payment file generated → Paid → Closed. Loan deductions and recoveries are posted only when the employee's net pay is confirmed paid.\n**Important notes:** Payslips can only be generated for locked, file-generated or paid runs. **Payments** shows payment progress per employee.\n\n> **Limitation:** The run row shows **Simulate payment**, **Pending demo**, **Failed demo** and **Retry demo** buttons. These are test tools; they work only when the server allows payment simulation. Do not use them in live payroll.\n\n### Feature: Cancel and reverse a run\n**Steps:**\n1. Before locking: click **Cancel run** and give a reason.\n2. After locking but before any payment is confirmed: reverse the journal first, then use **Reverse** with a reason and say whether the bank file was withdrawn.\n**Important notes:** A run with confirmed payments cannot be reversed. Use a correction (Adjustment) run or an overpayment recovery instead.\n\n### Feature: Overpayment recoveries\n**Purpose:** Recover salary paid in error.\n**Steps:**\n1. Open **Recoveries** and click **Raise recovery**.\n2. Enter **Employee ID**, **Original payroll run ID**, **Overpaid amount**, **Reason**, **Recovery method**, **Instalment per payroll**, **Legal basis**, **Consent / agreement / order reference**, **Evidence**.\n3. A second user clicks **Approve** (or **Reject**).\n4. Later use **Record refund** for cash refunds or **Accounting adjustment**.\n**Expected result:** Approved instalments are deducted in later runs and recorded when that pay is confirmed.\n\n### Feature: Attendance deduction policies\n**Purpose:** Deduct pay for lateness, early departure, half days or unauthorised absence.\n**Steps:**\n1. **Configuration → Attendance deductions → New draft policy**. Set **Applies to**, **Standard minutes per day**, **Grace min/day**, **Free min/month**, tick the deductions (**Deduct lateness**, **Deduct early departure**, **Deduct half days**, **Deduct unauthorised absence days**), **Monthly cap (% of basic, optional)**, **Net pay limit (optional)**, **Exempt employee IDs**.\n2. A different user with `payroll:statutory-approve` clicks **Activate** and enters **HR / legal review reference**.\n**Expected result:** Deductions start in runs after activation.\n**Important notes:** Drafts never change pay. Until a policy is activated, attendance never reduces pay.\n\n### Feature: Final settlement (exit pay)\n**Purpose:** Calculate final pay for a leaving employee.\n**Steps:** On **Overview → 3. Final pay**, choose the **Offboarding request**, click **Calculate final pay**, then **Close settlement** once paid.\n**Important notes:** When a final settlement is paid, encashed leave days are marked paid in Leave. Loan balances are recovered through Staff Finance exit recovery.\n\n### Feature: Reports\n**Steps:** Open **Reports**, choose **Report type** (**Register**, **Tax**, **Pension**, **WCF**, **Cost**, **Headcount**, **Run reconciliation**, **Loans**, **Advances**, **Shortfalls**, **YTD**, **YTD tax**, **Pension YTD**, **History**), optionally **Payroll run (optional)**, **Year (optional)**, then **Generate report** and **Export CSV**.\n\n### Feature: My payroll (employee)\n**Purpose:** Employees see their own payslips.\n**Steps:**\n1. Go to **Finance → My finance → My payroll**.\n2. See **Year-to-date summary**, **Pay trend** and **Earnings history**.\n3. Click **View latest payslip** or **Download latest payslip**, or **Download payslip** on a row.\n4. Click **Manage bank account** to update bank details in your profile.\n**Expected result:** Only published payslips are shown. If none: \"No payslips published yet\".\n\n## 6. Important fields and options\n\n| Option | Values | Meaning |\n|---|---|---|\n| **Component type** | Earning, Deduction, Employer contribution, Employer levy, Reimbursement, Taxable benefit, Informational | What the line does on the payslip |\n| **Frequency** | Recurring, One time, Daily, Hourly, Annual | How often it applies |\n| **Calculation method** | Fixed amount, % of base, % of gross, % of components, Quantity × rate, Progressive bands, Threshold bands, Formula template, External input | How the amount is worked out |\n| **Tax treatment** | Taxable, Non-taxable, Partially taxable, Tax exempt | Whether it counts for PAYE |\n| **Scheme type** | PAYE, Pension, Health insurance, Employer levy, Other | Statutory scheme kind |\n| **Run type** | Regular, Supplementary, Bonus, Off cycle, Adjustment, Final settlement | What the run pays |\n| **Payroll hold** | Yes / No | Excludes the employee until released |\n\nRun statuses: Draft, Processing, Validation failed, Pending HR / Finance / Management approval, Approved, Locked, Payment file generated, Paid, Closed, Reversed, Cancelled.\n\n## 7. Daily usage procedures\n\n**Monthly cycle (payroll officer):**\n1. Generate the period.\n2. Approve overtime (**Approved OT**), import **Sources**, enter and approve **Inputs** before cut-off.\n3. Create the regular run, check **Eligibility**, **Validate**, **Process**.\n4. Review totals, **Run variance** and warnings; send for approval.\n5. After approval, Finance locks, generates payslips, payment file, confirms payment, posts the journal and closes.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  A[Draft] --> B[Process]\n  B -->|errors| V[Validation failed] --> B\n  B --> H[Pending HR approval] --> F[Pending Finance approval] --> M[Pending Management approval]\n  H & F & M -->|Reject| A\n  M --> AP[Approved] --> L[Locked] --> PF[Payment file generated] --> P[Paid] --> C[Closed]\n  L & PF -->|no confirmed payment| R[Reversed]\n  A & AP -->|Cancel run| X[Cancelled]\n```\n\nThe stages actually used come from **Approval workflows** for the company, branch or group. Other approvals: salary (independent approver), statutory rule versions (second person), inputs, recoveries, attendance deduction policies.\n\n## 9. Links to other modules\n\n- **Attendance** — approved overtime and (if activated) attendance deductions.\n- **Leave** — unpaid leave, leave pay rules, encashment inputs, final settlement leave pay.\n- **Staff Finance** — loan and advance deductions; see [12-staff-finance-loans.md](12-staff-finance-loans.md).\n- **Offboarding** — final settlement runs.\n- **Employees / Onboarding** — salary assignment and bank accounts.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| Employee missing from run | Payroll profile not enabled, on hold, no approved salary, or not in the group | Check **Eligibility**, then the profile and salary |\n| Run shows Validation failed | Missing setup or data errors | Open the run, read the issues, fix, then **Process** again |\n| Duplicate payment error on Process | Another run already paid that salary or item in the period | Remove the duplicate input or use an Adjustment run |\n| Approve button refused | You prepared the run, already approved another stage, or the calculation hash does not match | Ask another approver; copy the current hash after any recalculation |\n| \"Payslips can be generated only from locked, bank-file generated, or paid payroll.\" | Run not yet locked | Lock the run first |\n| Cannot reverse | A payment was confirmed or the journal is not reversed | Reverse the journal; use a correction run or recovery for paid salary |\n| Late input rejected | Period cut-off has passed | Enter **Late adjustment reason** |\n| Attendance not deducting | No attendance deduction policy is active | Activate a policy (needs second user and legal reference) |\n| Employee sees no payslip | Payslips not generated for that run | Click **Payslips** on the locked run |\n\n## 11. Best practices\n\n- Keep preparer and approvers as different people; never share accounts.\n- Approve statutory rules from official sources and record the reference.\n- Close inputs before cut-off; use the late reason only for genuine exceptions.\n- Use **Compare runs** before approving to spot unusual changes.\n- Never use the demo payment buttons on live data.\n\n## 12. Setup checklist\n\n- [ ] Banks added in Bank directory\n- [ ] Default calendar created\n- [ ] Components created\n- [ ] Statutory schemes and approved rule versions (PAYE, pension, health, levies)\n- [ ] Salary structures active\n- [ ] Accounting mappings for every component\n- [ ] Approval workflow set\n- [ ] Overtime, bonus and leave rules (if used)\n- [ ] Payroll profiles for all employees\n- [ ] Approved salaries for all employees\n- [ ] First period generated\n- [ ] Test run calculated, reviewed and cancelled before go-live\n\n## 13. Not verified / limitations\n\n- **Bank-ready file** needs an approved bank format and encryption key; actual bank formats were not verified.\n- Demo payment buttons depend on a server setting.\n- Several forms ask for numeric IDs (Employee ID, Branch ID, run IDs) rather than offering pickers.\n- Exact contents of **Security & approvals** and the overview readiness checks were not fully verified.\n- Leave encashment as a payroll input: the link from Leave was described by the Leave module; its exact input screen was not verified here.\n"},{"path":"part-3-modules/12-staff-finance-loans.md","title":"12. Staff Finance and Loans","md":"# 12. Staff Finance and Loans\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Not verified / limitations](#13-not-verified--limitations)\n\n## 1. Overview and purpose\n\nStaff Finance manages **staff loans** and **salary advances**: products, employee applications, approvals, disbursement, repayment through payroll, and servicing (deferment, reschedule, penalties, waivers, write-off, exit recovery).\n\nSidebar locations:\n\n| Menu | Pages |\n|---|---|\n| **Finance → Finance management** | **Overview**, **Products**, **Applications**, **Accounts**, **Servicing**, **Reports**, **Settings**, **Bank, ERP & migration** (integrations) |\n| **Finance → Payroll → Payroll deductions** | Loan deductions per payroll run, shortfalls |\n| **Finance → My finance** | Employee self-service: products, applications, loans, guarantee requests |\n\n> 📷 Screenshot: Finance workspace – Staff loans and advances overview tiles\n\n## 2. Prerequisites and dependencies\n\n- Employees with approved salary and payroll profile — see [11. Payroll](11-payroll.md). Eligibility and the payroll deduction cap use salary and net pay.\n- Line managers set on employees (manager recommendation stage goes to the department manager).\n- Payroll runs working, because repayments are deducted in payroll.\n- Offboarding, for exit recovery.\n- Employee bank accounts for disbursement.\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| View products | `employee_finance:products-read` | Finance, HR |\n| Create, edit, version and retire products | `employee_finance:products` | Finance administrator |\n| Apply, accept, withdraw, see own loans, guarantor requests, request deferment | `employee_finance:applications-self` | Every employee |\n| View all applications | `employee_finance:applications-read` | HR, Finance |\n| Manager recommendation | `employee_finance:applications-manager-review` | Line manager |\n| HR approval (and verify documents) | `employee_finance:applications-hr-approve` | HR officer |\n| Finance approval | `employee_finance:applications-finance-approve` | Finance officer |\n| Management approval | `employee_finance:applications-management-approve` | Executive |\n| View accounts and statements | `employee_finance:accounts-read` | Finance |\n| Create / confirm disbursement | `employee_finance:disbursements` | Finance officer |\n| Approve disbursement | `employee_finance:disbursements-approve` | Finance manager (not the maker) |\n| Record / approve direct repayments | `employee_finance:repayments` / `employee_finance:repayments-approve` | Finance officer / manager |\n| Deferment, reschedule, settlement quote, exit recovery requests | `employee_finance:settlements` | Finance officer |\n| Approve deferment, reschedule, exit recovery | `employee_finance:settlements-approve` | Finance manager |\n| Raise / approve penalty, waiver, write-off | `employee_finance:adjustments` / `employee_finance:adjustments-approve` | Finance officer / manager |\n| Payroll deductions, shortfalls | `employee_finance:payroll` | Payroll officer |\n| Reconciliation, overdue check, bank statement import | `employee_finance:reconciliation` | Finance officer |\n| Reports, dashboard, audit | `employee_finance:reports` | Finance, auditors |\n| Bank/ERP integration settings, journal posting | `employee_finance:integrations` | Finance system admin |\n| Import existing loans | `employee_finance:migration` | Implementation lead |\n| Sanction letter template | `employee_finance:templates` | HR / Legal |\n| Approval delegation | `employee_finance:delegations` | Approvers |\n\n## 4. Initial setup and configuration\n\n1. **Products** — Mandatory. Create at least one staff loan or salary advance product. Scope: company, with optional branch/department/position/grade eligibility. Changeable by new version only.\n2. **Approval tiers** on each product — Optional. Without tiers the system uses default stages (Finance is always included by default).\n3. **Sanction letter template** (**Settings**) — Recommended. One per company.\n4. **Approval delegation** (**Settings**) — Optional, per approver.\n5. **Bank and ERP connection** (**Bank, ERP & migration → Connection settings**) — Optional.\n6. **Migrate existing loans** — Optional, one-time at go-live.\n\n## 5. Features – step by step\n\n### Feature: Products\n**Purpose:** Define loan and advance terms.\n**Steps:**\n1. Go to **Finance management → Products** and click **New product**.\n2. Choose type (**Staff loan** or **Salary advance**), enter **Code**, **Name**, **Description**.\n3. Set amounts and term (**Min amount**, maximum amount, **Max term**), interest (**Zero interest**, **Flat rate** or **Reducing balance**, with **Annual interest %**).\n4. Set processing fee (**No fee**, **Flat amount** or **Percent of loan**, **Fee value**) and **Late-payment penalty** (**No penalty**, **Flat amount per overdue instalment**, **Percent of overdue amount**, **Penalty value**).\n5. Set **Payroll cap** (maximum share of salary per instalment), **Required guarantors**, **Required document types**.\n6. Optionally **Add tier** for approval routing by amount (**From amount**, **To amount**, stages).\n7. Save.\n**Expected result:** The product appears to eligible employees under **Available products**.\n**Important notes:** To change terms, click **New version** (\"Publish changed terms; existing loans keep their terms\"). **Retire** stops new applications.\n\n### Feature: Apply for a loan or advance (employee)\n**Steps:**\n1. Go to **Finance → My finance** and open **Available products**.\n2. Choose **Select product**, enter **Amount**, **Term (months)** and **Purpose**.\n3. Check the **Eligibility estimate** (**Check eligibility**).\n4. If required, search coworkers in **Search coworkers** and add **Selected guarantors**, and upload documents and **Signed guarantor forms** (one per guarantor).\n5. Tick **Submit immediately after creating the draft** or submit later with **Submit**.\n**Expected result:** The application appears under **My applications** with its status.\n**Important notes:** You can **Withdraw** before a decision. If returned, use **Correct and resubmit**.\n\n### Feature: Guarantor requests (employee)\n**Steps:** Open **Guarantee requests**, review the request and click **Accept** or **Reject**.\n\n### Feature: Approve applications\n**Steps:**\n1. Go to **Finance management → Applications** and open the application.\n2. HR checks documents and clicks **Verify** for each required document.\n3. Click **Approve**, **Reject** or **Return for correction**, with comments.\n**Expected result:** The application moves to the next stage. After the last stage it is **Pending employee acceptance**.\n**Important notes:** Managers give a recommendation, not a final approval. Approvals bind to the application snapshot; if it changes, approval is needed again.\n\n### Feature: Employee acceptance and sanction letter\n**Steps:** The employee opens the application, reviews the **Sanction letter** and clicks **Accept**.\n**Expected result:** Status **Approved**; an account is created as **Pending disbursement**.\n\n### Feature: Disbursement\n**Steps:**\n1. Go to **Accounts**, open the pending account and click **Disburse**.\n2. A different user approves the disbursement.\n3. Click **Confirm** and enter the bank payment reference once money is sent.\n**Expected result:** Account becomes **Active**, with an **Installment schedule**.\n**Important notes:** The maker cannot approve their own disbursement. Bank files can be produced in **Bank, ERP & migration** (**Download payment file**, **Send payments to bank**).\n\n### Feature: Repayment through payroll\n**Steps:**\n1. Instalments are reserved automatically when a payroll run is calculated.\n2. Open **Finance → Payroll → Payroll deductions** to see **Deduction preview**, **Payroll run reconciliation** (**Reconcile run**) and **Shortfalls**.\n3. For a shortfall (net pay too low), click **Resolve** and choose **Carry forward to next payroll**, **Collect directly from the employee** or **Reschedule the loan** (**New term (months)**).\n**Expected result:** Deductions post to the loan only when the employee's net pay is confirmed paid in payroll.\n\n### Feature: Direct repayment and early settlement\n**Steps:**\n1. On the account click **Record repayment** (or **Repay**). A second user approves it.\n2. For early settlement click **Quote settlement**, then settle with a bank payment reference before the quote expires.\n\n### Feature: Servicing (deferment, reschedule, penalty, waiver, write-off)\n**Steps:**\n1. Deferment: employee uses **Ask to defer next instalment**, or Finance clicks **Defer next due**. Approver decides under **Servicing → Deferment requests**.\n2. Reschedule: click **Reschedule** on the account; approver decides under **Reschedule requests**.\n3. Penalty / waiver / write-off: click **Penalty / waiver / write-off**, choose **Late-payment penalty**, **Waive interest**, **Waive fees** or **Write off the remaining balance**, with reason. Approver decides under **Penalties, waivers, and write-offs**.\n**Important notes:** A reason is always required. Only unpaid instalments can be deferred. Rescheduling must be allowed by the product.\n\n### Feature: Exit recovery\n**Steps:**\n1. When an employee leaves, open **Servicing → Exit recoveries** and click **Record recovery** (**Record exit recovery**).\n2. An approver confirms with **Post recovery**.\n**Expected result:** The balance is recovered at final settlement (**Recovery at final settlement**).\n\n### Feature: Settings (sanction letter and delegation)\n**Steps:**\n1. **Finance management → Settings → Sanction letter template**: edit, **Preview**, **Save template**.\n2. **Approval delegation**: choose a **Delegate** and dates, click **Delegate**; **Revoke** to end it.\n**Important notes:** You cannot delegate to yourself; end date must be today or later.\n\n### Feature: Bank, ERP and migration\n**Steps:**\n1. **Connection settings**: choose **Bank mode**, **ERP mode**, **Environment**, **Endpoint URL**, **Authentication**, **Company debit account**, then **Save settings**, **Test bank**, **Test ERP**.\n2. **Accounting journal**: **Preview**, **Export journal (Excel)**, **Post to ERP**.\n3. **Bank payments and statements**: **Download payment file**, **Send payments to bank**, import statements.\n4. **Migrate existing loans**: **Download template**, upload **Completed template (.xlsx or .csv)** with a **Cut-over date**, **Check file**, **Import loans**, then **Sign off balances**.\n5. **Transmission log**: **Retry** failed transmissions.\n\n### Feature: Overview and reports\n**Overview** shows tiles such as **Active loans**, **Outstanding exposure**, **Loan approvals**, **Monthly loan deductions**. **Reports** offers reports such as **Outstanding and overdue**, **Aging**, **Repayment performance**, **Default risk**, with **Export CSV** / **Export Excel**. Account statements: **Statement PDF**, **Statement Excel**.\n\n## 6. Important fields and options\n\n| Field | Options | Meaning |\n|---|---|---|\n| Product type | Staff loan, Salary advance | Kind of product |\n| Interest method | Zero interest, Flat rate, Reducing balance | How interest is charged |\n| Processing fee | No fee, Flat amount, Percent of loan | One-time fee |\n| Late-payment penalty | No penalty, Flat amount per overdue instalment, Percent of overdue amount | Penalty on overdue instalments |\n| Payroll cap | percentage | Maximum instalment as share of salary |\n\nAccount statuses: Pending disbursement, Active, Deferred, In arrears, Restructured, Settlement pending, Settled, Exit recovery, Written off, Cancelled.\n\n## 7. Daily usage procedures\n\n- **Finance officer:** review applications waiting for Finance, disburse approved loans, check **Shortfalls** after each payroll, run **Check overdue now** if needed.\n- **Approvers:** clear deferment, reschedule and adjustment queues in **Servicing**; use **Send approval reminders** for stuck approvals.\n- **Employee:** check **My loans** and the **Statement**.\n\n## 8. Approval workflows\n\n```mermaid\nflowchart LR\n  D[Draft] --> S[Submitted]\n  S --> MG[Pending manager recommendation] --> HR[Pending HR approval] --> FN[Pending Finance approval] --> MM[Pending management approval]\n  MG & HR & FN & MM -->|Return| RC[Returned for correction] --> S\n  MG & HR & FN & MM -->|Reject| RJ[Rejected]\n  MM --> EA[Pending employee acceptance] --> AP[Approved] --> DB[Disbursed]\n  S -->|Withdraw| W[Withdrawn]\n```\n\nStages always run in the order Manager → HR → Finance → Management. Which stages apply depends on the product's amount tier; without a tier, defaults apply and Finance is included. Disbursement, repayments, deferments, reschedules, adjustments and exit recoveries each need a second person to approve.\n\n## 9. Links to other modules\n\n- **Payroll** ([11-payroll.md](11-payroll.md)) — instalments are deducted in regular runs; payroll reports **Loans**, **Advances**, **Shortfalls**.\n- **Offboarding** — exit recovery and final settlement.\n- **Employees** — manager, salary, bank accounts.\n\n## 10. Common errors and troubleshooting\n\n| Problem | Cause | Solution |\n|---|---|---|\n| Employee sees no products | Not eligible (branch/grade/etc.) or product retired | Check product eligibility and status |\n| \"Employee profile is required.\" | User account not linked to an employee | Link the user to an employee record |\n| \"Disbursement maker cannot approve it.\" | Same person made and approved | Ask another Finance user |\n| \"This quote has expired; issue a new one.\" | Settlement quote too old | Create a new quote |\n| \"This product does not allow rescheduling.\" | Product setting | Use deferment or a new product version |\n| \"Only unpaid instalments can be deferred.\" | Instalment already paid | Choose the next unpaid instalment |\n| \"You cannot delegate to yourself.\" | Delegate is the same user | Choose a different delegate |\n| Deduction not taken | Net pay too low (shortfall) | Resolve in **Payroll deductions → Shortfalls** |\n\n## 11. Best practices\n\n- Version products instead of editing live terms.\n- Keep maker and checker different for every money movement.\n- Resolve shortfalls before the next payroll.\n- Start exit recovery as soon as offboarding begins.\n\n## 12. Setup checklist\n\n- [ ] Products created with interest, fee, penalty and payroll cap\n- [ ] Approval tiers set (or defaults accepted)\n- [ ] Sanction letter template saved\n- [ ] Delegations set for absent approvers\n- [ ] Bank/ERP settings tested (if used)\n- [ ] Existing loans migrated and signed off (if any)\n- [ ] Roles given the permissions in Section 3\n\n## 13. Not verified / limitations\n\n- Default approval stages come from server settings; their values per environment were not verified.\n- Exact product form layout (eligibility scope fields, salary multiple) not fully verified.\n- Bank and ERP connectors depend on configuration; live connectivity not verified.\n- Delegation form field labels other than **Delegate** were not verified.\n"},{"path":"part-3-modules/13-probation.md","title":"13. Probation","md":"# 13. Probation\n\n## Contents\n- [1. Overview and purpose](#1-overview-and-purpose)\n- [2. Prerequisites and dependencies](#2-prerequisites-and-dependencies)\n- [3. Who can use it (roles and permissions)](#3-who-can-use-it-roles-and-permissions)\n- [4. Initial setup and configuration](#4-initial-setup-and-configuration)\n- [5. Features – step by step](#5-features--step-by-step)\n- [6. Important fields and options](#6-important-fields-and-options)\n- [7. Daily usage procedures](#7-daily-usage-procedures)\n- [8. Approval workflows](#8-approval-workflows)\n- [9. Links to other modules](#9-links-to-other-modules)\n- [10. Common errors and troubleshooting](#10-common-errors-and-troubleshooting)\n- [11. Best practices](#11-best-practices)\n- [12. Setup checklist](#12-setup-checklist)\n- [13. Policy defaults and review outcomes](#13-policy-defaults-and-review-outcomes)\n\n## 1. Overview and purpose\n\nThe Probation module tracks a new employee's probation period from start to final decision. For each employee it keeps one **probation case**. A case records:\n\n- the start date and due date of probation,\n- the probation policy that applies (period length, rating criteria, minimum score),\n- objectives the employee should achieve,\n- the employee's self-assessment (if the policy requires it),\n- the manager's review and recommendation,\n- HR's final decision: **Confirmed**, **Extended**, **Not confirmed** or **Termination recommended**.\n\nWhen HR confirms an employee, the employee record is marked as confirmed with a confirmation date, and a confirmation letter can be generated.\n\nYou open it from the sidebar: **Probation**. The tabs are **Overview**, **Policies**, **Cases**, **My team** and **Letter templates** (under \"Probation management\"), plus **Probation → My probation → Overview** for employees.\n\n> 📷 Screenshot: Probation → Overview – the summary tiles (Open cases, Due this week, Policies, My team) and the confirmation rate\n\n## 2. Prerequisites and dependencies\n\n| What must exist | Why | Where to set it up |\n|---|---|---|\n| Employees with a hire date | The case start date defaults to the hire date | Employees module |\n| Branches, departments, positions, grades (optional) | Select them in the policy to limit which employees it matches | Organization setup |\n| Reporting manager on each employee | The manager is the default probation reviewer | Employees module |\n| User accounts linked to employees | The employee and manager must sign in to do their steps | Users and Roles |\n| Onboarding (optional) | Completing onboarding creates the probation case automatically | Onboarding module |\n\n## 3. Who can use it (roles and permissions)\n\n| Task | Permission(s) | Typical role |\n|---|---|---|\n| See the Probation section | A permission for a Probation page, such as `probation_policies:read`, `probation_cases:read-team` or `probation_letters:generate` | HR, managers |\n| View policies | `probation_policies:read` | HR |\n| Create / edit / delete policies | `probation_policies:create`, `probation_policies:update`, `probation_policies:delete` | HR |\n| View all cases | `probation_cases:read` | HR |\n| View team cases (**My team** tab) | `probation_cases:read-team` (or manager team access) | Line manager |\n| Create a case manually | `probation_cases:create` | HR |\n| Edit a case (dates, policy) | `probation_cases:update` | HR |\n| Delete a case | `probation_cases:delete` | HR |\n| Add objectives | `probation_objectives:create` or `probation_cases:update` | HR, manager |\n| Submit manager review | `probation_reviews:manager-review` (own reports) or `probation_reviews:manager-review-any` | Manager |\n| Record HR decision | `probation_reviews:hr-decision` | HR |\n| Generate letters | `probation_letters:generate` | HR |\n| View own probation and submit self-assessment | None (any signed-in employee with a linked employee record) | Employee |\n\n## 4. Initial setup and configuration\n\n1. **Create at least one probation policy** – *Mandatory (recommended)*. Scope: company. Changeable at any time; changes do not alter existing cases, because each case keeps a copy of the policy it started with.\n   - Without any policy, the system still creates cases using the installation’s default period and rules.\n2. **Mark one policy as the default** – *Optional*. Among equally specific matches, higher priority wins, followed by the default flag and then the newest policy ID.\n3. **Add rating criteria to the policy** – *Optional but recommended*. Criterion weights must add up to exactly 100.\n4. **Check reporting managers on employees** – *Mandatory for manager review*. The manager becomes the case reviewer.\n5. **Assign permissions** to HR and managers (see section 3) – *Mandatory*.\n\n## 5. Features – step by step\n\n### Feature: Create a probation policy\n**Purpose:** Define how long probation lasts and how the employee is rated.\n**Before you start:** You need `probation_policies:create`.\n**Steps:**\n1. Go to **Probation → Policies**.\n2. Click **New policy**.\n3. Enter **Code** and **Name** (both required) and an optional **Description**.\n4. Choose an **Employment type** if the policy applies only to one type (leave blank for all).\n5. Enter **Probation days** (required), for example 180.\n6. Enter **Minimum score** – the lowest score at which the manager may recommend confirmation (default 60).\n7. Set **Branch**, **Department**, **Position** or **Grade** when the policy targets a particular group. Set **Priority** and **Default policy** as needed. Enter **Effective from** and optionally **Effective to**. Configure **Maximum extensions**, **Default extension days**, **Maximum extension days**, and the self-assessment, objectives, manager review and confirmation letter requirements.\n8. Under **Criteria (weights must total 100)**, click **Add criterion** and enter **Code**, **Name**, **Weight** and an optional **Description**. Repeat until the weights total 100.\n9. Click **Save**.\n\n**Expected result:** The message \"Saved.\" appears and the policy is listed with its days, status and whether it is the default.\n**Important notes:**\n- If the weights do not total 100, you see \"Probation criterion weights must total 100. Current total: X.\"\n- Criteria added on screen allow the employee to rate themselves.\n- To change a policy, open it and click **Update policy**. To remove it, delete it from the list (\"Policy deleted.\").\n\n![New probation policy with a branch, priority and extension limit filled in](../images/probation-policy.png)\n\n### Feature: Automatic case creation\n**Purpose:** Start probation without manual work.\n**Before you start:** The employee goes through the Onboarding module.\n**Steps:**\n1. Complete the employee's onboarding (see the Onboarding module). When the employee is activated, the system creates the probation case.\n\n**Expected result:** A case appears under **Probation → Cases** with a case number, start date = hire date (or today if none), and due date = start date + the policy's probation days.\n**Important notes:**\n- The system picks the best matching **active** policy whose effective dates cover the start date. A policy targeted at the employee's branch, department, position, grade or employment type wins over a general one; priority breaks ties.\n- If the employee already has an open case, no second case is created.\n\n### Feature: Create a case manually\n**Purpose:** Start probation for an employee who did not go through onboarding.\n**Before you start:** You need `probation_cases:create`.\n**Steps:**\n1. Go to **Probation → Cases** and click **New case**.\n2. In **Employee number**, search by employee number or name and select the employee.\n3. Enter the **Start date**.\n4. Choose a **Policy (optional)**, or leave it on **Auto-resolve** to let the system choose.\n5. Click **Save**.\n\n**Expected result:** The new case is listed with status **Objectives pending** or **Active**.\n**Important notes:** An employee can have only one open case. If one exists you see \"Employee already has an open probation case (case number).\"\n\n### Feature: Edit a case\n**Purpose:** Correct the start date, due date or policy.\n**Before you start:** The case must be **Active** or **Objectives pending**, and the manager review must not yet be submitted.\n**Steps:**\n1. Open the case under **Probation → Cases**.\n2. Click **Edit case**.\n3. Change **Start date**, **Due date** or **Policy** (choose **Keep current** to leave it).\n4. Click **Save**.\n\n**Expected result:** The case shows the new dates.\n**Important notes:** The total probation length cannot exceed 365 days (system default).\n\n### Feature: Add objectives\n**Purpose:** Set goals the employee must achieve during probation.\n**Steps:**\n1. Open the case and click **Add objective**.\n2. Enter **Title**, **Expected result**, **Weight**, **Due date** and **Description**.\n3. Click **Save**.\n\n**Expected result:** The objective appears under **Objectives**. A case waiting for objectives moves to **Active**.\n\n### Feature: Employee self-assessment\n**Purpose:** Let the employee rate themselves and report progress before the manager reviews.\n**Before you start:** The policy must require a self-assessment, and the probation due date must be reached (the case is in **Self-assessment pending**).\n**Steps:**\n1. The employee opens **Probation → My probation → Overview** (page title \"Your confirmation path\").\n2. They rate each criterion (between 0 and the criterion maximum) and may add a comment.\n3. They enter progress (0–100%) and a progress comment for each objective.\n4. They write an overall comment (required).\n5. They click **Submit assessment**.\n\n**Expected result:** \"Self-assessment submitted.\" The page shows \"Your self-assessment has been submitted and is waiting for the next review stage.\" The case moves to **Manager review pending** (or **HR review pending** if no manager review is required).\n**Important notes:**\n- Before the due date the page says \"Self-assessment opens when your probation review is due.\"\n- If the policy does not require it, the page says \"This policy does not require an employee self-assessment.\"\n- Every enabled criterion must be rated: \"Please rate all criteria before submitting: …\".\n\n> 📷 Screenshot: My probation – the cycle steps, Latest score ring and the Submit assessment button\n\n### Manage letter templates\n\nOpen **Probation → Letter templates** with `probation_letters:generate`. Choose Confirmation, Extension or Non-confirmation, enter the letterhead, body and signatory details, then select **Save template**. Templates belong to the active company.\n\n![A confirmation letter template with an example letterhead and signatory](../images/probation-letter-template.png)\n\n### Feature: Manager review\n**Purpose:** The reviewing manager gives a recommendation.\n**Before you start:** You are the assigned reviewer and the case is in **Manager review pending**. You cannot review your own case.\n**Steps:**\n1. Go to **Probation → My team** (or **Cases**) and open the case.\n2. Click **Manager review**.\n3. Enter a rating from zero to the maximum beside each criterion. You can add a comment per
