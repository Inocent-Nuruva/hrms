name: HRMS Frontend CI

on:
  pull_request:
    branches:
      - master
      - uat

  push:
    branches:
      - master
      - uat

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Build and Test HRMS Frontend
    runs-on:
      - self-hosted
      - Linux
      - X64
      - hrms-frontend-runner-selfhosted

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"
          echo "Workspace: $(pwd)"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
