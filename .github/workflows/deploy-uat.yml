name: Deploy HRMS UAT Frontend

on:
  push:
    branches:
      - uat

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-uat-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy UAT Frontend
    runs-on:
      - self-hosted
      - Linux
      - X64
      - hrms-frontend-runner-selfhosted

    steps:
      - name: Show runner info
        run: |
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"

      - name: Deploy UAT frontend
        run: |
          cd /opt/apps/hrms/uat/frontend

          git config --global --add safe.directory /opt/apps/hrms/uat/frontend || true

          git fetch origin uat
          git reset --hard origin/uat

          chmod +x scripts/deploy-uat.sh
          bash scripts/deploy-uat.sh
