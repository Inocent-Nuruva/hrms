name: Verify handbook screens
on:
  push:
    branches: [qa/uat-handbook-evidence-20261123]
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8888
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SERVER_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm pkg delete devDependencies.electron devDependencies.electron-builder --package-lock=false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
      - run: npx playwright test e2e/probation-access.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handbook-screen-evidence
          path: handbook-images/
          if-no-files-found: error
          retention-days: 7
