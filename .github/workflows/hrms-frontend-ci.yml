name: HRMS Frontend CI/CD

on:
  push:
    branches: [uat, master]
    paths:
      - "src/**"
      - "public/**"
      - "deploy/hrms-frontend/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/hrms-frontend-ci.yml"
      - ".github/workflows/hrms-frontend-deployment-preflight.yml"
  pull_request:
    branches: [uat, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build and deploy
        required: true
        type: choice
        options: [uat, production]

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package HRMS frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'hrms-frontend-production' || 'hrms-frontend-uat' }}
    concurrency:
      group: hrms-frontend-ci-${{ github.ref }}-${{ inputs.environment || 'push' }}
      cancel-in-progress: true
    env:
      CI: true
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'HRMS' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_USE_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_USE_MOCK_AUTH || 'false' }}
      COUNTRIES_API_BASE_URL: ${{ vars.COUNTRIES_API_BASE_URL || 'https://countriesnow.space/api/v0.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Pin API origin port for environment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.environment }}" == "production" ]]; then
            port=8888
          else
            port=9999
          fi
          current="${NEXT_PUBLIC_API_BASE_URL:-}"
          if [[ -z "$current" ]]; then
            current="http://127.0.0.1:${port}"
          elif [[ "$current" =~ ^https?://[^/]+:[0-9]+ ]]; then
            current="$(printf '%s\n' "$current" | sed -E "s#:[0-9]+([/?]|$)#:${port}\\1#")"
          fi
          echo "NEXT_PUBLIC_API_BASE_URL=${current}" >> "$GITHUB_ENV"
          echo "Using API origin ${current} (UAT=9999, production=8888)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Validate required deployment files
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in package.json package-lock.json next.config.ts deploy/hrms-frontend/deploy.sh deploy/hrms-frontend/stage-release.sh deploy/hrms-frontend/rollback.sh deploy/hrms-frontend/server-setup.sh deploy/hrms-frontend/production-edge.sh deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf deploy/hrms-frontend/ecosystem.config.js; do
            [[ -f "$file" ]] || { echo "Required file missing: $file"; exit 1; }
          done
          for file in deploy/hrms-frontend/*.sh; do
            grep -q $'\r' "$file" && { echo "$file contains CRLF line endings."; exit 1; }
            bash -n "$file"
          done
          node --check deploy/hrms-frontend/ecosystem.config.js
          grep -Eq '^[[:space:]]*server_name[[:space:]][^;]*hrms\.alliance\.co\.tz[^;]*;' deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf
          grep -Fq 'proxy_pass http://127.0.0.1:8880;' deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf
      - name: Exclude desktop and e2e-only tooling
        run: npm pkg delete 'devDependencies.@playwright/test' devDependencies.electron devDependencies.electron-builder --package-lock=false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate package scripts
        shell: bash
        run: |
          node -e "const s=require('./package.json').scripts; for(const n of ['build','lint','test']) if(!s?.[n]) throw new Error('Missing script: '+n)"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8888
        run: npm test -- --passWithNoTests
      - name: Build frontend
        run: npm run build
      - name: Validate standalone build
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f .next/standalone/server.js ]]
          [[ -d .next/static ]]
          [[ -f .next/BUILD_ID ]]
          grep -R -F -q -- "$NEXT_PUBLIC_API_BASE_URL" .next/static .next/server || {
            echo "Configured NEXT_PUBLIC_API_BASE_URL was not embedded in the build."
            exit 1
          }

  deploy:
    name: Deploy HRMS frontend
    needs: validate-and-package
    if: >-
      needs.validate-and-package.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
       (github.event_name == 'workflow_dispatch' &&
        ((github.ref == 'refs/heads/uat' && inputs.environment == 'uat') ||
         (github.ref == 'refs/heads/master' && inputs.environment == 'production'))))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    environment:
      name: ${{ github.ref_name == 'uat' && 'hrms-frontend-uat' || 'hrms-frontend-production' }}
    concurrency:
      group: hrms-frontend-${{ github.event_name == 'push' && 'uat' || inputs.environment }}-deploy
      cancel-in-progress: false
    outputs:
      require_ssl: ${{ steps.deployment-policy.outputs.require_ssl }}
    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'uat' || inputs.environment }}
      BASE_DIR: ${{ vars.BASE_DIR }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health/ready' }}
      KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}
      DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
      REQUIRE_SSL: ${{ vars.REQUIRE_SSL || 'false' }}
      FRONTEND_PUBLIC_IP: ${{ vars.FRONTEND_PUBLIC_IP }}
      CI: true
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'HRMS' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_USE_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_USE_MOCK_AUTH || 'false' }}
      COUNTRIES_API_BASE_URL: ${{ vars.COUNTRIES_API_BASE_URL || 'https://countriesnow.space/api/v0.1' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Pin API origin port for environment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TARGET_ENV" == "production" ]]; then
            port=8888
          else
            port=9999
          fi
          current="${NEXT_PUBLIC_API_BASE_URL:-}"
          if [[ -z "$current" ]]; then
            current="http://127.0.0.1:${port}"
          elif [[ "$current" =~ ^https?://[^/]+:[0-9]+ ]]; then
            current="$(printf '%s\n' "$current" | sed -E "s#:[0-9]+([/?]|$)#:${port}\\1#")"
          fi
          echo "NEXT_PUBLIC_API_BASE_URL=${current}" >> "$GITHUB_ENV"
          echo "Using API origin ${current} (UAT=9999, production=8888)"
      - name: Validate build runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          (( $(node -p "process.versions.node.split('.')[0]") >= 22 ))
          npm --version
      - name: Exclude desktop and e2e-only tooling
        run: npm pkg delete 'devDependencies.@playwright/test' devDependencies.electron devDependencies.electron-builder --package-lock=false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Build release artifact locally
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/hrms-frontend-release"
          archive="$RUNNER_TEMP/hrms-frontend-release.tar.gz"
          rm -rf "$release"; rm -f "$archive" "$archive.sha256"
          mkdir -p "$release/deploy/hrms-frontend" "$release/.next"
          cp -a .next/standalone/. "$release/"
          # Copy contents: standalone output may already contain these directories.
          # Copying the directory itself would create public/public or static/static.
          mkdir -p "$release/.next/static" "$release/public"
          cp -a .next/static/. "$release/.next/static/"
          cp -a public/. "$release/public/"
          cp -a deploy/hrms-frontend/. "$release/deploy/hrms-frontend/"
          [[ -f "$release/.next/BUILD_ID" && -d "$release/.next/static/chunks" && -f "$release/public/icon.png" ]]
          for file in \
            deploy/hrms-frontend/deploy.sh \
            deploy/hrms-frontend/stage-release.sh \
            deploy/hrms-frontend/rollback.sh \
            deploy/hrms-frontend/server-setup.sh \
            deploy/hrms-frontend/production-edge.sh \
            deploy/hrms-frontend/ecosystem.config.js \
            deploy/hrms-frontend/check-assets.mjs \
            deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf; do
            [[ -f "$release/$file" ]] || { echo "Release is missing $file" >&2; exit 1; }
          done
          cmp public/assets/alliance-logo.png "$release/public/assets/alliance-logo.png"
          cmp public/favicon.ico "$release/public/favicon.ico"
          chmod 750 "$release"/deploy/hrms-frontend/*.sh
          printf '%s\n' "$GITHUB_SHA" > "$release/REVISION"
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$release/BUILT_AT"
          tar -C "$release" -czf "$archive" .
          (cd "$RUNNER_TEMP"; sha256sum hrms-frontend-release.tar.gz > hrms-frontend-release.tar.gz.sha256; sha256sum --check hrms-frontend-release.tar.gz.sha256)
      - name: Validate configuration and artifact
        id: deployment-policy
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in BASE_DIR PM2_APP_NAME APP_ENV APP_HOST APP_PORT HEALTH_PATH; do [[ -n "${!name}" ]] || { echo "Missing $name"; exit 1; }; done
          [[ "$APP_PORT" =~ ^[0-9]+$ && "$KEEP_RELEASES" =~ ^[0-9]+$ ]]
          [[ "$TARGET_ENV" == uat && "$APP_ENV" == uat || "$TARGET_ENV" == production && "$APP_ENV" == production ]]
          [[ "$TARGET_ENV" == uat && "$APP_PORT" == 9990 || "$TARGET_ENV" == production && "$APP_PORT" == 8880 ]]
          [[ "$REQUIRE_SSL" == true || "$REQUIRE_SSL" == false ]]
          echo "require_ssl=$REQUIRE_SSL" >> "$GITHUB_OUTPUT"
          [[ "$(id -u)" -ne 0 && -w "$BASE_DIR/releases" && -w "$BASE_DIR/shared" && -w "$BASE_DIR/tmp" ]]
          echo "HEALTH_URL=http://127.0.0.1:${APP_PORT}${HEALTH_PATH}" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; sha256sum --check hrms-frontend-release.tar.gz.sha256
      - name: Deploy release locally
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/hrms-frontend-release.tar.gz"
          stage="$RUNNER_TEMP/stage-hrms-frontend-$GITHUB_SHA.sh"
          install -m 0750 deploy/hrms-frontend/stage-release.sh "$stage"
          bash "$stage" "$GITHUB_SHA" "$archive"
          for file in \
            deploy/hrms-frontend/server-setup.sh \
            deploy/hrms-frontend/production-edge.sh \
            deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf; do
            [[ -f "$BASE_DIR/releases/$GITHUB_SHA/$file" ]] || { echo "Deployed release is missing $file" >&2; exit 1; }
          done
      - name: Configure Production Nginx and SSL
        if: env.TARGET_ENV == 'production' && env.APP_ENV == 'production'
        shell: bash
        env:
          SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
        run: |
          set -Eeuo pipefail
          [[ "$APP_PORT" == 8880 ]]
          curl --noproxy '*' --fail --silent --show-error "$HEALTH_URL" >/dev/null
          pm2 status "$PM2_APP_NAME"
          [[ -x /usr/local/sbin/hrms-frontend-edge ]] || {
            echo "Missing /usr/local/sbin/hrms-frontend-edge. The setup bundle is available at $BASE_DIR/current/deploy/hrms-frontend/server-setup.sh and must be run once as root." >&2
            exit 1
          }
          cmp -s "$BASE_DIR/current/deploy/hrms-frontend/production-edge.sh" /usr/local/sbin/hrms-frontend-edge && \
            cmp -s "$BASE_DIR/current/deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf" /usr/local/share/hrms-frontend/nginx/hrms.alliance.co.tz.conf || {
              echo "The installed Production edge helper/template is stale. Rerun $BASE_DIR/current/deploy/hrms-frontend/server-setup.sh as root." >&2
              exit 1
            }
          printf '%s\n%s\n' "${SSL_EMAIL:-}" "${FRONTEND_PUBLIC_IP:-}" | sudo -n /usr/local/sbin/hrms-frontend-edge configure "$REQUIRE_SSL"
      - name: Verify deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --noproxy '*' --fail --silent --show-error "$HEALTH_URL" >/dev/null
          pm2 status "$PM2_APP_NAME"
          [[ "$(readlink -f "$BASE_DIR/current")" == "$BASE_DIR/releases/$GITHUB_SHA" ]]
          if [[ "$APP_ENV" == production ]]; then
            sudo -n /usr/local/sbin/hrms-frontend-edge status false </dev/null
          fi

  verify-production-edge:
    name: Verify Production frontend externally
    needs: deploy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.environment == 'production' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRE_SSL: ${{ needs.deploy.outputs.require_ssl }}
      PUBLIC_HEALTH_URL: https://hrms.alliance.co.tz/api/health/ready
    steps:
      - name: Check public HTTPS from outside the Production server
        shell: bash
        run: |
          set -Eeuo pipefail
          if curl --noproxy '*' --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$PUBLIC_HEALTH_URL" >/dev/null; then
            echo "External domain health-check passed: $PUBLIC_HEALTH_URL"
          elif [[ "$REQUIRE_SSL" == true ]]; then
            echo "External domain health-check failed: $PUBLIC_HEALTH_URL" >&2
            exit 1
          else
            echo "WARNING: External domain health-check failed, but REQUIRE_SSL=false." >&2
          fi
