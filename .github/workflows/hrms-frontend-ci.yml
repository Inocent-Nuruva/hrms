name: HRMS Frontend CI/CD

on:
  push:
    branches: [uat, master]
    paths:
      - "src/**"
      - "e2e/onboarding-workspace.spec.ts"
      - "e2e/probation-access.spec.ts"
      - "e2e/company-directory.spec.ts"
      - "e2e/notification-routing.spec.ts"
      - "e2e/organization-structure.spec.ts"
      - "e2e/attendance-navigation.spec.ts"
      - "e2e/leave-calendar.spec.ts"
      - "e2e/helpers/dashboard-fixture.ts"
      - "playwright.config.ts"
      - "public/**"
      - "deploy/hrms-frontend/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "scripts/ci-release-*.mjs"
      - "scripts/check-release-routes*.mjs"
      - "scripts/browser-shards.cjs"
      - "scripts/ci-concurrency-policy.check.cjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "android/src/lib/mobile-notification-routing.ts"
      - "android/src/lib/attendance-punch-policy.ts"
      - "android/src/screens/AttendanceScreen.tsx"
      - "eslint.config.mjs"
      - ".github/workflows/hrms-frontend-ci.yml"
      - ".github/workflows/hrms-frontend-deployment-preflight.yml"
  pull_request:
    branches: [uat, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build and deploy
        required: true
        type: choice
        options: [uat, production]

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package HRMS frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'hrms-frontend-production' || 'hrms-frontend-uat' }}
    concurrency:
      group: hrms-frontend-ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    env:
      CI: true
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'HRMS' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_USE_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_USE_MOCK_AUTH || 'false' }}
      COUNTRIES_API_BASE_URL: ${{ vars.COUNTRIES_API_BASE_URL || 'https://countriesnow.space/api/v0.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Pin API origin port for environment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.environment }}" == "production" ]]; then
            port=8888
          else
            port=9999
          fi
          current="${NEXT_PUBLIC_API_BASE_URL:-}"
          if [[ -z "$current" ]]; then
            # Both environments use /api: the frontend proxies it to its own backend
            # (APP_ENV=uat -> 127.0.0.1:9999, production -> localhost:8888).
            current="/api"
          elif [[ "$current" =~ ^https?://[^/]+:[0-9]+ ]]; then
            current="$(printf '%s\n' "$current" | sed -E "s#:[0-9]+([/?]|$)#:${port}\\1#")"
          fi
          if [[ "$port" == 9999 && "$current" == *hrms.alliance.co.tz* ]]; then
            echo "UAT must not use the Production domain hrms.alliance.co.tz (got '${current}'). Use /api." >&2
            exit 1
          fi
          if [[ "$port" == 9999 ]]; then echo "APP_ENV=uat" >> "$GITHUB_ENV"; else echo "APP_ENV=production" >> "$GITHUB_ENV"; fi
          echo "NEXT_PUBLIC_API_BASE_URL=${current}" >> "$GITHUB_ENV"
          echo "Using API origin ${current} (UAT=9999, production=8888)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Validate required deployment files
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in package.json package-lock.json next.config.ts deploy/hrms-frontend/deploy.sh deploy/hrms-frontend/stage-release.sh deploy/hrms-frontend/rollback.sh deploy/hrms-frontend/server-setup.sh deploy/hrms-frontend/production-edge.sh deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf deploy/hrms-frontend/ecosystem.config.js; do
            [[ -f "$file" ]] || { echo "Required file missing: $file"; exit 1; }
          done
          for file in deploy/hrms-frontend/*.sh; do
            grep -q $'\r' "$file" && { echo "$file contains CRLF line endings."; exit 1; }
            bash -n "$file"
          done
          node --check deploy/hrms-frontend/ecosystem.config.js
          grep -Eq '^[[:space:]]*server_name[[:space:]][^;]*hrms\.alliance\.co\.tz[^;]*;' deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf
          grep -Fq 'proxy_pass http://127.0.0.1:8880;' deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf
          # The domain serves the frontend only; the frontend proxies to the backend itself.
          if grep -Eq '127\.0\.0\.1:(9999|9990|8888)|listen[[:space:]]+(\[::\]:)?9990|server_name[^;]*[[:space:]]_[[:space:];]' deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf; then
            echo "Production Nginx template must proxy to the frontend (8880) only and must not use a catch-all server_name." >&2
            exit 1
          fi
          # The domain belongs to Production only; UAT must not ship a domain template.
          if [[ -e deploy/hrms-frontend/nginx/hrms.alliance.co.tz.uat.conf ]]; then
            echo "UAT must not serve hrms.alliance.co.tz; remove nginx/hrms.alliance.co.tz.uat.conf." >&2
            exit 1
          fi
      - name: Exclude desktop and e2e-only tooling
        run: npm pkg delete 'devDependencies.@playwright/test' devDependencies.electron devDependencies.electron-builder --package-lock=false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate package scripts
        shell: bash
        run: |
          node -e "const s=require('./package.json').scripts; for(const n of ['build','lint','test']) if(!s?.[n]) throw new Error('Missing script: '+n)"
      - name: Verify CI concurrency and retention policy
        run: node --test scripts/ci-concurrency-policy.check.cjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8888
        run: npm test -- --passWithNoTests
      - name: Build frontend
        run: npm run build
      - name: Validate standalone build
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f .next/standalone/server.js ]]
          [[ -d .next/static ]]
          [[ -f .next/BUILD_ID ]]
          grep -R -F -q -- "$NEXT_PUBLIC_API_BASE_URL" .next/static .next/server || {
            echo "Configured NEXT_PUBLIC_API_BASE_URL was not embedded in the build."
            exit 1
          }
          node scripts/check-release-routes.mjs .next/routes-manifest.json
          node -e "require('./.next/standalone/node_modules/sharp'); require('./.next/standalone/node_modules/next/package.json')"

      - name: Test release compatibility checks
        run: node --test scripts/ci-release-manifest.check.mjs scripts/check-release-routes.check.mjs
      - name: Package validated release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
          (github.event_name == 'workflow_dispatch' &&
           ((github.ref == 'refs/heads/uat' && inputs.environment == 'uat') ||
            (github.ref == 'refs/heads/master' && inputs.environment == 'production')))
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/hrms-frontend-release"
          archive="$RUNNER_TEMP/hrms-frontend-release.tar.gz"
          rm -rf "$release"; rm -f "$archive" "$archive.sha256"
          mkdir -p "$release/deploy/hrms-frontend" "$release/.next"
          cp -a .next/standalone/. "$release/"
          # Copy contents: standalone output may already contain these directories.
          # Copying the directory itself would create public/public or static/static.
          mkdir -p "$release/.next/static" "$release/public"
          cp -a .next/static/. "$release/.next/static/"
          cp -a public/. "$release/public/"
          cp -a deploy/hrms-frontend/. "$release/deploy/hrms-frontend/"
          [[ -f "$release/.next/BUILD_ID" && -d "$release/.next/static/chunks" && -f "$release/public/icon.png" ]]
          for file in \
            deploy/hrms-frontend/deploy.sh \
            deploy/hrms-frontend/stage-release.sh \
            deploy/hrms-frontend/rollback.sh \
            deploy/hrms-frontend/server-setup.sh \
            deploy/hrms-frontend/production-edge.sh \
            deploy/hrms-frontend/ecosystem.config.js \
            deploy/hrms-frontend/check-assets.mjs \
            deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf; do
            [[ -f "$release/$file" ]] || { echo "Release is missing $file" >&2; exit 1; }
          done
          cmp public/assets/alliance-logo.png "$release/public/assets/alliance-logo.png"
          cmp public/favicon.ico "$release/public/favicon.ico"
          chmod 750 "$release"/deploy/hrms-frontend/*.sh
          node scripts/ci-release-manifest.mjs create "$release/BUILD_MANIFEST.json"
          printf '%s\n' "$GITHUB_SHA" > "$release/REVISION"
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$release/BUILT_AT"
          tar -C "$release" -czf "$archive" .
          (cd "$RUNNER_TEMP"; sha256sum hrms-frontend-release.tar.gz > hrms-frontend-release.tar.gz.sha256; sha256sum --check hrms-frontend-release.tar.gz.sha256)
      - name: Upload validated release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
          (github.event_name == 'workflow_dispatch' &&
           ((github.ref == 'refs/heads/uat' && inputs.environment == 'uat') ||
            (github.ref == 'refs/heads/master' && inputs.environment == 'production')))
        uses: actions/upload-artifact@v4
        with:
          name: hrms-frontend-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hrms-frontend-release.tar.gz
            ${{ runner.temp }}/hrms-frontend-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  browser-shard:
    name: Browser regression (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: hrms-frontend-browser-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      CI: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8888
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SERVER_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Exclude desktop tooling
        run: npm pkg delete devDependencies.electron devDependencies.electron-builder --package-lock=false
      - run: npm ci --no-audit --no-fund
      - name: Verify browser shard coverage
        if: matrix.shard == 1
        run: node scripts/browser-shards.cjs verify
      - run: npx playwright install --with-deps chromium
      - name: Build production browser-test server
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
      - run: node scripts/browser-shards.cjs run ${{ matrix.shard }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-ui-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload manual illustrations from this shard
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: manual-illustrations-shard-${{ matrix.shard }}
          path: |
            test-results/**/my-insights.png
            test-results/**/team-recommendation.png
            test-results/**/employee-number-preview.png
            test-results/**/company-bank-directory.png
            test-results/**/company-deletion-confirmation.png
          if-no-files-found: ignore
          retention-days: 7

  verify-manual-illustrations:
    name: Verify manual illustrations
    needs: [browser-shard]
    if: github.event_name == 'pull_request' && needs.browser-shard.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: hrms-frontend-illustrations-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manual-illustrations-shard-*
          path: ${{ runner.temp }}/manual-illustrations
          merge-multiple: true
      - name: Require all expected illustrations
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in my-insights.png team-recommendation.png employee-number-preview.png company-bank-directory.png company-deletion-confirmation.png; do
            find "$RUNNER_TEMP/manual-illustrations" -type f -name "$file" -print -quit | grep -q . || { echo "Missing manual illustration: $file" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: self-service-manual-illustrations
          path: |
            ${{ runner.temp }}/manual-illustrations/**/my-insights.png
            ${{ runner.temp }}/manual-illustrations/**/team-recommendation.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: company-manual-illustrations
          path: |
            ${{ runner.temp }}/manual-illustrations/**/employee-number-preview.png
            ${{ runner.temp }}/manual-illustrations/**/company-bank-directory.png
            ${{ runner.temp }}/manual-illustrations/**/company-deletion-confirmation.png
          if-no-files-found: error
          retention-days: 7

  onboarding-ui:
    name: Onboarding desktop and mobile regression
    needs: [browser-shard, verify-manual-illustrations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both browser shards and pull-request illustrations
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
          ILLUSTRATIONS_RESULT: ${{ needs.verify-manual-illustrations.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SHARD_RESULT" == success ]] || { echo 'A browser test shard did not pass.' >&2; exit 1; }
          if [[ "$EVENT_NAME" == pull_request && "$ILLUSTRATIONS_RESULT" != success ]]; then
            echo 'Pull-request manual illustration verification did not pass.' >&2
            exit 1
          fi

  deploy:
    name: Deploy HRMS frontend
    needs: [validate-and-package, onboarding-ui]
    if: >-
      !cancelled() &&
      needs.validate-and-package.result == 'success' &&
      needs.onboarding-ui.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
       (github.event_name == 'workflow_dispatch' &&
        ((github.ref == 'refs/heads/uat' && inputs.environment == 'uat') ||
         (github.ref == 'refs/heads/master' && inputs.environment == 'production'))))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    environment:
      name: ${{ github.ref_name == 'uat' && 'hrms-frontend-uat' || 'hrms-frontend-production' }}
    concurrency:
      group: hrms-frontend-${{ github.event_name == 'push' && 'uat' || inputs.environment }}-deploy
      cancel-in-progress: false
      queue: max
    outputs:
      require_ssl: ${{ steps.deployment-policy.outputs.require_ssl }}
    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'uat' || inputs.environment }}
      BASE_DIR: ${{ vars.BASE_DIR }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health/ready' }}
      KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}
      DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
      REQUIRE_SSL: ${{ vars.REQUIRE_SSL || 'false' }}
      FRONTEND_PUBLIC_IP: ${{ vars.FRONTEND_PUBLIC_IP }}
      CI: true
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'HRMS' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_USE_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_USE_MOCK_AUTH || 'false' }}
      COUNTRIES_API_BASE_URL: ${{ vars.COUNTRIES_API_BASE_URL || 'https://countriesnow.space/api/v0.1' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Pin API origin port for environment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TARGET_ENV" == "production" ]]; then
            port=8888
          else
            port=9999
          fi
          current="${NEXT_PUBLIC_API_BASE_URL:-}"
          if [[ -z "$current" ]]; then
            # Both environments use /api: the frontend proxies it to its own backend
            # (APP_ENV=uat -> 127.0.0.1:9999, production -> localhost:8888).
            current="/api"
          elif [[ "$current" =~ ^https?://[^/]+:[0-9]+ ]]; then
            current="$(printf '%s\n' "$current" | sed -E "s#:[0-9]+([/?]|$)#:${port}\\1#")"
          fi
          if [[ "$port" == 9999 && "$current" == *hrms.alliance.co.tz* ]]; then
            echo "UAT must not use the Production domain hrms.alliance.co.tz (got '${current}'). Use /api." >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_API_BASE_URL=${current}" >> "$GITHUB_ENV"
          echo "Using API origin ${current} (UAT=9999, production=8888)"
      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: hrms-frontend-release-${{ github.sha }}
          path: ${{ runner.temp }}/hrms-frontend-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check downloaded artifact files
        id: artifact-download-check
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/hrms-frontend-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -s "$artifact_dir/hrms-frontend-release.tar.gz" && -s "$artifact_dir/hrms-frontend-release.tar.gz.sha256" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'Artifact download is incomplete; retrying once.'
          fi
      - name: Retry incomplete artifact download
        if: steps.artifact-download-check.outputs.complete != 'true'
        uses: actions/download-artifact@v4
        with:
          name: hrms-frontend-release-${{ github.sha }}
          path: ${{ runner.temp }}/hrms-frontend-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify artifact runtime and build configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/hrms-frontend-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sha256sum --check hrms-frontend-release.tar.gz.sha256
          tar -xOzf hrms-frontend-release.tar.gz ./BUILD_MANIFEST.json > hrms-frontend-build-manifest.json
          node "$GITHUB_WORKSPACE/scripts/ci-release-manifest.mjs" verify hrms-frontend-build-manifest.json
      - name: Validate configuration and artifact
        id: deployment-policy
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in BASE_DIR PM2_APP_NAME APP_ENV APP_HOST APP_PORT HEALTH_PATH; do [[ -n "${!name}" ]] || { echo "Missing $name"; exit 1; }; done
          [[ "$APP_PORT" =~ ^[0-9]+$ && "$KEEP_RELEASES" =~ ^[0-9]+$ ]]
          [[ "$TARGET_ENV" == uat && "$APP_ENV" == uat || "$TARGET_ENV" == production && "$APP_ENV" == production ]]
          [[ "$TARGET_ENV" == uat && "$APP_PORT" == 9990 || "$TARGET_ENV" == production && "$APP_PORT" == 8880 ]]
          [[ "$REQUIRE_SSL" == true || "$REQUIRE_SSL" == false ]]
          echo "require_ssl=$REQUIRE_SSL" >> "$GITHUB_OUTPUT"
          # The domain is frontend-only, so an absolute domain URL would make the
          # frontend proxy to itself. Production must use the same-origin /api proxy.
          if [[ "$TARGET_ENV" == production && "$NEXT_PUBLIC_API_BASE_URL" != /api ]]; then
            echo "Production NEXT_PUBLIC_API_BASE_URL must be /api (got '${NEXT_PUBLIC_API_BASE_URL}')." >&2
            exit 1
          fi
          [[ "$(id -u)" -ne 0 && -w "$BASE_DIR/releases" && -w "$BASE_DIR/shared" && -w "$BASE_DIR/tmp" ]]
          echo "HEALTH_URL=http://127.0.0.1:${APP_PORT}${HEALTH_PATH}" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/hrms-frontend-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; sha256sum --check hrms-frontend-release.tar.gz.sha256
      - name: Deploy release locally
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/hrms-frontend-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/hrms-frontend-release.tar.gz"
          stage="$RUNNER_TEMP/stage-hrms-frontend-$GITHUB_SHA.sh"
          install -m 0750 deploy/hrms-frontend/stage-release.sh "$stage"
          bash "$stage" "$GITHUB_SHA" "$archive"
          for file in \
            deploy/hrms-frontend/server-setup.sh \
            deploy/hrms-frontend/production-edge.sh \
            deploy/hrms-frontend/nginx/hrms.alliance.co.tz.conf; do
            [[ -f "$BASE_DIR/releases/$GITHUB_SHA/$file" ]] || { echo "Deployed release is missing $file" >&2; exit 1; }
          done
      # hrms.alliance.co.tz is Production-only. UAT is served directly on
      # 196.41.62.162:9990 (frontend) / :9999 (backend) and never touches Nginx.
      - name: Configure domain Nginx and SSL
        if: env.TARGET_ENV == 'production'
        shell: bash
        env:
          SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_ENV" == "$APP_ENV" && "$APP_PORT" == 8880 ]]
          template=hrms.alliance.co.tz.conf
          curl --noproxy '*' --fail --silent --show-error "$HEALTH_URL" >/dev/null
          pm2 status "$PM2_APP_NAME"
          [[ -x /usr/local/sbin/hrms-frontend-edge ]] || {
            echo "Missing /usr/local/sbin/hrms-frontend-edge. The setup bundle is available at $BASE_DIR/current/deploy/hrms-frontend/server-setup.sh and must be run once as root." >&2
            exit 1
          }
          cmp -s "$BASE_DIR/current/deploy/hrms-frontend/production-edge.sh" /usr/local/sbin/hrms-frontend-edge && \
            cmp -s "$BASE_DIR/current/deploy/hrms-frontend/nginx/$template" "/usr/local/share/hrms-frontend/nginx/$template" || {
              echo "The installed edge helper/template is stale. Rerun $BASE_DIR/current/deploy/hrms-frontend/server-setup.sh as root." >&2
              exit 1
            }
          printf '%s\n%s\n' "${SSL_EMAIL:-}" "${FRONTEND_PUBLIC_IP:-196.41.62.162}" | sudo -n /usr/local/sbin/hrms-frontend-edge configure "$REQUIRE_SSL"
      - name: Verify deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --noproxy '*' --fail --silent --show-error "$HEALTH_URL" >/dev/null
          pm2 status "$PM2_APP_NAME"
          [[ "$(readlink -f "$BASE_DIR/current")" == "$BASE_DIR/releases/$GITHUB_SHA" ]]
          if [[ "$APP_ENV" == production ]]; then
            sudo -n /usr/local/sbin/hrms-frontend-edge status false </dev/null
          fi

  verify-production-edge:
    name: Verify domain externally
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRE_SSL: ${{ needs.deploy.outputs.require_ssl }}
      PUBLIC_HEALTH_URL: https://hrms.alliance.co.tz/api/health/ready
    steps:
      - name: Check public HTTPS from outside the Production server
        shell: bash
        run: |
          set -Eeuo pipefail
          if curl --noproxy '*' --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$PUBLIC_HEALTH_URL" >/dev/null; then
            echo "External domain health-check passed: $PUBLIC_HEALTH_URL"
          elif [[ "$REQUIRE_SSL" == true ]]; then
            echo "External domain health-check failed: $PUBLIC_HEALTH_URL" >&2
            exit 1
          else
            echo "WARNING: External domain health-check failed, but REQUIRE_SSL=false." >&2
          fi
