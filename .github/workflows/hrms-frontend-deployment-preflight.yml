name: HRMS Frontend Deployment Preflight
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Server environment to validate
        required: true
        type: choice
        options: [uat, production]
permissions: { contents: read }
jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment == 'uat' && 'hrms-frontend-uat' || 'hrms-frontend-production' }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      BASE_DIR: ${{ vars.BASE_DIR }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health/ready' }}
      SUPPORT_OWNER: ${{ vars.SUPPORT_OWNER }}
      SUPPORT_CONTACT: ${{ vars.SUPPORT_CONTACT }}
      MONITORING_URL: ${{ vars.MONITORING_URL }}
    steps:
      - name: Validate server runtime and layout
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in BASE_DIR APP_ENV APP_HOST APP_PORT PM2_APP_NAME HEALTH_PATH SUPPORT_OWNER SUPPORT_CONTACT MONITORING_URL; do [[ -n "${!name}" ]] || { echo "Missing $name"; exit 1; }; done
          [[ "$APP_PORT" =~ ^[0-9]+$ ]]
          [[ "$TARGET_ENV" == uat && "$APP_ENV" == uat || "$TARGET_ENV" == production && "$APP_ENV" == production ]]
          [[ "$TARGET_ENV" == uat && "$APP_PORT" == 9990 || "$TARGET_ENV" == production && "$APP_PORT" == 8880 ]]
          [[ "$(id -u)" -ne 0 ]]
          (( $(node -p "process.versions.node.split('.')[0]") >= 22 ))
          for cmd in pm2 curl tar gzip flock find sort sha256sum install mktemp stat; do command -v "$cmd" >/dev/null; done
          for dir in "$BASE_DIR" "$BASE_DIR/releases" "$BASE_DIR/shared" "$BASE_DIR/shared/logs" "$BASE_DIR/tmp"; do [[ -d "$dir" && -w "$dir" ]]; done
          env_file="$BASE_DIR/shared/.env"; [[ -f "$env_file" && -r "$env_file" && "$(stat -c '%a' "$env_file")" == 600 ]]
          if [[ -L "$BASE_DIR/current" ]]; then pm2 describe "$PM2_APP_NAME" >/dev/null; curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}${HEALTH_PATH}" >/dev/null; fi
          if [[ "$APP_ENV" == production ]]; then
            [[ -x /usr/local/sbin/hrms-frontend-edge ]] || { echo 'Production edge helper is not installed. Rerun server-setup.sh as root.' >&2; exit 1; }
            sudo -n /usr/local/sbin/hrms-frontend-edge preflight false </dev/null
          fi
