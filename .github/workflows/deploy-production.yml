name: Deploy HRMS Production Frontend

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production Frontend
    runs-on:
      - self-hosted
      - Linux
      - X64
      - hrms-frontend-runner-selfhosted

    steps:
      - name: Show runner info
        run: |
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"

      - name: Deploy production frontend
        run: |
          cd /opt/apps/hrms/prod/frontend

          git config --global --add safe.directory /opt/apps/hrms/prod/frontend || true

          git fetch origin master
          git reset --hard origin/master

          chmod +x scripts/deploy-production.sh
          bash scripts/deploy-production.sh
