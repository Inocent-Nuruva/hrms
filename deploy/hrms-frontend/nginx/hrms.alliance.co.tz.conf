# Production HRMS frontend only. Certbot adds the 443 listener and HTTP->HTTPS redirect here.
# Every path goes to the frontend on 127.0.0.1:8880 (never the UAT port 9990). The frontend
# itself proxies /api, /uploads and /socket.io to the backend (loopback port 8888)
# (NEXT_PUBLIC_API_BASE_URL=/api), so the backend is never exposed by Nginx.
server {
    listen 80;
    listen [::]:80;

    server_name hrms.alliance.co.tz;

    client_max_body_size 20M;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8880;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# Direct-IP HTTP requests on port 80 are redirected to the HTTPS domain so Production
# is never served over plain HTTP. Kept separate so Certbot leaves it untouched, and
# deliberately not a catch-all. UAT is unaffected: it is reached on
# 196.41.62.162:9990 (frontend) and :9999 (backend), not through this Nginx site.
server {
    listen 80;
    listen [::]:80;

    server_name 196.41.62.162 192.168.1.30;

    server_tokens off;

    return 301 https://hrms.alliance.co.tz$request_uri;
}
